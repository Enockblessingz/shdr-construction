body{background:#f8fafc}
.sidebar-link.active{background:#ecfdf5;color:#059669;border-left:3px solid #059669}

.modal{display:none}.modal.active{display:flex}
.spinner{border:3px solid #e2e8f0;border-top:3px solid #059669;border-radius:50%;width:24px;height:24px;animation:spin .8s linear infinite}

.tab-active{background:#059669;color:#fff}.tab-inactive{background:#f1f5f9;color:#334155}.tab-inactive:hover{background:#e2e8f0}

.profile-avatar-wrapper{position:relative;width:120px;height:120px;margin:0 auto}

.profile-avatar-wrapper .change-photo-btn{position:absolute;bottom:4px;right:4px;background:#059669;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff}

.settings-card h3{font-weight:600;font-size:1.1rem;color:#1e293b;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.settings-card .field-group{margin-bottom:1.25rem}
.settings-card label{display:block;font-size:.85rem;font-weight:500;color:#475569;margin-bottom:.3rem}
.settings-card input,.settings-card select{width:100%;padding:.6rem .75rem;border:1px solid #d1d5db;border-radius:8px;font-size:.95rem;background:#fff}
.settings-card input:focus,.settings-card select:focus{outline:none;border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.2)}
.settings-card .readonly-field{background:#f1f5f9;color:#475569;padding:.6rem .75rem;border-radius:8px;font-size:.95rem}

.settings-card .remove-photo-btn{color:#ef4444;font-size:.85rem;cursor:pointer;background:none;border:none}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.20);transform:translateY(80px);opacity:0;transition:all .4s ease;z-index:999;max-width:400px;display:flex;align-items:center;gap:10px}

<!-- Safety net: if module fails to load, show error -->
<script>
window.__shdrModuleLoaded=false;
window.addEventListener('error',function(e){
  console.error('[SHDR Global Error]',e.message,e.filename,e.lineno,e.colno,e.error);
  var el=document.getElementById('content-area');
  if(el&&!el.textContent.trim()){el.innerHTML='<div class="p-6"><div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-red-800 max-w-2xl mx-auto"><p class="font-semibold text-lg">⚠️ Script error</p><p class="text-sm mt-1">'+(e.message||'Unknown error')+'</p><p class="text-xs mt-2 text-red-600">File: '+(e.filename||'')+' line '+(e.lineno||'')+'</p><button onclick="location.reload()" class="mt-3 px-4 py-2 bg-red-600 text-white rounded-lg text-sm">Reload Page</button></div></div>';}
},true);
window.addEventListener('unhandledrejection',function(e){console.error('[SHDR Unhandled Promise]',e.reason);});
setTimeout(function(){
  if(!window.__shdrModuleLoaded){
    var el=document.getElementById('content-area');
    if(el){el.innerHTML='<div class="p-6"><div class="bg-amber-50 border border-amber-200 rounded-2xl p-6 text-amber-800 max-w-2xl mx-auto"><p class="font-semibold text-lg">⏳ Module not loaded</p><p class="text-sm mt-2">The dashboard JavaScript did not initialize. Common causes:</p><ul class="list-disc list-inside mt-2 text-sm space-y-1"><li>Firebase CDN blocked or unreachable</li><li>Network/firewall issue</li><li>Wrong script URL</li></ul><p class="text-xs mt-3">Open the browser console (F12) for details.</p><button onclick="location.reload()" class="mt-3 px-4 py-2 bg-amber-600 text-white rounded-lg text-sm">Reload Page</button></div></div>';}
  }
},7000);
</script>

async function loadLogoDataURL(){
  if(_cachedLogoDataURL)return _cachedLogoDataURL;
  return new Promise(resolve=>{
    const img=new Image();img.crossOrigin='anonymous';
    const timeout=setTimeout(()=>resolve(null),2500);
    img.onload=()=>{clearTimeout(timeout);try{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);_cachedLogoDataURL=c.toDataURL('image/png');resolve(_cachedLogoDataURL)}catch(e){resolve(null)}};
    img.onerror=()=>{clearTimeout(timeout);resolve(null)};
    img.src='shdr_logo%20Background%20Removed.png';
  });
}

function buildGeneralReportData(){
  const f=getReportFilters();const site=assignedSites.find(s=>s.id===currentSiteId);const siteName=site?site.name:'—';
  const matUsed=materialsData.filter(m=>m.site_id===currentSiteId);
  const matSpent=matUsed.reduce((s,m)=>s+calculateTotal(m.quantity_used||0,m.unit_cost||0),0);
  const siteStock=stockData.filter(s=>s.site_id===currentSiteId);
  const stockValue=siteStock.reduce((s,i)=>s+toNumber(i.quantity)*toNumber(i.unit_cost),0);
  const att=attendanceData.filter(a=>a.site_id===currentSiteId);
  const payroll=att.reduce((s,a)=>s+toNumber(a.daily_rate),0);
  const completed=progressTasks.filter(x=>x.status==='completed').length,totalTasks=progressTasks.length;
  const completion=totalTasks?Math.round((completed/totalTasks)*100):0;
  const reqs=requisitionsData.filter(r=>r.site_id===currentSiteId);
  return{title:'General Manager Report',type:'general',site:siteName,manager:managerProfile?.full_name||'—',period:f.startDate&&f.endDate?`${f.startDate} to ${f.endDate}`:'All time',sections:[
    {label:'Assigned Site',value:siteName},{label:'Site Status',value:(site?.status||'active').toUpperCase()},
    {label:'Site Location',value:site?.location||'—'},{label:'Progress',value:`${completed}/${totalTasks} tasks (${completion}%)`},
    {label:'Registered Workers',value:String(siteWorkersData.length)},{label:'Worker Attendance Days',value:String(att.length)},
    {label:'Total Payroll Recorded',value:formatRWF(payroll)},{label:'Materials Used Records',value:String(matUsed.length)},
    {label:'Materials Spent',value:formatRWF(matSpent)},{label:'Stock Items',value:String(siteStock.length)},
    {label:'Stock Value',value:formatRWF(stockValue)},{label:'Requisitions Submitted',value:String(reqs.length)}
  ]};
}
function buildPayrollReportData(){
  const f=getReportFilters();let list=attendanceData.filter(a=>a.site_id===currentSiteId);
  if(f.startDate)list=list.filter(a=>String(a.date||'')>=f.startDate);
  if(f.endDate)list=list.filter(a=>String(a.date||'')<=f.endDate);
  const map={};
  list.forEach(r=>{const k=r.worker_id||r.id;if(!map[k])map[k]={name:r.name,role:r.role||'',paymentType:'',dailyRate:0,days:0,total:0};map[k].days+=1;map[k].dailyRate=toNumber(r.daily_rate);map[k].total+=toNumber(r.daily_rate)});
  Object.keys(map).forEach(k=>{const w=siteWorkersData.find(x=>x.id===k);if(w)map[k].paymentType=w.payment_method==='monthly'?'Monthly':'Daily'});
  const workers=Object.values(map);const totalDays=workers.reduce((s,w)=>s+w.days,0),totalPayroll=workers.reduce((s,w)=>s+w.total,0);
  return{title:'Worker Payroll Report',type:'worker-payroll',site:assignedSites.find(s=>s.id===currentSiteId)?.name||'—',manager:managerProfile?.full_name||'—',period:f.startDate&&f.endDate?`${f.startDate} to ${f.endDate}`:'All time',workers,totalWorkers:workers.length,totalDays,totalPayroll,avgDaily:totalDays?totalPayroll/totalDays:0};
}
function buildMaterialsReportData(){
  const f=getReportFilters();const siteStock=stockData.filter(s=>s.site_id===currentSiteId);
  const map={};
  siteStock.forEach(s=>{const k=normalizeName(s.material_name);if(!map[k])map[k]={material:s.material_name,unit:s.unit||'units',opening:0,added:0,used:0,current:0,unitCost:toNumber(s.unit_cost),value:0}});
  let usage=materialsData.filter(m=>m.site_id===currentSiteId);
  if(f.startDate)usage=usage.filter(m=>String(m.date_used||m.created_at||'').split('T')[0]>=f.startDate);
  if(f.endDate)usage=usage.filter(m=>String(m.date_used||m.created_at||'').split('T')[0]<=f.endDate);
  usage.forEach(u=>{const k=normalizeName(u.name);if(!map[k])map[k]={material:u.name,unit:u.unit||'units',opening:0,added:0,used:0,current:0,unitCost:toNumber(u.unit_cost),value:0};map[k].used+=toNumber(u.quantity_used);if(u.unit_cost)map[k].unitCost=toNumber(u.unit_cost)});
  let transactions=stockTransactions.filter(tx=>tx.site_id===currentSiteId);
  if(f.startDate)transactions=transactions.filter(tx=>String(tx.created_at||'').split('T')[0]>=f.startDate);
  if(f.endDate)transactions=transactions.filter(tx=>String(tx.created_at||'').split('T')[0]<=f.endDate);
  transactions.forEach(tx=>{if(tx.transaction_type==='STOCK_ADDED'){const k=normalizeName(tx.material_name);if(!map[k])map[k]={material:tx.material_name,unit:tx.unit||'units',opening:0,added:0,used:0,current:0,unitCost:0,value:0};map[k].added+=toNumber(tx.quantity)}});
  Object.keys(map).forEach(k=>{const s=getStockByName(currentSiteId,map[k].material);map[k].current=s?toNumber(s.quantity):0;map[k].value=map[k].current*map[k].unitCost;map[k].opening=Math.max(0,map[k].current+map[k].used-map[k].added)});
  const rows=Object.values(map);const totalValue=rows.reduce((s,r)=>s+r.value,0);
  return{title:'Materials Report',type:'materials',site:assignedSites.find(s=>s.id===currentSiteId)?.name||'—',manager:managerProfile?.full_name||'—',period:f.startDate&&f.endDate?`${f.startDate} to ${f.endDate}`:'All time',rows,totalValue,totalMaterials:rows.length};
}
function buildWorkersReportData(){
  const workers=siteWorkersData.slice();const byType=workers.reduce((acc,w)=>{const k=w.payment_method||'daily';acc[k]=(acc[k]||0)+1;return acc},{});
  return{title:'Workers Report',type:'workers',site:assignedSites.find(s=>s.id===currentSiteId)?.name||'—',manager:managerProfile?.full_name||'—',period:'Current',workers,totalWorkers:workers.length,dailyCount:byType.daily||0,monthlyCount:byType.monthly||0};
}
function getReportData(type){switch(type){case 'general':return buildGeneralReportData();case 'worker-payroll':return buildPayrollReportData();case 'materials':return buildMaterialsReportData();case 'workers':return buildWorkersReportData();default:throw new Error('Unsupported report type')}}

window.submitUsageBatch=async function(e){e.preventDefault();const btn=document.getElementById('usage-save-btn');setButtonLoading(btn,true);try{const date=document.getElementById('usage-date').value;if(!date){showToast(t('common.requiredField'),'error');setButtonLoading(btn,false);return}const valid=Array.from(_usageSelectedMaterials.entries()).filter(([_,d])=>toNumber(d.quantityUsed)>0);if(!valid.length){showToast(t('materials.selectAtLeastOneMaterial'),'error');setButtonLoading(btn,false);return}const errors=[],validated=[];for(const[sid,d]of valid){const q=toNumber(d.quantityUsed),c=toNumber(d.unitCost);if(q<=0){errors.push(`${d.materialName}: ${t('materials.quantityMustBePositive')}`);continue}if(c<0){errors.push(`${d.materialName}: ${t('materials.unitCostCannotBeNegative')}`);continue}if(q>d.available){errors.push(`${d.materialName}: ${t('materials.insufficientStock')}`);continue}const s=getStockById(sid);if(!s){errors.push(`${d.materialName}: ${t('materials.stockNotFound')}`);continue}const cur=getStockQuantity(s);if(q>cur){errors.push(`${d.materialName}: ${t('materials.insufficientStock')}`);continue}validated.push({stockId:sid,stockItem:s,materialName:d.materialName,quantityUsed:q,unit:d.unit,unitCost:c,totalAmount:q*c,notes:d.notes||'',previousQuantity:cur,newQuantity:cur-q})}if(errors.length){showToast('❌ '+errors.join('; '),'error');setButtonLoading(btn,false);return}let imageUrl='';if(_usagePhotoFile){imageUrl=await uploadImageToImgbb(_usagePhotoFile)}const batchNumber=generateBatchNumber();const now=new Date().toISOString();const batchTotal=validated.reduce((s,e)=>s+e.totalAmount,0);await runTransaction(db,async(tx)=>{const refs=validated.map(e=>doc(db,'stock',e.stockId));const snaps=await Promise.all(refs.map(r=>tx.get(r)));for(let i=0;i<validated.length;i++){const e=validated[i],snap=snaps[i];if(!snap.exists())throw new Error(`${e.materialName}: ${t('materials.stockNotFound')}`);const cur=toNumber(snap.data().quantity);if(e.quantityUsed>cur)throw new Error(`${e.materialName}: ${t('materials.insufficientStock')}`);e.previousQuantity=cur;e.newQuantity=cur-e.quantityUsed}const batchRef=doc(collection(db,'material_usage_batches'));tx.set(batchRef,{batch_number:batchNumber,site_id:currentSiteId,usage_date:date,total_amount:batchTotal,item_count:validated.length,image:imageUrl||'',recorded_by:currentUser.uid,recorded_by_name:managerProfile?.full_name||'Manager',created_at:now,updated_at:now});for(const e of validated){const uRef=doc(collection(db,'materials'));tx.set(uRef,{site_id:currentSiteId,name:e.materialName,quantity_used:e.quantityUsed,unit:e.unit,unit_cost:e.unitCost,total_amount:e.totalAmount,notes:e.notes,date_used:date,batch_number:batchNumber,stock_id:e.stockId,image:imageUrl||'',recorded_by:currentUser.uid,created_at:now,updated_at:now});tx.update(doc(db,'stock',e.stockId),{quantity:e.newQuantity,unit_cost:e.unitCost,updated_at:now});const tRef=doc(collection(db,'stock_transactions'));tx.set(tRef,{site_id:currentSiteId,stock_id:e.stockId,material_name:e.materialName,transaction_type:'MATERIAL_USAGE',quantity:e.quantityUsed,quantity_change:-e.quantityUsed,previous_quantity:e.previousQuantity,new_quantity:e.newQuantity,unit:e.unit,unit_cost:e.unitCost,total_value:e.totalAmount,batch_number:batchNumber,notes:e.notes||'Material used',recorded_by:currentUser.uid,created_at:now})}});_usagePhotoFile=null;closeModal();showToast(`✅ ${t('materials.batchSaved')} (${batchNumber})`,'success')}catch(err){console.error(err);showToast(err.message||t('common.somethingWentWrong'),'error')}finally{setButtonLoading(btn,false)}};

window.editMaterial=async function(id){const m=getMaterialById(id);if(!m){showToast('Material record not found.','error');return}const s=getStockByName(currentSiteId,m.name);if(!s){showToast(`No stock record found for "${m.name}".`,'error');return}const cur=getStockQuantity(s),orig=toNumber(m.quantity_used),cost=toNumber(m.unit_cost),unit=getStockUnit(s),restored=cur+orig;openModal(`✏️ ${t('materials.editMaterial')}`,`<form onsubmit="submitEditMaterial(event,'${id}')" class="space-y-4"><div class="bg-slate-50 rounded-xl p-4 text-sm space-y-1"><div class="flex justify-between"><span class="text-slate-500">${t('materials.materialName')}</span><span class="font-medium">${m.name}</span></div><div class="flex justify-between"><span class="text-slate-500">${t('materials.currentStock')}</span><span class="font-medium">${cur} ${unit}</span></div><div class="flex justify-between"><span class="text-slate-500">${t('materials.originalUsage')}</span><span class="font-medium">${orig} ${unit}</span></div><div class="flex justify-between border-t pt-2 mt-1"><span class="text-slate-500 font-medium">${t('materials.restoredStock')}</span><span class="font-bold text-emerald-600">${restored} ${unit}</span></div></div><div><label class="block text-sm font-medium mb-1">${t('materials.quantityUsed')} *</label><input type="number" step="0.01" min="0" id="edit-qty" value="${orig}" class="w-full border rounded-lg p-2.5 text-sm" required/></div><div><label class="block text-sm font-medium mb-1">${t('materials.unitCost')} (RWF)</label><input type="number" step="0.01" min="0" id="edit-cost" value="${cost}" class="w-full border rounded-lg p-2.5 text-sm" required/></div><div class="bg-slate-50 rounded-xl p-3 flex justify-between"><span class="text-sm text-slate-600">${t('materials.newTotal')}</span><span id="edit-total-display" class="font-bold text-emerald-600 text-lg">${formatRWF(orig*cost)}</span></div><button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold">${t('common.save')}</button></form>`);const q=document.getElementById('edit-qty'),c=document.getElementById('edit-cost'),d=document.getElementById('edit-total-display');function upd(){d.textContent=formatRWF((parseFloat(q.value)||0)*(parseFloat(c.value)||0))}q.addEventListener('input',upd);c.addEventListener('input',upd)};
window.submitEditMaterial=async function(e,id){e.preventDefault();const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);try{const m=getMaterialById(id);if(!m)throw new Error('Not found');const s=getStockByName(currentSiteId,m.name);if(!s)throw new Error('No stock');const cur=getStockQuantity(s),orig=toNumber(m.quantity_used),restored=cur+orig;const newQ=parseFloat(document.getElementById('edit-qty').value)||0;const newC=parseFloat(document.getElementById('edit-cost').value)||0;if(newQ<=0)throw new Error('Invalid quantity');if(newQ>restored)throw new Error('Exceeds available');const finalStock=restored-newQ,newTotal=newQ*newC,now=new Date().toISOString();await runTransaction(db,async(tx)=>{tx.update(doc(db,'stock',s.id),{quantity:finalStock,unit_cost:newC,updated_at:now});tx.update(doc(db,'materials',id),{quantity_used:newQ,unit_cost:newC,total_amount:newTotal,updated_at:now})});closeModal();showToast(t('common.updatedSuccessfully'),'success')}catch(err){showToast(err.message||'Error','error')}finally{setButtonLoading(btn,false)}};
window.deleteMaterial=async function(id){if(!confirm(t('common.areYouSure')))return;const m=getMaterialById(id);if(!m)return;const s=getStockByName(currentSiteId,m.name);const orig=toNumber(m.quantity_used);try{if(s){await updateDoc(doc(db,'stock',s.id),{quantity:getStockQuantity(s)+orig,updated_at:new Date().toISOString()})}await deleteDoc(doc(db,'materials',id));showToast(t('common.deletedSuccessfully'),'success')}catch(err){showToast(t('common.somethingWentWrong'),'error')}};

function renderStock(container){
  const site=assignedSites.find(s=>s.id===currentSiteId);
  if(!site){container.innerHTML=`<p class="text-red-500">No site assigned.</p>`;return}
  const list=stockData.filter(s=>s.site_id===currentSiteId).slice().sort((a,b)=>String(a.material_name||'').localeCompare(String(b.material_name||'')));
  let h=`<div class="flex justify-between items-center mb-4"><h2 class="text-xl sm:text-2xl font-bold">${t('stock.title')}</h2><button type="button" onclick="openAddStockModal()" class="px-3 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 flex items-center gap-2 text-sm"><iconify-icon icon="material-symbols:add"></iconify-icon> ${t('stock.receiveStock')}</button></div><div class="bg-white rounded-2xl border p-4 shadow-sm mb-5"><p class="text-sm text-slate-600"><strong>Site:</strong> ${site.name}</p></div>`;
  if(!list.length){h+=`<div class="bg-white rounded-2xl border p-8 text-center"><iconify-icon icon="material-symbols:inventory-2-outline" class="text-5xl text-slate-300 mb-3"></iconify-icon><p class="text-slate-500">No stock records.</p><button onclick="openAddStockModal()" class="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm">+ Receive Stock</button></div>`}
  else{h+=`<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">`;list.forEach(item=>{const q=toNumber(item.quantity),m=toNumber(item.minimum_quantity),uc=getStockUnitCost(item),val=q*uc;const st=q<=0?{l:t('stock.outOfStock'),c:'stock-status-out'}:(m>0&&q<=m?{l:t('stock.lowStock'),c:'stock-status-low'}:{l:t('stock.normal'),c:'stock-status-normal'});h+=`<div class="bg-white rounded-2xl border overflow-hidden shadow-sm"><div class="p-5"><div class="flex justify-between items-start gap-3"><h3 class="font-bold text-lg text-slate-800">${item.material_name||'Unknown'}</h3><span class="text-xs font-medium px-2 py-1 rounded-full ${st.c}">${st.l}</span></div><div class="mt-4 space-y-2 text-sm"><div class="flex justify-between border-b pb-2"><span class="text-slate-500">${t('stock.quantity')}</span><span class="font-semibold">${q} ${item.unit||'units'}</span></div><div class="flex justify-between border-b pb-2"><span class="text-slate-500">${t('stock.unitCost')}</span><span class="font-semibold">${formatRWF(uc)}</span></div><div class="flex justify-between"><span class="text-slate-500">${t('stock.stockValue')}</span><span class="font-bold text-emerald-700">${formatRWF(val)}</span></div></div><div class="mt-4 pt-3 border-t flex gap-4"><button type="button" onclick="editStockItem('${item.id}')" class="text-xs text-emerald-600 font-medium">${t('common.edit')}</button></div></div></div>`});h+=`</div>`}
  container.innerHTML=h;
}
window.openAddStockModal=function(){openModal('📦 '+t('stock.receiveStock'),`<form onsubmit="handleAddStock(event)" class="space-y-4"><div><label class="block text-sm font-medium mb-1">${t('materials.materialName')} *</label><input class="w-full border rounded-lg p-3" id="stock-name" required></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-sm font-medium mb-1">${t('stock.quantity')} *</label><input class="w-full border rounded-lg p-3" type="number" step="0.01" min="0" id="stock-qty" required></div><div><label class="block text-sm font-medium mb-1">${t('stock.unit')}</label><input class="w-full border rounded-lg p-3" id="stock-unit" value="units"></div></div><div><label class="block text-sm font-medium mb-1">${t('stock.unitCost')} *</label><input class="w-full border rounded-lg p-3" type="number" step="0.01" min="0" id="stock-cost" required></div><button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold">${t('common.save')}</button></form>`)};
window.handleAddStock=async function(e){e.preventDefault();const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);try{const name=document.getElementById('stock-name').value.trim();const qty=parseFloat(document.getElementById('stock-qty').value)||0;const unit=document.getElementById('stock-unit').value.trim()||'units';const cost=parseFloat(document.getElementById('stock-cost').value)||0;if(!name||qty<=0){showToast(t('common.requiredField'),'error');setButtonLoading(btn,false);return}const existing=getStockByName(currentSiteId,name);const now=new Date().toISOString();if(existing){const newQ=toNumber(existing.quantity)+qty;await updateDoc(doc(db,'stock',existing.id),{quantity:newQ,unit_cost:cost,updated_at:now});await addDoc(collection(db,'stock_transactions'),{site_id:currentSiteId,stock_id:existing.id,material_name:name,transaction_type:'STOCK_ADDED',quantity:qty,quantity_change:qty,previous_quantity:toNumber(existing.quantity),new_quantity:newQ,unit,unit_cost:cost,notes:'Stock received',recorded_by:currentUser.uid,created_at:now})}else{const ref=await addDoc(collection(db,'stock'),{site_id:currentSiteId,material_name:name,quantity:qty,unit,unit_cost:cost,created_at:now,updated_at:now});await addDoc(collection(db,'stock_transactions'),{site_id:currentSiteId,stock_id:ref.id,material_name:name,transaction_type:'STOCK_ADDED',quantity:qty,quantity_change:qty,previous_quantity:0,new_quantity:qty,unit,unit_cost:cost,notes:'Initial stock',recorded_by:currentUser.uid,created_at:now})}closeModal();showToast(t('common.savedSuccessfully'),'success')}catch(err){showToast(err.message||'Error','error')}finally{setButtonLoading(btn,false)}};
window.editStockItem=function(id){const s=getStockById(id);if(!s)return;openModal('✏️ '+t('stock.editStock'),`<form onsubmit="handleEditStock(event,'${id}')" class="space-y-4"><div><label class="block text-sm font-medium mb-1">${t('materials.materialName')}</label><input class="w-full border rounded-lg p-3 bg-slate-50" value="${s.material_name}" disabled></div><div><label class="block text-sm font-medium mb-1">${t('stock.quantity')} *</label><input class="w-full border rounded-lg p-3" type="number" step="0.01" min="0" id="edit-stock-qty" value="${toNumber(s.quantity)}" required></div><div><label class="block text-sm font-medium mb-1">${t('stock.unitCost')} *</label><input class="w-full border rounded-lg p-3" type="number" step="0.01" min="0" id="edit-stock-cost" value="${toNumber(s.unit_cost)}" required></div><button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-semibold">${t('common.save')}</button></form>`)};
window.handleEditStock=async function(e,id){e.preventDefault();const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);try{const q=parseFloat(document.getElementById('edit-stock-qty').value)||0;const c=parseFloat(document.getElementById('edit-stock-cost').value)||0;await updateDoc(doc(db,'stock',id),{quantity:q,unit_cost:c,updated_at:new Date().toISOString()});closeModal();showToast(t('common.updatedSuccessfully'),'success')}catch(err){showToast('Error','error')}finally{setButtonLoading(btn,false)}};

window.openAddWorkerModal=function(){_workerPhotoFile=null;openModal('👷 '+t('workers.addWorker'),`<form onsubmit="handleAddWorker(event)" class="space-y-4"><div><label class="block text-sm font-medium mb-1">${t('workers.fullName')} *</label><input class="w-full border rounded-lg p-3" id="worker-name" required></div><div><label class="block text-sm font-medium mb-1">${t('workers.role')} *</label><input class="w-full border rounded-lg p-3" id="worker-role" required></div><div><label class="block text-sm font-medium mb-1">${t('workers.phone')}</label><input class="w-full border rounded-lg p-3" id="worker-phone" placeholder="+250 7XX XXX XXX"></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-sm font-medium mb-1">${t('workers.paymentType')}</label><select class="w-full border rounded-lg p-3" id="worker-payment"><option value="daily">${t('workers.dailyRate')}</option><option value="monthly">${t('workers.monthlySalary')}</option></select></div><div><label class="block text-sm font-medium mb-1">${t('workers.salary')} (RWF) *</label><input type="number" min="0" class="w-full border rounded-lg p-3" id="worker-salary" required></div></div><div><label class="block text-sm font-medium mb-1">${t('workers.photo')}</label><div id="worker-photo-zone"><label class="img-upload-area block"><input type="file" id="worker-photo-input" accept="image/*" capture="environment" onchange="previewWorkerPhoto(event)"><iconify-icon icon="material-symbols:add-a-photo" class="text-4xl text-slate-400"></iconify-icon><p class="text-sm text-slate-600 mt-2">${t('workers.photoHint')}</p></label></div><div id="worker-photo-preview-wrap" class="hidden mt-3"><div class="img-preview-wrap"><img id="worker-photo-preview" alt=""><button type="button" class="remove-img-btn" onclick="removeWorkerPhoto()"><iconify-icon icon="material-symbols:close" width="18"></iconify-icon></button></div></div></div><button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 round function renderProgress(container){
  let h=`<h2 class="text-xl sm:text-2xl font-bold mb-4">${t('progress.title')}</h2>`;
  if(!progressTasks.length){h+=`<div class="bg-white rounded-2xl border p-8 text-center"><p class="text-slate-500">${t('progress.noTasks')}</p></div>`;container.innerHTML=h;return}
  const rows=progressTasks.map(task=>{const c=task.status==='completed';const cell=c?`<span class="text-emerald-600"><iconify-icon icon="material-symbols:check-circle" width="20"></iconify-icon></span>`:`<button onclick="markTaskCompleted('${task.id}')" class="bg-gray-300 hover:bg-gray-400 text-white w-8 h-8 rounded-full inline-flex items-center justify-center"><iconify-icon icon="material-symbols:check" width="18"></iconify-icon></button>`;const sc=c?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700';const st=c?t('progress.completed'):t('progress.pending');return `<tr><td class="px-3 py-2 text-center">${cell}</td><td class="px-3 py-2 font-medium">${task.name||'Unnamed'}</td><td class="px-3 py-2">${formatDate(task.start_date)}</td><td class="px-3 py-2">${formatDate(task.end_date)}</td><td class="px-3 py-2"><span class="px-2 py-1 rounded-full text-xs ${sc}">${st}</span></td></tr>`}).join('');
  h+=`<div class="bg-white rounded-2xl border overflow-hidden shadow-sm"><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 uppercase text-xs"><tr><th class="px-3 py-2 text-center">Action</th><th class="px-3 py-2">${t('progress.task')}</th><th class="px-3 py-2">${t('progress.start')}</th><th class="px-3 py-2">${t('progress.end')}</th><th class="px-3 py-2">${t('progress.status')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  container.innerHTML=h;
}
window.markTaskCompleted=async function(taskId){if(!confirm('Mark as completed?'))return;try{await updateDoc(doc(db,'progress_tasks',taskId),{status:'completed',updated_at:new Date().toISOString()});showToast(t('common.updatedSuccessfully'),'success')}catch(err){showToast('Error','error')}};

portReportPDF()" class="bg-slate-800 text-white py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-semibold"><iconify-icon icon="material-symbols:picture-as-pdf"></iconify-icon> ${t('reports.exportPDF')}</button><button onclick="exportReportExcel()" class="bg-emerald-700 text-white py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-semibold"><iconify-icon icon="material-symbols:table"></iconify-icon> ${t('reports.exportExcel')}</button><button onclick="exportReportPrint()" class="bg-slate-600 text-white py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-semibold"><iconify-icon icon="material-symbols:print"></iconify-icon> ${t('reports.print')}</button></div></div><div class="bg-white rounded-2xl border p-5 shadow-sm"><h3 class="font-semibold text-slate-700 mb-3">Preview</h3><div id="report-preview" class="text-sm text-slate-600">${renderReportPreview()}</div></div>`;

function renderReportPreview(){
  try{const data=getReportData(currentReportType);

function renderSettings(container){
  container.innerHTML=`<h2 class="text-xl sm:text-2xl font-bold mb-6">${t('settings.title')}</h2><div class="flex flex-wrap gap-2 mb-6 p-1 bg-slate-200/60 rounded-xl"><button class="settings-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition ${settingsTab==='profile'?'active':''}" onclick="switchSettingsTab('profile')">${t('settings.profile')}</button><button class="settings-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition ${settingsTab==='account'?'active':''}" onclick="switchSettingsTab('account')">${t('settings.account')}</button><button class="settings-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition ${settingsTab==='security'?'active':''}" onclick="switchSettingsTab('security')">${t('settings.security')}</button></div><div id="settings-body">${renderSettingsBody()}</div>`;

function renderSettingsBody(){
  const p=managerProfile||{};
  if(settingsTab==='profile')return `<div class="settings-card"><h3>${t('settings.profileInfo')}</h3><form onsubmit="handleProfileSave(event)"><div class="field-group text-center"><div class="profile-avatar-wrapper"><img id="settings-profile-photo-img" src="${p.profile_picture||PLACEHOLDER_IMG}"><label class="change-photo-btn"><iconify-icon icon="material-symbols:photo-camera" width="20"></iconify-icon><input type="file" accept="image/*" style="display:none;" onchange="previewProfilePhoto(event)"></label></div></div><div class="field-group"><label>${t('settings.fullName')}</label><input type="text" id="settings-full-name" value="${p.full_name||''}"></div><div class="field-group"><label>${t('settings.phone')}</label><input type="tel" id="settings-phone" value="${p.phone||''}"></div><div class="field-group"><label>${t('settings.email')}</label><input type="email" id="settings-email" value="${p.email||''}"></div><button type="submit" class="save-btn">${t('settings.saveProfile')}</button></form></div>`;
  if(settingsTab==='account')return `<div class="settings-card"><h3>${t('settings.accountInfo')}</h3><div class="field-group"><label>${t('settings.accountName')}</label><div class="readonly-field">${p.full_name||'N/A'}</div></div><div class="field-group"><label>${t('settings.role')}</label><div class="readonly-field">${p.role||'Manager'}</div></div><div class="field-group"><label>${t('settings.email')}</label><div class="readonly-field">${p.email||'N/A'}</div></div><div class="field-group"><label>${t('settings.memberSince')}</label><div class="readonly-field">${formatDate(p.created_at)}</div></div></div>`;
  if(settingsTab==='security')return `<div class="settings-card"><h3>${t('settings.changePassword')}</h3><form onsubmit="handlePasswordChange(event)"><div class="field-group"><label>${t('settings.currentPassword')}</label><input type="password" id="current-password" required></div><div class="field-group"><label>${t('settings.newPassword')}</label><input type="password" id="new-password" required minlength="6"></div><div class="field-group"><label>${t('settings.confirmPassword')}</label><input type="password" id="confirm-password" required></div><button type="submit" class="save-btn">${t('settings.changePassBtn')}</button></form></div>`;
  return '';

window.switchSettingsTab=function(tab){settingsTab=tab;showSection('settings')};
window.previewProfilePhoto=function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const img=document.getElementById('settings-profile-photo-img');if(img)img.src=ev.target.result;_profilePhotoFile=f};r.readAsDataURL(f)};
window.handleProfileSave=async function(e){e.preventDefault();const btn=e.target.querySelector('.save-btn');setButtonLoading(btn,true);try{const name=document.getElementById('settings-full-name').value.trim();const phone=document.getElementById('settings-phone').value.trim();const email=document.getElementById('settings-email').value.trim();if(!name){showToast('Required','error');setButtonLoading(btn,false);return}const upd={full_name:name,phone,email,updated_at:new Date().toISOString()};if(_profilePhotoFile){upd.profile_picture=await uploadImageToImgbb(_profilePhotoFile);_profilePhotoFile=null}await updateDoc(doc(db,'profiles',currentUser.uid),upd);managerProfile={...managerProfile,...upd};updateProfileUI(managerProfile);showToast(t('common.savedSuccessfully'),'success')}catch(err){showToast('Error','error')}finally{setButtonLoading(btn,false)}};
window.handlePasswordChange=async function(e){e.preventDefault();const btn=e.target.querySelector('.save-btn');setButtonLoading(btn,true);try{const cur=document.getElementById('current-password').value;const np=document.getElementById('new-password').value;const cp=document.getElementById('confirm-password').value;if(np!==cp){showToast('Passwords do not match','error');setButtonLoading(btn,false);return}const cred=EmailAuthProvider.credential(currentUser.email,cur);await reauthenticateWithCredential(currentUser,cred);await updatePassword(currentUser,np);e.target.reset();showToast(t('common.updatedSuccessfully'),'success')}catch(err){showToast(err.message||'Error','error')}finally{setButtonLoading(btn,false)}};

window.showSection=function(section){
  if(currentSection==='settings'&&hasUnsavedChanges){if(!confirm('Unsaved changes. Continue?'))return;hasUnsavedChanges=false}
  currentSection=section;clearError();
  document.getElementById('page-title').textContent=t(`navigation.${section}`)||section;
  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
  document.querySelector(`[data-section="${section}"]`)?.classList.add('active');
  document.querySelectorAll('#bottom-nav a').forEach(a=>a.classList.remove('active'));
  document.querySelector(`#bottom-nav a[data-section="${section}"]`)?.classList.add('active');
  const c=document.getElementById('content-area');c.innerHTML='';
  try{
    switch(section){
      case 'dashboard':renderDashboard(c);break;
      case 'materials':renderMaterials(c);break;
      case 'stock':renderStock(c);break;
      case 'workers':renderWorkers(c);break;
      case 'progress':renderProgress(c);break;
      case 'reports':renderReports(c);break;
      case 'gallery':renderGallery(c);break;
      case 'settings':renderSettings(c);break;
      default:renderDashboard(c);
    }
  }catch(err){console.error('Render error:',err);c.innerHTML=`<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-red-800 max-w-2xl mx-auto mt-8"><p class="font-semibold">⚠️ Render error</p><p class="text-sm mt-1">${err.message}</p><p class="text-xs mt-2">Check console for details.</p></div>`}
  if(window.innerWidth<1024){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebar-overlay').classList.add('hidden')}
};
window.closeModal=function(){document.getElementById('modal-overlay').classList.remove('active')};
window.openModal=function(title,bodyHTML){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=bodyHTML;document.getElementById('modal-overlay').classList.add('active')};
window.toggleSidebar=function(){document.getElementById('sidebar').classList.toggle('-translate-x-full');document.getElementById('sidebar-overlay').classList.toggle('hidden')};

function updateProfileUI(p){if(!p)return;const name=p.full_name||'Manager',email=p.email||'',photo=p.profile_picture||'';const ai=document.getElementById('sidebar-user-avatar-img'),at=document.getElementById('user-avatar-text');if(photo){ai.src=photo;ai.style.display='block';at.style.display='none'}else{ai.style.display='none';at.style.display='flex';at.textContent=name.charAt(0).toUpperCase()}document.getElementById('user-name').textContent=name;document.getElementById('user-email').textContent=email}
function attachListeners(){
  unsubscribeSnapshots.forEach(fn=>{try{fn()}catch(_){}});unsubscribeSnapshots=[];
  if(!currentSiteId)return;const sid=currentSiteId;
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'materials'),where('site_id','==',sid)),s=>{materialsData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'site_workers'),where('site_id','==',sid)),s=>{siteWorkersData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'progress_tasks'),where('site_id','==',sid)),s=>{progressTasks=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'gallery'),where('site_id','==',sid)),s=>{galleryData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'worker_attendance'),where('site_id','==',sid)),s=>{attendanceData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'stock'),where('site_id','==',sid)),s=>{stockData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'stock_transactions'),where('site_id','==',sid),orderBy('created_at','desc')),s=>{stockTransactions=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'requisitions'),where('site_id','==',sid)),s=>{requisitionsData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'requisition_items'),where('site_id','==',sid)),s=>{requisitionItemsData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
}
function refreshCurrentSection(){if(window._refreshing)return;window._refreshing=true;requestAnimationFrame(()=>{if(currentUser&&currentSiteId)showSection(currentSection);window._refreshing=false})}
window.switchSite=function(id){currentSiteId=id;attachListeners();showSection(currentSection)};

// ============================================================
// INIT
// ============================================================
function initLanguage(){document.querySelectorAll('.lang-btn').forEach(b=>{const a=b.dataset.language===currentLanguage;b.classList.toggle('active',a)});document.documentElement.lang=currentLanguage;applyTranslations()}
async function initApp(){
  initLanguage();
  onAuthStateChanged(auth,async(user)=>{
    if(!user){window.location.href='../manager.html';return}
    currentUser=user;
    try{
      const pref=doc(db,'profiles',user.uid);
      const snap=await getDoc(pref);
      if(!snap.exists()||snap.data().role!=='manager'){await signOut(auth);window.location.href='../manager.html';return}
      managerProfile=snap.data();updateProfileUI(managerProfile);
      onSnapshot(pref,s=>{if(s.exists()){managerProfile=s.data();updateProfileUI(managerProfile);if(currentSection==='settings')showSection('settings')}});
      let ids=[];
      if(managerProfile.assigned_sites&&Array.isArray(managerProfile.assigned_sites))ids=managerProfile.assigned_sites;
      else if(managerProfile.assigned_site)ids=[managerProfile.assigned_site];
      if(ids.length){
        const snaps=await Promise.all(ids.map(id=>getDoc(doc(db,'sites',id))));
        assignedSites=snaps.filter(s=>s.exists()).map(s=>({id:s.id,...s.data()}));
        if(assignedSites.length){
          currentSiteId=assignedSites[0].id;
          const sel=document.getElementById('site-selector');
          if(assignedSites.length>1){sel.classList.remove('hidden');sel.innerHTML=assignedSites.map(s=>`<option value="${s.id}" ${s.id===currentSiteId?'selected':''}>${s.name}</option>`).join('')}
          else{sel.classList.add('hidden')}
          attachListeners();
        }
      }
      showSection('dashboard');
    }catch(err){console.error('Init error:',err);showError('Failed to initialize: '+err.message);document.getElementById('content-area').innerHTML=`<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-red-800 max-w-2xl mx-auto mt-8"><p class="font-semibold">⚠️ Init error</p><p class="text-sm mt-1">${err.message}</p><p class="text-xs mt-2">Check that Firestore rules allow reading your profile.</p></div>`}
  });
}
initApp();
console.log('✅ SHDR Manager Dashboard initialized');
</script>
</body>
</html>
