<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#059669">
<title>Sustainable Homes Design Rwanda Ltd — Construction Sites Management System</title>
<link rel="icon" type="image/png" href="shdr_logo%20Background%20Removed.png">
<link rel="apple-touch-icon" sizes="180x180" href="shdr_logo%20Background%20Removed.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{font-family:'Plus Jakarta Sans',sans-serif}
body{background:#f8fafc}
.sidebar-link.active{background:#ecfdf5;color:#059669;border-left:3px solid #059669}
.stat-card{transition:all .2s ease}.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,.05)}
.modal{display:none}.modal.active{display:flex}
.spinner{border:3px solid #e2e8f0;border-top:3px solid #059669;border-radius:50%;width:24px;height:24px;animation:spin .8s linear infinite}
.btn-spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top:2px solid #fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;z-index:40;justify-content:space-around;padding:8px 0;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;font-size:.6rem;color:#6b7280;text-decoration:none;padding:4px 8px;border-radius:8px;transition:.2s}
.bottom-nav a.active{color:#059669;background:#ecfdf5}.bottom-nav a iconify-icon{font-size:1.3rem}
@media (max-width:1023px){.bottom-nav{display:flex}main{padding-bottom:80px}}
@media (max-width:640px){#content-area{padding:1rem}.stat-card{padding:1rem}}
.tab-active{background:#059669;color:#fff}.tab-inactive{background:#f1f5f9;color:#334155}.tab-inactive:hover{background:#e2e8f0}
.report-tab-active{background:#059669;color:#fff}.report-tab-inactive{background:#f1f5f9;color:#334155}.report-tab-inactive:hover{background:#e2e8f0}
.stock-status-normal{background:#dcfce7;color:#166534}.stock-status-low{background:#fef9c3;color:#854d0e}.stock-status-out{background:#fee2e2;color:#991b1b}
.language-switcher{display:flex;align-items:center;background:rgba(30,86,160,.1);border:1px solid rgba(30,86,160,.2);border-radius:50px;padding:4px}
.lang-btn{background:transparent;border:2px solid transparent;color:#64748b;font-size:14px;font-weight:700;padding:6px 16px;border-radius:50px;cursor:pointer;transition:all .3s ease;outline:none}
.lang-btn.active{background:#fff;color:#1e56a0;border-color:#1e56a0}
@media (max-width:640px){.lang-btn{font-size:12px;padding:4px 10px}}
.settings-tab-btn{transition:all .2s}.settings-tab-btn.active{background:#059669;color:#fff}
.settings-section{display:none}.settings-section.active{display:block}
.profile-avatar-wrapper{position:relative;width:120px;height:120px;margin:0 auto}
.profile-avatar-wrapper img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.profile-avatar-wrapper .change-photo-btn{position:absolute;bottom:4px;right:4px;background:#059669;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff}
.settings-card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.settings-card h3{font-weight:600;font-size:1.1rem;color:#1e293b;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.settings-card .field-group{margin-bottom:1.25rem}
.settings-card label{display:block;font-size:.85rem;font-weight:500;color:#475569;margin-bottom:.3rem}
.settings-card input,.settings-card select{width:100%;padding:.6rem .75rem;border:1px solid #d1d5db;border-radius:8px;font-size:.95rem;background:#fff}
.settings-card input:focus,.settings-card select:focus{outline:none;border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.2)}
.settings-card .readonly-field{background:#f1f5f9;color:#475569;padding:.6rem .75rem;border-radius:8px;font-size:.95rem}
.settings-card .save-btn{background:#059669;color:#fff;padding:.6rem 1.5rem;border-radius:8px;font-weight:600;border:none;cursor:pointer}
.settings-card .save-btn:disabled{opacity:.6;cursor:not-allowed}
.settings-card .remove-photo-btn{color:#ef4444;font-size:.85rem;cursor:pointer;background:none;border:none}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.20);transform:translateY(80px);opacity:0;transition:all .4s ease;z-index:999;max-width:400px;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateY(0);opacity:1}.toast.success{border-left:4px solid #059669}.toast.error{border-left:4px solid #ef4444}.toast.info{border-left:4px solid #3b82f6}
.usage-material-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.75rem;max-height:340px;overflow-y:auto;padding:.25rem}
.usage-material-grid .mat-card{border:2px solid #e5e7eb;border-radius:12px;padding:12px 8px;background:#fff;cursor:pointer;transition:all .15s ease;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;user-select:none;position:relative;min-height:80px;justify-content:center}
.usage-material-grid .mat-card:hover{border-color:#9ca3af;transform:translateY(-2px)}
.usage-material-grid .mat-card .mat-icon{font-size:1.8rem;line-height:1.2}
.usage-material-grid .mat-card .mat-name{font-weight:700;font-size:.8rem;color:#1e293b;text-transform:uppercase}
.usage-material-grid .mat-card .mat-unit{font-size:.65rem;color:#94a3b8}
.usage-material-grid .mat-card .check-indicator{position:absolute;top:4px;right:6px;color:#059669;font-size:1rem;font-weight:700;opacity:0}
.usage-material-grid .mat-card.selected{border-color:#059669;background:#f0fdf4;box-shadow:0 4px 12px rgba(5,150,105,.10)}
.usage-material-grid .mat-card.selected .check-indicator{opacity:1}
.usage-entries-table th{background:#f8fafc;font-weight:600;font-size:.7rem;text-transform:uppercase;color:#475569;padding:.5rem .75rem;text-align:left;border-bottom:2px solid #e5e7eb}
.usage-entries-table td{padding:.5rem .75rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.usage-entries-table input{border:1px solid #e2e8f0;border-radius:6px;padding:4px 8px;width:100%;font-size:.85rem;background:#fff}
.usage-entries-table input:focus{border-color:#059669;outline:none;box-shadow:0 0 0 3px rgba(5,150,105,.15)}
.usage-entries-table .remove-btn{color:#94a3b8;background:none;border:none;cursor:pointer;padding:4px}
.usage-entries-table .remove-btn:hover{color:#dc2626}
.usage-total-card{background:linear-gradient(135deg,#ecfdf5 0%,#d1fae5 100%);border:2px solid #059669;border-radius:16px;padding:1.25rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.usage-total-card .total-amount{font-size:1.8rem;font-weight:800;color:#065f46}
.usage-empty-state{display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;color:#94a3b8}
.usage-empty-state iconify-icon{font-size:3rem;margin-bottom:.5rem;opacity:.5}
.usage-save-btn{background:#059669;color:#fff;padding:14px 32px;border-radius:12px;font-weight:700;font-size:1rem;border:none;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.usage-save-btn:hover{background:#047857}.usage-save-btn:disabled{opacity:.6;cursor:not-allowed}
.usage-photo-preview{width:100%;max-height:220px;object-fit:contain;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc}
.req-filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:#f8fafc;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:16px}
.req-filter-bar input,.req-filter-bar select{border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:.85rem;background:#fff;outline:none}
.req-filter-bar input:focus,.req-filter-bar select:focus{border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.15)}
.req-table th{background:#059669;color:#fff;font-weight:600;font-size:.75rem;text-transform:uppercase;padding:10px 12px;text-align:left;white-space:nowrap}
.req-table td{padding:10px 12px;border-bottom:1px solid #e5e7eb;font-size:.85rem;vertical-align:top}
.req-table tr:nth-child(even){background:#f9fafb}
.req-table tr:hover{background:#f1f5f9}
.req-status-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
.req-status-Pending{background:#fef3c7;color:#92400e}
.req-status-Approved{background:#dbeafe;color:#1e40af}
.req-status-Rejected{background:#fee2e2;color:#991b1b}
.req-status-Supplied{background:#d1fae5;color:#065f46}
.req-status-Partially{background:#fef9c3;color:#854d0e}
.img-upload-area{border:2px dashed #cbd5e1;border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;background:#f8fafc}
.img-upload-area:hover{border-color:#059669;background:#f0fdf4}
.img-upload-area input{display:none}
.img-preview-wrap{position:relative;display:inline-block;max-width:100%}
.img-preview-wrap img{max-width:100%;max-height:220px;border-radius:12px;object-fit:cover;border:1px solid #e2e8f0}
.img-preview-wrap .remove-img-btn{position:absolute;top:6px;right:6px;background:rgba(220,38,38,.9);color:#fff;border:none;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
@media (max-width:640px){.usage-material-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.usage-material-grid .mat-card{padding:8px 4px;min-height:70px}}

/* ===== PASSWORD SHOW/HIDE TOGGLE ===== */
.password-field{position:relative;width:100%}
.password-field input{width:100%;padding-right:52px}
.password-toggle{
  position:absolute;top:50%;right:4px;transform:translateY(-50%);
  width:44px;height:44px;
  display:inline-flex;align-items:center;justify-content:center;
  border:0;background:transparent;border-radius:10px;
  color:#6b7280;cursor:pointer;padding:0;margin:0;z-index:2;
  transition:color .2s ease,background-color .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.password-toggle:hover{color:#059669;background:rgba(5,150,105,.08)}
.password-toggle:focus-visible{outline:2px solid #059669;outline-offset:1px}
.password-toggle .material-symbols-rounded{
  font-family:'Material Symbols Rounded',sans-serif !important;
  font-weight:normal;font-style:normal;font-size:22px;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;
  white-space:nowrap;word-wrap:normal;direction:ltr;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  -webkit-font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased;
  pointer-events:none;user-select:none;
}

/* ===== MESSAGING ===== */
.messages-shell{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 240px);min-height:440px;position:relative;overflow:hidden}
.messages-shell.info-open{grid-template-columns:320px 1fr 360px}
.messages-directory{border-right:1px solid #e5e7eb;display:flex;flex-direction:column;min-height:0}
.messages-thread{display:flex;flex-direction:column;min-height:0;background:#f8fafc}
.messages-info-panel{border-left:1px solid #e5e7eb;background:#fff;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.messages-info-panel.hidden{display:none}
.msg-row{transition:background .15s;cursor:pointer}
.msg-row:hover{background:#f1f5f9}
.msg-row.active{background:#ecfdf5;border-left:3px solid #059669}
.presence-dot{width:10px;height:10px;border-radius:50%;border:2px solid #fff;position:absolute;bottom:0;right:0}
.presence-online{background:#22c55e}
.presence-offline{background:#cbd5e1}
#messages-nav-badge{background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:auto}
@media (max-width:1023px){
  .messages-shell{grid-template-columns:1fr;height:calc(100vh - 200px)}
  .messages-shell.info-open{grid-template-columns:1fr}
  .messages-shell.thread-open .messages-directory{display:none}
  .messages-shell:not(.thread-open) .messages-thread{display:none}
  .messages-shell:not(.thread-open) .messages-info-panel{display:none}
  .messages-info-panel{position:fixed;inset:0;z-index:60;border-left:none}
}

.msg-tick{font-size:11px;letter-spacing:-2px;display:inline-block;line-height:1}
.msg-tick.read{color:#53bdeb}
.msg-tick.delivered{color:#e5e7eb}
.msg-tick.sent{color:#e5e7eb}

.msg-bubble-row{display:flex;align-items:flex-start;gap:6px;width:100%}
.msg-bubble-row.mine{flex-direction:row-reverse}
.msg-bubble-col{max-width:80%;display:flex;flex-direction:column;position:relative}
.msg-bubble-row.mine .msg-bubble-col{align-items:flex-end}
.msg-bubble-row:not(.mine) .msg-bubble-col{align-items:flex-start}

.msg-menu-btn{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid #e5e7eb;color:#94a3b8;
  cursor:pointer;flex-shrink:0;
  transition:all .15s ease;
  margin-top:4px;
}
.msg-menu-btn:hover,.msg-menu-btn:active{background:#ecfdf5;color:#059669;border-color:#059669}
.msg-menu-btn iconify-icon{font-size:20px}

.msg-star-badge{position:absolute;top:4px;right:4px;color:#f59e0b;font-size:14px}
.msg-pin-badge{position:absolute;top:4px;left:4px;color:#059669;font-size:14px}

.msg-action-menu{
  position:fixed;
  background:#fff;border:1px solid #e5e7eb;border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.18);
  padding:4px;z-index:9000;
  display:flex;flex-direction:column;
  min-width:210px;max-height:70vh;overflow-y:auto;
}
.msg-action-menu button{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;
  font-size:14px;font-weight:500;color:#334155;background:none;border:none;cursor:pointer;
  text-align:left;width:100%;
}
.msg-action-menu button:hover{background:#f1f5f9;color:#059669}
.msg-action-menu button.danger:hover{background:#fef2f2;color:#dc2626}
.msg-action-menu .menu-icon{width:18px;display:inline-flex;justify-content:center}

.reaction-picker-floating{
  position:fixed;
  background:#fff;border:1px solid #e5e7eb;border-radius:999px;
  box-shadow:0 8px 24px rgba(0,0,0,.15);
  padding:4px;z-index:9001;
  display:flex;gap:2px;
}
.reaction-picker-floating button{
  width:36px;height:36px;border-radius:50%;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;cursor:pointer;
  transition:transform .12s ease;
}
.reaction-picker-floating button:hover{background:#f1f5f9;transform:scale(1.15)}

.msg-reply-quote{border-left:3px solid #059669;background:rgba(5,150,105,.08);border-radius:6px;padding:4px 8px;margin-bottom:5px;font-size:11px;color:#334155;cursor:pointer}
.msg-reply-quote .rq-name{font-weight:600;color:#059669}
.msg-reply-quote .rq-text{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;display:block}
.msg-forwarded-label{font-size:10px;font-style:italic;opacity:.85;margin-bottom:3px;display:flex;align-items:center;gap:4px}

.msg-reactions{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.msg-reactions .react-pill{background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:2px 8px;font-size:12px;display:inline-flex;gap:3px;align-items:center;cursor:pointer;line-height:1.4;transition:all .15s}
.msg-reactions .react-pill:hover{background:#f8fafc}
.msg-reactions .react-pill.mine{background:#ecfdf5;border-color:#059669;color:#065f46}

.msg-highlight{animation:msgHighlight 1.4s ease}
@keyframes msgHighlight{0%{background:#fef08a}100%{background:transparent}}

.msg-deleted{font-style:italic;opacity:.7;font-size:12px}

.composer-toolbar{display:flex;gap:2px;align-items:center}
.composer-toolbar button{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#64748b;background:transparent;border:none;cursor:pointer}
.composer-toolbar button:hover{background:#f1f5f9;color:#059669}
.composer-toolbar button.active{background:#ecfdf5;color:#059669}

#message-send-btn{transition:opacity .15s ease, background-color .15s ease}
#message-send-btn:disabled{opacity:.5;cursor:not-allowed;background-color:#94a3b8}
#message-send-btn:disabled:hover{background-color:#94a3b8}

.emoji-picker{position:absolute;bottom:60px;left:12px;right:12px;max-width:340px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:10px;z-index:20;display:none}
.emoji-picker.open{display:block}
.emoji-picker .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:220px;overflow-y:auto}
.emoji-picker .emoji-grid button{font-size:22px;padding:6px 0;border-radius:8px;background:transparent;border:none;cursor:pointer}
.emoji-picker .emoji-grid button:hover{background:#f1f5f9}

.composer-reply{display:flex;align-items:center;gap:8px;border-left:3px solid #059669;background:rgba(5,150,105,.06);padding:6px 10px;border-radius:6px;margin-bottom:6px;font-size:12px}
.composer-reply .close-x{margin-left:auto;color:#64748b;padding:2px;background:none;border:none;cursor:pointer}

.composer-attachment{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:12px}

.msg-search-panel{background:#fff;border-bottom:1px solid #e5e7eb;padding:8px 12px;display:none}
.msg-search-panel.open{display:block}
.msg-search-result{padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;border-bottom:1px solid #f1f5f9}
.msg-search-result:hover{background:#f1f5f9}

.shared-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;font-size:12px;max-width:280px}
.shared-card .sc-title{font-weight:700;color:#065f46;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.shared-card .sc-row{display:flex;justify-content:space-between;color:#334155;padding:2px 0}

.attach-preview{max-width:220px;border-radius:8px;overflow:hidden;margin-bottom:4px;background:#000}
.attach-preview img{display:block;width:100%;max-height:200px;object-fit:cover;cursor:pointer}
.attach-file{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border-radius:8px;padding:6px 8px;margin-bottom:4px;font-size:12px;color:inherit;text-decoration:none}

/* Conversation Info Panel */
.info-header{padding:14px 16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px;background:#fff;flex-shrink:0}
.info-header h3{font-weight:700;font-size:15px;flex:1}
.info-header button{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:#64748b}
.info-header button:hover{background:#f1f5f9;color:#059669}
.info-scroll{flex:1;overflow-y:auto;padding:16px}
.info-hero{text-align:center;padding:12px 0 20px}
.info-hero .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;overflow:hidden;background:#ecfdf5;color:#059669;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;position:relative}
.info-hero .avatar img{width:100%;height:100%;object-fit:cover}
.info-hero .name{font-weight:700;font-size:18px;color:#0f172a}
.info-hero .email{font-size:12px;color:#64748b;margin-top:2px}
.info-hero .org{font-size:12px;color:#059669;font-weight:600;margin-top:4px}
.info-hero .presence{font-size:12px;margin-top:6px}
.info-section{background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:12px}
.info-section h4{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;gap:10px}
.info-row .label{color:#64748b}
.info-row .value{color:#0f172a;font-weight:500;text-align:right;word-break:break-word;max-width:60%}
.info-action{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #e5e7eb;cursor:pointer;font-size:13px;font-weight:500;color:#334155;width:100%;text-align:left;margin-bottom:6px}
.info-action:hover{background:#f8fafc}
.info-action iconify-icon{color:#059669}
.info-tabs{display:flex;gap:4px;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:12px}
.info-tabs button{flex:1;padding:7px 8px;border-radius:8px;font-size:12px;font-weight:600;color:#64748b;background:transparent;border:none;cursor:pointer}
.info-tabs button.active{background:#059669;color:#fff}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.media-grid .media-cell{aspect-ratio:1;border-radius:8px;overflow:hidden;background:#f1f5f9;cursor:pointer}
.media-grid .media-cell img{width:100%;height:100%;object-fit:cover;display:block}
.file-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:6px;font-size:12px}
.file-row .file-icon{width:36px;height:36px;border-radius:8px;background:#ecfdf5;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-row .file-info{flex:1;min-width:0}
.file-row .file-name{font-weight:600;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-row .file-size{color:#64748b;font-size:11px}
.file-row a{color:#059669;text-decoration:none;font-weight:600}
.info-empty{text-align:center;color:#94a3b8;font-size:12px;padding:20px 8px}

function formatDate(v){
  if(!v) return '—';
  let d, dateOnly=false;
  if(typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)){const [y,m,dd]=v.split('-').map(Number);d=new Date(y,m-1,dd);dateOnly=true;}
  else {d=typeof v==='string'?new Date(v):v;}
  if(isNaN(d.getTime())) return '—';
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const datePart=`${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  if(dateOnly) return datePart;
  const hh=String(d.getHours()).padStart(2,'0');
  const mm=String(d.getMinutes()).padStart(2,'0');
  return `${datePart}, ${hh}:${mm} PM`;
}
function formatDateShort(v){if(!v)return '—';const d=typeof v==='string'?new Date(v):v;if(isNaN(d.getTime()))return '—';return d.toISOString().split('T')[0]}

function showToast(msg,type='info'){
  const el=document.getElementById('toast');
  const icons={success:'✅',error:'❌',info:'ℹ️'};
  el.innerHTML='';
  const span=document.createElement('span');
  span.textContent=icons[type]||'ℹ️';
  el.appendChild(span);
  el.appendChild(document.createTextNode(' '+String(msg??'')));
  el.className='toast '+(type||'info');
  el.classList.add('show');
  clearTimeout(el._h);
  el._h=setTimeout(()=>el.classList.remove('show'),5000);
}

  const siteOpts = assignedSites.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  const tabs = [
    {key:'general', label:t('reports.general'), icon:'material-symbols:description'},
    {key:'payroll', label:t('reports.workerPayroll'), icon:'material-symbols:payments'},
    {key:'materials', label:t('reports.materials'), icon:'material-symbols:inventory-2'},
    {key:'workers', label:t('reports.workers'), icon:'material-symbols:engineering'}
  ];
  container.innerHTML = `
    <h2 class="text-xl sm:text-2xl font-bold mb-4 flex items-center gap-2"><iconify-icon icon="material-symbols:description" class="text-emerald-600"></iconify-icon>${t('reports.title')}</h2>
    <div class="flex gap-2 p-1 bg-slate-200/60 rounded-xl mb-6 overflow-x-auto">
      ${tabs.map(tb => `<button onclick="setReportType('${tb.key}')" class="flex-1 min-w-[140px] px-4 py-2.5 rounded-lg text-sm font-semibold transition ${reportType===tb.key?'report-tab-active':'report-tab-inactive'} flex items-center justify-center gap-2"><iconify-icon icon="${tb.icon}" width="18"></iconify-icon> ${tb.label}</button>`).join('')}
    </div>
    <div id="report-content">${
      reportType==='general' ? renderGeneralReport(siteOpts) :
      reportType==='payroll' ? renderPayrollReport(siteOpts) :
      reportType==='materials' ? renderMaterialsReport(siteOpts) :
      renderWorkersReport(siteOpts)
    }</div>`;
  if (reportType === 'payroll') setTimeout(updatePayrollReport, 100);
  if (reportType === 'general') setTimeout(updateGeneralPreview, 100);
  if (reportType === 'materials') setTimeout(updateMaterialsPreview, 100);
  if (reportType === 'workers') setTimeout(updateWorkersPreview, 100);
}

function updateGeneralPreview(){
  const container = document.getElementById('general-preview-container');
  if (!container) return;
  const siteId = document.getElementById('report-site')?.value || 'all';
  const dept = document.getElementById('report-dept')?.value || 'all';
  const startDate = document.getElementById('report-start')?.value || '';
  const endDate = document.getElementById('report-end')?.value || '';
  const siteLabel = siteId === 'all' ? t('reports.allSites') : (assignedSites.find(s=>s.id===siteId)?.name || 'Site');
  const deptLabel = dept === 'all' ? t('reports.allDepartments') : dept.charAt(0).toUpperCase()+dept.slice(1);
  const period = startDate && endDate ? `${startDate} — ${endDate}` : (startDate || endDate || 'All time');
  const rows = [];
  const getSiteName = (id) => assignedSites.find(s=>s.id===id)?.name || 'Unknown';
  if (dept === 'all' || dept === 'materials'){
    let mats = siteId !== 'all' ? materialsData.filter(m=>m.site_id===siteId) : materialsData;
    if (startDate) mats = mats.filter(m => (m.date_used || m.created_at || '').slice(0,10) >= startDate);
    if (endDate) mats = mats.filter(m => (m.date_used || m.created_at || '').slice(0,10) <= endDate);
    mats.forEach(m => rows.push({Department:'Materials', Site:getSiteName(m.site_id), Name:m.name, Qty:m.quantity_used||0, 'Unit Cost':m.unit_cost||0, Total:calculateTotal(m.quantity_used||0,m.unit_cost||0), Date: formatDate(m.date_used || m.created_at)}));
  }
  if (dept === 'all' || dept === 'workers'){
    let ws = siteId !== 'all' ? siteWorkersData.filter(w=>w.site_id===siteId) : siteWorkersData;
    ws.forEach(w => rows.push({Department:'Workers', Site:getSiteName(w.site_id), Name:w.name, Role:w.role||'', Salary:w.salary||0, Phone:w.phone||''}));
  }
  if (!rows.length){container.innerHTML = `<div class="p-10 text-center text-slate-500 text-sm flex flex-col items-center gap-2"><iconify-icon icon="material-symbols:inbox-outline" class="text-5xl text-slate-300"></iconify-icon>${t('common.noDataAvailable')}</div>`;return;}
  const headers = Object.keys(rows[0]);
  const thead = headers.map(h=>`<th class="px-3 py-2 text-left text-xs font-semibold text-slate-500 uppercase whitespace-nowrap">${h}</th>`).join('');
  const tbody = rows.slice(0,100).map(r=>`<tr class="border-b border-slate-100">${headers.map(h=>`<td class="px-3 py-2 text-sm text-slate-700 whitespace-nowrap">${r[h] ?? ''}</td>`).join('')}</tr>`).join('');
  container.innerHTML = `
    <div class="px-4 py-3 border-b border-slate-100 bg-slate-50 flex flex-wrap items-center justify-between gap-2">
      <div><h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><iconify-icon icon="material-symbols:description" class="text-emerald-600" width="18"></iconify-icon>${t('reports.reportTitles.general')}</h3>
      <p class="text-xs text-slate-500 mt-0.5">${siteLabel} • ${deptLabel} • ${period}</p></div>
      <span class="text-xs text-slate-500 bg-white border border-slate-200 px-3 py-1 rounded-full flex items-center gap-1"><iconify-icon icon="material-symbols:summarize" width="14"></iconify-icon>${rows.length} ${t('reports.total')}</span>
    </div>
    <div class="overflow-x-auto"><table class="w-full"><thead class="bg-slate-50"><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>
    ${rows.length > 100 ? `<div class="px-4 py-2 text-xs text-slate-400">Showing first 100 of ${rows.length} rows.</div>` : ''}`;
}
window.exportGeneralReport = (format) => {
  const siteId = document.getElementById('report-site').value;
  const dept = document.getElementById('report-dept').value;
  const startDate = document.getElementById('report-start').value;
  const endDate = document.getElementById('report-end').value;
  const company = getCompanyDetails();
  const getSiteName = (id) => assignedSites.find(s=>s.id===id)?.name || 'Unknown';
  const data = [];
  if (dept === 'all' || dept === 'materials'){
    let mats = siteId !== 'all' ? materialsData.filter(m=>m.site_id===siteId) : materialsData;
    if (startDate) mats = mats.filter(m => (m.date_used || m.created_at || '').slice(0,10) >= startDate);
    if (endDate) mats = mats.filter(m => (m.date_used || m.created_at || '').slice(0,10) <= endDate);
    data.push(...mats.map(m => ({Department:'Materials', Site:getSiteName(m.site_id), Name:m.name, Quantity:m.quantity_used||0, 'Unit Cost':m.unit_cost||0, Total:calculateTotal(m.quantity_used||0,m.unit_cost||0), Date: formatDate(m.date_used || m.created_at)})));
  }
  if (dept === 'all' || dept === 'workers'){
    let ws = siteId !== 'all' ? siteWorkersData.filter(w=>w.site_id===siteId) : siteWorkersData;
    data.push(...ws.map(w => ({Department:'Workers', Site:getSiteName(w.site_id), Name:w.name, Role:w.role||'', Salary:w.salary||0, Phone:w.phone||''})));
  }
  if (!data.length){ alert(t('common.noDataAvailable')); return; }
  const siteLabel = siteId === 'all' ? t('reports.allSites') : (assignedSites.find(s=>s.id===siteId)?.name || 'Site');
  const deptLabel = dept === 'all' ? t('reports.allDepartments') : dept.charAt(0).toUpperCase()+dept.slice(1);
  const generatedDate = formatDate(new Date());
  const filename = `SHDR_${siteLabel.replace(/\s/g,'_')}_${deptLabel.replace(/\s/g,'_')}_${new Date().toISOString().slice(0,10)}`;
  if (format === 'csv'){
    const headers = Object.keys(data[0]);
    const csvRows = [`"${company.name}"`,`"${company.address}"`,`"${company.location}"`,`"${company.city}"`,`"Tel: ${company.phone}"`,`"Email: ${company.email}"`,`"Generated: ${generatedDate}"`,`"Report: ${siteLabel}"`,`"Department: ${deptLabel}"`,'',headers.join(',')];
    for (const row of data) csvRows.push(headers.map(h=>`"${String(row[h] ?? '').replace(/"/g,'""')}"`).join(','));
    const csv = csvRows.join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');a.href = url; a.download = `${filename}.csv`; a.click();URL.revokeObjectURL(url);return;
  }
  const headers = Object.keys(data[0]);
  const tableRows = data.map(row=>`<tr>${headers.map(h=>`<td>${row[h] ?? ''}</td>`).join('')}</tr>`).join('');
  const meta = `<strong>${t('reports.labels.siteName')}:</strong> ${siteLabel} &nbsp;|&nbsp; <strong>${t('reports.labels.department')}:</strong> ${deptLabel}<br><strong>${t('reports.generated')}:</strong> ${generatedDate}`;
  const bodyHTML = `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${tableRows}</tbody></table>`;
  const fullHTML = generateReportHTML(t('reports.reportTitles.general'), bodyHTML, meta);
  const win = window.open('', '_blank', 'width=1000,height=700');
  if (!win){ alert(t('common.accessDenied')); return; }
  win.document.write(fullHTML); win.document.close();
  setTimeout(()=>win.print(), 500);
};

function isRecordPaid(rec){if (!rec) return false; if (rec.payment_status === 'paid' || rec.paid === true || rec.is_paid === true) return true; return false;}
function buildPayrollDataset(){
  const siteId = document.getElementById('payroll-site')?.value || 'all';
  const startDate = document.getElementById('payroll-start')?.value || '';
  const endDate = document.getElementById('payroll-end')?.value || '';
  const search = (document.getElementById('payroll-worker-search')?.value || '').toLowerCase();
  const position = document.getElementById('payroll-position')?.value || 'all';
  const status = document.getElementById('payroll-status')?.value || 'all';
  let filtered = attendanceData.slice();
  if (siteId !== 'all') filtered = filtered.filter(a=>a.site_id===siteId);
  if (startDate) filtered = filtered.filter(a=>(a.date||'').slice(0,10) >= startDate);
  if (endDate) filtered = filtered.filter(a=>(a.date||'').slice(0,10) <= endDate);
  if (search) filtered = filtered.filter(a=>(a.name||'').toLowerCase().includes(search));
  if (position !== 'all') filtered = filtered.filter(a=>a.role === position);
  if (status === 'paid') filtered = filtered.filter(isRecordPaid);
  else if (status === 'unpaid') filtered = filtered.filter(r => !isRecordPaid(r));
  const map = {};
  filtered.forEach(rec=>{const key = rec.worker_id || rec.name; if (!map[key]) map[key] = { id:key, name:rec.name, role:rec.role||'', dailyRate:rec.daily_rate||0, days:[], totalPayable:0 }; map[key].days.push(rec.date); map[key].totalPayable += (rec.daily_rate || 0); if (rec.daily_rate) map[key].dailyRate = rec.daily_rate;});
  const workers = Object.values(map);
  const totalWorkers = workers.length;
  const totalDays = workers.reduce((s,w)=>s+w.days.length,0);
  const totalPayroll = workers.reduce((s,w)=>s+w.totalPayable,0);
  const avgDaily = totalDays > 0 ? totalPayroll / totalDays : 0;
  return { workers, totalWorkers, totalDays, totalPayroll, avgDaily, siteId, startDate, endDate, position, status };
}

function renderMaterialsReport(siteOpts){

function buildMaterialsDataset(){
  const siteId = document.getElementById('mat-report-site')?.value || 'all';
  const startDate = document.getElementById('mat-report-start')?.value || '';
  const endDate = document.getElementById('mat-report-end')?.value || '';
  let mats = materialsData.slice();
  if (siteId !== 'all') mats = mats.filter(m=>m.site_id===siteId);
  if (startDate) mats = mats.filter(m => (m.date_used || m.created_at || '').slice(0,10) >= startDate);
  if (endDate) mats = mats.filter(m => (m.date_used || m.created_at || '').slice(0,10) <= endDate);
  mats = mats.slice().sort((a,b)=> new Date(b.date_used||b.created_at||0) - new Date(a.date_used||a.created_at||0));
  const getSiteName = (id) => assignedSites.find(s=>s.id===id)?.name || 'Unknown';
  const rows = mats.map(m => ({Site: getSiteName(m.site_id), Date: formatDate(m.date_used||m.created_at), Material: m.name, Quantity: m.quantity_used || 0, Unit: m.unit || 'units', 'Unit Cost': m.unit_cost || 0, Total: calculateTotal(m.quantity_used||0, m.unit_cost||0)}));
  const totalValue = rows.reduce((s,r)=>s+r.Total,0);
  return { rows, totalValue, siteId, startDate, endDate };
}

function addPdfFooter(doc, company){

function buildRequisitionReportData(){
  const filters=_reqFilters;
  const rows=[];
  const reqs=requisitionsData.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  reqs.forEach(req=>{
    const items=requisitionItemsData.filter(i=>i.requisition_id===req.id);
    const site=assignedSites.find(s=>s.id===req.site_id);
    const siteName=site?site.name:'—';
    const reqDate=formatDateShort(req.request_date);
    const needDate=formatDateShort(req.required_date);
    const status=req.status||'Pending';
    if(filters.priority!=='all'&&req.priority!==filters.priority)return;
    if(filters.status!=='all'&&status!==filters.status)return;
    if(filters.dateFrom&&reqDate<filters.dateFrom)return;
    if(filters.dateTo&&reqDate>filters.dateTo)return;
    const reqBy=req.requested_by_name||'—';
    if(items.length===0){
      rows.push({reqId:req.requisition_number,reqDate,needDate,material:'—',unit:'—',qty:'0',priority:req.priority||'Normal',notes:req.notes||'',status,site:siteName,reqBy,raw:req});
    }else{
      items.forEach(it=>{
        const mat=cleanName(it.material_name||'—');
        if(filters.search){
          const q=filters.search.toLowerCase();
          const haystack=`${req.requisition_number} ${mat} ${siteName} ${reqBy} ${req.notes||''}`.toLowerCase();
          if(!haystack.includes(q))return;
        }
        rows.push({reqId:req.requisition_number,reqDate,needDate,material:mat,unit:it.unit||'—',qty:it.quantity_requested||0,priority:req.priority||'Normal',notes:req.notes||'',status,site:siteName,reqBy,raw:req});
      });
    }
  });
  if(filters.search){const q=filters.search.toLowerCase(); return rows.filter(r=>`${r.reqId} ${r.material} ${r.site} ${r.reqBy} ${r.notes}`.toLowerCase().includes(q));}
  return rows;
}

function updateUsageEntries(){

  if(!e.length){c.innerHTML=`<div class="usage-empty-state"><iconify-icon icon="material-symbols:inbox-outline"></iconify-icon><p>${t('materials.selectMaterials')}</p></div>`;document.getElementById('usage-total-container').classList.add('hidden');return}

window.updateUsageRow=function(sid,field,value){

  else if(field==='notes')d.notes=value||'';
  _usageSelectedMaterials.set(sid,d);

  const cell=document.querySelector(`.usage-total-cell[data-stock-id="${sid}"] span`);if(cell)cell.textContent=formatRWF(q*uc);

function updateUsageTotal(){
  let total=0,hasValid=false;
  for(const[_,d]of _usageSelectedMaterials){const q=toNumber(d.quantityUsed),c=toNumber(d.unitCost);if(q>0&&c>=0&&q<=d.available){total+=q*c;hasValid=true}}
  const el=document.getElementById('usage-total-amount');if(el)el.textContent=formatRWF(total);
  const c=document.getElementById('usage-total-container');if(c){if(_usageSelectedMaterials.size===0||!hasValid)c.classList.add('hidden');else c.classList.remove('hidden')}
}
window.submitUsageBatch=async function(e){
  e.preventDefault();
  const btn=document.getElementById('usage-save-btn');setButtonLoading(btn,true);
  try{
    const date=document.getElementById('usage-date').value;
    if(!date){showToast(t('common.requiredField'),'error');setButtonLoading(btn,false);return}
    const valid=Array.from(_usageSelectedMaterials.entries()).filter(([_,d])=>toNumber(d.quantityUsed)>0);
    if(!valid.length){showToast(t('materials.selectAtLeastOneMaterial'),'error');setButtonLoading(btn,false);return}
    const errors=[],validated=[];
    for(const[sid,d]of valid){
      const q=toNumber(d.quantityUsed),c=toNumber(d.unitCost);
      if(q<=0){errors.push(`${d.materialName}: ${t('materials.quantityMustBePositive')}`);continue}
      if(c<0){errors.push(`${d.materialName}: ${t('materials.unitCostCannotBeNegative')}`);continue}
      if(q>d.available){errors.push(`${d.materialName}: ${t('materials.insufficientStock')}`);continue}
      const s=getStockById(sid);
      if(!s){errors.push(`${d.materialName}: ${t('materials.stockNotFound')}`);continue}
      const cur=getStockQuantity(s);
      if(q>cur){errors.push(`${d.materialName}: ${t('materials.insufficientStock')}`);continue}
      validated.push({stockId:sid,stockItem:s,materialName:d.materialName,quantityUsed:q,unit:d.unit,unitCost:c,totalAmount:q*c,notes:d.notes||'',previousQuantity:cur,newQuantity:cur-q});
    }
    if(errors.length){showToast('❌ '+errors.join('; '),'error');setButtonLoading(btn,false);return}
    let imageUrl='';
    if(_usagePhotoFile){imageUrl=await uploadImageToImgbb(_usagePhotoFile)}
    const batchNumber=generateBatchNumber();
    const now=new Date().toISOString();
    const batchTotal=validated.reduce((s,e)=>s+e.totalAmount,0);
    await runTransaction(db,async(tx)=>{
      const refs=validated.map(e=>doc(db,'stock',e.stockId));
      const snaps=await Promise.all(refs.map(r=>tx.get(r)));
      for(let i=0;i<validated.length;i++){const e=validated[i],snap=snaps[i];if(!snap.exists())throw new Error(`${e.materialName}: ${t('materials.stockNotFound')}`);const cur=toNumber(snap.data().quantity);if(e.quantityUsed>cur)throw new Error(`${e.materialName}: ${t('materials.insufficientStock')}`);e.previousQuantity=cur;e.newQuantity=cur-e.quantityUsed;}
      const batchRef=doc(collection(db,'material_usage_batches'));
      tx.set(batchRef,{batch_number:batchNumber,site_id:currentSiteId,usage_date:date,total_amount:batchTotal,item_count:validated.length,image:imageUrl||'',recorded_by:currentUser.uid,recorded_by_name:managerProfile?.full_name||'Manager',created_at:now,updated_at:now});
      for(const e of validated){
        const uRef=doc(collection(db,'materials'));
        tx.set(uRef,{site_id:currentSiteId,name:e.materialName,quantity_used:e.quantityUsed,unit:e.unit,unit_cost:e.unitCost,total_amount:e.totalAmount,notes:e.notes,date_used:date,batch_number:batchNumber,stock_id:e.stockId,image:imageUrl||'',recorded_by:currentUser.uid,created_at:now,updated_at:now});
        tx.update(doc(db,'stock',e.stockId),{quantity:e.newQuantity,unit_cost:e.unitCost,updated_at:now});
        const tRef=doc(collection(db,'stock_transactions'));
        tx.set(tRef,{site_id:currentSiteId,stock_id:e.stockId,material_name:e.materialName,transaction_type:'MATERIAL_USAGE',quantity:e.quantityUsed,quantity_change:-e.quantityUsed,previous_quantity:e.previousQuantity,new_quantity:e.newQuantity,unit:e.unit,unit_cost:e.unitCost,total_value:e.totalAmount,batch_number:batchNumber,notes:e.notes||'Material used',recorded_by:currentUser.uid,created_at:now});
      }
    });
    _usagePhotoFile=null;closeModal();
    showToast(`✅ ${t('materials.batchSaved')} (${batchNumber})`,'success');
  }catch(err){console.error(err);showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};

window.handleEditMaterial=async function(e,id){
  e.preventDefault();
  const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);
  try{
    const newQ=parseFloat(document.getElementById('em-qty').value)||0;
    const newC=parseFloat(document.getElementById('em-cost').value)||0;
    const notes=document.getElementById('em-notes').value.trim();
    const m=getMaterialById(id);
    if(!m)throw new Error('Material record not found');
    const oldQ=toNumber(m.quantity_used);
    const delta=newQ-oldQ;
    const siteId=m.site_id;
    const stockItem = m.stock_id ? stockData.find(s=>s.id===m.stock_id) : getStockByName(siteId, m.name);
    const now=new Date().toISOString();
    if(stockItem && delta!==0){
      await runTransaction(db, async(tx)=>{
        const sRef=doc(db,'stock',stockItem.id);
        const sSnap=await tx.get(sRef);
        if(sSnap.exists()){
          const cur=toNumber(sSnap.data().quantity);
          const newStock=cur-delta;
          if(newStock<0)throw new Error(t('materials.insufficientStock'));
          const updatePayload={quantity:newStock,updated_at:now};
          if(newC>0)updatePayload.unit_cost=newC;
          tx.update(sRef,updatePayload);
          const tRef=doc(collection(db,'stock_transactions'));
          tx.set(tRef,{site_id:siteId,stock_id:stockItem.id,material_name:m.name,transaction_type:'MATERIAL_USAGE_EDITED',quantity:Math.abs(delta),quantity_change:-delta,previous_quantity:cur,new_quantity:newStock,unit:m.unit||getStockUnit(stockItem),unit_cost:newC,notes:`Usage edited from ${oldQ} to ${newQ}`,recorded_by:currentUser.uid,created_at:now});
        }
        tx.update(doc(db,'materials',id),{quantity_used:newQ,unit_cost:newC,notes,updated_at:now});
      });
    }else{await updateDoc(doc(db,'materials',id),{quantity_used:newQ,unit_cost:newC,notes,updated_at:now});}
    closeModal();showToast(t('common.updatedSuccessfully'),'success');
  }catch(err){console.error('Material edit failed:',err);showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};
window.deleteMaterial=async function(id){
  if(!confirm(t('common.areYouSure')+' '+t('common.cannotUndo')))return;
  try{
    const m=getMaterialById(id);
    if(!m){ await deleteDoc(doc(db,'materials',id)); showToast(t('common.deletedSuccessfully'),'success'); return; }
    const siteId=m.site_id;
    const qty=toNumber(m.quantity_used);
    const stockItem = m.stock_id ? stockData.find(s=>s.id===m.stock_id) : getStockByName(siteId, m.name);
    const now=new Date().toISOString();
    if(stockItem && qty>0){
      await runTransaction(db, async(tx)=>{
        const sRef=doc(db,'stock',stockItem.id);
        const sSnap=await tx.get(sRef);
        if(sSnap.exists()){
          const cur=toNumber(sSnap.data().quantity);
          const newStock=cur+qty;
          tx.update(sRef,{quantity:newStock,updated_at:now});
          const tRef=doc(collection(db,'stock_transactions'));
          tx.set(tRef,{site_id:siteId,stock_id:stockItem.id,material_name:m.name,transaction_type:'MATERIAL_USAGE_DELETED',quantity:qty,quantity_change:qty,previous_quantity:cur,new_quantity:newStock,unit:m.unit||getStockUnit(stockItem),unit_cost:toNumber(m.unit_cost),notes:`Material usage deleted — stock restored`,recorded_by:currentUser.uid,created_at:now});
        }
        tx.delete(doc(db,'materials',id));
      });
    }else{await deleteDoc(doc(db,'materials',id));}
    showToast(t('common.deletedSuccessfully'),'success');
  }catch(err){console.error('Material delete failed:',err);showToast(err.message||t('common.somethingWentWrong'),'error')}
};

function renderRequisitionsList(){
  const allReqs=requisitionsData.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(!allReqs.length)return `<div class="bg-white rounded-2xl border p-8 text-center"><iconify-icon icon="material-symbols:assignment-outline" class="text-5xl text-slate-300 mb-3"></iconify-icon><p class="text-slate-500">${t('materials.noRequisitions')}</p></div>`;
  const f=_reqFilters;
  const filtered=allReqs.filter(req=>{
    if(f.priority!=='all'&&req.priority!==f.priority)return false;
    if(f.status!=='all'&&(req.status||'Pending')!==f.status)return false;
    const reqDate=formatDateShort(req.request_date);
    if(f.dateFrom&&reqDate<f.dateFrom)return false;
    if(f.dateTo&&reqDate>f.dateTo)return false;
    if(f.search){
      const q=f.search.toLowerCase();
      const items=requisitionItemsData.filter(i=>i.requisition_id===req.id);
      const site=assignedSites.find(s=>s.id===req.site_id);
      const haystack=`${req.requisition_number} ${req.requested_by_name||''} ${req.notes||''} ${site?site.name:''} ${items.map(i=>i.material_name).join(' ')}`.toLowerCase();
      if(!haystack.includes(q))return false;
    }
    return true;
  });
  let h=`
    <div class="req-filter-bar">
      <input type="text" id="req-search" placeholder="${t('materials.search')}" value="${f.search}" oninput="updateReqFilter('search',this.value)" class="flex-1 min-w-[180px]">
      <select id="req-priority-filter" onchange="updateReqFilter('priority',this.value)">
        <option value="all" ${f.priority==='all'?'selected':''}>${t('materials.allPriorities')}</option>
        <option value="Normal" ${f.priority==='Normal'?'selected':''}>${t('materials.normal')}</option>
        <option value="Urgent" ${f.priority==='Urgent'?'selected':''}>${t('materials.urgent')}</option>
      </select>
      <select id="req-status-filter" onchange="updateReqFilter('status',this.value)">

  if(!filtered.length){h+=`<tr><td colspan="12" class="text-center py-8 text-slate-400">No requisitions match the filters.</td></tr>`;}

      }else{
        items.forEach((it,idx)=>{
          h+=`<tr>`;
          if(idx===0){h+=`<td rowspan="${rowspan}" class="font-semibold text-emerald-700">${req.requisition_number}</td>`;h+=`<td rowspan="${rowspan}">${formatDateShort(req.request_date)}</td>`;h+=`<td rowspan="${rowspan}">${formatDateShort(req.required_date)}</td>`;}
          h+=`<td>${cleanName(it.material_name||'—')}</td><td>${it.unit||'—'}</td><td style="text-align:right">${toNumber(it.quantity_requested)}</td>`;
          if(idx===0){
            h+=`<td rowspan="${rowspan}">${req.priority||'Normal'}</td>`;
            h+=`<td rowspan="${rowspan}"><span class="req-status-badge ${badgeCls}">${status}</span></td>`;
            h+=`<td rowspan="${rowspan}">${siteName}</td>`;
            h+=`<td rowspan="${rowspan}">${req.requested_by_name||'—'}</td>`;
            h+=`<td rowspan="${rowspan}" class="max-w-[180px] truncate">${req.notes||'—'}</td>`;
            h+=`<td rowspan="${rowspan}"><button onclick="viewRequisition('${req.id}')" class="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded hover:bg-blue-100 flex items-center gap-1"><iconify-icon icon="material-symbols:visibility" width="14"></iconify-icon>${t('common.view')}</button></td>`;
          }
          h+=`</tr>`;
        });
      }
    });
  }
  h+=`</tbody></table></div></div>`;
  return h;
}

window.handleCreateRequisition=async function(e){
  e.preventDefault();
  const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);
  try{
    const date=document.getElementById('req-date').value;
    const priority=document.getElementById('req-priority').value;
    const notes=document.getElementById('req-notes').value.trim();
    if(!date){showToast(t('common.requiredField'),'error');setButtonLoading(btn,false);return}
    const items=[];document.querySelectorAll('.req-qty').forEach(inp=>{const q=parseFloat(inp.value)||0;if(q>0)items.push({name:inp.dataset.name,unit:inp.dataset.unit,qty:q})});
    if(!items.length){showToast(t('materials.selectAtLeastOneMaterial'),'error');setButtonLoading(btn,false);return}
    const now=new Date().toISOString();
    const reqNum='SHDR-REQ-'+Date.now().toString().slice(-8);
    const reqRef=await addDoc(collection(db,'requisitions'),{requisition_number:reqNum,site_id:currentSiteId,requested_by:currentUser.uid,requested_by_name:managerProfile?.full_name||'Manager',request_date:getTodayISO(),required_date:date,priority,status:'Pending',notes,created_at:now,updated_at:now});
    for(const it of items){await addDoc(collection(db,'requisition_items'),{requisition_id:reqRef.id,site_id:currentSiteId,requested_by:currentUser.uid,material_name:it.name,quantity_requested:it.qty,quantity_supplied:0,unit:it.unit,created_at:now,updated_at:now});}
    await addDoc(collection(db,'requisition_history'),{requisition_id:reqRef.id,site_id:currentSiteId,requested_by:currentUser.uid,action:'Created',actor:currentUser.uid,actor_name:managerProfile?.full_name||'Manager',timestamp:now,details:'Requisition submitted'});
    closeModal();showToast(t('common.savedSuccessfully'),'success');
  }catch(err){showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};

  }

}

window.handleAddStock=async function(e){
  e.preventDefault();
  const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);
  try{
    const name=document.getElementById('stock-name').value.trim();
    const qty=parseFloat(document.getElementById('stock-qty').value)||0;
    const unit=document.getElementById('stock-unit').value.trim()||'units';
    const cost=parseFloat(document.getElementById('stock-cost').value)||0;
    const min=parseFloat(document.getElementById('stock-min').value)||0;
    const notes=document.getElementById('stock-notes').value.trim();
    if(!name||qty<=0){showToast(t('common.requiredField'),'error');setButtonLoading(btn,false);return}
    const existing=getStockByName(currentSiteId,name);
    const now=new Date().toISOString();
    if(existing){const newQ=toNumber(existing.quantity)+qty;await updateDoc(doc(db,'stock',existing.id),{quantity:newQ,unit_cost:cost,minimum_quantity:min,updated_at:now});await addDoc(collection(db,'stock_transactions'),{site_id:currentSiteId,stock_id:existing.id,material_name:name,transaction_type:'STOCK_ADDED',quantity:qty,quantity_change:qty,previous_quantity:toNumber(existing.quantity),new_quantity:newQ,unit,unit_cost:cost,notes:notes||'Stock received',recorded_by:currentUser.uid,created_at:now});}
    else{const ref=await addDoc(collection(db,'stock'),{site_id:currentSiteId,material_name:name,quantity:qty,unit,unit_cost:cost,minimum_quantity:min,notes,created_at:now,updated_at:now});await addDoc(collection(db,'stock_transactions'),{site_id:currentSiteId,stock_id:ref.id,material_name:name,transaction_type:'STOCK_ADDED',quantity:qty,quantity_change:qty,previous_quantity:0,new_quantity:qty,unit,unit_cost:cost,notes:notes||'Initial stock',recorded_by:currentUser.uid,created_at:now});}
    closeModal();showToast(t('common.savedSuccessfully'),'success');
  }catch(err){showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};
window.editStockItem=function(id){
  const s=getStockById(id);if(!s)return;
  openModal(''+t('stock.editStock'),`

      <div><label class="block text-sm font-medium mb-1">${t('stock.unitCost')} *</label><input class="w-full border rounded-lg p-3" type="number" step="0.01" min="0" id="edit-stock-cost" value="${toNumber(s.unit_cost)}" required></div>
      <div><label class="block text-sm font-medium mb-1">${t('stock.minimumStock')}</label><input class="w-full border rounded-lg p-3" type="number" step="0.01" min="0" id="edit-stock-min" value="${toNumber(s.minimum_quantity)}"></div>

window.handleEditStock=async function(e,id){
  e.preventDefault();
  const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);
  try{
    const q=parseFloat(document.getElementById('edit-stock-qty').value)||0;
    const c=parseFloat(document.getElementById('edit-stock-cost').value)||0;
    const m=parseFloat(document.getElementById('edit-stock-min').value)||0;
    const s=getStockById(id);if(!s)throw new Error('Stock not found');
    const prev=toNumber(s.quantity);const now=new Date().toISOString();
    await updateDoc(doc(db,'stock',id),{quantity:q,unit_cost:c,minimum_quantity:m,updated_at:now});
    await addDoc(collection(db,'stock_transactions'),{site_id:currentSiteId,stock_id:id,material_name:s.material_name,transaction_type:'STOCK_ADJUSTMENT',quantity:Math.abs(q-prev),quantity_change:q-prev,previous_quantity:prev,new_quantity:q,unit:getStockUnit(s),unit_cost:c,notes:`Adjusted from ${prev} to ${q}`,recorded_by:currentUser.uid,created_at:now});
    closeModal();showToast(t('common.updatedSuccessfully'),'success');
  }catch(err){showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};
window.viewStockHistory=function(id){
  const s=getStockById(id);if(!s)return;
  const txs=stockTransactions.filter(x=>x.stock_id===id).slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  let h=`<div class="space-y-2 max-h-[60vh] overflow-y-auto">`;
  if(!txs.length)h+=`<p class="text-slate-400 text-sm">${t('common.noDataAvailable')}</p>`;
  txs.forEach(tx=>{const ch=toNumber(tx.quantity_change);const sign=ch>0?'+':ch<0?'-':'';const cls=ch>0?'text-emerald-600':ch<0?'text-red-500':'text-slate-500';h+=`<div class="flex justify-between gap-3 text-sm border-b border-slate-100 pb-2"><div><div class="font-medium">${tx.transaction_type.replace(/_/g,' ')}</div><div class="text-xs text-slate-500">${tx.notes||''}</div></div><div class="text-right whitespace-nowrap"><div class="font-semibold ${cls}">${sign}${Math.abs(ch)} ${tx.unit||''}</div><div class="text-xs text-slate-400">${formatDate(tx.created_at)}</div></div></div>`;});
  h+=`</div>`;
  openModal('📜 '+t('stock.stockHistory')+' — '+s.material_name,h);
};

function renderWorkersRecord(){
  if(!siteWorkersData.length)return `<div class="bg-white rounded-2xl border p-8 text-center"><p class="text-slate-500">${t('workers.noWorkers')}</p></div>`;
  const today=getTodayISO();
  let h=`<div class="space-y-6"><div class="bg-white rounded-2xl border p-4 shadow-sm"><div class="flex justify-between items-center flex-wrap gap-2"><h3 class="text-sm font-semibold flex items-center gap-2"><iconify-icon icon="material-symbols:edit-calendar" class="text-emerald-600" width="18"></iconify-icon>${t('workers.recordAttendance')}</h3><div class="flex items-center gap-2"><button onclick="changeAttendanceDate(-1)" class="p-2 rounded-lg border"><iconify-icon icon="material-symbols:chevron-left"></iconify-icon></button><input type="date" id="attendance-date" value="${today}" class="border rounded-lg px-3 py-2 text-sm w-40" onchange="updateAttendanceSummary()"><button onclick="changeAttendanceDate(0)" class="px-3 py-2 bg-emerald-50 text-emerald-700 rounded-lg text-sm">${t('common.today')}</button><button onclick="changeAttendanceDate(1)" class="p-2 rounded-lg border"><iconify-icon icon="material-symbols:chevron-right"></iconify-icon></button></div></div></div><div class="bg-white rounded-2xl border p-4 shadow-sm"><div class="flex justify-between items-center mb-4"><h4 class="text-sm font-medium">${t('workers.view')} (${siteWorkersData.length})</h4><button onclick="toggleSelectAllWorkers()" class="text-xs text-emerald-600 flex items-center gap-1"><iconify-icon icon="material-symbols:check-box" width="14"></iconify-icon>${t('common.selectAll')}</button></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">`;
  siteWorkersData.forEach(w=>{
    const initial=(w.name||'W').charAt(0).toUpperCase();
    const avatar=w.image?`<img src="${w.image}" class="w-full h-full object-cover">`:`<span class="font-bold text-emerald-700">${initial}</span>`;
    h+=`<div class="worker-card relative bg-slate-50 border-2 border-transparent rounded-xl p-3 cursor-pointer" data-worker-id="${w.id}" onclick="toggleWorkerSelection('${w.id}')"><input type="checkbox" id="worker-chk-${w.id}" value="${w.id}" class="hidden worker-checkbox-input"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full overflow-hidden flex-shrink-0 bg-emerald-100 flex items-center justify-center">${avatar}</div><div><p class="text-sm font-medium">${w.name}</p><p class="text-xs text-slate-500">${w.role||''}</p></div></div></div>`;
  });
  h+=`</div></div><div id="attendance-summary" class="bg-white rounded-2xl border p-4 shadow-sm hidden"><div class="flex justify-between items-center"><div class="flex gap-6"><div><p class="text-xs text-slate-500">${t('workers.view')}</p><p class="text-2xl font-bold"><span id="selected-count">0</span> / ${siteWorkersData.length}</p></div><div><p class="text-xs text-slate-500">${t('reports.totalPayroll')}</p><p class="text-2xl font-bold text-emerald-600"><span id="total-cost">0</span> RWF</p></div></div><button onclick="submitAttendance(this)" class="px-6 py-2 bg-emerald-600 text-white rounded-xl text-sm font-semibold flex items-center gap-2"><iconify-icon icon="material-symbols:save"></iconify-icon> ${t('common.save')}</button></div></div>`;
  if(attendanceData.length){
    const groups={};attendanceData.forEach(a=>{const d=a.date||'Unknown';if(!groups[d])groups[d]=[];groups[d].push(a)});
    const sorted=Object.keys(groups).sort((a,b)=>new Date(b)-new Date(a));
    let hist=`<div class="bg-white rounded-2xl border p-4 shadow-sm"><h4 class="text-sm font-medium mb-3 flex items-center gap-2"><iconify-icon icon="material-symbols:history" class="text-blue-600" width="18"></iconify-icon>${t('workers.attendanceLogs')}</h4>`;
    sorted.forEach(d=>{const workers=groups[d];const tot=workers.reduce((s,a)=>s+(Number(a.daily_rate)||0),0);hist+=`<div class="mb-3 p-3 bg-slate-50 rounded-xl border border-slate-100"><div class="flex justify-between items-center mb-2"><span class="text-sm font-semibold">${d}</span><span class="text-xs text-slate-500">${workers.length} ${t('workers.workers')} • ${tot.toLocaleString()} RWF</span></div><div class="flex flex-wrap gap-1">${workers.map(a=>`<span class="inline-flex items-center gap-1 bg-white border px-2 py-0.5 rounded text-xs">${a.name} <span class="text-[10px] text-slate-400">(${a.role||''})</span></span>`).join('')}</div></div>`;});
    hist+=`</div>`;h+=hist;
  }
  h+=`</div>`;return h;
}
window.toggleWorkerSelection=function(id){const cb=document.getElementById(`worker-chk-${id}`);if(cb){cb.checked=!cb.checked;const card=cb.closest('.worker-card');if(card)card.classList.toggle('border-emerald-500',cb.checked);if(card)card.classList.toggle('bg-emerald-50',cb.checked);updateAttendanceSummary()}};
window.toggleSelectAllWorkers=function(){const cbs=document.querySelectorAll('.worker-checkbox-input');const all=Array.from(cbs).every(c=>c.checked);cbs.forEach(c=>{c.checked=!all;const card=c.closest('.worker-card');if(card){card.classList.toggle('border-emerald-500',c.checked);card.classList.toggle('bg-emerald-50',c.checked)}});updateAttendanceSummary()};
window.changeAttendanceDate=function(delta){const input=document.getElementById('attendance-date');if(!input)return;let d=new Date(input.value||getTodayISO());if(delta===0)d=new Date();else d.setDate(d.getDate()+delta);input.value=d.toISOString().split('T')[0];updateAttendanceSummary()};
window.updateAttendanceSummary=function(){
  const checked=document.querySelectorAll('.worker-checkbox-input:checked');
  const summary=document.getElementById('attendance-summary');if(!summary)return;
  if(!checked.length){summary.classList.add('hidden');return}
  summary.classList.remove('hidden');
  document.getElementById('selected-count').textContent=checked.length;
  let total=0;checked.forEach(cb=>{const w=siteWorkersData.find(x=>x.id===cb.value);if(w)total+=w.payment_method==='daily'?(Number(w.salary)||0):Math.round((Number(w.salary)||0)/30)});
  document.getElementById('total-cost').textContent=total.toLocaleString();
};
window.submitAttendance=async function(btn){
  setButtonLoading(btn,true);
  try{
    const date=document.getElementById('attendance-date').value;
    const checked=document.querySelectorAll('.worker-checkbox-input:checked');
    if(!checked.length){showToast('Please select at least one worker.','error');setButtonLoading(btn,false);return}
    const now=new Date().toISOString();
    for(const cb of checked){
      const w=siteWorkersData.find(x=>x.id===cb.value);if(!w)continue;
      const rate=w.payment_method==='daily'?(Number(w.salary)||0):Math.round((Number(w.salary)||0)/30);
      await addDoc(collection(db,'worker_attendance'),{site_id:currentSiteId,worker_id:w.id,name:w.name,role:w.role||'',date,status:'present',daily_rate:rate,recorded_by:currentUser.uid,created_at:now});
    }
    showToast(t('common.savedSuccessfully'),'success');
  }catch(err){showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};

function renderProgress(container){
  let h=`<h2 class="text-xl sm:text-2xl font-bold mb-4 flex items-center gap-2"><iconify-icon icon="material-symbols:trending-up" class="text-emerald-600"></iconify-icon>${t('progress.title')}</h2>`;
  if(!progressTasks.length){h+=`<div class="bg-white rounded-2xl border p-6 text-center"><p class="text-slate-500">${t('progress.noTasks')}</p></div>`;container.innerHTML=h;return}
  const rows=progressTasks.map(task=>{
    const c=task.status==='completed';
    const cell=c?`<span class="text-emerald-600"><iconify-icon icon="material-symbols:check-circle" width="20"></iconify-icon></span>`:`<button onclick="markTaskCompleted('${task.id}')" class="bg-gray-300 hover:bg-gray-400 text-white w-8 h-8 rounded-full inline-flex items-center justify-center"><iconify-icon icon="material-symbols:check" width="18"></iconify-icon></button>`;
    const sc=c?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700';
    const st=c?t('progress.completed'):t('progress.pending');
    return `<tr><td class="px-3 py-2 text-center">${cell}</td><td class="px-3 py-2 font-medium">${task.name||'Unnamed'}</td><td class="px-3 py-2">${formatDate(task.start_date)}</td><td class="px-3 py-2">${formatDate(task.end_date)}</td><td class="px-3 py-2"><span class="px-2 py-1 rounded-full text-xs ${sc}">${st}</span></td></tr>`;
  }).join('');
  h+=`<div class="bg-white rounded-2xl border overflow-hidden shadow-sm"><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 uppercase text-xs"><tr><th class="px-3 py-2 text-center">Action</th><th class="px-3 py-2">${t('progress.task')}</th><th class="px-3 py-2">${t('progress.start')}</th><th class="px-3 py-2">${t('progress.end')}</th><th class="px-3 py-2">${t('progress.status')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  container.innerHTML=h;
}
window.markTaskCompleted=async function(taskId){
  if(!confirm(t('common.areYouSure')))return;
  try{await updateDoc(doc(db,'progress_tasks',taskId),{status:'completed',updated_at:new Date().toISOString()});showToast(t('common.updatedSuccessfully'),'success')}
  catch(err){showToast(t('common.somethingWentWrong'),'error')}
};

/* ============ PASSCODE TOGGLE BINDING ============ */
function bindPasswordToggles() {
  document.querySelectorAll('.password-toggle').forEach(btn => {
    if (btn.dataset.bound === '1') return; // prevent duplicate listeners
    btn.dataset.bound = '1';

    const icon = btn.querySelector('.material-symbols-rounded');
    const inputId = btn.getAttribute('data-target');
    const input = document.getElementById(inputId);
    if (!input || !icon) return;

    btn.addEventListener('click', () => {
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.textContent = isHidden ? 'visibility_off' : 'visibility';
      const action = isHidden ? 'Hide' : 'Show';
      const fieldName = input.getAttribute('aria-label') || 'passcode';
      btn.setAttribute('aria-label', `${action} ${fieldName}`);
      btn.setAttribute('title', `${action} ${fieldName}`);
      if (document.activeElement === btn) {
        try { input.focus({ preventScroll: true }); } catch (_) {}
      }
    });
  });
}

      const inputId = btn.getAttribute('data-target');
      const input = document.getElementById(inputId);

      btn.setAttribute('aria-label', `Show ${fieldName}`);

  if (d.toDateString() === now.toDateString()) return `${hh}:${mm}`;
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `${t('messages.yesterday')} ${hh}:${mm}`;
  return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()} ${hh}:${mm}`;
}
function formatBytes(bytes) {
  if (!bytes) return '0 B';
  const k = 1024, sizes = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return `${(bytes / Math.pow(k, i)).toFixed(1)} ${sizes[i]}`;
}

}

window.sendOwnerMessage = async () => {
  const input = document.getElementById('message-input');
  if (!input || !activeConversationId) return;
  const text = (input.value || '').trim();
  const hasAttachment = !!pendingAttachment;
  const hasShared = !!window._pendingSharedRecord;
  if (!text && !hasAttachment && !hasShared) return;
  if (text.length > 4000) { showToast(t('common.invalidValue'), 'error'); return; }
  const btn = document.getElementById('message-send-btn');
  _sendingInProgress = true;
  if (btn) btn.disabled = true;
  const now = new Date().toISOString();
  const msgRef = doc(collection(db, CONVERSATIONS, activeConversationId, 'messages'));
  const reply = replyingTo;
  const shared = window._pendingSharedRecord || null;
  input.value = '';
  setDraft(activeConversationId, '');
  replyingTo = null;
  renderComposerReplyPreview();
  stopTyping(activeConversationId);
  try {
    let attachment = null;
    if (hasAttachment) {
      const f = pendingAttachment.file;
      if (!ALLOWED_MIME.includes(f.type)) throw new Error(t('messages.fileTypeNotAllowed'));
      if (f.size > MAX_FILE_BYTES) throw new Error(t('messages.fileTooLarge'));
      showToast(t('messages.uploading', { name: f.name }), 'info');
      const url = await uploadFileToImgbb(f);
      attachment = { url, name: f.name, size: f.size, mime: f.type };
    }
    const msgPayload = { sender_id: currentUser.uid, sender_role: 'manager', text: text || '', type: attachment ? 'attachment' : (shared ? 'shared_record' : 'text'), attachment: attachment, shared_record: shared, reply_to: reply?.id || null, reply_preview: reply ? { sender_name: reply.sender_name, text: reply.text } : null, reactions: {}, edited_at: null, deleted_for_all: false, deleted_for: [], starred_by: [], pinned_by: [], created_at: now, sent_at: now, delivered_at: null, read_at: null };
    const previewText = attachment ? `📎 ${attachment.name}` : shared ? `📋 ${shared.title}` : text.slice(0, 200);
    const batch = writeBatch(db);
    batch.set(msgRef, msgPayload);
    batch.update(doc(db, CONVERSATIONS, activeConversationId), { last_message: { text: previewText, sender_id: currentUser.uid, created_at: now }, updated_at: now, [`unread.${activeOwnerId}`]: increment(1) });
    await batch.commit();
    clearPendingAttachment();
    window._pendingSharedRecord = null;
    renderComposerAttachment();
  } catch (err) {
    console.error(err);
    input.value = text;
    replyingTo = reply;
    renderComposerReplyPreview();
    showToast(err.message || t('messages.sendFailed'), 'error');
  } finally {
    _sendingInProgress = false;
    updateSendButtonState();
  }
};

  const j = await res.json();
  if (!j.success) throw new Error('File upload failed');
  return j.data.url;
}

window.onSearchInput = (e) => { currentSearchQuery = (e.target.value || '').trim(); renderSearchPanel(); };
function getSearchResults() {
  if (!currentSearchQuery) return [];
  const q = currentSearchQuery.toLowerCase();
  return messagesCache.map((m, idx) => ({ m, idx })).filter(({ m }) => {
    if (m.deleted_for_all) return false;
    if (Array.isArray(m.deleted_for) && m.deleted_for.includes(currentUser.uid)) return false;
    const hay = [m.text, m.attachment?.name, m.shared_record?.title].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  }).slice(-30);
}
function renderSearchPanel() {
  const panel = document.getElementById('msg-search-panel');
  if (!panel) return;
  panel.classList.toggle('open', searchPanelOpen);
  const input = document.getElementById('msg-search-input');
  if (input && document.activeElement !== input) input.value = currentSearchQuery;
  const resultsEl = document.getElementById('msg-search-results');
  if (!resultsEl) return;
  if (!searchPanelOpen || !currentSearchQuery) { resultsEl.innerHTML = ''; return; }
  const results = getSearchResults();
  resultsEl.innerHTML = results.length ? results.map(r => `<div class="msg-search-result" onclick="closeSearchAndScroll('${r.m.id}')"><div class="text-slate-700 truncate">${escapeHTML((r.m.text || r.m.attachment?.name || r.m.shared_record?.title || '').slice(0, 120))}</div><div class="text-[10px] text-slate-400">${escapeHTML(formatChatTime(r.m.created_at))}</div></div>`).join('') : `<p class="text-xs text-slate-400 p-2">${t('messages.noSearchResults')}</p>`;
}
