            let value = getNestedTranslation(translations[currentLanguage], key);

            if (value === undefined) return key;
            if (params) {
                Object.keys(params).forEach(param => {

                });
            }
            return value;

            unsubscribeSnapshots.forEach(fn => fn());

            if (!currentSiteId) return;
            const siteId = currentSiteId;
            const matQ = query(collection(db, 'materials'), where('site_id', '==', siteId));
            unsubscribeSnapshots.push(onSnapshot(matQ, snap => { materialsData = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshCurrentSection(); }));
            const workQ = query(collection(db, 'site_workers'), where('site_id', '==', siteId));
            unsubscribeSnapshots.push(onSnapshot(workQ, snap => { siteWorkersData = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshCurrentSection(); }));
            const progQ = query(collection(db, 'progress_tasks'), where('site_id', '==', siteId));
            unsubscribeSnapshots.push(onSnapshot(progQ, snap => {
                const tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));

                window.progressTasks = tasks; // keep global in sync
                refreshCurrentSection();

            const posQ = query(collection(db, 'worker_positions'), where('site_id', 'in', [siteId, 'all']));

        // =================================================================
        // MATERIALS & STOCK (New integrated code with all fixes)
        // =================================================================
        // All helper functions and render functions from the provided new block,
        // but with corrected translation keys and no duplicates.
        // I'll include the entire new block here, modified as needed.
        
        // Helper: normalize material name
        function normalizeMaterialName(name) {
            return String(name || '').trim().replace(/\s+/g, ' ').toLowerCase();
        }
        function cleanMaterialName(name) {
            return String(name || '').trim().replace(/\s+/g, ' ');
        }
        function toNumber(value, fallback = 0) {
            const n = Number(value);
            return Number.isFinite(n) ? n : fallback;
        }
        function roundQuantity(value) {
            return Math.round(toNumber(value) * 100) / 100;
        }
        function calculateStockValue(quantity, unitCost) {
            return roundQuantity(quantity) * toNumber(unitCost);
        }
        function formatRWF(value) {
            return toNumber(value).toLocaleString('en-RW', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' RWF';
        }
        function getMaterialByName(siteId, materialName) {
            const normalized = normalizeMaterialName(materialName);
            return materialsData
                .filter(m => m.site_id === siteId && normalizeMaterialName(m.name) === normalized)
                .sort((a, b) => {
                    const dateA = new Date(a.date_used || a.created_at || a.updated_at || 0);
                    const dateB = new Date(b.date_used || b.created_at || b.updated_at || 0);
                    return dateB - dateA;
                })[0] || null;
        }
        function getStockByName(siteId, materialName) {
            const normalized = normalizeMaterialName(materialName);
            return stockData.find(s => s.site_id === siteId && normalizeMaterialName(s.material_name) === normalized) || null;
        }
        function getLatestMaterialUnitCost(siteId, materialName) {
            const material = getMaterialByName(siteId, materialName);
            return material ? toNumber(material.unit_cost) : 0;
        }
        function getStockUnitCost(stockItem) {
            if (!stockItem) return 0;
            const storedCost = toNumber(stockItem.unit_cost);
            if (storedCost > 0) return storedCost;
            return getLatestMaterialUnitCost(stockItem.site_id, stockItem.material_name);
        }
        function getStockStatus(quantity, minimumQuantity) {
            const qty = toNumber(quantity);
            const minimum = toNumber(minimumQuantity);
            if (qty <= 0) return { label: t('stock.outOfStock'), className: 'stock-status-out' };
            if (minimum > 0 && qty <= minimum) return { label: t('stock.lowStock'), className: 'stock-status-low' };
            return { label: t('stock.normal'), className: 'stock-status-normal' };
        }
        function getTransactionChange(transaction) {
            if (transaction.quantity_change !== undefined && transaction.quantity_change !== null) {
                return toNumber(transaction.quantity_change);
            }
            switch (transaction.transaction_type) {
                case 'STOCK_ADDED': return Math.abs(toNumber(transaction.quantity));
                case 'MATERIAL_USAGE': case 'STOCK_DEDUCTED': return -Math.abs(toNumber(transaction.quantity));
                case 'MATERIAL_USAGE_DELETED': return Math.abs(toNumber(transaction.quantity));
                case 'STOCK_ADJUSTMENT': case 'MATERIAL_USAGE_EDITED':
                    return toNumber(transaction.new_quantity) - toNumber(transaction.previous_quantity);
                default: return 0;
            }
        }
        function getTransactionLabel(transaction) {
            switch (transaction.transaction_type) {
                case 'STOCK_ADDED': return t('stock.transactionReceived');
                case 'MATERIAL_USAGE': return t('stock.transactionUsed');
                case 'MATERIAL_USAGE_EDITED': return t('stock.transactionEdited');
                case 'MATERIAL_USAGE_DELETED': return t('stock.transactionDeleted');
                case 'STOCK_ADJUSTMENT': return t('stock.transactionAdjusted');
                default: return transaction.notes || t('stock.transactionOther');
            }
        }
        function getTransactionColor(change) {
            if (change > 0) return 'text-emerald-600';
            if (change < 0) return 'text-red-500';
            return 'text-slate-500';
        }
        function refreshLocalStockCache(stockId, updates) {
            const index = stockData.findIndex(s => s.id === stockId);
            if (index === -1) return;
            stockData[index] = { ...stockData[index], ...updates };
        }
        function refreshLocalMaterialsCache(materialId, updates) {
            const index = materialsData.findIndex(m => m.id === materialId);
            if (index === -1) return;
            materialsData[index] = { ...materialsData[index], ...updates };
        }
        function removeLocalMaterial(materialId) {
            const index = materialsData.findIndex(m => m.id === materialId);
            if (index !== -1) materialsData.splice(index, 1);
        }
        function addLocalTransaction(transaction) {
            if (!Array.isArray(stockTransactions)) return;
            stockTransactions.unshift(transaction);
        }

        // Render Materials
        function renderMaterials(container) {
            const currentSite = assignedSites.find(s => s.id === currentSiteId);
            const siteName = currentSite ? currentSite.name : 'Unknown Site';
            const siteMaterials = materialsData
                .filter(m => m.site_id === currentSiteId)

                        <div class="relative w-full h-48 overflow-hidden bg-slate-100">

                                    <span class="font-semibold text-slate-700">${quantityUsed} ${material.unit || ''}</span>

        // Edit Material
        window.editMaterial = (id) => {
            const material = materialsData.find(m => m.id === id);
            if (!material) { showToast('Material record not found.', 'error'); return; }
            const currentStock = getStockByName(material.site_id, material.name);

            openModal(t('materials.editMaterial'), `

        };

        // Handle Edit Material (same as new block, but with fixed translation keys and no re-render)
        window.handleEditMaterial = async (e, id) => {
            e.preventDefault();
            const form = e.target;
            const btn = getFormSubmitBtn(form);
            setButtonLoading(btn, true);
            try {
                const material = materialsData.find(m => m.id === id);
                if (!material) throw new Error('Material record not found.');
                const siteId = material.site_id;
                const oldName = cleanMaterialName(material.name);
                const newName = cleanMaterialName(document.getElementById('edit-mat-name').value);
                const oldQuantity = toNumber(material.quantity_used);
                const newQuantity = toNumber(document.getElementById('edit-mat-used').value);
                const unitCost = toNumber(document.getElementById('edit-mat-unit-cost').value);
                const unit = document.getElementById('edit-mat-unit').value;
                const imageFile = document.getElementById('edit-mat-image').files[0];
                if (!newName) throw new Error('Material name is required.');
                if (newQuantity <= 0) throw new Error('Quantity used must be greater than zero.');
                if (unitCost < 0) throw new Error('Unit cost cannot be negative.');

                let imageUrl = material.image || '';
                if (imageFile) imageUrl = await uploadImageToImgbb(imageFile);

                const oldNormalized = normalizeMaterialName(oldName);
                const newNormalized = normalizeMaterialName(newName);
                const oldStock = getStockByName(siteId, oldName);

                if (oldNormalized === newNormalized) {
                    if (!oldStock) throw new Error(`No stock record exists for "${oldName}".`);
                    const currentStock = toNumber(oldStock.quantity);
                    const restoredStock = roundQuantity(currentStock + oldQuantity);
                    const newStockQuantity = roundQuantity(restoredStock - newQuantity);
                    if (newStockQuantity < 0) throw new Error(`Insufficient stock. Available after restoring previous usage: ${restoredStock} ${oldStock.unit || ''}.`);
                    const quantityChange = roundQuantity(newStockQuantity - currentStock);
                    const now = new Date().toISOString();
                    const batch = writeBatch(db);
                    batch.update(doc(db, 'materials', id), { name: newName, quantity_used: newQuantity, unit_cost: unitCost, unit: unit, image: imageUrl, updated_at: now });
                    batch.update(doc(db, 'stock', oldStock.id), { quantity: newStockQuantity, unit: oldStock.unit || unit, updated_at: now });
                    const transactionRef = doc(collection(db, 'stock_transactions'));
                    batch.set(transactionRef, {
                        site_id: siteId, stock_id: oldStock.id, material_name: newName,
                        transaction_type: 'MATERIAL_USAGE_EDITED', quantity: Math.abs(quantityChange), quantity_change: quantityChange,
                        previous_quantity: currentStock, new_quantity: newStockQuantity, unit: oldStock.unit || unit || 'units',
                        unit_cost: unitCost, total_value: Math.abs(quantityChange) * unitCost,
                        notes: `Usage changed from ${oldQuantity} to ${newQuantity}.`, recorded_by: currentUser.uid, created_at: now
                    });
                    await batch.commit();
                    // Update local cache
                    refreshLocalMaterialsCache(id, { name: newName, quantity_used: newQuantity, unit_cost: unitCost, unit: unit, image: imageUrl, updated_at: now });
                    refreshLocalStockCache(oldStock.id, { quantity: newStockQuantity, updated_at: now });
                    // Add local transaction
                    addLocalTransaction({ id: transactionRef.id, site_id: siteId, stock_id: oldStock.id, material_name: newName, transaction_type: 'MATERIAL_USAGE_EDITED', quantity: Math.abs(quantityChange), quantity_change: quantityChange, previous_quantity: currentStock, new_quantity: newStockQuantity, unit: oldStock.unit || unit || 'units', unit_cost: unitCost, notes: `Usage changed from ${oldQuantity} to ${newQuantity}.`, created_at: now });
                } else {
                    // Material name changed - handle as in new block but omit re-render
                    if (!oldStock) throw new Error(`No stock record exists for "${oldName}".`);
                    const oldStockQuantity = toNumber(oldStock.quantity);
                    const restoredOldStock = roundQuantity(oldStockQuantity + oldQuantity);
                    const newStock = getStockByName(siteId, newName);
                    let newStockId = null, newStockQuantity = 0, newStockUnit = unit || oldStock.unit || 'units';
                    if (newStock) {
                        newStockId = newStock.id;
                        newStockQuantity = toNumber(newStock.quantity);
                        newStockUnit = newStock.unit || unit || 'units';
                    }
                    if (newStockQuantity < newQuantity) throw new Error(`Insufficient stock for "${newName}". Available: ${newStockQuantity} ${newStockUnit}. Required: ${newQuantity} ${newStockUnit}.`);
                    const finalNewStock = roundQuantity(newStockQuantity - newQuantity);
                    const now = new Date().toISOString();
                    const batch = writeBatch(db);
                    batch.update(doc(db, 'materials', id), { name: newName, quantity_used: newQuantity, unit_cost: unitCost, unit: unit, image: imageUrl, updated_at: now });
                    batch.update(doc(db, 'stock', oldStock.id), { quantity: restoredOldStock, updated_at: now });
                    if (newStock) batch.update(doc(db, 'stock', newStock.id), { quantity: finalNewStock, updated_at: now });
                    const restoreTransactionRef = doc(collection(db, 'stock_transactions'));
                    batch.set(restoreTransactionRef, {
                        site_id: siteId, stock_id: oldStock.id, material_name: oldName,
                        transaction_type: 'MATERIAL_USAGE_EDITED', quantity: oldQuantity, quantity_change: oldQuantity,
                        previous_quantity: oldStockQuantity, new_quantity: restoredOldStock, unit: oldStock.unit || 'units',
                        unit_cost: getStockUnitCost(oldStock), total_value: oldQuantity * getStockUnitCost(oldStock),
                        notes: `Material changed from "${oldName}" to "${newName}". Previous usage restored.`, recorded_by: currentUser.uid, created_at: now
                    });
                    const deductTransactionRef = doc(collection(db, 'stock_transactions'));
                    batch.set(deductTransactionRef, {
                        site_id: siteId, stock_id: newStock ? newStock.id : null, material_name: newName,
                        transaction_type: 'MATERIAL_USAGE_EDITED', quantity: newQuantity, quantity_change: -newQuantity,
                        previous_quantity: newStockQuantity, new_quantity: finalNewStock, unit: newStockUnit,
                        unit_cost: unitCost || getStockUnitCost(newStock), total_value: newQuantity * (unitCost || getStockUnitCost(newStock)),
                        notes: `Material changed from "${oldName}" to "${newName}". New usage deducted.`, recorded_by: currentUser.uid, created_at: now
                    });
                    await batch.commit();
                    // Update local caches
                    refreshLocalMaterialsCache(id, { name: newName, quantity_used: newQuantity, unit_cost: unitCost, unit: unit, image: imageUrl, updated_at: now });
                    refreshLocalStockCache(oldStock.id, { quantity: restoredOldStock, updated_at: now });
                    if (newStock) refreshLocalStockCache(newStock.id, { quantity: finalNewStock, updated_at: now });
                    addLocalTransaction({ id: restoreTransactionRef.id, site_id: siteId, stock_id: oldStock.id, material_name: oldName, transaction_type: 'MATERIAL_USAGE_EDITED', quantity: oldQuantity, quantity_change: oldQuantity, previous_quantity: oldStockQuantity, new_quantity: restoredOldStock, unit: oldStock.unit || 'units', unit_cost: getStockUnitCost(oldStock), notes: `Previous usage restored.`, created_at: now });
                    addLocalTransaction({ id: deductTransactionRef.id, site_id: siteId, stock_id: newStock ? newStock.id : null, material_name: newName, transaction_type: 'MATERIAL_USAGE_EDITED', quantity: newQuantity, quantity_change: -newQuantity, previous_quantity: newStockQuantity, new_quantity: finalNewStock, unit: newStockUnit, unit_cost: unitCost || getStockUnitCost(newStock), notes: `New usage deducted.`, created_at: now });
                }
                closeModal();
                showToast(t('common.updatedSuccessfully'), 'success');
            } catch (err) {
                console.error('Error editing material:', err);
                showToast(err.message || t('common.somethingWentWrong'), 'error');
            } finally {
                setButtonLoading(btn, false);
            }
        };

        // Delete Material (no re-render)
        window.deleteMaterial = async (id) => {
            if (!confirm(t('common.areYouSure'))) return;
            const material = materialsData.find(m => m.id === id);
            if (!material) { showToast('Material record not found.', 'error'); return; }
            try {
                const siteId = material.site_id;
                const materialName = cleanMaterialName(material.name);
                const quantityUsed = toNumber(material.quantity_used);
                const stockItem = getStockByName(siteId, materialName);
                if (!stockItem) throw new Error(`Stock record for "${materialName}" was not found.`);
                const previousQuantity = toNumber(stockItem.quantity);
                const newQuantity = roundQuantity(previousQuantity + quantityUsed);
                const now = new Date().toISOString();
                const batch = writeBatch(db);
                batch.update(doc(db, 'stock', stockItem.id), { quantity: newQuantity, updated_at: now });
                batch.delete(doc(db, 'materials', id));
                const transactionRef = doc(collection(db, 'stock_transactions'));
                batch.set(transactionRef, {
                    site_id: siteId, stock_id: stockItem.id, material_name: materialName,
                    transaction_type: 'MATERIAL_USAGE_DELETED', quantity: quantityUsed, quantity_change: quantityUsed,
                    previous_quantity: previousQuantity, new_quantity: newQuantity, unit: stockItem.unit || material.unit || 'units',
                    unit_cost: toNumber(material.unit_cost) || getStockUnitCost(stockItem),
                    total_value: quantityUsed * (toNumber(material.unit_cost) || getStockUnitCost(stockItem)),
                    notes: 'Deleted material usage and restored stock.', recorded_by: currentUser.uid, created_at: now
                });
                await batch.commit();
                refreshLocalStockCache(stockItem.id, { quantity: newQuantity, updated_at: now });
                removeLocalMaterial(id);
                addLocalTransaction({ id: transactionRef.id, site_id: siteId, stock_id: stockItem.id, material_name: materialName, transaction_type: 'MATERIAL_USAGE_DELETED', quantity: quantityUsed, quantity_change: quantityUsed, previous_quantity: previousQuantity, new_quantity: newQuantity, unit: stockItem.unit || material.unit || 'units', unit_cost: toNumber(material.unit_cost) || getStockUnitCost(stockItem), created_at: now });
                showToast(t('common.deletedSuccessfully'), 'success');
            } catch (err) {
                console.error('Error deleting material:', err);
                showToast(err.message || t('common.somethingWentWrong'), 'error');
            }
        };

        // Add Material Usage Modal and submission (new block)
        window.openAddMaterialModal = () => {
            let entryCount = 0;
            const units = ['bags','tons','kg','litres','pieces','rolls','cubic meters'];
            const addEntry = () => {
                entryCount++;
                const container = document.getElementById('material-entries');
                if (!container) return;
                const entry = document.createElement('div');
                entry.className = 'material-entry bg-slate-50 border rounded-xl p-3';
                entry.dataset.entryId = entryCount;
                entry.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm font-semibold text-slate-700">Material #${entryCount}</span>
                        <button type="button" onclick="this.closest('.material-entry').remove()" class="text-red-500 text-xs hover:text-red-700">Remove</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium mb-1">${t('materials.materialName')}</label>
                            <input class="w-full border rounded-lg p-2 text-sm" placeholder="${t('materials.materialName')}" name="mat-name-${entryCount}" list="usage-material-list" required>
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1">${t('materials.quantityUsed')}</label>
                            <input class="w-full border rounded-lg p-2 text-sm" placeholder="${t('materials.quantityUsed')}" type="number" name="mat-used-${entryCount}" min="0.01" step="0.01" required>
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1">Unit</label>
                            <select class="w-full border rounded-lg p-2 text-sm" name="mat-unit-${entryCount}">

                `;

            };
            const materialNames = [...new Map(materialsData.filter(m => m.site_id === currentSiteId && m.name).map(m => [normalizeMaterialName(m.name), cleanMaterialName(m.name)])).values()];
            openModal(t('materials.recordUsage'), `
                <form id="material-usage-form" onsubmit="submitBatchMaterials(event)" class="space-y-4">

                        <label class="block text-sm font-medium mb-1">${t('reports.startDate')}</label>

                    </div>
                    <datalist id="usage-material-list">${materialNames.map(name => `<option value="${name}">`).join('')}</datalist>
                    <div id="material-entries" class="space-y-3"></div>
                    <button type="button" onclick="window.addMaterialUsageEntry()" class="text-emerald-600 text-sm font-medium">+ ${t('materials.addMaterial')}</button>

        window.submitBatchMaterials = async (e) => {
            if (e) e.preventDefault();
            const form = document.getElementById('material-usage-form');
            const btn = form ? getFormSubmitBtn(form) : null;
            if (btn) setButtonLoading(btn, true);
            try {
                const dateInput = document.getElementById('usageDate');
                const selectedDate = dateInput?.value;
                if (!selectedDate) throw new Error('Usage date is required.');
                const entries = document.querySelectorAll('#material-entries .material-entry');
                if (!entries.length) throw new Error('Add at least one material.');
                const rawEntries = [];
                for (const entry of entries) {
                    const nameInput = entry.querySelector('[name^="mat-name-"]');
                    const quantityInput = entry.querySelector('[name^="mat-used-"]');
                    const unitInput = entry.querySelector('[name^="mat-unit-"]');
                    const unitCostInput = entry.querySelector('[name^="mat-unit-cost-"]');
                    const imageInput = entry.querySelector('[name^="mat-image-"]');
                    const name = cleanMaterialName(nameInput?.value);
                    const quantity = toNumber(quantityInput?.value);
                    const unit = unitInput?.value || 'units';
                    const enteredUnitCost = toNumber(unitCostInput?.value);
                    const imageFile = imageInput?.files?.[0] || null;
                    if (!name) continue;
                    if (quantity <= 0) throw new Error(`Invalid quantity for "${name}".`);
                    if (enteredUnitCost < 0) throw new Error(`Invalid unit cost for "${name}".`);
                    rawEntries.push({ name, normalizedName: normalizeMaterialName(name), quantity, unit, enteredUnitCost, imageFile });
                }
                if (!rawEntries.length) throw new Error('Add at least one valid material.');
                const groupedEntries = new Map();
                for (const entry of rawEntries) {
                    if (groupedEntries.has(entry.normalizedName)) {
                        const existing = groupedEntries.get(entry.normalizedName);
                        existing.quantity = roundQuantity(existing.quantity + entry.quantity);
                        if (entry.enteredUnitCost > 0) existing.enteredUnitCost = entry.enteredUnitCost;
                        if (entry.imageFile) existing.imageFile = entry.imageFile;
                    } else {
                        groupedEntries.set(entry.normalizedName, { ...entry });
                    }
                }
                const usageEntries = [...groupedEntries.values()];
                const stockPlans = [];
                for (const entry of usageEntries) {
                    const stockItem = getStockByName(currentSiteId, entry.name);
                    if (!stockItem) throw new Error(`No stock available for "${entry.name}". Receive stock first.`);
                    const available = toNumber(stockItem.quantity);
                    if (entry.quantity > available) throw new Error(`Insufficient stock for "${stockItem.material_name}". Available: ${available} ${stockItem.unit || entry.unit}. Required: ${entry.quantity} ${entry.unit}.`);
                    const materialCost = getLatestMaterialUnitCost(currentSiteId, entry.name);
                    const unitCost = entry.enteredUnitCost > 0 ? entry.enteredUnitCost : (toNumber(stockItem.unit_cost) || materialCost || 0);
                    const newQuantity = roundQuantity(available - entry.quantity);
                    stockPlans.push({ ...entry, stockItem, available, newQuantity, unitCost });
                }
                for (const plan of stockPlans) {
                    plan.imageUrl = '';
                    if (plan.imageFile) plan.imageUrl = await uploadImageToImgbb(plan.imageFile);
                }
                const now = new Date().toISOString();
                const dateISO = new Date(selectedDate + 'T00:00:00.000Z').toISOString();
                const batch = writeBatch(db);
                const createdMaterials = [];
                const createdTransactions = [];
                for (const plan of stockPlans) {
                    const materialRef = doc(collection(db, 'materials'));
                    batch.set(materialRef, {
                        site_id: currentSiteId, name: plan.name, quantity_used: plan.quantity, unit: plan.unit,
                        unit_cost: plan.unitCost, total_amount: calculateStockValue(plan.quantity, plan.unitCost),
                        image: plan.imageUrl, date_used: dateISO, created_at: now, updated_at: now
                    });
                    batch.update(doc(db, 'stock', plan.stockItem.id), { quantity: plan.newQuantity, updated_at: now });
                    const transactionRef = doc(collection(db, 'stock_transactions'));
                    batch.set(transactionRef, {
                        site_id: currentSiteId, stock_id: plan.stockItem.id, material_name: plan.stockItem.material_name,
                        transaction_type: 'MATERIAL_USAGE', quantity: plan.quantity, quantity_change: -plan.quantity,
                        previous_quantity: plan.available, new_quantity: plan.newQuantity, unit: plan.stockItem.unit || plan.unit || 'units',
                        unit_cost: plan.unitCost, total_value: calculateStockValue(plan.quantity, plan.unitCost),
                        notes: 'Material used', recorded_by: currentUser.uid, created_at: now
                    });
                    createdMaterials.push({ id: materialRef.id, site_id: currentSiteId, name: plan.name, quantity_used: plan.quantity, unit: plan.unit, unit_cost: plan.unitCost, total_amount: calculateStockValue(plan.quantity, plan.unitCost), image: plan.imageUrl, date_used: dateISO, created_at: now, updated_at: now });
                    createdTransactions.push({ id: transactionRef.id, site_id: currentSiteId, stock_id: plan.stockItem.id, material_name: plan.stockItem.material_name, transaction_type: 'MATERIAL_USAGE', quantity: plan.quantity, quantity_change: -plan.quantity, previous_quantity: plan.available, new_quantity: plan.newQuantity, unit: plan.stockItem.unit || plan.unit || 'units', unit_cost: plan.unitCost, total_value: calculateStockValue(plan.quantity, plan.unitCost), notes: 'Material used', recorded_by: currentUser.uid, created_at: now });
                }
                await batch.commit();
                createdMaterials.forEach(material => materialsData.push(material));
                stockPlans.forEach(plan => refreshLocalStockCache(plan.stockItem.id, { quantity: plan.newQuantity, updated_at: now }));
                createdTransactions.reverse().forEach(transaction => addLocalTransaction(transaction));
                closeModal();
                showToast(t('common.savedSuccessfully'), 'success');
            } catch (err) {
                console.error('Error recording material usage:', err);
                showToast(err.message || t('common.somethingWentWrong'), 'error');
            } finally {
                if (btn) setButtonLoading(btn, false);
            }
        };

        // Render Stock

            const recentTransactions = stockTransactions.filter(tr => tr.site_id === currentSiteId)

            if (recentTransactions.length) {

                            ${recentTransactions.map(transaction => {

        // Receive Stock Modal and handler (new block, but fixed translation)
        window.openAddStockModal = () => {
            const materialNames = [...new Map(materialsData.filter(m => m.site_id === currentSiteId && m.name).map(m => [normalizeMaterialName(m.name), cleanMaterialName(m.name)])).values()];
            const units = ['bags','tons','kg','litres','pieces','rolls','cubic meters'];
            openModal(t('stock.receiveStock'), `

            `);
            const materialInput = document.getElementById('stock-material');
            if (materialInput) {
                materialInput.addEventListener('change', () => {
                    const stock = getStockByName(currentSiteId, materialInput.value);
                    const material = getMaterialByName(currentSiteId, materialInput.value);
                    const unitCostInput = document.getElementById('stock-unit-cost');
                    const unitInput = document.getElementById('stock-unit');
                    const minimumInput = document.getElementById('stock-min');
                    if (stock) {
                        if (unitCostInput) unitCostInput.value = toNumber(stock.unit_cost) || '';
                        if (unitInput && stock.unit && [...unitInput.options].some(o => o.value === stock.unit)) unitInput.value = stock.unit;
                        if (minimumInput) minimumInput.value = stock.minimum_quantity ?? '';
                    } else if (material) {
                        if (unitCostInput) unitCostInput.value = toNumber(material.unit_cost) || '';
                    }
                });

        };

        window.handleAddStock = async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = getFormSubmitBtn(form);
            setButtonLoading(btn, true);
            try {
                const materialName = cleanMaterialName(document.getElementById('stock-material').value);
                const quantity = toNumber(document.getElementById('stock-quantity').value);
                const unit = document.getElementById('stock-unit').value || 'units';
                const enteredUnitCost = toNumber(document.getElementById('stock-unit-cost').value);
                const minimumQuantityRaw = document.getElementById('stock-min').value;
                const minimumQuantity = minimumQuantityRaw === '' ? null : toNumber(minimumQuantityRaw);
                if (!materialName) throw new Error('Material name is required.');
                if (quantity <= 0) throw new Error('Quantity must be greater than zero.');
                if (enteredUnitCost < 0) throw new Error('Unit cost cannot be negative.');
                if (minimumQuantity !== null && minimumQuantity < 0) throw new Error('Minimum stock cannot be negative.');
                const existing = getStockByName(currentSiteId, materialName);
                const fallbackCost = getLatestMaterialUnitCost(currentSiteId, materialName);
                const unitCost = enteredUnitCost > 0 ? enteredUnitCost : existing ? toNumber(existing.unit_cost) || fallbackCost : fallbackCost;
                const now = new Date().toISOString();
                if (existing) {
                    const previousQuantity = toNumber(existing.quantity);
                    const newQuantity = roundQuantity(previousQuantity + quantity);
                    const finalMinimum = minimumQuantity !== null ? minimumQuantity : (existing.minimum_quantity ?? null);
                    const finalUnitCost = unitCost > 0 ? unitCost : toNumber(existing.unit_cost);
                    const batch = writeBatch(db);
                    batch.update(doc(db, 'stock', existing.id), { material_name: existing.material_name, quantity: newQuantity, unit: unit || existing.unit || 'units', unit_cost: finalUnitCost, minimum_quantity: finalMinimum, updated_at: now });
                    const transactionRef = doc(collection(db, 'stock_transactions'));
                    batch.set(transactionRef, {
                        site_id: currentSiteId, stock_id: existing.id, material_name: existing.material_name,
                        transaction_type: 'STOCK_ADDED', quantity: quantity, quantity_change: quantity,
                        previous_quantity: previousQuantity, new_quantity: newQuantity, unit: unit || existing.unit || 'units',
                        unit_cost: finalUnitCost, total_value: calculateStockValue(quantity, finalUnitCost),
                        notes: 'Stock received', recorded_by: currentUser.uid, created_at: now
                    });
                    await batch.commit();
                    refreshLocalStockCache(existing.id, { material_name: existing.material_name, quantity: newQuantity, unit: unit || existing.unit || 'units', unit_cost: finalUnitCost, minimum_quantity: finalMinimum, updated_at: now });
                    addLocalTransaction({ id: transactionRef.id, site_id: currentSiteId, stock_id: existing.id, material_name: existing.material_name, transaction_type: 'STOCK_ADDED', quantity, quantity_change: quantity, previous_quantity: previousQuantity, new_quantity: newQuantity, unit: unit || existing.unit || 'units', unit_cost: finalUnitCost, total_value: calculateStockValue(quantity, finalUnitCost), notes: 'Stock received', recorded_by: currentUser.uid, created_at: now });
                } else {
                    const stockRef = doc(collection(db, 'stock'));
                    const transactionRef = doc(collection(db, 'stock_transactions'));
                    const batch = writeBatch(db);
                    batch.set(stockRef, { site_id: currentSiteId, material_name: materialName, quantity: quantity, unit: unit, unit_cost: unitCost, minimum_quantity: minimumQuantity, created_at: now, updated_at: now });
                    batch.set(transactionRef, {
                        site_id: currentSiteId, stock_id: stockRef.id, material_name: materialName,
                        transaction_type: 'STOCK_ADDED', quantity: quantity, quantity_change: quantity,
                        previous_quantity: 0, new_quantity: quantity, unit: unit,
                        unit_cost: unitCost, total_value: calculateStockValue(quantity, unitCost),
                        notes: 'Initial stock received', recorded_by: currentUser.uid, created_at: now
                    });
                    await batch.commit();
                    const localStock = { id: stockRef.id, site_id: currentSiteId, material_name: materialName, quantity: quantity, unit: unit, unit_cost: unitCost, minimum_quantity: minimumQuantity, created_at: now, updated_at: now };
                    stockData.push(localStock);
                    addLocalTransaction({ id: transactionRef.id, site_id: currentSiteId, stock_id: stockRef.id, material_name: materialName, transaction_type: 'STOCK_ADDED', quantity, quantity_change: quantity, previous_quantity: 0, new_quantity: quantity, unit: unit, unit_cost: unitCost, total_value: calculateStockValue(quantity, unitCost), notes: 'Initial stock received', recorded_by: currentUser.uid, created_at: now });
                }
                closeModal();
                showToast(t('common.savedSuccessfully'), 'success');

        window.handleEditStock = async (e, id) => {
            e.preventDefault();
            const form = e.target;
            const btn = getFormSubmitBtn(form);
            setButtonLoading(btn, true);
            try {
                const item = stockData.find(s => s.id === id);
                if (!item) throw new Error('Stock item not found.');
                const oldName = cleanMaterialName(item.material_name);
                const newName = cleanMaterialName(document.getElementById('edit-stock-material').value);
                const previousQuantity = toNumber(item.quantity);
                const newQuantity = toNumber(document.getElementById('edit-stock-quantity').value);
                const unit = document.getElementById('edit-stock-unit').value || 'units';
                const unitCost = toNumber(document.getElementById('edit-stock-unit-cost').value);
                const minimumRaw = document.getElementById('edit-stock-min').value;
                const minimumQuantity = minimumRaw === '' ? null : toNumber(minimumRaw);
                if (!newName) throw new Error('Material name is required.');
                if (newQuantity < 0) throw new Error('Stock quantity cannot be negative.');
                if (unitCost < 0) throw new Error('Unit cost cannot be negative.');
                if (minimumQuantity !== null && minimumQuantity < 0) throw new Error('Minimum stock cannot be negative.');
                const normalizedOld = normalizeMaterialName(oldName);
                const normalizedNew = normalizeMaterialName(newName);
                const now = new Date().toISOString();
                if (normalizedOld === normalizedNew) {
                    const quantityChange = roundQuantity(newQuantity - previousQuantity);
                    const batch = writeBatch(db);
                    batch.update(doc(db, 'stock', id), { material_name: item.material_name, quantity: newQuantity, unit: unit, unit_cost: unitCost, minimum_quantity: minimumQuantity, updated_at: now });
                    if (quantityChange !== 0) {
                        const transactionRef = doc(collection(db, 'stock_transactions'));
                        batch.set(transactionRef, {
                            site_id: currentSiteId, stock_id: id, material_name: item.material_name,
                            transaction_type: 'STOCK_ADJUSTMENT', quantity: Math.abs(quantityChange), quantity_change: quantityChange,
                            previous_quantity: previousQuantity, new_quantity: newQuantity, unit: unit,
                            unit_cost: unitCost, total_value: Math.abs(quantityChange) * unitCost,
                            notes: 'Manual stock adjustment', recorded_by: currentUser.uid, created_at: now
                        });
                        await batch.commit();
                        addLocalTransaction({ id: transactionRef.id, site_id: currentSiteId, stock_id: id, material_name: item.material_name, transaction_type: 'STOCK_ADJUSTMENT', quantity: Math.abs(quantityChange), quantity_change: quantityChange, previous_quantity: previousQuantity, new_quantity: newQuantity, unit: unit, unit_cost: unitCost, total_value: Math.abs(quantityChange) * unitCost, notes: 'Manual stock adjustment', created_at: now });
                    } else {
                        await batch.commit();
                    }
                    refreshLocalStockCache(id, { material_name: item.material_name, quantity: newQuantity, unit: unit, unit_cost: unitCost, minimum_quantity: minimumQuantity, updated_at: now });
                } else {
                    const duplicate = getStockByName(currentSiteId, newName);
                    if (duplicate) throw new Error(`A stock record already exists for "${duplicate.material_name}". Rename it first or keep the existing material name.`);
                    const batch = writeBatch(db);
                    batch.update(doc(db, 'stock', id), { material_name: newName, quantity: newQuantity, unit: unit, unit_cost: unitCost, minimum_quantity: minimumQuantity, updated_at: now });
                    const transactionRef = doc(collection(db, 'stock_transactions'));
                    batch.set(transactionRef, {
                        site_id: currentSiteId, stock_id: id, material_name: newName,
                        transaction_type: 'STOCK_ADJUSTMENT', quantity: Math.abs(newQuantity - previousQuantity),
                        quantity_change: roundQuantity(newQuantity - previousQuantity),
                        previous_quantity: previousQuantity, new_quantity: newQuantity, unit: unit,
                        unit_cost: unitCost, total_value: Math.abs(newQuantity - previousQuantity) * unitCost,
                        notes: `Stock renamed from "${oldName}" to "${newName}".`, recorded_by: currentUser.uid, created_at: now
                    });
                    await batch.commit();
                    refreshLocalStockCache(id, { material_name: newName, quantity: newQuantity, unit: unit, unit_cost: unitCost, minimum_quantity: minimumQuantity, updated_at: now });
                    addLocalTransaction({ id: transactionRef.id, site_id: currentSiteId, stock_id: id, material_name: newName, transaction_type: 'STOCK_ADJUSTMENT', quantity: Math.abs(newQuantity - previousQuantity), quantity_change: roundQuantity(newQuantity - previousQuantity), previous_quantity: previousQuantity, new_quantity: newQuantity, unit: unit, unit_cost: unitCost, notes: `Stock renamed from "${oldName}" to "${newName}".`, created_at: now });
                }
                closeModal();
                showToast(t('common.updatedSuccessfully'), 'success');
            } catch (err) {
                console.error('Error editing stock:', err);

            if (tasks.length) {

                    const actionCell = isCompleted
                        ? `<span class="text-emerald-600"><iconify-icon icon="material-symbols:check-circle" width="20"></iconify-icon></span>`

                </div>
                <div class="settings-sections">
                    <div id="settings-profile" class="settings-section ${settingsTab === 'profile' ? 'active' : ''}">${renderProfileSection()}</div>
                    <div id="settings-account" class="settings-section ${settingsTab === 'account' ? 'active' : ''}">${renderAccountSection()}</div>
                    <div id="settings-security" class="settings-section ${settingsTab === 'security' ? 'active' : ''}">${renderSecuritySection()}</div>
                    <div id="settings-preferences" class="settings-section ${settingsTab === 'preferences' ? 'active' : ''}">${renderPreferencesSection()}</div>
                </div>
            `;
            populateSettingsForms();
            attachSettingsChangeListeners();
        }
        function renderProfileSection() {
            const profile = managerProfile || {};
            const photo = profile.profile_picture || PLACEHOLDER_IMG;
            return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:person-outline" class="text-emerald-600"></iconify-icon> ${t('settings.profileInfo')}</h3><form id="profile-form" onsubmit="handleProfileSave(event)">
                <div class="field-group text-center"><div class="profile-avatar-wrapper"><img id="settings-profile-photo-img" src="${photo}" alt="Profile Photo"><label class="change-photo-btn" title="${t('settings.changePhoto')}"><iconify-icon icon="material-symbols:photo-camera" width="20"></iconify-icon><input type="file" id="settings-profile-photo-input" accept="image/*" style="display:none;" onchange="previewProfilePhoto(event)"></label></div><button type="button" id="settings-remove-photo-btn" class="remove-photo-btn mt-2" onclick="removeProfilePhoto()">${t('settings.removePhoto')}</button></div>
                <div class="field-group"><label for="settings-full-name">${t('settings.fullName')}</label><input type="text" id="settings-full-name" placeholder="${t('settings.fullName')}" value="${profile.full_name || ''}"></div>
                <div class="field-group"><label for="settings-phone">${t('settings.phone')}</label><input type="tel" id="settings-phone" placeholder="+250 7XX XXX XXX" value="${profile.phone || ''}"></div>
                <div class="field-group"><label for="settings-email">${t('settings.email')}</label><input type="email" id="settings-email" placeholder="example@email.com" value="${profile.email || ''}"></div>
                <button type="submit" class="save-btn">${t('settings.saveProfile')}</button>
            </form></div>`;
        }
        function renderAccountSection() {
            const profile = managerProfile || {};
            return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:account-box-outline" class="text-emerald-600"></iconify-icon> ${t('settings.accountInfo')}</h3>
                <div class="field-group"><label>${t('settings.accountName')}</label><div class="readonly-field">${profile.full_name || 'N/A'}</div></div>
                <div class="field-group"><label>${t('settings.role')}</label><div class="readonly-field" id="settings-role">${profile.role || 'Manager'}</div></div>
                <div class="field-group"><label>${t('settings.email')}</label><div class="readonly-field">${profile.email || 'N/A'}</div></div>
                <div class="field-group"><label>${t('settings.phone')}</label><div class="readonly-field">${profile.phone || 'N/A'}</div></div>
                <div class="field-group"><label>${t('settings.accountStatus')}</label><div class="readonly-field" id="settings-status">${profile.status || t('settings.active')}</div></div>
                <div class="field-group"><label>${t('settings.memberSince')}</label><div class="readonly-field" id="settings-since">${formatDate(profile.created_at)}</div></div>
            </div>`;
        }
        function renderSecuritySection() {
            return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:lock-outline" class="text-emerald-600"></iconify-icon> ${t('settings.changePassword')}</h3><form id="security-form" onsubmit="handlePasswordChange(event)">
                <div class="field-group"><label for="current-password">${t('settings.currentPassword')}</label><input type="password" id="current-password" placeholder="${t('settings.currentPassword')}" required></div>
                <div class="field-group"><label for="new-password">${t('settings.newPassword')}</label><input type="password" id="new-password" placeholder="${t('settings.newPassword')}" required minlength="6"></div>
                <div class="field-group"><label for="confirm-password">${t('settings.confirmPassword')}</label><input type="password" id="confirm-password" placeholder="${t('settings.confirmPassword')}" required></div>
                <button type="submit" class="save-btn">${t('settings.changePassBtn')}</button>
            </form></div>`;
        }
        function renderPreferencesSection() {
            const profile = managerProfile || {};
            const prefs = profile.preferences || {};
            return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:settings-outline" class="text-emerald-600"></iconify-icon> ${t('settings.preferences')}</h3><form id="preferences-form" onsubmit="handlePreferencesSave(event)">
                <div class="field-group"><label for="settings-language">${t('settings.language')}</label><select id="settings-language"><option value="en">English</option><option value="fr">French</option><option value="rw">Kinyarwanda</option></select></div>
                <div class="field-group"><label for="settings-currency">${t('settings.currency')}</label><select id="settings-currency"><option value="RWF">RWF — Rwandan Franc</option><option value="USD">USD — US Dollar</option><option value="EUR">EUR — Euro</option></select></div>
                <div class="field-group"><label for="settings-date-format">${t('settings.dateFormat')}</label><select id="settings-date-format"><option value="DD/MM/YYYY">DD/MM/YYYY</option><option value="MM/DD/YYYY">MM/DD/YYYY</option><option value="YYYY-MM-DD">YYYY-MM-DD</option></select></div>
                <div class="field-group flex items-center gap-3"><input type="checkbox" id="settings-notifications" class="w-5 h-5 text-emerald-600"><label for="settings-notifications" class="mb-0">${t('settings.notifications')}</label></div>
                <button type="submit" class="save-btn">${t('settings.savePrefs')}</button>
            </form></div>`;
        }
        function populateSettingsForms() {
            const profile = managerProfile || {};
            const nameInput = document.getElementById('settings-full-name'); if (nameInput) nameInput.value = profile.full_name || '';
            const phoneInput = document.getElementById('settings-phone'); if (phoneInput) phoneInput.value = profile.phone || '';
            const emailInput = document.getElementById('settings-email'); if (emailInput) emailInput.value = profile.email || '';
            const photoImg = document.getElementById('settings-profile-photo-img'); if (photoImg) photoImg.src = profile.profile_picture || PLACEHOLDER_IMG;
            const roleDisplay = document.getElementById('settings-role'); if (roleDisplay) roleDisplay.textContent = profile.role || 'Manager';
            const statusDisplay = document.getElementById('settings-status'); if (statusDisplay) statusDisplay.textContent = profile.status || 'Active';
            const sinceDisplay = document.getElementById('settings-since'); if (sinceDisplay) sinceDisplay.textContent = formatDate(profile.created_at);
            const langSelect = document.getElementById('settings-language'); if (langSelect) langSelect.value = profile.preferences?.language || currentLanguage;
            const currencySelect = document.getElementById('settings-currency'); if (currencySelect) currencySelect.value = profile.preferences?.currency || 'RWF';
            const dateFormatSelect = document.getElementById('settings-date-format'); if (dateFormatSelect) dateFormatSelect.value = profile.preferences?.dateFormat || 'DD/MM/YYYY';
            const notifToggle = document.getElementById('settings-notifications'); if (notifToggle) notifToggle.checked = profile.preferences?.notifications !== false;
        }
        function attachSettingsChangeListeners() {
            const inputs = document.querySelectorAll('#settings-profile input, #settings-preferences input, #settings-preferences select, #settings-security input');
            inputs.forEach(el => { el.addEventListener('input', () => { if (!hasUnsavedChanges) hasUnsavedChanges = true; }); el.addEventListener('change', () => { if (!hasUnsavedChanges) hasUnsavedChanges = true; }); });
            const fileInput = document.getElementById('settings-profile-photo-input'); if (fileInput) fileInput.addEventListener('change', () => { hasUnsavedChanges = true; });
            const removeBtn = document.getElementById('settings-remove-photo-btn'); if (removeBtn) removeBtn.addEventListener('click', () => { hasUnsavedChanges = true; });
        }
        window.switchSettingsTab = (tab) => {
            if (hasUnsavedChanges) { if (!confirm(t('common.areYouSure'))) return; hasUnsavedChanges = false; }
            settingsTab = tab;
            document.querySelectorAll('.settings-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.settings-tab-btn[onclick*="${tab}"]`)?.classList.add('active');
            document.querySelectorAll('.settings-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`settings-${tab}`)?.classList.add('active');
            populateSettingsForms();
            attachSettingsChangeListeners();
        };
        window.previewProfilePhoto = (event) => {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { const img = document.getElementById('settings-profile-photo-img'); if (img) img.src = e.target.result; _profilePhotoFile = file; hasUnsavedChanges = true; };
            reader.readAsDataURL(file);
        };
        window.removeProfilePhoto = () => {
            if (!confirm(t('common.areYouSure'))) return;
            const img = document.getElementById('settings-profile-photo-img'); if (img) img.src = PLACEHOLDER_IMG;
            _profilePhotoFile = null;
            const input = document.getElementById('settings-profile-photo-input'); if (input) input.value = '';
            hasUnsavedChanges = true;
        };
        window.handleProfileSave = async (e) => {
            e.preventDefault(); const form = e.target; const btn = form.querySelector('.save-btn'); setButtonLoading(btn, true);
            try {
                const name = document.getElementById('settings-full-name').value.trim();
                const phone = document.getElementById('settings-phone').value.trim();
                const email = document.getElementById('settings-email').value.trim();
                if (!name) { alert(t('common.requiredField')); setButtonLoading(btn, false); return; }
                if (phone && !/^\+?[0-9\s-]{7,15}$/.test(phone)) { alert(t('common.invalidValue')); setButtonLoading(btn, false); return; }
                if (email && !/^\S+@\S+\.\S+$/.test(email)) { alert(t('common.invalidValue')); setButtonLoading(btn, false); return; }
                if (email && email !== managerProfile.email) {
                    const usersQuery = query(collection(db, 'profiles'), where('email', '==', email));
                    const snap = await getDocs(usersQuery);
                    if (!snap.empty && snap.docs[0].id !== currentUser.uid) { alert(t('common.invalidValue')); setButtonLoading(btn, false); return; }
                }
                const updateData = { full_name: name, phone: phone, email: email, updated_at: new Date().toISOString() };
                if (_profilePhotoFile) {
                    try { const photoUrl = await uploadImageToImgbb(_profilePhotoFile); updateData.profile_picture = photoUrl; _profilePhotoFile = null; }
                    catch (err) { alert(t('common.somethingWentWrong')); setButtonLoading(btn, false); return; }
                } else {
                    const currentImg = document.getElementById('settings-profile-photo-img').src;
                    if (currentImg === PLACEHOLDER_IMG && managerProfile.profile_picture) updateData.profile_picture = '';
                }
                const profileRef = doc(db, 'profiles', currentUser.uid);
                await updateDoc(profileRef, updateData);
                if (email && email !== currentUser.email) {
                    const password = prompt(t('settings.currentPassword'));
                    if (!password) { alert(t('common.somethingWentWrong')); setButtonLoading(btn, false); return; }
                    const credential = EmailAuthProvider.credential(currentUser.email, password);
                    await reauthenticateWithCredential(currentUser, credential);
                    await updateEmail(currentUser, email);
                    await sendEmailVerification(currentUser);
                    showToast(t('common.savedSuccessfully'), 'success');
                }
                managerProfile = { ...managerProfile, ...updateData };
                updateProfileUI(managerProfile);
                hasUnsavedChanges = false;
                showToast(t('common.updatedSuccessfully'), 'success');
                populateSettingsForms();
            } catch (err) { showToast(t('common.somethingWentWrong'), 'error'); }
            finally { setButtonLoading(btn, false); }
        };
        window.handlePasswordChange = async (e) => {
            e.preventDefault(); const form = e.target; const btn = form.querySelector('.save-btn'); setButtonLoading(btn, true);
            const current = document.getElementById('current-password').value;
            const newPass = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            if (newPass !== confirm) { alert(t('common.invalidValue')); setButtonLoading(btn, false); return; }
            if (newPass.length < 6) { alert(t('common.invalidValue')); setButtonLoading(btn, false); return; }
            try {
                const credential = EmailAuthProvider.credential(currentUser.email, current);
                await reauthenticateWithCredential(currentUser, credential);
                await updatePassword(currentUser, newPass);
                showToast(t('common.updatedSuccessfully'), 'success');
                form.reset();
                hasUnsavedChanges = false;
            } catch (err) { alert(t('common.somethingWentWrong')); }
            finally { setButtonLoading(btn, false); }
        };
        window.handlePreferencesSave = async (e) => {
            e.preventDefault(); const form = e.target; const btn = form.querySelector('.save-btn'); setButtonLoading(btn, true);
            try {
                const language = document.getElementById('settings-language').value;
                const currency = document.getElementById('settings-currency').value;
                const dateFormat = document.getElementById('settings-date-format').value;
                const notifications = document.getElementById('settings-notifications').checked;
                const prefs = { language, currency, dateFormat, notifications };
                const profileRef = doc(db, 'profiles', currentUser.uid);
                await updateDoc(profileRef, { preferences: prefs, updated_at: new Date().toISOString() });
                managerProfile.preferences = prefs;
                hasUnsavedChanges = false;
                if (language !== currentLanguage) setLanguage(language);
                showToast(t('common.savedSuccessfully'), 'success');
            } catch (err) { showToast(t('common.somethingWentWrong'), 'error'); }
            finally { setButtonLoading(btn, false); }
        };

        window.handleLogout = async () => {
            await signOut(auth);
            window.location.href = '../index.html';
        };
    </script>
</body>
</html>
