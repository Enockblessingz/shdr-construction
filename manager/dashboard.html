            function renderPayrollReport() {
                return `<div class="space-y-6"><div class="bg-white rounded-2xl border p-4 grid grid-cols-1 md:grid-cols-3 gap-4"><div><label class="block text-sm font-medium">${t('reports.startDate')}</label><input type="date" id="payroll-start" class="w-full border rounded-lg p-2.5 text-sm" onchange="updatePayrollReport()"></div><div><label class="block text-sm font-medium">${t('reports.endDate')}</label><input type="date" id="payroll-end" class="w-full border rounded-lg p-2.5 text-sm" onchange="updatePayrollReport()"></div><div><label class="block text-sm font-medium">${t('reports.searchWorker')}</label><input type="text" id="payroll-worker-search" class="w-full border rounded-lg p-2.5 text-sm" placeholder="${t('reports.searchWorker')}" oninput="updatePayrollReport()"></div></div><div id="payroll-summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div><div id="payroll-table-container" class="bg-white rounded-2xl border overflow-hidden shadow-sm"></div><div class="flex gap-3 justify-end"><button onclick="exportPayrollReport('csv')" class="px-6 py-2 bg-emerald-600 text-white rounded-xl">${t('reports.exportCSV')}</button><button onclick="exportPayrollReport('print')" class="px-6 py-2 bg-slate-800 text-white rounded-xl">${t('reports.printPDF')}</button></div></div>`;
            }

            window.updatePayrollReport = function() {
                const startDate = document.getElementById('payroll-start')?.value || '',
                    endDate = document.getElementById('payroll-end')?.value || '',
                    workerSearch = document.getElementById('payroll-worker-search')?.value?.toLowerCase() || '';
                let filtered = attendanceData.filter(a => a.site_id === currentSiteId);
                if (startDate) filtered = filtered.filter(a => a.date >= startDate);
                if (endDate) filtered = filtered.filter(a => a.date <= endDate);
                if (workerSearch) filtered = filtered.filter(a => a.name.toLowerCase().includes(workerSearch));
                const workerMap = {};
                filtered.forEach(rec => {
                    const key = rec.worker_id || rec.id;
                    if (!workerMap[key]) workerMap[key] = { name: rec.name, role: rec.role, dailyRate: rec.daily_rate || 0, days: [], totalPayable: 0 };
                    workerMap[key].days.push(rec.date);
                    workerMap[key].totalPayable += rec.daily_rate || 0;
                });
                const workers = Object.values(workerMap);
                const totalWorkers = workers.length,
                    totalDays = workers.reduce((s, w) => s + w.days.length, 0),
                    totalPayroll = workers.reduce((s, w) => s + w.totalPayable, 0),
                    avgDaily = totalDays > 0 ? totalPayroll / totalDays : 0;
                const cards = document.getElementById('payroll-summary-cards');
                if (cards) cards.innerHTML =
                    `<div class="payroll-card bg-white rounded-2xl border p-4 shadow-sm"><p class="text-xs text-slate-500">${t('reports.totalWorkers')}</p><p class="text-2xl font-bold">${totalWorkers}</p></div><div class="payroll-card bg-white rounded-2xl border p-4 shadow-sm"><p class="text-xs text-slate-500">${t('reports.workerDays')}</p><p class="text-2xl font-bold">${totalDays}</p></div><div class="payroll-card bg-white rounded-2xl border p-4 shadow-sm"><p class="text-xs text-slate-500">${t('reports.totalPayroll')}</p><p class="text-2xl font-bold text-emerald-600">${totalPayroll.toLocaleString()} RWF</p></div><div class="payroll-card bg-white rounded-2xl border p-4 shadow-sm"><p class="text-xs text-slate-500">${t('reports.avgDaily')}</p><p class="text-2xl font-bold">${avgDaily.toLocaleString()} RWF</p></div>`;
                const table = document.getElementById('payroll-table-container');
                if (table) {

                    table.innerHTML =
                        `<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs"><tr><th class="px-3 py-2">${t('workers.fullName')}</th><th class="px-3 py-2">${t('workers.role')}</th><th class="px-3 py-2">${t('reports.workerDays')}</th><th class="px-3 py-2">${t('reports.totalPayroll')}</th></tr></thead><tbody>${workers.map(w => `<tr><td class="px-3 py-2 font-medium">${w.name}</td><td class="px-3 py-2">${w.role||'—'}</td><td class="px-3 py-2 text-center">${w.days.length}</td><td class="px-3 py-2 text-right font-semibold text-emerald-600">${w.totalPayable.toLocaleString()} RWF</td></tr>`).join('')}</tbody><tfoot class="bg-slate-50 font-bold"><tr><td colspan="2" class="px-3 py-2">Total</td><td class="px-3 py-2 text-center">${totalDays}</td><td class="px-3 py-2 text-right">${totalPayroll.toLocaleString()} RWF</td></tr></tfoot></table></div>`;

            window.addEventListener('load', () => {
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    const isActive = btn.dataset.language === currentLanguage;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-pressed', isActive.toString());
                });
                document.documentElement.lang = currentLanguage;
                applyTranslations();

                onAuthStateChanged(auth, async (user) => {
                    if (!user) { window.location.href = '../manager.html'; return; }
                    currentUser = user;
                    try {
                        const profileRef = doc(db, 'profiles', user.uid);
                        const profileSnap = await getDoc(profileRef);
                        if (!profileSnap.exists() || profileSnap.data().role !== 'manager') {
                            await signOut(auth);
                            window.location.href = '../manager.html';
                            return;
                        }
                        managerProfile = profileSnap.data();
                        updateProfileUI(managerProfile);
                        onSnapshot(profileRef, (snap) => {
                            if (snap.exists()) {
                                managerProfile = snap.data();
                                updateProfileUI(managerProfile);
                                if (currentSection === 'settings') populateSettingsForms();
                            }
                        });

                        let siteIds = [];
                        if (managerProfile.assigned_sites && Array.isArray(managerProfile.assigned_sites)) siteIds = managerProfile.assigned_sites;
                        else if (managerProfile.assigned_site) siteIds = [managerProfile.assigned_site];
                        if (siteIds.length) {
                            const sitePromises = siteIds.map(id => getDoc(doc(db, 'sites', id)));
                            const siteSnaps = await Promise.all(sitePromises);
                            assignedSites = siteSnaps.filter(snap => snap.exists()).map(snap => ({ id: snap.id, ...snap.data() }));
                            if (assignedSites.length) {
                                currentSiteId = assignedSites[0].id;
                                const selector = document.getElementById('site-selector');
                                if (assignedSites.length > 1) {

                                        `<option value="${s.id}" ${s.id === currentSiteId ? 'selected' : ''}>${s.name}</option>`
                                    ).join('');

                                attachListeners();
                            }

                        console.error('Init error:', err);
                        showError('Failed to initialize: ' + err.message);

            function updateProfileUI(profile) {
                if (!profile) return;
                const name = profile.full_name || 'Manager';
                const email = profile.email || '';
                const photo = profile.profile_picture || '';
                const avatarImg = document.getElementById('sidebar-user-avatar-img');
                const avatarText = document.getElementById('user-avatar-text');
                if (photo) { avatarImg.src = photo;
                    avatarImg.style.display = 'block';

                    avatarText.style.display = 'flex';

                document.getElementById('user-name').textContent = name;
                document.getElementById('user-email').textContent = email;
            }

            function attachListeners() {
                unsubscribeSnapshots.forEach(fn => fn());
                unsubscribeSnapshots = [];
                if (!currentSiteId) return;
                const siteId = currentSiteId;
                const matQ = query(collection(db, 'materials'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(matQ, snap => { materialsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    refreshCurrentSection(); }));
                const workQ = query(collection(db, 'site_workers'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(workQ, snap => { siteWorkersData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    refreshCurrentSection(); }));
                const progQ = query(collection(db, 'progress_tasks'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(progQ, snap => { const tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    progressTasks = tasks;
                    window.progressTasks = tasks;
                    refreshCurrentSection(); }));
                const posQ = query(collection(db, 'worker_positions'), where('site_id', 'in', [siteId, 'all']));
                unsubscribeSnapshots.push(onSnapshot(posQ, snap => { workerPositions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    refreshCurrentSection(); }));
                const galleryQ = query(collection(db, 'gallery'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(galleryQ, snap => { galleryData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    refreshCurrentSection(); }));
                const attQ = query(collection(db, 'worker_attendance'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(attQ, snap => { attendanceData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    refreshCurrentSection(); }));
                const stockQ = query(collection(db, 'stock'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(stockQ, snap => { stockData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    refreshCurrentSection(); }));
                const transQ = query(collection(db, 'stock_transactions'), where('site_id', '==', siteId), orderBy('created_at', 'desc'));
                unsubscribeSnapshots.push(onSnapshot(transQ, snap => { stockTransactions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    refreshCurrentSection(); }));

                const reqQ = query(collection(db, 'requisitions'), where('requested_by', '==', currentUser.uid));
                unsubscribeSnapshots.push(onSnapshot(reqQ, snap => { requisitionsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    refreshCurrentSection(); }));
                const reqItemsQ = query(collection(db, 'requisition_items'), where('requested_by', '==', currentUser.uid));
                unsubscribeSnapshots.push(onSnapshot(reqItemsQ, snap => { requisitionItemsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    refreshCurrentSection(); }));
                const reqHistQ = query(collection(db, 'requisition_history'), where('requested_by', '==', currentUser.uid), orderBy('timestamp', 'desc'));
                unsubscribeSnapshots.push(onSnapshot(reqHistQ, snap => { requisitionHistoryData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    refreshCurrentSection(); }));
            }

            function refreshCurrentSection() {
                if (window._refreshing) return;
                window._refreshing = true;
                requestAnimationFrame(() => { showSection(currentSection);
                    window._refreshing = false; });
            }

            window.switchSite = function(siteId) {
                currentSiteId = siteId;
                attachListeners();
                showSection(currentSection);
            };

            console.log('✅ SHDR Manager Dashboard loaded with Batch Material Usage (card-based UI)');
        </script>
    </main>
</body>
</html>
