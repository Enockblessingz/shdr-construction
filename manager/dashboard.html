*{font-family:'Plus Jakarta Sans',sans-serif}
body{background:#f8fafc}
.sidebar-link.active{background:#ecfdf5;color:#059669;border-left:3px solid #059669}
.stat-card{transition:all .2s ease}.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,.05)}
.modal{display:none}.modal.active{display:flex}
.spinner{border:3px solid #e2e8f0;border-top:3px solid #059669;border-radius:50%;width:24px;height:24px;animation:spin .8s linear infinite}
.btn-spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top:2px solid #fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;z-index:40;justify-content:space-around;padding:8px 0;box-shadow:0 -2px 10px rgba(0,0,0,.05)}

.bottom-nav a.active{color:#059669;background:#ecfdf5}.bottom-nav a iconify-icon{font-size:1.3rem}

@media (max-width:640px){#content-area{padding:1rem}.stat-card{padding:1rem}.table-cell{padding:.5rem}}
.tab-active{background:#059669;color:#fff}.tab-inactive{background:#f1f5f9;color:#334155}.tab-inactive:hover{background:#e2e8f0}
.report-tab-active{background:#059669;color:#fff}.report-tab-inactive{background:#f1f5f9;color:#334155}.report-tab-inactive:hover{background:#e2e8f0}
.payroll-card{transition:all .2s}.payroll-card:hover{transform:translateY(-2px)}

.lang-btn{background:transparent;border:2px solid transparent;color:#64748b;font-size:14px;font-weight:700;padding:6px 16px;border-radius:50px;cursor:pointer;transition:all .3s ease;outline:none}
.lang-btn:hover{background:rgba(30,86,160,.1)}.lang-btn.active{background:#fff;color:#1e56a0;border-color:#1e56a0;box-shadow:0 2px 6px rgba(30,86,160,.2)}
@media (max-width:640px){.lang-btn{font-size:12px;padding:4px 10px}}
.settings-tab-btn{transition:all .2s}.settings-tab-btn.active{background:#059669;color:#fff;box-shadow:0 4px 10px rgba(5,150,105,.2)}.settings-tab-btn:not(.active):hover{background:#f1f5f9}
.settings-section{display:none}.settings-section.active{display:block}
.profile-avatar-wrapper{position:relative;width:120px;height:120px;margin:0 auto}
.profile-avatar-wrapper img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.profile-avatar-wrapper .change-photo-btn{position:absolute;bottom:4px;right:4px;background:#059669;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.settings-card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.settings-card h3{font-weight:600;font-size:1.1rem;color:#1e293b;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.settings-card .field-group{margin-bottom:1.25rem}
.settings-card label{display:block;font-size:.85rem;font-weight:500;color:#475569;margin-bottom:.3rem}
.settings-card input,.settings-card select{width:100%;padding:.6rem .75rem;border:1px solid #d1d5db;border-radius:8px;font-size:.95rem;background:#fff}
.settings-card input:focus,.settings-card select:focus{outline:none;border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.2)}
.settings-card .readonly-field{background:#f1f5f9;color:#475569;padding:.6rem .75rem;border-radius:8px;font-size:.95rem}
.settings-card .save-btn{background:#059669;color:#fff;padding:.6rem 1.5rem;border-radius:8px;font-weight:600;border:none;cursor:pointer;transition:.2s}
.settings-card .save-btn:hover{background:#047857}.settings-card .save-btn:disabled{opacity:.6;cursor:not-allowed}
.settings-card .remove-photo-btn{color:#ef4444;font-size:.85rem;cursor:pointer;background:none;border:none;padding:.2rem .5rem}
.settings-card .remove-photo-btn:hover{color:#dc2626;text-decoration:underline}

.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.20);transform:translateY(80px);opacity:0;transition:all .4s ease;z-index:999;max-width:400px;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateY(0);opacity:1}.toast.success{border-left:4px solid #059669}.toast.error{border-left:4px solid #ef4444}.toast.info{border-left:4px solid #3b82f6}

.usage-material-grid .mat-card{border:2px solid #e5e7eb;border-radius:12px;padding:12px 8px;background:#fff;cursor:pointer;transition:all .15s ease;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;user-select:none;position:relative;min-height:80px;justify-content:center}
.usage-material-grid .mat-card:hover{border-color:#9ca3af;transform:translateY(-2px)}
.usage-material-grid .mat-card .mat-icon{font-size:1.8rem;line-height:1.2}
.usage-material-grid .mat-card .mat-name{font-weight:700;font-size:.8rem;color:#1e293b;text-transform:uppercase;letter-spacing:.3px}
.usage-material-grid .mat-card .mat-unit{font-size:.65rem;color:#94a3b8;font-weight:400}
.usage-material-grid .mat-card .check-indicator{position:absolute;top:4px;right:6px;color:#059669;font-size:1rem;font-weight:700;opacity:0;transition:opacity .2s}
.usage-material-grid .mat-card.selected{border-color:#059669;background:#f0fdf4;box-shadow:0 4px 12px rgba(5,150,105,.10)}

.usage-header .date-group{display:flex;align-items:center;gap:8px}
.usage-header .date-group label{font-weight:600;font-size:.9rem;color:#1e293b}
.usage-header .date-group input{border:1px solid #d1d5db;border-radius:8px;padding:6px 12px;font-size:.9rem;outline:none;background:#fff}
.usage-header .assigned-site{font-size:.9rem;font-weight:600;color:#1e293b;background:#f1f5f9;padding:4px 16px;border-radius:20px;display:inline-block}
.usage-select-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.usage-select-header h3{font-size:1rem;font-weight:700;color:#1e293b}
.usage-select-header .select-all-link{color:#059669;font-weight:600;font-size:.85rem;cursor:pointer;background:none;border:none}
.usage-hint{font-size:.8rem;color:#6b7280;text-align:center;padding:2px 0 0}
.usage-entries-table th{background:#f8fafc;font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#475569;padding:.5rem .75rem;text-align:left;border-bottom:2px solid #e5e7eb}
.usage-entries-table td{padding:.5rem .75rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.usage-entries-table input{border:1px solid #e2e8f0;border-radius:6px;padding:4px 8px;width:100%;font-size:.85rem;background:#fff}
.usage-entries-table input:focus{border-color:#059669;outline:none;box-shadow:0 0 0 3px rgba(5,150,105,.15)}
.usage-entries-table .remove-btn{color:#94a3b8;transition:color .2s;background:none;border:none;cursor:pointer;padding:4px}

.usage-entries-table .invalid-row td{background:#fef2f2}
.usage-entries-table .invalid-row .error-msg{color:#dc2626;font-size:.7rem;font-weight:500}

.usage-total-card .total-amount{font-size:1.8rem;font-weight:800;color:#065f46}
.usage-total-card .total-label{font-size:1rem;font-weight:600;color:#065f46}
.usage-empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;color:#94a3b8}
.usage-empty-state iconify-icon{font-size:3rem;margin-bottom:.5rem;opacity:.5}.usage-empty-state p{font-size:.9rem}
.usage-save-btn{background:#059669;color:#fff;padding:14px 32px;border-radius:12px;font-weight:700;font-size:1rem;border:none;cursor:pointer;transition:.2s;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}

function getNestedTranslation(o,k){return k.split('.').reduce((x,i)=>(x?x[i]:undefined),o)}
function t(key,params={}){let v=getNestedTranslation(translations[currentLanguage],key);if(v===undefined)v=getNestedTranslation(translations.en,key);if(v===undefined)return key;if(params)Object.keys(params).forEach(p=>{v=v.replace(new RegExp(`{${p}}`,'g'),params[p])});return v}
function applyTranslations(){document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.i18nPlaceholder)});document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=t(el.dataset.i18nTitle)});document.querySelectorAll('[data-i18n-aria-label]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.i18nAriaLabel))});}
function setLanguage(lang){if(!['en','rw','fr'].includes(lang))return;currentLanguage=lang;localStorage.setItem('shdr_language',lang);document.querySelectorAll('.lang-btn').forEach(b=>{const a=b.dataset.language===lang;b.classList.toggle('active',a);b.setAttribute('aria-pressed',a.toString())});document.documentElement.lang=lang;applyTranslations();if(currentSection&&currentUser)showSection(currentSection);}
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.language)));

function formatDate(v){if(!v)return '—';const d=typeof v==='string'?new Date(v):v;if(isNaN(d.getTime()))return '—';const l={en:'en-US',rw:'rw-RW',fr:'fr-FR'};return new Intl.DateTimeFormat(l[currentLanguage],{year:'numeric',month:'long',day:'numeric'}).format(d);}
function showLoading(s){document.getElementById('global-loading').classList.toggle('hidden',!s);}
function showError(m){const el=document.getElementById('global-error');el.classList.remove('hidden');el.querySelector('div').textContent=m;}
function clearError(){document.getElementById('global-error').classList.add('hidden');}
function setButtonLoading(btn,loading){if(!btn)return;if(loading){btn.disabled=true;btn.dataset.origHTML=btn.innerHTML;btn.innerHTML='<span class="btn-spinner"></span> '+t('common.loading');}else{btn.disabled=false;btn.innerHTML=btn.dataset.origHTML||'Submit';}}
function getFormSubmitBtn(f){return f.querySelector('button[type="submit"]');}
function getTodayISO(){return new Date().toISOString().split('T')[0];}
function calculateTotal(q,u){return (q||0)*(u||0);}
function toNumber(v,f=0){const n=Number(v);return Number.isFinite(n)?n:f;}
function formatRWF(v){return toNumber(v).toLocaleString('en-RW',{minimumFractionDigits:0,maximumFractionDigits:0})+' RWF';}
function normalizeMaterialName(n){return String(n||'').trim().replace(/\s+/g,' ').toLowerCase();}
function cleanMaterialName(n){return String(n||'').trim().replace(/\s+/g,' ');}
function getStockByName(sid,name){const n=normalizeMaterialName(name);return stockData.find(s=>s.site_id===sid&&normalizeMaterialName(s.material_name)===n)||null;}
function getStockUnitCost(s){return s?toNumber(s.unit_cost):0;}
function getStockQuantity(s){return s?toNumber(s.quantity):0;}
function getStockUnit(s){return s?s.unit||'units':'units';}
function getMaterialById(id){return materialsData.find(m=>m.id===id)||null;}
function getStockById(id){return stockData.find(s=>s.id===id)||null;}
function generateBatchNumber(){const y=new Date().getFullYear();const c=materialsData.filter(m=>m.batch_number&&m.batch_number.startsWith(`SHDR-USAGE-${y}-`)).length;return `SHDR-USAGE-${y}-${String(c+1).padStart(4,'0')}`;}
function getMaterialIcon(name){const l=String(name).toLowerCase();
  if(l.includes('cement'))return '🧱';if(l.includes('sand'))return '⏳';if(l.includes('aggregate')||l.includes('gravel'))return '🪨';
  if(l.includes('brick')||l.includes('clay'))return '🧱';if(l.includes('steel')||l.includes('bar'))return '🔩';if(l.includes('roofing'))return '🏗️';
  if(l.includes('water'))return '💧';if(l.includes('paint'))return '🎨';if(l.includes('tile'))return '🟦';if(l.includes('timber')||l.includes('wood'))return '🪵';
  if(l.includes('pvc')||l.includes('pipe'))return '🔧';if(l.includes('nail'))return '📌';if(l.includes('concrete'))return '🧱';if(l.includes('block'))return '🧱';return '📦';}
function showToast(msg,type='info'){const el=document.getElementById('toast');const i={success:'✅',error:'❌',info:'ℹ️'};el.innerHTML=`<span>${i[type]||'ℹ️'}</span> ${msg}`;el.className='toast '+(type||'info');el.classList.add('show');clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove('show'),5000);}

window.openAddMaterialModal=function(){
  _usageSelectedMaterials=new Map();
  const siteStock=stockData.filter(s=>s.site_id===currentSiteId);
  if(!siteStock.length){showToast('No stock items available at this site. Please receive stock first.','error');return;}
  const site=assignedSites.find(s=>s.id===currentSiteId);
  const siteName=site?site.name:'Unknown Site';
  const today=getTodayISO();
  const cardsHtml=siteStock.map(item=>{const name=cleanMaterialName(item.material_name||'Unknown');const unit=getStockUnit(item);const icon=getMaterialIcon(name);return `<div class="mat-card" data-stock-id="${item.id}" onclick="toggleUsageMaterialCard('${item.id}')"><div class="mat-icon">${icon}</div><div class="mat-name">${name}</div><div class="mat-unit">${unit}</div><div class="check-indicator">✓</div></div>`;}).join('');
  openModal('📦 '+t('materials.batchMaterialUsage'),`
    <form id="usage-batch-form" onsubmit="submitUsageBatch(event)" class="space-y-5">
      <div class="usage-header">
        <div class="date-group"><label for="usage-date">${t('materials.dateUsed')}</label><input type="date" id="usage-date" value="${today}" required /></div>
        <div class="assigned-site">Assigned Site: ${siteName}</div>
      </div>
      <div>
        <div class="usage-select-header"><h3>${t('materials.selectMaterials')}</h3><button type="button" class="select-all-link" onclick="toggleAllUsageMaterials(true)">${t('common.selectAll')}</button></div>
        <div class="usage-material-grid" id="usage-material-grid">${cardsHtml}</div>
        <p class="usage-hint">${t('materials.selectMaterialsHint')}</p>
      </div>
      <div id="usage-entries-container" class="bg-white rounded-2xl border p-4 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-semibold text-slate-800">${t('materials.materialItems')}</h3>
          <span class="text-xs text-slate-400" id="usage-selected-count">0 ${t('materials.materials')}</span>
        </div>
        <div id="usage-entries"><div class="usage-empty-state"><iconify-icon icon="material-symbols:inbox-outline"></iconify-icon><p>${t('materials.selectMaterials')}</p></div></div>
      </div>
      <div id="usage-total-container" class="usage-total-card hidden">
        <span class="total-label">${t('materials.batchTotal')}</span>
        <span class="total-amount" id="usage-total-amount">0 RWF</span>
      </div>
      <button type="submit" id="usage-save-btn" class="usage-save-btn"><iconify-icon icon="material-symbols:save" class="text-xl"></iconify-icon> ${t('materials.saveUsageBatch')}</button>
    </form>`);
  updateUsageEntries();updateUsageTotal();
};
window.toggleUsageMaterialCard=function(stockId){
  const card=document.querySelector(`.mat-card[data-stock-id="${stockId}"]`);if(!card)return;
  const isSel=card.classList.contains('selected');card.classList.toggle('selected');
  const s=stockData.find(x=>x.id===stockId);if(!s)return;
  if(!isSel){_usageSelectedMaterials.set(stockId,{stockId,materialName:cleanMaterialName(s.material_name||'Unknown'),available:getStockQuantity(s),unit:getStockUnit(s),unitCost:getStockUnitCost(s)>0?getStockUnitCost(s):0,quantityUsed:0,notes:''});}
  else{_usageSelectedMaterials.delete(stockId);}
  document.getElementById('usage-selected-count').textContent=`${_usageSelectedMaterials.size} ${t('materials.materials')}`;
  updateUsageEntries();updateUsageTotal();
};
window.toggleAllUsageMaterials=function(select){
  document.querySelectorAll('.mat-card').forEach(card=>{
    const sid=card.dataset.stockId;const isSel=card.classList.contains('selected');
    if(select&&!isSel){card.classList.add('selected');const s=stockData.find(x=>x.id===sid);if(s){_usageSelectedMaterials.set(sid,{stockId:sid,materialName:cleanMaterialName(s.material_name||'Unknown'),available:getStockQuantity(s),unit:getStockUnit(s),unitCost:getStockUnitCost(s)>0?getStockUnitCost(s):0,quantityUsed:0,notes:''});}}
    else if(!select&&isSel){card.classList.remove('selected');_usageSelectedMaterials.delete(sid);}
  });
  document.getElementById('usage-selected-count').textContent=`${_usageSelectedMaterials.size} ${t('materials.materials')}`;
  updateUsageEntries();updateUsageTotal();
};
function updateUsageEntries(){
  const c=document.getElementById('usage-entries');if(!c)return;
  const e=Array.from(_usageSelectedMaterials.entries());
  if(!e.length){c.innerHTML=`<div class="usage-empty-state"><iconify-icon icon="material-symbols:inbox-outline"></iconify-icon><p>${t('materials.selectMaterials')}</p></div>`;document.getElementById('usage-total-container').classList.add('hidden');return;}

function updateUsageTotal(){
  let total=0,hasValid=false;
  for(const[_,d]of _usageSelectedMaterials){const q=toNumber(d.quantityUsed),c=toNumber(d.unitCost);if(q>0&&c>=0&&q<=d.available){total+=q*c;hasValid=true;}}

  const c=document.getElementById('usage-total-container');if(c){if(_usageSelectedMaterials.size===0||!hasValid)c.classList.add('hidden');else c.classList.remove('hidden');}

window.submitUsageBatch=async function(e){
  e.preventDefault();
  const btn=document.getElementById('usage-save-btn');setButtonLoading(btn,true);
  try{
    const date=document.getElementById('usage-date').value;
    if(!date){showToast(t('common.requiredField')+': '+t('materials.dateUsed'),'error');setButtonLoading(btn,false);return;}
    const entries=Array.from(_usageSelectedMaterials.entries());
    const valid=entries.filter(([_,d])=>toNumber(d.quantityUsed)>0);
    if(!valid.length){showToast(t('materials.selectAtLeastOneMaterial'),'error');setButtonLoading(btn,false);return;}
    const errors=[],validated=[];
    for(const[sid,d]of valid){
      const q=toNumber(d.quantityUsed),c=toNumber(d.unitCost);
      if(q<=0){errors.push(`${d.materialName}: ${t('materials.quantityMustBePositive')}`);continue;}
      if(c<0){errors.push(`${d.materialName}: ${t('materials.unitCostCannotBeNegative')}`);continue;}
      if(q>d.available){errors.push(`${d.materialName}: ${t('materials.insufficientStock')}`);continue;}
      const s=getStockById(sid);
      if(!s){errors.push(`${d.materialName}: ${t('materials.stockNotFound')}`);continue;}
      const cur=getStockQuantity(s);
      if(q>cur){errors.push(`${d.materialName}: ${t('materials.insufficientStock')}`);continue;}
      validated.push({stockId:sid,stockItem:s,materialName:d.materialName,quantityUsed:q,unit:d.unit,unitCost:c,totalAmount:q*c,notes:d.notes||'',previousQuantity:cur,newQuantity:cur-q});
    }
    if(errors.length){showToast('❌ '+errors.join('; '),'error');setButtonLoading(btn,false);return;}
    const batchNumber=generateBatchNumber();
    const now=new Date().toISOString();
    const batchTotal=validated.reduce((s,e)=>s+e.totalAmount,0);
    await runTransaction(db,async(tx)=>{
      const refs=validated.map(e=>doc(db,'stock',e.stockId));
      const snaps=await Promise.all(refs.map(r=>tx.get(r)));
      for(let i=0;i<validated.length;i++){
        const e=validated[i],snap=snaps[i];
        if(!snap.exists())throw new Error(`${e.materialName}: ${t('materials.stockNotFound')}`);
        const cur=toNumber(snap.data().quantity);
        if(e.quantityUsed>cur)throw new Error(`${e.materialName}: ${t('materials.insufficientStock')}`);
        e.previousQuantity=cur;e.newQuantity=cur-e.quantityUsed;
      }
      const batchRef=doc(collection(db,'material_usage_batches'));
      tx.set(batchRef,{batch_number:batchNumber,site_id:currentSiteId,usage_date:date,total_amount:batchTotal,item_count:validated.length,recorded_by:currentUser.uid,recorded_by_name:managerProfile?.full_name||'Manager',created_at:now,updated_at:now});
      for(const e of validated){
        const uRef=doc(collection(db,'materials'));
        tx.set(uRef,{site_id:currentSiteId,name:e.materialName,quantity_used:e.quantityUsed,unit:e.unit,unit_cost:e.unitCost,total_amount:e.totalAmount,notes:e.notes,date_used:date,batch_number:batchNumber,stock_id:e.stockId,recorded_by:currentUser.uid,created_at:now,updated_at:now});
        tx.update(doc(db,'stock',e.stockId),{quantity:e.newQuantity,unit_cost:e.unitCost,updated_at:now});
        const tRef=doc(collection(db,'stock_transactions'));
        tx.set(tRef,{site_id:currentSiteId,stock_id:e.stockId,material_name:e.materialName,transaction_type:'MATERIAL_USAGE',quantity:e.quantityUsed,quantity_change:-e.quantityUsed,previous_quantity:e.previousQuantity,new_quantity:e.newQuantity,unit:e.unit,unit_cost:e.unitCost,total_value:e.totalAmount,batch_number:batchNumber,notes:e.notes||'Material used',recorded_by:currentUser.uid,created_at:now});
      }
    });
    closeModal();showToast(`✅ ${t('materials.batchSaved')} (${batchNumber})`,'success');
  }catch(err){console.error(err);showToast(err.message||t('common.somethingWentWrong'),'error');}
  finally{setButtonLoading(btn,false);}
};

window.submitEditMaterial=async function(e,id){
  e.preventDefault();
  const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);
  try{
    const m=getMaterialById(id);if(!m)throw new Error('Material record not found.');
    const s=getStockByName(currentSiteId,m.name);if(!s)throw new Error(`No stock record found for "${m.name}".`);
    const cur=getStockQuantity(s),orig=toNumber(m.quantity_used),restored=cur+orig;
    const newQ=parseFloat(document.getElementById('edit-qty').value)||0;
    const newC=parseFloat(document.getElementById('edit-cost').value)||0;
    const newNotes=document.getElementById('edit-notes').value.trim();
    if(newQ<=0)throw new Error(t('materials.quantityMustBePositive'));
    if(newC<0)throw new Error(t('materials.unitCostCannotBeNegative'));
    if(newQ>restored)throw new Error(`${t('materials.quantityExceedsAvailable')}. ${t('materials.available')}: ${restored} ${getStockUnit(s)}`);
    const finalStock=restored-newQ,newTotal=newQ*newC,now=new Date().toISOString();
    await runTransaction(db,async(tx)=>{
      const sRef=doc(db,'stock',s.id),sSnap=await tx.get(sRef);if(!sSnap.exists())throw new Error('Stock not found');
      const latest=toNumber(sSnap.data().quantity),latestRestored=latest+orig;
      if(newQ>latestRestored)throw new Error(`${t('materials.quantityExceedsAvailable')}`);
      const latestFinal=latestRestored-newQ;
      tx.update(sRef,{quantity:latestFinal,unit_cost:newC,updated_at:now});
      tx.update(doc(db,'materials',id),{quantity_used:newQ,unit_cost:newC,total_amount:newTotal,notes:newNotes,updated_at:now});
      const tRef=doc(collection(db,'stock_transactions'));
      tx.set(tRef,{site_id:currentSiteId,stock_id:s.id,material_name:m.name,transaction_type:'MATERIAL_USAGE_EDITED',quantity:Math.abs(newQ-orig),quantity_change:newQ-orig,previous_quantity:latest,new_quantity:latestFinal,unit:getStockUnit(s),unit_cost:newC,total_value:newTotal,batch_number:m.batch_number||null,notes:`Edited from ${orig} to ${newQ} ${getStockUnit(s)}`,recorded_by:currentUser.uid,created_at:now});
    });
    closeModal();showToast(t('common.updatedSuccessfully'),'success');
  }catch(err){showToast(err.message||t('common.somethingWentWrong'),'error');}
  finally{setButtonLoading(btn,false);}
};

function renderMaterialsList(){
  const currentSite=assignedSites.find(s=>s.id===currentSiteId);
  const siteName=currentSite?currentSite.name:'Unknown Site';
  const mats=materialsData.filter(m=>m.site_id===currentSiteId).sort((a,b)=>new Date(b.date_used||b.created_at||0)-new Date(a.date_used||a.created_at||0));
  if(!mats.length)return `<div class="bg-white rounded-2xl border p-6 text-center"><p class="text-slate-500">${t('materials.noMaterials')}</p></div>`;
  const grouped={};mats.forEach(m=>{const k=m.date_used?String(m.date_used).substring(0,10):'unknown';if(!grouped[k])grouped[k]=[];grouped[k].push(m);});
  const sorted=Object.keys(grouped).sort((a,b)=>{if(a==='unknown')return 1;if(b==='unknown')return -1;return new Date(b)-new Date(a);});
  let h='';
  sorted.forEach(dateKey=>{
    const list=grouped[dateKey];
    const display=dateKey!=='unknown'?formatDate(dateKey+'T00:00:00'):'Unknown Date';
    h+=`<div class="mb-6"><h3 class="font-bold text-sm text-slate-700 mb-3 flex items-center gap-2"><iconify-icon icon="material-symbols:calendar-month" class="text-emerald-500"></iconify-icon>${display}</h3><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">`;
    list.forEach(m=>{
      const q=toNumber(m.quantity_used),uc=toNumber(m.unit_cost),tot=q*uc;
      const img=m.image||PLACEHOLDER_IMG;
      h+=`<div class="bg-white rounded-2xl border overflow-hidden shadow-sm hover:shadow-md transition">
        <div class="relative w-full h-48 overflow-hidden bg-slate-100">
          <img src="${img}" class="w-full h-full object-cover" onerror="this.src='${PLACEHOLDER_IMG}'">
          <div class="absolute top-3 left-3 bg-emerald-600/90 text-white text-xs font-medium px-2.5 py-1 rounded-full">${siteName}</div>
          ${m.batch_number?`<div class="absolute top-3 right-3 bg-slate-800/80 text-white text-[10px] font-medium px-2 py-0.5 rounded-full">${m.batch_number}</div>`:''}
        </div>
        <div class="p-5">
          <h3 class="font-bold text-lg text-slate-800 truncate">${m.name||'Unknown'}</h3>
          <div class="mt-4 space-y-2">
            <div class="flex justify-between text-sm border-b border-slate-100 pb-2"><span class="text-slate-500">${t('materials.quantityUsed')}</span><span class="font-semibold text-slate-700">${q} ${m.unit||''}</span></div>

      h+=`<div class="flex justify-between gap-3 text-sm border-b border-slate-100 pb-2"><div><div class="font-medium truncate">${tx.material_name||''}</div><div class="text-xs text-slate-500">${(tx.transaction_type||'').replace(/_/g,' ')}</div></div><div class="text-right whitespace-nowrap"><div class="font-semibold ${cls}">${sign}${Math.abs(ch)} ${tx.unit||''}</div><div class="text-xs text-slate-400">${tx.created_at?formatDate(tx.created_at):''}</div></div></div>`;
    });
    h+=`</div></div>`;
  }
  container.innerHTML=h;
}

function renderPayrollReport(){return `<div class="space-y-6"><div class="bg-white rounded-2xl border p-4 grid grid-cols-1 md:grid-cols-3 gap-4"><div><label class="block text-sm font-medium">${t('reports.startDate')}</label><input type="date" id="payroll-start" class="w-full border rounded-lg p-2.5 text-sm" onchange="updatePayrollReport()"></div><div><label class="block text-sm font-medium">${t('reports.endDate')}</label><input type="date" id="payroll-end" class="w-full border rounded-lg p-2.5 text-sm" onchange="updatePayrollReport()"></div><div><label class="block text-sm font-medium">${t('reports.searchWorker')}</label><input type="text" id="payroll-worker-search" class="w-full border rounded-lg p-2.5 text-sm" placeholder="${t('reports.searchWorker')}" oninput="updatePayrollReport()"></div></div><div id="payroll-summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div><div id="payroll-table-container" class="bg-white rounded-2xl border overflow-hidden shadow-sm"></div><div class="flex gap-3 justify-end"><button onclick="exportPayrollReport('csv')" class="px-6 py-2 bg-emerald-600 text-white rounded-xl">${t('reports.exportCSV')}</button><button onclick="exportPayrollReport('print')" class="px-6 py-2 bg-slate-800 text-white rounded-xl">${t('reports.printPDF')}</button></div></div>`;}
window.updatePayrollReport=function(){
  const s=document.getElementById('payroll-start')?.value||'',e=document.getElementById('payroll-end')?.value||'',q=document.getElementById('payroll-worker-search')?.value?.toLowerCase()||'';
  let f=attendanceData.filter(a=>a.site_id===currentSiteId);
  if(s)f=f.filter(a=>a.date>=s);if(e)f=f.filter(a=>a.date<=e);if(q)f=f.filter(a=>a.name.toLowerCase().includes(q));
  const map={};f.forEach(r=>{const k=r.worker_id||r.id;if(!map[k])map[k]={name:r.name,role:r.role,dailyRate:r.daily_rate||0,days:[],totalPayable:0};map[k].days.push(r.date);map[k].totalPayable+=r.daily_rate||0;});
  const w=Object.values(map),tw=w.length,td=w.reduce((s,x)=>s+x.days.length,0),tp=w.reduce((s,x)=>s+x.totalPayable,0),ad=td>0?tp/td:0;
  const c=document.getElementById('payroll-summary-cards');if(c)c.innerHTML=`<div class="payroll-card bg-white rounded-2xl border p-4 shadow-sm"><p class="text-xs text-slate-500">${t('reports.totalWorkers')}</p><p class="text-2xl font-bold">${tw}</p></div><div class="payroll-card bg-white rounded-2xl border p-4 shadow-sm"><p class="text-xs text-slate-500">${t('reports.workerDays')}</p><p class="text-2xl font-bold">${td}</p></div><div class="payroll-card bg-white rounded-2xl border p-4 shadow-sm"><p class="text-xs text-slate-500">${t('reports.totalPayroll')}</p><p class="text-2xl font-bold text-emerald-600">${tp.toLocaleString()} RWF</p></div><div class="payroll-card bg-white rounded-2xl border p-4 shadow-sm"><p class="text-xs text-slate-500">${t('reports.avgDaily')}</p><p class="text-2xl font-bold">${ad.toLocaleString()} RWF</p></div>`;
  const tb=document.getElementById('payroll-table-container');if(tb){if(!w.length){tb.innerHTML=`<p class="p-4 text-slate-500">${t('common.noDataAvailable')}</p>`;return;}tb.innerHTML=`<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs"><tr><th class="px-3 py-2">${t('workers.fullName')}</th><th class="px-3 py-2">${t('workers.role')}</th><th class="px-3 py-2">${t('reports.workerDays')}</th><th class="px-3 py-2">${t('reports.totalPayroll')}</th></tr></thead><tbody>${w.map(x=>`<tr><td class="px-3 py-2 font-medium">${x.name}</td><td class="px-3 py-2">${x.role||'—'}</td><td class="px-3 py-2 text-center">${x.days.length}</td><td class="px-3 py-2 text-right font-semibold text-emerald-600">${x.totalPayable.toLocaleString()} RWF</td></tr>`).join('')}</tbody><tfoot class="bg-slate-50 font-bold"><tr><td colspan="2" class="px-3 py-2">Total</td><td class="px-3 py-2 text-center">${td}</td><td class="px-3 py-2 text-right">${tp.toLocaleString()} RWF</td></tr></tfoot></table></div>`;}
};

function renderProfileSection(){const p=managerProfile||{};const photo=p.profile_picture||PLACEHOLDER_IMG;return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:person-outline" class="text-emerald-600"></iconify-icon> ${t('settings.profileInfo')}</h3><form id="profile-form" onsubmit="handleProfileSave(event)"><div class="field-group text-center"><div class="profile-avatar-wrapper"><img id="settings-profile-photo-img" src="${photo}"><label class="change-photo-btn" title="${t('settings.changePhoto')}"><iconify-icon icon="material-symbols:photo-camera" width="20"></iconify-icon><input type="file" id="settings-profile-photo-input" accept="image/*" style="display:none;" onchange="previewProfilePhoto(event)"></label></div><button type="button" id="settings-remove-photo-btn" class="remove-photo-btn mt-2" onclick="removeProfilePhoto()">${t('settings.removePhoto')}</button></div><div class="field-group"><label for="settings-full-name">${t('settings.fullName')}</label><input type="text" id="settings-full-name" value="${p.full_name||''}"></div><div class="field-group"><label for="settings-phone">${t('settings.phone')}</label><input type="tel" id="settings-phone" value="${p.phone||''}"></div><div class="field-group"><label for="settings-email">${t('settings.email')}</label><input type="email" id="settings-email" value="${p.email||''}"></div><button type="submit" class="save-btn">${t('settings.saveProfile')}</button></form></div>`;}
function renderAccountSection(){const p=managerProfile||{};return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:account-box-outline" class="text-emerald-600"></iconify-icon> ${t('settings.accountInfo')}</h3><div class="field-group"><label>${t('settings.accountName')}</label><div class="readonly-field">${p.full_name||'N/A'}</div></div><div class="field-group"><label>${t('settings.role')}</label><div class="readonly-field">${p.role||'Manager'}</div></div><div class="field-group"><label>${t('settings.email')}</label><div class="readonly-field">${p.email||'N/A'}</div></div><div class="field-group"><label>${t('settings.phone')}</label><div class="readonly-field">${p.phone||'N/A'}</div></div><div class="field-group"><label>${t('settings.accountStatus')}</label><div class="readonly-field">${p.status||t('settings.active')}</div></div><div class="field-group"><label>${t('settings.memberSince')}</label><div class="readonly-field">${formatDate(p.created_at)}</div></div></div>`;}
function renderSecuritySection(){return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:lock-outline" class="text-emerald-600"></iconify-icon> ${t('settings.changePassword')}</h3><form id="security-form" onsubmit="handlePasswordChange(event)"><div class="field-group"><label for="current-password">${t('settings.currentPassword')}</label><input type="password" id="current-password" required></div><div class="field-group"><label for="new-password">${t('settings.newPassword')}</label><input type="password" id="new-password" required minlength="6"></div><div class="field-group"><label for="confirm-password">${t('settings.confirmPassword')}</label><input type="password" id="confirm-password" required></div><button type="submit" class="save-btn">${t('settings.changePassBtn')}</button></form></div>`;}
function renderPreferencesSection(){const p=managerProfile||{},pr=p.preferences||{};return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:settings-outline" class="text-emerald-600"></iconify-icon> ${t('settings.preferences')}</h3><form id="preferences-form" onsubmit="handlePreferencesSave(event)"><div class="field-group"><label for="settings-language">${t('settings.language')}</label><select id="settings-language"><option value="en" ${pr.language==='en'?'selected':''}>English</option><option value="fr" ${pr.language==='fr'?'selected':''}>French</option><option value="rw" ${pr.language==='rw'?'selected':''}>Kinyarwanda</option></select></div><div class="field-group"><label for="settings-currency">${t('settings.currency')}</label><select id="settings-currency"><option value="RWF" ${pr.currency==='RWF'?'selected':''}>RWF</option><option value="USD" ${pr.currency==='USD'?'selected':''}>USD</option><option value="EUR" ${pr.currency==='EUR'?'selected':''}>EUR</option></select></div><div class="field-group"><label for="settings-date-format">${t('settings.dateFormat')}</label><select id="settings-date-format"><option value="DD/MM/YYYY" ${pr.dateFormat==='DD/MM/YYYY'?'selected':''}>DD/MM/YYYY</option><option value="MM/DD/YYYY" ${pr.dateFormat==='MM/DD/YYYY'?'selected':''}>MM/DD/YYYY</option><option value="YYYY-MM-DD" ${pr.dateFormat==='YYYY-MM-DD'?'selected':''}>YYYY-MM-DD</option></select></div><div class="field-group flex items-center gap-3"><input type="checkbox" id="settings-notifications" class="w-5 h-5 text-emerald-600" ${pr.notifications!==false?'checked':''}><label for="settings-notifications" class="mb-0">${t('settings.notifications')}</label></div><button type="submit" class="save-btn">${t('settings.savePrefs')}</button></form></div>`;}
function populateSettingsForms(){const p=managerProfile||{};const n=document.getElementById('settings-full-name');if(n)n.value=p.full_name||'';const ph=document.getElementById('settings-phone');if(ph)ph.value=p.phone||'';const em=document.getElementById('settings-email');if(em)em.value=p.email||'';const img=document.getElementById('settings-profile-photo-img');if(img)img.src=p.profile_picture||PLACEHOLDER_IMG;}
function attachSettingsChangeListeners(){document.querySelectorAll('#settings-profile input, #settings-preferences input, #settings-preferences select, #settings-security input').forEach(el=>{el.addEventListener('input',()=>{if(!hasUnsavedChanges)hasUnsavedChanges=true;});el.addEventListener('change',()=>{if(!hasUnsavedChanges)hasUnsavedChanges=true;});});}

window.showSection=function(section){
  if(currentSection==='settings'&&hasUnsavedChanges){if(!confirm(t('common.areYouSure')))return;hasUnsavedChanges=false;}
  currentSection=section;clearError();
  document.getElementById('page-title').textContent=t(`navigation.${section}`)||section;
  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
  document.querySelector(`[data-section="${section}"]`)?.classList.add('active');
  document.querySelectorAll('#bottom-nav a').forEach(a=>a.classList.remove('active'));
  document.querySelector(`#bottom-nav a[data-section="${section}"]`)?.classList.add('active');
  const c=document.getElementById('content-area');c.innerHTML='';
  try{
    switch(section){
      case 'dashboard':renderDashboard(c);break;
      case 'materials':renderMaterials(c);break;
      case 'stock':renderStock(c);break;
      case 'workers':renderWorkers(c);break;
      case 'progress':renderProgress(c);break;
      case 'reports':renderReports(c);break;
      case 'gallery':renderGallery(c);break;
      case 'settings':renderSettings(c);break;
      default:renderDashboard(c);
    }
  }catch(err){console.error('Render error:',err);c.innerHTML=`<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-red-800 max-w-2xl mx-auto mt-10"><p class="font-semibold">⚠️ Something went wrong</p><p class="text-sm mt-1">${err.message}</p></div>`;}
  if(window.innerWidth<1024){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebar-overlay').classList.add('hidden');}
};
window.closeModal=function(){document.getElementById('modal-overlay').classList.remove('active');};
window.openModal=function(title,bodyHTML){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=bodyHTML;document.getElementById('modal-overlay').classList.add('active');};
window.toggleSidebar=function(){document.getElementById('sidebar').classList.toggle('-translate-x-full');document.getElementById('sidebar-overlay').classList.toggle('hidden');};

function updateProfileUI(p){
  if(!p)return;const name=p.full_name||'Manager',email=p.email||'',photo=p.profile_picture||'';
  const ai=document.getElementById('sidebar-user-avatar-img'),at=document.getElementById('user-avatar-text');
  if(photo){ai.src=photo;ai.style.display='block';at.style.display='none';}
  else{ai.style.display='none';at.style.display='flex';at.textContent=name.charAt(0).toUpperCase();}
  document.getElementById('user-name').textContent=name;
  document.getElementById('user-email').textContent=email;
}
function attachListeners(){
  unsubscribeSnapshots.forEach(fn=>{try{fn();}catch(_){}});
  unsubscribeSnapshots=[];
  if(!currentSiteId)return;
  const sid=currentSiteId;
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'materials'),where('site_id','==',sid)),s=>{materialsData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection();}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'site_workers'),where('site_id','==',sid)),s=>{siteWorkersData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection();}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'progress_tasks'),where('site_id','==',sid)),s=>{progressTasks=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection();}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'worker_positions'),where('site_id','in',[sid,'all'])),s=>{workerPositions=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection();}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'gallery'),where('site_id','==',sid)),s=>{galleryData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection();}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'worker_attendance'),where('site_id','==',sid)),s=>{attendanceData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection();}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'stock'),where('site_id','==',sid)),s=>{stockData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection();}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'stock_transactions'),where('site_id','==',sid),orderBy('created_at','desc')),s=>{stockTransactions=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection();}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'requisitions'),where('requested_by','==',currentUser.uid)),s=>{requisitionsData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection();}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'requisition_items'),where('requested_by','==',currentUser.uid)),s=>{requisitionItemsData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection();}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'requisition_history'),where('requested_by','==',currentUser.uid),orderBy('timestamp','desc')),s=>{requisitionHistoryData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection();}));
}
function refreshCurrentSection(){
  if(window._refreshing)return;window._refreshing=true;
  requestAnimationFrame(()=>{if(currentUser&&currentSiteId)showSection(currentSection);window._refreshing=false;});
}
window.switchSite=function(id){currentSiteId=id;attachListeners();showSection(currentSection);};

// ============================================================
// 17. INIT — run directly (module scripts execute after DOM parse)
// ============================================================
function initLanguage(){
  document.querySelectorAll('.lang-btn').forEach(b=>{
    const a=b.dataset.language===currentLanguage;
    b.classList.toggle('active',a);b.setAttribute('aria-pressed',a.toString());
  });
  document.documentElement.lang=currentLanguage;
  applyTranslations();
}
async function initApp(){
  initLanguage();
  onAuthStateChanged(auth,async(user)=>{
    if(!user){window.location.href='../manager.html';return;}
    currentUser=user;
    try{
      const pref=doc(db,'profiles',user.uid);
      const snap=await getDoc(pref);
      if(!snap.exists()||snap.data().role!=='manager'){await signOut(auth);window.location.href='../manager.html';return;}
      managerProfile=snap.data();
      updateProfileUI(managerProfile);
      onSnapshot(pref,s=>{if(s.exists()){managerProfile=s.data();updateProfileUI(managerProfile);if(currentSection==='settings')populateSettingsForms();}});
      let ids=[];
      if(managerProfile.assigned_sites&&Array.isArray(managerProfile.assigned_sites))ids=managerProfile.assigned_sites;
      else if(managerProfile.assigned_site)ids=[managerProfile.assigned_site];
      if(ids.length){
        const snaps=await Promise.all(ids.map(id=>getDoc(doc(db,'sites',id))));
        assignedSites=snaps.filter(s=>s.exists()).map(s=>({id:s.id,...s.data()}));
        if(assignedSites.length){
          currentSiteId=assignedSites[0].id;
          const sel=document.getElementById('site-selector');
          if(assignedSites.length>1){sel.classList.remove('hidden');sel.innerHTML=assignedSites.map(s=>`<option value="${s.id}" ${s.id===currentSiteId?'selected':''}>${s.name}</option>`).join('');}
          else{sel.classList.add('hidden');}
          attachListeners();
        }
      }
      showSection('dashboard');
    }catch(err){console.error('Init error:',err);showError('Failed to initialize: '+err.message);}
  });
}
// Run directly - module scripts are deferred so DOM is ready
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
}else{
  initApp();
}
console.log('✅ SHDR Manager Dashboard loaded');
