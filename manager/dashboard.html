<style>
*{font-family:'Plus Jakarta Sans',sans-serif}
body{background:#f8fafc}
.sidebar-link.active{background:#ecfdf5;color:#059669;border-left:3px solid #059669}
.stat-card{transition:all .2s ease}.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,.05)}
.modal{display:none}.modal.active{display:flex}
.spinner{border:3px solid #e2e8f0;border-top:3px solid #059669;border-radius:50%;width:24px;height:24px;animation:spin .8s linear infinite}
.btn-spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top:2px solid #fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;z-index:40;justify-content:space-around;padding:8px 0;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;font-size:.6rem;color:#6b7280;text-decoration:none;padding:4px 8px;border-radius:8px;transition:.2s}
.bottom-nav a.active{color:#059669;background:#ecfdf5}.bottom-nav a iconify-icon{font-size:1.3rem}
@media (max-width:1023px){.bottom-nav{display:flex}main{padding-bottom:80px}}
@media (max-width:640px){#content-area{padding:1rem}.stat-card{padding:1rem}}
.tab-active{background:#059669;color:#fff}.tab-inactive{background:#f1f5f9;color:#334155}.tab-inactive:hover{background:#e2e8f0}
.report-tab-active{background:#059669;color:#fff}.report-tab-inactive{background:#f1f5f9;color:#334155}.report-tab-inactive:hover{background:#e2e8f0}
.stock-status-normal{background:#dcfce7;color:#166534}.stock-status-low{background:#fef9c3;color:#854d0e}.stock-status-out{background:#fee2e2;color:#991b1b}
.language-switcher{display:flex;align-items:center;background:rgba(30,86,160,.1);border:1px solid rgba(30,86,160,.2);border-radius:50px;padding:4px}
.lang-btn{background:transparent;border:2px solid transparent;color:#64748b;font-size:14px;font-weight:700;padding:6px 16px;border-radius:50px;cursor:pointer;transition:all .3s ease;outline:none}
.lang-btn.active{background:#fff;color:#1e56a0;border-color:#1e56a0}
@media (max-width:640px){.lang-btn{font-size:12px;padding:4px 10px}}
.settings-tab-btn{transition:all .2s}.settings-tab-btn.active{background:#059669;color:#fff}
.settings-section{display:none}.settings-section.active{display:block}
.profile-avatar-wrapper{position:relative;width:120px;height:120px;margin:0 auto}
.profile-avatar-wrapper img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.profile-avatar-wrapper .change-photo-btn{position:absolute;bottom:4px;right:4px;background:#059669;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff}
.settings-card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.settings-card h3{font-weight:600;font-size:1.1rem;color:#1e293b;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.settings-card .field-group{margin-bottom:1.25rem}
.settings-card label{display:block;font-size:.85rem;font-weight:500;color:#475569;margin-bottom:.3rem}
.settings-card input,.settings-card select{width:100%;padding:.6rem .75rem;border:1px solid #d1d5db;border-radius:8px;font-size:.95rem;background:#fff}
.settings-card input:focus,.settings-card select:focus{outline:none;border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.2)}
.settings-card .readonly-field{background:#f1f5f9;color:#475569;padding:.6rem .75rem;border-radius:8px;font-size:.95rem}
.settings-card .save-btn{background:#059669;color:#fff;padding:.6rem 1.5rem;border-radius:8px;font-weight:600;border:none;cursor:pointer}
.settings-card .save-btn:disabled{opacity:.6;cursor:not-allowed}
.settings-card .remove-photo-btn{color:#ef4444;font-size:.85rem;cursor:pointer;background:none;border:none}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.20);transform:translateY(80px);opacity:0;transition:all .4s ease;z-index:999;max-width:400px;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateY(0);opacity:1}.toast.success{border-left:4px solid #059669}.toast.error{border-left:4px solid #ef4444}.toast.info{border-left:4px solid #3b82f6}
.usage-material-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.75rem;max-height:340px;overflow-y:auto;padding:.25rem}
.usage-material-grid .mat-card{border:2px solid #e5e7eb;border-radius:12px;padding:12px 8px;background:#fff;cursor:pointer;transition:all .15s ease;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;user-select:none;position:relative;min-height:80px;justify-content:center}
.usage-material-grid .mat-card:hover{border-color:#9ca3af;transform:translateY(-2px)}
.usage-material-grid .mat-card .mat-icon{font-size:1.8rem;line-height:1.2}
.usage-material-grid .mat-card .mat-name{font-weight:700;font-size:.8rem;color:#1e293b;text-transform:uppercase}
.usage-material-grid .mat-card .mat-unit{font-size:.65rem;color:#94a3b8}
.usage-material-grid .mat-card .check-indicator{position:absolute;top:4px;right:6px;color:#059669;font-size:1rem;font-weight:700;opacity:0}
.usage-material-grid .mat-card.selected{border-color:#059669;background:#f0fdf4;box-shadow:0 4px 12px rgba(5,150,105,.10)}
.usage-material-grid .mat-card.selected .check-indicator{opacity:1}
.usage-entries-table th{background:#f8fafc;font-weight:600;font-size:.7rem;text-transform:uppercase;color:#475569;padding:.5rem .75rem;text-align:left;border-bottom:2px solid #e5e7eb}
.usage-entries-table td{padding:.5rem .75rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.usage-entries-table input{border:1px solid #e2e8f0;border-radius:6px;padding:4px 8px;width:100%;font-size:.85rem;background:#fff}
.usage-entries-table input:focus{border-color:#059669;outline:none;box-shadow:0 0 0 3px rgba(5,150,105,.15)}
.usage-entries-table .remove-btn{color:#94a3b8;background:none;border:none;cursor:pointer;padding:4px}
.usage-entries-table .remove-btn:hover{color:#dc2626}
.usage-total-card{background:linear-gradient(135deg,#ecfdf5 0%,#d1fae5 100%);border:2px solid #059669;border-radius:16px;padding:1.25rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.usage-total-card .total-amount{font-size:1.8rem;font-weight:800;color:#065f46}
.usage-empty-state{display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;color:#94a3b8}
.usage-empty-state iconify-icon{font-size:3rem;margin-bottom:.5rem;opacity:.5}
.usage-save-btn{background:#059669;color:#fff;padding:14px 32px;border-radius:12px;font-weight:700;font-size:1rem;border:none;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.usage-save-btn:hover{background:#047857}.usage-save-btn:disabled{opacity:.6;cursor:not-allowed}
.usage-photo-preview{width:100%;max-height:220px;object-fit:contain;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc}
.req-filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:#f8fafc;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:16px}
.req-filter-bar input,.req-filter-bar select{border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:.85rem;background:#fff;outline:none}
.req-filter-bar input:focus,.req-filter-bar select:focus{border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.15)}
.req-table th{background:#059669;color:#fff;font-weight:600;font-size:.75rem;text-transform:uppercase;padding:10px 12px;text-align:left;white-space:nowrap}
.req-table td{padding:10px 12px;border-bottom:1px solid #e5e7eb;font-size:.85rem;vertical-align:top}
.req-table tr:nth-child(even){background:#f9fafb}
.req-table tr:hover{background:#f1f5f9}
.req-status-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
.req-status-Pending{background:#fef3c7;color:#92400e}
.req-status-Approved{background:#dbeafe;color:#1e40af}
.req-status-Rejected{background:#fee2e2;color:#991b1b}
.req-status-Supplied{background:#d1fae5;color:#065f46}
.req-status-Partially{background:#fef9c3;color:#854d0e}
.img-upload-area{border:2px dashed #cbd5e1;border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;background:#f8fafc}
.img-upload-area:hover{border-color:#059669;background:#f0fdf4}
.img-upload-area input{display:none}
.img-preview-wrap{position:relative;display:inline-block;max-width:100%}
.img-preview-wrap img{max-width:100%;max-height:220px;border-radius:12px;object-fit:cover;border:1px solid #e2e8f0}
.img-preview-wrap .remove-img-btn{position:absolute;top:6px;right:6px;background:rgba(220,38,38,.9);color:#fff;border:none;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
@media (max-width:640px){.usage-material-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.usage-material-grid .mat-card{padding:8px 4px;min-height:70px}}
</style>
</head>

function formatDate(v){if(!v)return '—';const d=typeof v==='string'?new Date(v):v;if(isNaN(d.getTime()))return '—';const l={en:'en-US',rw:'rw-RW',fr:'fr-FR'};return new Intl.DateTimeFormat(l[currentLanguage],{year:'numeric',month:'long',day:'numeric'}).format(d)}
function formatDateShort(v){if(!v)return '—';const d=typeof v==='string'?new Date(v):v;if(isNaN(d.getTime()))return '—';return d.toISOString().split('T')[0]}

function getTodayISO(){return new Date().toISOString().split('T')[0]}
function calculateTotal(q,u){return (q||0)*(u||0)}
function toNumber(v,f=0){const n=Number(v);return Number.isFinite(n)?n:f}
function formatRWF(v){return toNumber(v).toLocaleString('en-RW',{minimumFractionDigits:0,maximumFractionDigits:0})+' RWF'}
function normalizeName(n){return String(n||'').trim().replace(/\s+/g,' ').toLowerCase()}
function cleanName(n){return String(n||'').trim().replace(/\s+/g,' ')}
function getStockByName(sid,name){const n=normalizeName(name);return stockData.find(s=>s.site_id===sid&&normalizeName(s.material_name)===n)||null}
function getStockUnitCost(s){return s?toNumber(s.unit_cost):0}
function getStockQuantity(s){return s?toNumber(s.quantity):0}
function getStockUnit(s){return s?s.unit||'units':'units'}
function getMaterialById(id){return materialsData.find(m=>m.id===id)||null}
function getStockById(id){return stockData.find(s=>s.id===id)||null}
function generateBatchNumber(){const y=new Date().getFullYear();const c=materialsData.filter(m=>m.batch_number&&m.batch_number.startsWith(`SHDR-USAGE-${y}-`)).length;return `SHDR-USAGE-${y}-${String(c+1).padStart(4,'0')}`}

window.exportGeneralReport = (format) => {
  const siteId = document.getElementById('report-site').value;
  const dept = document.getElementById('report-dept').value;
  const startDate = document.getElementById('report-start').value;
  const endDate = document.getElementById('report-end').value;
  const company = getCompanyDetails();
  const getSiteName = (id) => assignedSites.find(s=>s.id===id)?.name || 'Unknown';
  const data = [];

  if (dept === 'all' || dept === 'materials'){
    let mats = siteId !== 'all' ? materialsData.filter(m=>m.site_id===siteId) : materialsData;
    if (startDate) mats = mats.filter(m => (m.date_used || m.created_at || '').slice(0,10) >= startDate);
    if (endDate) mats = mats.filter(m => (m.date_used || m.created_at || '').slice(0,10) <= endDate);
    data.push(...mats.map(m => ({
      Department:'Materials', Site:getSiteName(m.site_id), Name:m.name,
      Quantity:m.quantity_used||0, 'Unit Cost':m.unit_cost||0,
      Total:calculateTotal(m.quantity_used||0,m.unit_cost||0),
      Date: formatDate(m.date_used || m.created_at)
    })));
  }
  if (dept === 'all' || dept === 'workers'){
    let ws = siteId !== 'all' ? siteWorkersData.filter(w=>w.site_id===siteId) : siteWorkersData;
    data.push(...ws.map(w => ({
      Department:'Workers', Site:getSiteName(w.site_id), Name:w.name,
      Role:w.role||'', Salary:w.salary||0, Phone:w.phone||''
    })));
  }

  if (!data.length){ alert(t('common.noDataAvailable')); return; }
  const siteLabel = siteId === 'all' ? t('reports.allSites') : (assignedSites.find(s=>s.id===siteId)?.name || 'Site');
  const deptLabel = dept === 'all' ? t('reports.allDepartments') : dept.charAt(0).toUpperCase()+dept.slice(1);
  const generatedDate = new Date().toLocaleString();
  const filename = `SHDR_${siteLabel.replace(/\s/g,'_')}_${deptLabel.replace(/\s/g,'_')}_${new Date().toISOString().slice(0,10)}`;

  if (format === 'csv'){
    const headers = Object.keys(data[0]);
    const csvRows = [
      `"${company.name}"`,`"${company.address}"`,`"${company.location}"`,`"${company.city}"`,
      `"Tel: ${company.phone}"`,`"Email: ${company.email}"`,`"Generated: ${generatedDate}"`,
      `"Report: ${siteLabel}"`,`"Department: ${deptLabel}"`,'',headers.join(',')
    ];
    for (const row of data) csvRows.push(headers.map(h=>`"${String(row[h] ?? '').replace(/"/g,'""')}"`).join(','));
    const csv = csvRows.join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${filename}.csv`; a.click();
    URL.revokeObjectURL(url);
    return;
  }
  const headers = Object.keys(data[0]);
  const tableRows = data.map(row=>`<tr>${headers.map(h=>`<td>${row[h] ?? ''}</td>`).join('')}</tr>`).join('');
  const meta = `<strong>${t('reports.labels.siteName')}:</strong> ${siteLabel} &nbsp;|&nbsp; <strong>${t('reports.labels.department')}:</strong> ${deptLabel}<br><strong>${t('reports.generated')}:</strong> ${generatedDate}`;
  const bodyHTML = `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${tableRows}</tbody></table>`;
  const fullHTML = generateReportHTML(t('reports.reportTitles.general'), bodyHTML, meta);
  const win = window.open('', '_blank', 'width=1000,height=700');
  if (!win){ alert(t('common.accessDenied')); return; }
  win.document.write(fullHTML); win.document.close();
  setTimeout(()=>win.print(), 500);
};

function isRecordPaid(rec){
  if (!rec) return false;
  if (rec.payment_status === 'paid' || rec.paid === true || rec.is_paid === true) return true;
  return false;
}

function buildPayrollDataset(){
  const siteId = document.getElementById('payroll-site')?.value || 'all';
  const startDate = document.getElementById('payroll-start')?.value || '';
  const endDate = document.getElementById('payroll-end')?.value || '';
  const search = (document.getElementById('payroll-worker-search')?.value || '').toLowerCase();
  const position = document.getElementById('payroll-position')?.value || 'all';
  const status = document.getElementById('payroll-status')?.value || 'all';

  let filtered = attendanceData.slice();
  if (siteId !== 'all') filtered = filtered.filter(a=>a.site_id===siteId);
  if (startDate) filtered = filtered.filter(a=>(a.date||'').slice(0,10) >= startDate);
  if (endDate) filtered = filtered.filter(a=>(a.date||'').slice(0,10) <= endDate);
  if (search) filtered = filtered.filter(a=>(a.name||'').toLowerCase().includes(search));
  if (position !== 'all') filtered = filtered.filter(a=>a.role === position);
  if (status === 'paid') filtered = filtered.filter(isRecordPaid);
  else if (status === 'unpaid') filtered = filtered.filter(r => !isRecordPaid(r));

  const map = {};
  filtered.forEach(rec=>{
    const key = rec.worker_id || rec.name;
    if (!map[key]) map[key] = { id:key, name:rec.name, role:rec.role||'', dailyRate:rec.daily_rate||0, days:[], totalPayable:0 };
    map[key].days.push(rec.date);
    map[key].totalPayable += (rec.daily_rate || 0);
    if (rec.daily_rate) map[key].dailyRate = rec.daily_rate;
  });
  const workers = Object.values(map);
  const totalWorkers = workers.length;
  const totalDays = workers.reduce((s,w)=>s+w.days.length,0);
  const totalPayroll = workers.reduce((s,w)=>s+w.totalPayable,0);
  const avgDaily = totalDays > 0 ? totalPayroll / totalDays : 0;
  return { workers, totalWorkers, totalDays, totalPayroll, avgDaily, siteId, startDate, endDate, position, status };
}

  let mats = materialsData.slice();

  if (endDate) mats = mats.filter(m => (m.date_used || m.created_at || '').slice(0,10) <= endDate);
  mats = mats.slice().sort((a,b)=> new Date(b.date_used||b.created_at||0) - new Date(a.date_used||a.created_at||0));

    Total: calculateTotal(m.quantity_used||0, m.unit_cost||0)

function drawPdfHeader(doc, company, model){
  const W = doc.internal.pageSize.getWidth();

  let headerTop = 10;

  doc.text('Construction Management System', 14, headerTop+12);
  doc.setFontSize(7.5); doc.setTextColor(100,100,100);
  doc.text(`${company.address} | ${company.location}`, 14, headerTop+16.5);
  doc.text(`${company.city} | Tel: ${company.phone}`, 14, headerTop+20);
  doc.text(`Email: ${company.email}`, 14, headerTop+23.5);
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(20,20,20);
  doc.text(model.title, W-14, headerTop+7, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(100,100,100);
  doc.text('Official Company Report', W-14, headerTop+12, {align:'right'});
  doc.setDrawColor(5,150,105); doc.setLineWidth(0.5);
  doc.line(14, headerTop+27, W-14, headerTop+27);
  let y = headerTop + 33;
  const meta = [
    {label:'Manager', value: model.manager},
    {label:'Site', value: model.site},
    {label:'Generated', value: new Date().toLocaleString()}
  ];
  doc.setFontSize(8.5); doc.setTextColor(40,40,40);
  meta.forEach(m=>{
    doc.setFont('helvetica','bold'); doc.text(`${m.label}:`, 14, y);
    doc.setFont('helvetica','normal'); doc.text(String(m.value||'—'), 42, y);
    y += 4.5;
  });
  return y + 3;
}
function addPdfFooter(doc, company){
  const pages = doc.internal.getNumberOfPages();
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  for (let i=1; i<=pages; i++){
    doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(120,120,120);
    doc.text(`Generated by ${company.name} Management System on ${new Date().toLocaleString()}`, W/2, H-8, {align:'center'});
    doc.text(`Page ${i} of ${pages}`, W-14, H-8, {align:'right'});
  }
}

function buildRequisitionReportData(){
  const filters=_reqFilters;
  const rows=[];
  const reqs=requisitionsData.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  reqs.forEach(req=>{
    const items=requisitionItemsData.filter(i=>i.requisition_id===req.id);
    const site=assignedSites.find(s=>s.id===req.site_id);
    const siteName=site?site.name:'—';
    const reqDate=formatDateShort(req.request_date);
    const needDate=formatDateShort(req.required_date);
    const status=req.status||'Pending';
    if(filters.priority!=='all'&&req.priority!==filters.priority)return;
    if(filters.status!=='all'&&status!==filters.status)return;
    if(filters.dateFrom&&reqDate<filters.dateFrom)return;
    if(filters.dateTo&&reqDate>filters.dateTo)return;
    const reqBy=req.requested_by_name||'—';
    if(items.length===0){
      rows.push({reqId:req.requisition_number,reqDate,needDate,material:'—',unit:'—',qty:'0',priority:req.priority||'Normal',notes:req.notes||'',status,site:siteName,reqBy,raw:req});
    }else{
      items.forEach(it=>{
        const mat=cleanName(it.material_name||'—');
        if(filters.search){
          const q=filters.search.toLowerCase();
          const haystack=`${req.requisition_number} ${mat} ${siteName} ${reqBy} ${req.notes||''}`.toLowerCase();
          if(!haystack.includes(q))return;
        }
        rows.push({reqId:req.requisition_number,reqDate,needDate,material:mat,unit:it.unit||'—',qty:it.quantity_requested||0,priority:req.priority||'Normal',notes:req.notes||'',status,site:siteName,reqBy,raw:req});
      });
    }
  });
  if(filters.search){
    const q=filters.search.toLowerCase();
    return rows.filter(r=>`${r.reqId} ${r.material} ${r.site} ${r.reqBy} ${r.notes}`.toLowerCase().includes(q));
  }
  return rows;
}

function updateUsageEntries(){

  if(!e.length){c.innerHTML=`<div class="usage-empty-state"><iconify-icon icon="material-symbols:inbox-outline"></iconify-icon><p>${t('materials.selectMaterials')}</p></div>`;document.getElementById('usage-total-container').classList.add('hidden');return}

  e.forEach(([sid,d])=>{
    const q=toNumber(d.quantityUsed),uc=toNumber(d.unitCost),tot=q*uc;const inv=q>d.available&&d.available>0;

window.updateUsageRow=function(sid,field,value){

  else if(field==='notes')d.notes=value||'';
  _usageSelectedMaterials.set(sid,d);
  const q=toNumber(d.quantityUsed),uc=toNumber(d.unitCost);
  const cell=document.querySelector(`.usage-total-cell[data-stock-id="${sid}"] span`);if(cell)cell.textContent=formatRWF(q*uc);

};

function updateUsageTotal(){
  let total=0,hasValid=false;
  for(const[_,d]of _usageSelectedMaterials){const q=toNumber(d.quantityUsed),c=toNumber(d.unitCost);if(q>0&&c>=0&&q<=d.available){total+=q*c;hasValid=true}}
  const el=document.getElementById('usage-total-amount');if(el)el.textContent=formatRWF(total);
  const c=document.getElementById('usage-total-container');if(c){if(_usageSelectedMaterials.size===0||!hasValid)c.classList.add('hidden');else c.classList.remove('hidden')}
}
window.submitUsageBatch=async function(e){
  e.preventDefault();
  const btn=document.getElementById('usage-save-btn');setButtonLoading(btn,true);
  try{
    const date=document.getElementById('usage-date').value;
    if(!date){showToast(t('common.requiredField'),'error');setButtonLoading(btn,false);return}
    const valid=Array.from(_usageSelectedMaterials.entries()).filter(([_,d])=>toNumber(d.quantityUsed)>0);
    if(!valid.length){showToast(t('materials.selectAtLeastOneMaterial'),'error');setButtonLoading(btn,false);return}
    const errors=[],validated=[];
    for(const[sid,d]of valid){
      const q=toNumber(d.quantityUsed),c=toNumber(d.unitCost);
      if(q<=0){errors.push(`${d.materialName}: ${t('materials.quantityMustBePositive')}`);continue}
      if(c<0){errors.push(`${d.materialName}: ${t('materials.unitCostCannotBeNegative')}`);continue}
      if(q>d.available){errors.push(`${d.materialName}: ${t('materials.insufficientStock')}`);continue}
      const s=getStockById(sid);
      if(!s){errors.push(`${d.materialName}: ${t('materials.stockNotFound')}`);continue}
      const cur=getStockQuantity(s);
      if(q>cur){errors.push(`${d.materialName}: ${t('materials.insufficientStock')}`);continue}
      validated.push({stockId:sid,stockItem:s,materialName:d.materialName,quantityUsed:q,unit:d.unit,unitCost:c,totalAmount:q*c,notes:d.notes||'',previousQuantity:cur,newQuantity:cur-q});
    }
    if(errors.length){showToast('❌ '+errors.join('; '),'error');setButtonLoading(btn,false);return}
    let imageUrl='';
    if(_usagePhotoFile){imageUrl=await uploadImageToImgbb(_usagePhotoFile)}
    const batchNumber=generateBatchNumber();
    const now=new Date().toISOString();
    const batchTotal=validated.reduce((s,e)=>s+e.totalAmount,0);
    await runTransaction(db,async(tx)=>{
      const refs=validated.map(e=>doc(db,'stock',e.stockId));
      const snaps=await Promise.all(refs.map(r=>tx.get(r)));
      for(let i=0;i<validated.length;i++){
        const e=validated[i],snap=snaps[i];
        if(!snap.exists())throw new Error(`${e.materialName}: ${t('materials.stockNotFound')}`);
        const cur=toNumber(snap.data().quantity);
        if(e.quantityUsed>cur)throw new Error(`${e.materialName}: ${t('materials.insufficientStock')}`);
        e.previousQuantity=cur;e.newQuantity=cur-e.quantityUsed;
      }
      const batchRef=doc(collection(db,'material_usage_batches'));
      tx.set(batchRef,{batch_number:batchNumber,site_id:currentSiteId,usage_date:date,total_amount:batchTotal,item_count:validated.length,image:imageUrl||'',recorded_by:currentUser.uid,recorded_by_name:managerProfile?.full_name||'Manager',created_at:now,updated_at:now});
      for(const e of validated){
        const uRef=doc(collection(db,'materials'));
        tx.set(uRef,{site_id:currentSiteId,name:e.materialName,quantity_used:e.quantityUsed,unit:e.unit,unit_cost:e.unitCost,total_amount:e.totalAmount,notes:e.notes,date_used:date,batch_number:batchNumber,stock_id:e.stockId,image:imageUrl||'',recorded_by:currentUser.uid,created_at:now,updated_at:now});
        tx.update(doc(db,'stock',e.stockId),{quantity:e.newQuantity,unit_cost:e.unitCost,updated_at:now});
        const tRef=doc(collection(db,'stock_transactions'));
        tx.set(tRef,{site_id:currentSiteId,stock_id:e.stockId,material_name:e.materialName,transaction_type:'MATERIAL_USAGE',quantity:e.quantityUsed,quantity_change:-e.quantityUsed,previous_quantity:e.previousQuantity,new_quantity:e.newQuantity,unit:e.unit,unit_cost:e.unitCost,total_value:e.totalAmount,batch_number:batchNumber,notes:e.notes||'Material used',recorded_by:currentUser.uid,created_at:now});
      }
    });
    _usagePhotoFile=null;closeModal();
    showToast(`✅ ${t('materials.batchSaved')} (${batchNumber})`,'success');
  }catch(err){console.error(err);showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};

window.handleEditMaterial=async function(e,id){
  e.preventDefault();
  const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);
  try{
    const newQ=parseFloat(document.getElementById('em-qty').value)||0;
    const newC=parseFloat(document.getElementById('em-cost').value)||0;
    const notes=document.getElementById('em-notes').value.trim();
    const m=getMaterialById(id);
    if(!m)throw new Error('Material record not found');
    const oldQ=toNumber(m.quantity_used);
    const delta=newQ-oldQ;
    const siteId=m.site_id;
    const stockItem = m.stock_id ? stockData.find(s=>s.id===m.stock_id) : getStockByName(siteId, m.name);
    const now=new Date().toISOString();
    if(stockItem && delta!==0){
      await runTransaction(db, async(tx)=>{
        const sRef=doc(db,'stock',stockItem.id);
        const sSnap=await tx.get(sRef);
        if(sSnap.exists()){
          const cur=toNumber(sSnap.data().quantity);
          const newStock=cur-delta;
          if(newStock<0)throw new Error(t('materials.insufficientStock'));
          const updatePayload={quantity:newStock,updated_at:now};
          if(newC>0)updatePayload.unit_cost=newC;
          tx.update(sRef,updatePayload);
          const tRef=doc(collection(db,'stock_transactions'));
          tx.set(tRef,{site_id:siteId,stock_id:stockItem.id,material_name:m.name,transaction_type:'MATERIAL_USAGE_EDITED',quantity:Math.abs(delta),quantity_change:-delta,previous_quantity:cur,new_quantity:newStock,unit:m.unit||getStockUnit(stockItem),unit_cost:newC,notes:`Usage edited from ${oldQ} to ${newQ}`,recorded_by:currentUser.uid,created_at:now});
        }
        tx.update(doc(db,'materials',id),{quantity_used:newQ,unit_cost:newC,notes,updated_at:now});
      });
    }else{
      await updateDoc(doc(db,'materials',id),{quantity_used:newQ,unit_cost:newC,notes,updated_at:now});
    }
    closeModal();showToast(t('common.updatedSuccessfully'),'success');
  }catch(err){console.error('Material edit failed:',err);showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};
window.deleteMaterial=async function(id){
  if(!confirm(t('common.areYouSure')+' '+t('common.cannotUndo')))return;
  try{
    const m=getMaterialById(id);
    if(!m){ await deleteDoc(doc(db,'materials',id)); showToast(t('common.deletedSuccessfully'),'success'); return; }
    const siteId=m.site_id;
    const qty=toNumber(m.quantity_used);
    const stockItem = m.stock_id ? stockData.find(s=>s.id===m.stock_id) : getStockByName(siteId, m.name);
    const now=new Date().toISOString();
    if(stockItem && qty>0){
      await runTransaction(db, async(tx)=>{
        const sRef=doc(db,'stock',stockItem.id);
        const sSnap=await tx.get(sRef);
        if(sSnap.exists()){
          const cur=toNumber(sSnap.data().quantity);
          const newStock=cur+qty;
          tx.update(sRef,{quantity:newStock,updated_at:now});
          const tRef=doc(collection(db,'stock_transactions'));
          tx.set(tRef,{site_id:siteId,stock_id:stockItem.id,material_name:m.name,transaction_type:'MATERIAL_USAGE_DELETED',quantity:qty,quantity_change:qty,previous_quantity:cur,new_quantity:newStock,unit:m.unit||getStockUnit(stockItem),unit_cost:toNumber(m.unit_cost),notes:`Material usage deleted — stock restored`,recorded_by:currentUser.uid,created_at:now});
        }
        tx.delete(doc(db,'materials',id));
      });
    }else{
      await deleteDoc(doc(db,'materials',id));
    }
    showToast(t('common.deletedSuccessfully'),'success');
  }catch(err){console.error('Material delete failed:',err);showToast(err.message||t('common.somethingWentWrong'),'error')}
};

function renderRequisitionsList(){
  const allReqs=requisitionsData.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(!allReqs.length)return `<div class="bg-white rounded-2xl border p-8 text-center"><iconify-icon icon="material-symbols:assignment-outline" class="text-5xl text-slate-300 mb-3"></iconify-icon><p class="text-slate-500">${t('materials.noRequisitions')}</p></div>`;
  const f=_reqFilters;
  const filtered=allReqs.filter(req=>{
    if(f.priority!=='all'&&req.priority!==f.priority)return false;
    if(f.status!=='all'&&(req.status||'Pending')!==f.status)return false;
    const reqDate=formatDateShort(req.request_date);
    if(f.dateFrom&&reqDate<f.dateFrom)return false;
    if(f.dateTo&&reqDate>f.dateTo)return false;
    if(f.search){
      const q=f.search.toLowerCase();
      const items=requisitionItemsData.filter(i=>i.requisition_id===req.id);
      const site=assignedSites.find(s=>s.id===req.site_id);
      const haystack=`${req.requisition_number} ${req.requested_by_name||''} ${req.notes||''} ${site?site.name:''} ${items.map(i=>i.material_name).join(' ')}`.toLowerCase();
      if(!haystack.includes(q))return false;
    }
    return true;
  });
  let h=`
    <div class="req-filter-bar">
      <input type="text" id="req-search" placeholder="${t('materials.search')}" value="${f.search}" oninput="updateReqFilter('search',this.value)" class="flex-1 min-w-[180px]">
      <select id="req-priority-filter" onchange="updateReqFilter('priority',this.value)">
        <option value="all" ${f.priority==='all'?'selected':''}>${t('materials.allPriorities')}</option>
        <option value="Normal" ${f.priority==='Normal'?'selected':''}>${t('materials.normal')}</option>

      <div class="px-4 py-2 text-xs text-slate-500 border-b">${filtered.length} requisitions</div>
      <div class="overflow-x-auto">
        <table class="w-full req-table">
          <thead><tr>
            <th>${t('materials.reqNumber')}</th><th>${t('materials.requestDate')}</th><th>${t('materials.requiredDate')}</th><th>${t('materials.material')}</th><th>${t('materials.unit')}</th><th style="text-align:right">${t('materials.requestedQty')}</th><th>${t('materials.priority')}</th><th>${t('materials.status')}</th><th>${t('materials.site')}</th><th>${t('materials.requestedBy')}</th><th>${t('materials.notes')}</th><th>${t('materials.actions')}</th>
          </tr></thead><tbody>`;
  if(!filtered.length){
    h+=`<tr><td colspan="12" class="text-center py-8 text-slate-400">No requisitions match the filters.</td></tr>`;
  }else{
    filtered.forEach(req=>{
      const items=requisitionItemsData.filter(i=>i.requisition_id===req.id);
      const site=assignedSites.find(s=>s.id===req.site_id);
      const siteName=site?site.name:'—';
      const status=req.status||'Pending';
      const badgeCls='req-status-'+status.replace(/\s+/g,'');
      const rowspan=Math.max(items.length,1);
      if(!items.length){
        h+=`<tr><td>${req.requisition_number}</td><td>${formatDateShort(req.request_date)}</td><td>${formatDateShort(req.required_date)}</td><td colspan="3" class="text-center text-slate-400">No materials</td><td>${req.priority||'Normal'}</td><td><span class="req-status-badge ${badgeCls}">${status}</span></td><td>${siteName}</td><td>${req.requested_by_name||'—'}</td><td>${req.notes||'—'}</td><td><button onclick="viewRequisition('${req.id}')" class="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded hover:bg-blue-100 flex items-center gap-1"><iconify-icon icon="material-symbols:visibility" width="14"></iconify-icon>${t('common.view')}</button></td></tr>`;
      }else{
        items.forEach((it,idx)=>{
          h+=`<tr>`;
          if(idx===0){
            h+=`<td rowspan="${rowspan}" class="font-semibold text-emerald-700">${req.requisition_number}</td>`;
            h+=`<td rowspan="${rowspan}">${formatDateShort(req.request_date)}</td>`;
            h+=`<td rowspan="${rowspan}">${formatDateShort(req.required_date)}</td>`;
          }
          h+=`<td>${cleanName(it.material_name||'—')}</td><td>${it.unit||'—'}</td><td style="text-align:right">${toNumber(it.quantity_requested)}</td>`;
          if(idx===0){
            h+=`<td rowspan="${rowspan}">${req.priority||'Normal'}</td>`;
            h+=`<td rowspan="${rowspan}"><span class="req-status-badge ${badgeCls}">${status}</span></td>`;
            h+=`<td rowspan="${rowspan}">${siteName}</td>`;
            h+=`<td rowspan="${rowspan}">${req.requested_by_name||'—'}</td>`;
            h+=`<td rowspan="${rowspan}" class="max-w-[180px] truncate">${req.notes||'—'}</td>`;
            h+=`<td rowspan="${rowspan}"><button onclick="viewRequisition('${req.id}')" class="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded hover:bg-blue-100 flex items-center gap-1"><iconify-icon icon="material-symbols:visibility" width="14"></iconify-icon>${t('common.view')}</button></td>`;
          }
          h+=`</tr>`;
        });
      }
    });
  }
  h+=`</tbody></table></div></div>`;
  return h;
}

window.handleCreateRequisition=async function(e){
  e.preventDefault();
  const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);
  try{
    const date=document.getElementById('req-date').value;
    const priority=document.getElementById('req-priority').value;
    const notes=document.getElementById('req-notes').value.trim();
    if(!date){showToast(t('common.requiredField'),'error');setButtonLoading(btn,false);return}
    const items=[];document.querySelectorAll('.req-qty').forEach(inp=>{const q=parseFloat(inp.value)||0;if(q>0)items.push({name:inp.dataset.name,unit:inp.dataset.unit,qty:q})});
    if(!items.length){showToast(t('materials.selectAtLeastOneMaterial'),'error');setButtonLoading(btn,false);return}
    const now=new Date().toISOString();
    const reqNum='SHDR-REQ-'+Date.now().toString().slice(-8);
    const reqRef=await addDoc(collection(db,'requisitions'),{requisition_number:reqNum,site_id:currentSiteId,requested_by:currentUser.uid,requested_by_name:managerProfile?.full_name||'Manager',request_date:getTodayISO(),required_date:date,priority,status:'Pending',notes,created_at:now,updated_at:now});
    for(const it of items){
      await addDoc(collection(db,'requisition_items'),{requisition_id:reqRef.id,site_id:currentSiteId,requested_by:currentUser.uid,material_name:it.name,quantity_requested:it.qty,quantity_supplied:0,unit:it.unit,created_at:now,updated_at:now});
    }
    await addDoc(collection(db,'requisition_history'),{requisition_id:reqRef.id,site_id:currentSiteId,requested_by:currentUser.uid,action:'Created',actor:currentUser.uid,actor_name:managerProfile?.full_name||'Manager',timestamp:now,details:'Requisition submitted'});
    closeModal();showToast(t('common.savedSuccessfully'),'success');
  }catch(err){showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};

    });
    h+=`</div></div>`;
  }
  container.innerHTML=h;
}

window.handleAddStock=async function(e){
  e.preventDefault();
  const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);
  try{
    const name=document.getElementById('stock-name').value.trim();
    const qty=parseFloat(document.getElementById('stock-qty').value)||0;
    const unit=document.getElementById('stock-unit').value.trim()||'units';
    const cost=parseFloat(document.getElementById('stock-cost').value)||0;
    const min=parseFloat(document.getElementById('stock-min').value)||0;
    const notes=document.getElementById('stock-notes').value.trim();
    if(!name||qty<=0){showToast(t('common.requiredField'),'error');setButtonLoading(btn,false);return}
    const existing=getStockByName(currentSiteId,name);
    const now=new Date().toISOString();
    if(existing){
      const newQ=toNumber(existing.quantity)+qty;
      await updateDoc(doc(db,'stock',existing.id),{quantity:newQ,unit_cost:cost,minimum_quantity:min,updated_at:now});
      await addDoc(collection(db,'stock_transactions'),{site_id:currentSiteId,stock_id:existing.id,material_name:name,transaction_type:'STOCK_ADDED',quantity:qty,quantity_change:qty,previous_quantity:toNumber(existing.quantity),new_quantity:newQ,unit,unit_cost:cost,notes:notes||'Stock received',recorded_by:currentUser.uid,created_at:now});
    }else{
      const ref=await addDoc(collection(db,'stock'),{site_id:currentSiteId,material_name:name,quantity:qty,unit,unit_cost:cost,minimum_quantity:min,notes,created_at:now,updated_at:now});

window.handleEditStock=async function(e,id){
  e.preventDefault();
  const btn=getFormSubmitBtn(e.target);setButtonLoading(btn,true);
  try{
    const q=parseFloat(document.getElementById('edit-stock-qty').value)||0;

    const prev=toNumber(s.quantity);const now=new Date().toISOString();
    await updateDoc(doc(db,'stock',id),{quantity:q,unit_cost:c,minimum_quantity:m,updated_at:now});
    await addDoc(collection(db,'stock_transactions'),{site_id:currentSiteId,stock_id:id,material_name:s.material_name,transaction_type:'STOCK_ADJUSTMENT',quantity:Math.abs(q-prev),quantity_change:q-prev,previous_quantity:prev,new_quantity:q,unit:getStockUnit(s),unit_cost:c,notes:`Adjusted from ${prev} to ${q}`,recorded_by:currentUser.uid,created_at:now});

};
window.viewStockHistory=function(id){

    h+=`<div class="flex justify-between gap-3 text-sm border-b border-slate-100 pb-2"><div><div class="font-medium">${tx.transaction_type.replace(/_/g,' ')}</div><div class="text-xs text-slate-500">${tx.notes||''}</div></div><div class="text-right whitespace-nowrap"><div class="font-semibold ${cls}">${sign}${Math.abs(ch)} ${tx.unit||''}</div><div class="text-xs text-slate-400">${formatDate(tx.created_at)}</div></div></div>`;

window.toggleSelectAllWorkers=function(){const cbs=document.querySelectorAll('.worker-checkbox-input');const all=Array.from(cbs).every(c=>c.checked);cbs.forEach(c=>{c.checked=!all;const card=c.closest('.worker-card');if(card){card.classList.toggle('border-emerald-500',c.checked);card.classList.toggle('bg-emerald-50',c.checked)}});updateAttendanceSummary()};

window.updateAttendanceSummary=function(){
  const checked=document.querySelectorAll('.worker-checkbox-input:checked');
  const summary=document.getElementById('attendance-summary');if(!summary)return;
  if(!checked.length){summary.classList.add('hidden');return}
  summary.classList.remove('hidden');
  document.getElementById('selected-count').textContent=checked.length;
  let total=0;checked.forEach(cb=>{const w=siteWorkersData.find(x=>x.id===cb.value);if(w)total+=w.payment_method==='daily'?(Number(w.salary)||0):Math.round((Number(w.salary)||0)/30)});
  document.getElementById('total-cost').textContent=total.toLocaleString();
};
window.submitAttendance=async function(btn){
  setButtonLoading(btn,true);
  try{
    const date=document.getElementById('attendance-date').value;
    const checked=document.querySelectorAll('.worker-checkbox-input:checked');
    if(!checked.length){showToast('Please select at least one worker.','error');setButtonLoading(btn,false);return}
    const now=new Date().toISOString();
    for(const cb of checked){
      const w=siteWorkersData.find(x=>x.id===cb.value);if(!w)continue;
      const rate=w.payment_method==='daily'?(Number(w.salary)||0):Math.round((Number(w.salary)||0)/30);
      await addDoc(collection(db,'worker_attendance'),{site_id:currentSiteId,worker_id:w.id,name:w.name,role:w.role||'',date,status:'present',daily_rate:rate,recorded_by:currentUser.uid,created_at:now});

    showToast(t('common.savedSuccessfully'),'success');
  }catch(err){showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};

function renderProgress(container){
  let h=`<h2 class="text-xl sm:text-2xl font-bold mb-4 flex items-center gap-2"><iconify-icon icon="material-symbols:trending-up" class="text-emerald-600"></iconify-icon>${t('progress.title')}</h2>`;

    const cell=c?`<span class="text-emerald-600"><iconify-icon icon="material-symbols:check-circle" width="20"></iconify-icon></span>`:`<button onclick="markTaskCompleted('${task.id}')" class="bg-gray-300 hover:bg-gray-400 text-white w-8 h-8 rounded-full inline-flex items-center justify-center"><iconify-icon icon="material-symbols:check" width="18"></iconify-icon></button>`;
    const sc=c?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700';
    const st=c?t('progress.completed'):t('progress.pending');
    return `<tr><td class="px-3 py-2 text-center">${cell}</td><td class="px-3 py-2 font-medium">${task.name||'Unnamed'}</td><td class="px-3 py-2">${formatDate(task.start_date)}</td><td class="px-3 py-2">${formatDate(task.end_date)}</td><td class="px-3 py-2"><span class="px-2 py-1 rounded-full text-xs ${sc}">${st}</span></td></tr>`;
  }).join('');
  h+=`<div class="bg-white rounded-2xl border overflow-hidden shadow-sm"><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 uppercase text-xs"><tr><th class="px-3 py-2 text-center">Action</th><th class="px-3 py-2">${t('progress.task')}</th><th class="px-3 py-2">${t('progress.start')}</th><th class="px-3 py-2">${t('progress.end')}</th><th class="px-3 py-2">${t('progress.status')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  container.innerHTML=h;
}

function renderSettings(container){
  container.innerHTML=`<h2 class="text-xl sm:text-2xl font-bold mb-6 flex items-center gap-2"><iconify-icon icon="material-symbols:settings" class="text-emerald-600"></iconify-icon>${t('settings.title')}</h2><div class="flex flex-wrap gap-2 mb-6 p-1 bg-slate-200/60 rounded-xl"><button class="settings-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition ${settingsTab==='profile'?'active':''} flex items-center gap-2" onclick="switchSettingsTab('profile')"><iconify-icon icon="material-symbols:person-outline" width="18"></iconify-icon> ${t('settings.profile')}</button><button class="settings-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition ${settingsTab==='account'?'active':''} flex items-center gap-2" onclick="switchSettingsTab('account')"><iconify-icon icon="material-symbols:account-box-outline" width="18"></iconify-icon> ${t('settings.account')}</button><button class="settings-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition ${settingsTab==='security'?'active':''} flex items-center gap-2" onclick="switchSettingsTab('security')"><iconify-icon icon="material-symbols:lock-outline" width="18"></iconify-icon> ${t('settings.security')}</button><button class="settings-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition ${settingsTab==='preferences'?'active':''} flex items-center gap-2" onclick="switchSettingsTab('preferences')"><iconify-icon icon="material-symbols:tune" width="18"></iconify-icon> ${t('settings.preferences')}</button></div><div class="settings-sections"><div id="settings-profile" class="settings-section ${settingsTab==='profile'?'active':''}">${renderProfileSection()}</div><div id="settings-account" class="settings-section ${settingsTab==='account'?'active':''}">${renderAccountSection()}</div><div id="settings-security" class="settings-section ${settingsTab==='security'?'active':''}">${renderSecuritySection()}</div><div id="settings-preferences" class="settings-section ${settingsTab==='preferences'?'active':''}">${renderPreferencesSection()}</div></div>`;
  populateSettingsForms();attachSettingsChangeListeners();
}
function renderProfileSection(){const p=managerProfile||{};const photo=p.profile_picture||PLACEHOLDER_IMG;return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:person-outline" class="text-emerald-600"></iconify-icon> ${t('settings.profileInfo')}</h3><form id="profile-form" onsubmit="handleProfileSave(event)"><div class="field-group text-center"><div class="profile-avatar-wrapper"><img id="settings-profile-photo-img" src="${photo}"><label class="change-photo-btn"><iconify-icon icon="material-symbols:photo-camera" width="20"></iconify-icon><input type="file" id="settings-profile-photo-input" accept="image/*" style="display:none;" onchange="previewProfilePhoto(event)"></label></div><button type="button" id="settings-remove-photo-btn" class="remove-photo-btn mt-2" onclick="removeProfilePhoto()">${t('settings.removePhoto')}</button></div><div class="field-group"><label>${t('settings.fullName')}</label><input type="text" id="settings-full-name" value="${p.full_name||''}"></div><div class="field-group"><label>${t('settings.phone')}</label><input type="tel" id="settings-phone" value="${p.phone||''}"></div><div class="field-group"><label>${t('settings.email')}</label><input type="email" id="settings-email" value="${p.email||''}"></div><button type="submit" class="save-btn">${t('settings.saveProfile')}</button></form></div>`}
function renderAccountSection(){const p=managerProfile||{};return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:account-box-outline" class="text-emerald-600"></iconify-icon> ${t('settings.accountInfo')}</h3><div class="field-group"><label>${t('settings.accountName')}</label><div class="readonly-field">${p.full_name||'N/A'}</div></div><div class="field-group"><label>${t('settings.role')}</label><div class="readonly-field">${p.role||'Manager'}</div></div><div class="field-group"><label>${t('settings.email')}</label><div class="readonly-field">${p.email||'N/A'}</div></div><div class="field-group"><label>${t('settings.phone')}</label><div class="readonly-field">${p.phone||'N/A'}</div></div><div class="field-group"><label>${t('settings.memberSince')}</label><div class="readonly-field">${formatDate(p.created_at)}</div></div></div>`}
function renderSecuritySection(){return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:lock-outline" class="text-emerald-600"></iconify-icon> ${t('settings.changePassword')}</h3><form id="security-form" onsubmit="handlePasswordChange(event)"><div class="field-group"><label>${t('settings.currentPassword')}</label><input type="password" id="current-password" required></div><div class="field-group"><label>${t('settings.newPassword')}</label><input type="password" id="new-password" required minlength="6"></div><div class="field-group"><label>${t('settings.confirmPassword')}</label><input type="password" id="confirm-password" required></div><button type="submit" class="save-btn">${t('settings.changePassBtn')}</button></form></div>`}
function renderPreferencesSection(){const p=managerProfile||{},pr=p.preferences||{};return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:tune" class="text-emerald-600"></iconify-icon> ${t('settings.preferences')}</h3><form id="preferences-form" onsubmit="handlePreferencesSave(event)"><div class="field-group"><label>${t('settings.language')}</label><select id="settings-language"><option value="en" ${pr.language==='en'?'selected':''}>English</option><option value="fr" ${pr.language==='fr'?'selected':''}>French</option><option value="rw" ${pr.language==='rw'?'selected':''}>Kinyarwanda</option></select></div><div class="field-group"><label>${t('settings.currency')}</label><select id="settings-currency"><option value="RWF" ${pr.currency==='RWF'?'selected':''}>RWF</option><option value="USD" ${pr.currency==='USD'?'selected':''}>USD</option><option value="EUR" ${pr.currency==='EUR'?'selected':''}>EUR</option></select></div><div class="field-group flex items-center gap-3"><input type="checkbox" id="settings-notifications" class="w-5 h-5" ${pr.notifications!==false?'checked':''}><label class="mb-0">${t('settings.notifications')}</label></div><button type="submit" class="save-btn">${t('settings.savePrefs')}</button></form></div>`}
function populateSettingsForms(){const p=managerProfile||{};const n=document.getElementById('settings-full-name');if(n)n.value=p.full_name||'';const ph=document.getElementById('settings-phone');if(ph)ph.value=p.phone||'';const em=document.getElementById('settings-email');if(em)em.value=p.email||'';const img=document.getElementById('settings-profile-photo-img');if(img)img.src=p.profile_picture||PLACEHOLDER_IMG}
function attachSettingsChangeListeners(){document.querySelectorAll('#settings-profile input, #settings-preferences input, #settings-preferences select, #settings-security input').forEach(el=>{el.addEventListener('input',()=>{if(!hasUnsavedChanges)hasUnsavedChanges=true});el.addEventListener('change',()=>{if(!hasUnsavedChanges)hasUnsavedChanges=true})})}
window.switchSettingsTab=function(tab){
  if(hasUnsavedChanges){if(!confirm(t('common.areYouSure')))return;hasUnsavedChanges=false}
  settingsTab=tab;
  document.querySelectorAll('.settings-tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.settings-tab-btn[onclick*="${tab}"]`)?.classList.add('active');
  document.querySelectorAll('.settings-section').forEach(el=>el.classList.remove('active'));
  document.getElementById(`settings-${tab}`)?.classList.add('active');
  populateSettingsForms();attachSettingsChangeListeners();
};
window.previewProfilePhoto=function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const img=document.getElementById('settings-profile-photo-img');if(img)img.src=ev.target.result;_profilePhotoFile=f;hasUnsavedChanges=true};r.readAsDataURL(f)};
window.removeProfilePhoto=function(){if(!confirm(t('common.areYouSure')))return;const img=document.getElementById('settings-profile-photo-img');if(img)img.src=PLACEHOLDER_IMG;_profilePhotoFile=null;const inp=document.getElementById('settings-profile-photo-input');if(inp)inp.value='';hasUnsavedChanges=true};
window.handleProfileSave=async function(e){
  e.preventDefault();
  const btn=e.target.querySelector('.save-btn');setButtonLoading(btn,true);
  try{
    const name=document.getElementById('settings-full-name').value.trim();
    const phone=document.getElementById('settings-phone').value.trim();
    const email=document.getElementById('settings-email').value.trim();
    if(!name){showToast(t('common.requiredField'),'error');setButtonLoading(btn,false);return}
    const upd={full_name:name,phone,email,updated_at:new Date().toISOString()};
    if(_profilePhotoFile){upd.profile_picture=await uploadImageToImgbb(_profilePhotoFile);_profilePhotoFile=null}
    await updateDoc(doc(db,'profiles',currentUser.uid),upd);
    managerProfile={...managerProfile,...upd};updateProfileUI(managerProfile);
    hasUnsavedChanges=false;showToast(t('common.savedSuccessfully'),'success');
  }catch(err){showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};
window.handlePasswordChange=async function(e){
  e.preventDefault();
  const btn=e.target.querySelector('.save-btn');setButtonLoading(btn,true);
  try{
    const cur=document.getElementById('current-password').value;
    const np=document.getElementById('new-password').value;
    const cp=document.getElementById('confirm-password').value;
    if(np!==cp){showToast('Passwords do not match.','error');setButtonLoading(btn,false);return}
    if(np.length<6){showToast('Password must be at least 6 characters.','error');setButtonLoading(btn,false);return}
    const cred=EmailAuthProvider.credential(currentUser.email,cur);
    await reauthenticateWithCredential(currentUser,cred);
    await updatePassword(currentUser,np);
    e.target.reset();showToast(t('common.updatedSuccessfully'),'success');
  }catch(err){showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};
window.handlePreferencesSave=async function(e){
  e.preventDefault();
  const btn=e.target.querySelector('.save-btn');setButtonLoading(btn,true);
  try{
    const prefs={language:document.getElementById('settings-language').value,currency:document.getElementById('settings-currency').value,notifications:document.getElementById('settings-notifications').checked};
    await updateDoc(doc(db,'profiles',currentUser.uid),{preferences:prefs,updated_at:new Date().toISOString()});
    managerProfile.preferences=prefs;hasUnsavedChanges=false;
    setLanguage(prefs.language);showToast(t('common.savedSuccessfully'),'success');
  }catch(err){showToast(err.message||t('common.somethingWentWrong'),'error')}
  finally{setButtonLoading(btn,false)}
};

// ============================================================
// NAVIGATION
// ============================================================
window.showSection=function(section){
  if(currentSection==='settings'&&hasUnsavedChanges){if(!confirm(t('common.areYouSure')))return;hasUnsavedChanges=false}
  currentSection=section;clearError();
  document.getElementById('page-title').textContent=t(`navigation.${section}`)||section;
  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
  document.querySelector(`[data-section="${section}"]`)?.classList.add('active');
  document.querySelectorAll('#bottom-nav a').forEach(a=>a.classList.remove('active'));
  document.querySelector(`#bottom-nav a[data-section="${section}"]`)?.classList.add('active');
  const c=document.getElementById('content-area');c.innerHTML='';
  try{
    switch(section){
      case 'dashboard':renderDashboard(c);break;
      case 'materials':renderMaterials(c);break;
      case 'stock':renderStock(c);break;
      case 'workers':renderWorkers(c);break;
      case 'progress':renderProgress(c);break;
      case 'reports':renderReports(c);break;
      case 'gallery':renderGallery(c);break;
      case 'settings':renderSettings(c);break;
      default:renderDashboard(c);
    }
  }catch(err){console.error('Render error:',err);c.innerHTML=`<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-red-800 max-w-2xl mx-auto mt-10"><p class="font-semibold">⚠️ Something went wrong</p><p class="text-sm mt-1">${err.message}</p></div>`}
  if(window.innerWidth<1024){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebar-overlay').classList.add('hidden')}
};
window.closeModal=function(){document.getElementById('modal-overlay').classList.remove('active')};
window.openModal=function(title,bodyHTML){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=bodyHTML;document.getElementById('modal-overlay').classList.add('active')};
window.toggleSidebar=function(){document.getElementById('sidebar').classList.toggle('-translate-x-full');document.getElementById('sidebar-overlay').classList.toggle('hidden')};
window.handleLogout=async function(){await signOut(auth);window.location.href='../index.html'};

// ============================================================
// PROFILE UI + LISTENERS
// ============================================================
function updateProfileUI(p){
  if(!p)return;
  const name=p.full_name||'Manager',email=p.email||'',photo=p.profile_picture||'';
  const ai=document.getElementById('sidebar-user-avatar-img'),at=document.getElementById('user-avatar-text');
  if(photo){ai.src=photo;ai.style.display='block';at.style.display='none'}else{ai.style.display='none';at.style.display='flex';at.textContent=name.charAt(0).toUpperCase()}
  document.getElementById('user-name').textContent=name;
  document.getElementById('user-email').textContent=email;
}
function attachListeners(){
  unsubscribeSnapshots.forEach(fn=>{try{fn()}catch(_){}});
  unsubscribeSnapshots=[];
  if(!currentSiteId)return;
  const sid=currentSiteId;
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'materials'),where('site_id','==',sid)),s=>{materialsData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'site_workers'),where('site_id','==',sid)),s=>{siteWorkersData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'progress_tasks'),where('site_id','==',sid)),s=>{progressTasks=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'worker_positions'),where('site_id','in',[sid,'all'])),s=>{workerPositions=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'gallery'),where('site_id','==',sid)),s=>{galleryData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'worker_attendance'),where('site_id','==',sid)),s=>{attendanceData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'stock'),where('site_id','==',sid)),s=>{stockData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'stock_transactions'),where('site_id','==',sid),orderBy('created_at','desc')),s=>{stockTransactions=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'requisitions'),where('site_id','==',sid)),s=>{requisitionsData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'requisition_items'),where('site_id','==',sid)),s=>{requisitionItemsData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
  unsubscribeSnapshots.push(onSnapshot(query(collection(db,'requisition_history'),where('site_id','==',sid),orderBy('timestamp','desc')),s=>{requisitionHistoryData=s.docs.map(d=>({id:d.id,...d.data()}));refreshCurrentSection()}));
}
function refreshCurrentSection(){
  if(window._refreshing)return;window._refreshing=true;
  requestAnimationFrame(()=>{
    if(currentUser&&currentSiteId){
      let savedFilters=null;
      if(currentSection==='reports'){
        savedFilters={
          site:document.getElementById('report-site')?.value||document.getElementById('payroll-site')?.value||document.getElementById('mat-report-site')?.value||document.getElementById('wk-report-site')?.value||'all',
          dept:document.getElementById('report-dept')?.value||'all',
          start:document.getElementById('report-start')?.value||document.getElementById('payroll-start')?.value||document.getElementById('mat-report-start')?.value||'',
          end:document.getElementById('report-end')?.value||document.getElementById('payroll-end')?.value||document.getElementById('mat-report-end')?.value||'',
          search:document.getElementById('payroll-worker-search')?.value||document.getElementById('wk-report-search')?.value||'',
          pos:document.getElementById('payroll-position')?.value||'all',
          status:document.getElementById('payroll-status')?.value||'all'
        };
      }
      showSection(currentSection);
      if(currentSection==='reports' && savedFilters){
        ['report-site','payroll-site','mat-report-site','wk-report-site'].forEach(id=>{const el=document.getElementById(id);if(el && savedFilters.site)el.value=savedFilters.site;});
        const dpt=document.getElementById('report-dept');if(dpt)dpt.value=savedFilters.dept;
        ['report-start','payroll-start','mat-report-start'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=savedFilters.start;});
        ['report-end','payroll-end','mat-report-end'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=savedFilters.end;});
        const srch=document.getElementById('payroll-worker-search');if(srch)srch.value=savedFilters.search;
        const wsrch=document.getElementById('wk-report-search');if(wsrch)wsrch.value=savedFilters.search;
        const pos=document.getElementById('payroll-position');if(pos)pos.value=savedFilters.pos;
        const st=document.getElementById('payroll-status');if(st)st.value=savedFilters.status;
        if(reportType==='general')updateGeneralPreview();
        if(reportType==='payroll')updatePayrollReport();
        if(reportType==='materials')updateMaterialsPreview();
        if(reportType==='workers')updateWorkersPreview();
      }
    }
    window._refreshing=false;
  });
}
window.switchSite=function(id){currentSiteId=id;attachListeners();showSection(currentSection)};

// ============================================================
// INIT
// ============================================================
function initLanguage(){
  document.querySelectorAll('.lang-btn').forEach(b=>{const a=b.dataset.language===currentLanguage;b.classList.toggle('active',a)});
  document.documentElement.lang=currentLanguage;applyTranslations();
}
async function initApp(){
  initLanguage();
  onAuthStateChanged(auth,async(user)=>{
    if(!user){window.location.href='../manager.html';return}
    currentUser=user;
    try{
      const pref=doc(db,'profiles',user.uid);
      const snap=await getDoc(pref);
      if(!snap.exists()||snap.data().role!=='manager'){await signOut(auth);window.location.href='../manager.html';return}
      managerProfile=snap.data();updateProfileUI(managerProfile);
      onSnapshot(pref,s=>{if(s.exists()){managerProfile=s.data();updateProfileUI(managerProfile);if(currentSection==='settings')populateSettingsForms()}});
      let ids=[];
      if(managerProfile.assigned_sites&&Array.isArray(managerProfile.assigned_sites))ids=managerProfile.assigned_sites;
      else if(managerProfile.assigned_site)ids=[managerProfile.assigned_site];
      if(ids.length){
        const snaps=await Promise.all(ids.map(id=>getDoc(doc(db,'sites',id))));
        assignedSites=snaps.filter(s=>s.exists()).map(s=>({id:s.id,...s.data()}));
        if(assignedSites.length){
          currentSiteId=assignedSites[0].id;
          const sel=document.getElementById('site-selector');
          if(assignedSites.length>1){sel.classList.remove('hidden');sel.innerHTML=assignedSites.map(s=>`<option value="${s.id}" ${s.id===currentSiteId?'selected':''}>${s.name}</option>`).join('')}
          else{sel.classList.add('hidden')}
          attachListeners();
        }
      }
      showSection('dashboard');
    }catch(err){console.error('Init error:',err);showError('Failed to initialize: '+err.message)}
  });
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initApp)}else{initApp()}
console.log('✅ SHDR Manager Dashboard — Owner-style reports with real Material Symbols icons');
