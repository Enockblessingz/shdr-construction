            // SETTINGS
            // =================================================================
            function renderSettings(container) { container.innerHTML = `<h2 class="text-xl sm:text-2xl font-bold mb-6">${t('settings.title')}</h2><div class="flex flex-wrap gap-2 mb-6 p-1 bg-slate-200/60 rounded-xl"><button class="settings-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition ${settingsTab === 'profile' ? 'active' : ''}" onclick="switchSettingsTab('profile')"><iconify-icon icon="material-symbols:person-outline" class="inline mr-1"></iconify-icon> ${t('settings.profile')}</button><button class="settings-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition ${settingsTab === 'account' ? 'active' : ''}" onclick="switchSettingsTab('account')"><iconify-icon icon="material-symbols:account-box-outline" class="inline mr-1"></iconify-icon> ${t('settings.account')}</button><button class="settings-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition ${settingsTab === 'security' ? 'active' : ''}" onclick="switchSettingsTab('security')"><iconify-icon icon="material-symbols:lock-outline" class="inline mr-1"></iconify-icon> ${t('settings.security')}</button><button class="settings-tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition ${settingsTab === 'preferences' ? 'active' : ''}" onclick="switchSettingsTab('preferences')"><iconify-icon icon="material-symbols:settings-outline" class="inline mr-1"></iconify-icon> ${t('settings.preferences')}</button></div><div class="settings-sections"><div id="settings-profile" class="settings-section ${settingsTab === 'profile' ? 'active' : ''}">${renderProfileSection()}</div><div id="settings-account" class="settings-section ${settingsTab === 'account' ? 'active' : ''}">${renderAccountSection()}</div><div id="settings-security" class="settings-section ${settingsTab === 'security' ? 'active' : ''}">${renderSecuritySection()}</div><div id="settings-preferences" class="settings-section ${settingsTab === 'preferences' ? 'active' : ''}">${renderPreferencesSection()}</div></div>`; populateSettingsForms();
                attachSettingsChangeListeners(); }

            function renderProfileSection() { const profile = managerProfile || {}; const photo = profile.profile_picture || PLACEHOLDER_IMG; return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:person-outline" class="text-emerald-600"></iconify-icon> ${t('settings.profileInfo')}</h3><form id="profile-form" onsubmit="handleProfileSave(event)"><div class="field-group text-center"><div class="profile-avatar-wrapper"><img id="settings-profile-photo-img" src="${photo}" alt="Profile Photo"><label class="change-photo-btn" title="${t('settings.changePhoto')}"><iconify-icon icon="material-symbols:photo-camera" width="20"></iconify-icon><input type="file" id="settings-profile-photo-input" accept="image/*" style="display:none;" onchange="previewProfilePhoto(event)"></label></div><button type="button" id="settings-remove-photo-btn" class="remove-photo-btn mt-2" onclick="removeProfilePhoto()">${t('settings.removePhoto')}</button></div><div class="field-group"><label for="settings-full-name">${t('settings.fullName')}</label><input type="text" id="settings-full-name" placeholder="${t('settings.fullName')}" value="${profile.full_name || ''}"></div><div class="field-group"><label for="settings-phone">${t('settings.phone')}</label><input type="tel" id="settings-phone" placeholder="+250 7XX XXX XXX" value="${profile.phone || ''}"></div><div class="field-group"><label for="settings-email">${t('settings.email')}</label><input type="email" id="settings-email" placeholder="example@email.com" value="${profile.email || ''}"></div><button type="submit" class="save-btn">${t('settings.saveProfile')}</button></form></div>`; }

            function renderAccountSection() { const profile = managerProfile || {}; return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:account-box-outline" class="text-emerald-600"></iconify-icon> ${t('settings.accountInfo')}</h3><div class="field-group"><label>${t('settings.accountName')}</label><div class="readonly-field">${profile.full_name || 'N/A'}</div></div><div class="field-group"><label>${t('settings.role')}</label><div class="readonly-field" id="settings-role">${profile.role || 'Manager'}</div></div><div class="field-group"><label>${t('settings.email')}</label><div class="readonly-field">${profile.email || 'N/A'}</div></div><div class="field-group"><label>${t('settings.phone')}</label><div class="readonly-field">${profile.phone || 'N/A'}</div></div><div class="field-group"><label>${t('settings.accountStatus')}</label><div class="readonly-field" id="settings-status">${profile.status || t('settings.active')}</div></div><div class="field-group"><label>${t('settings.memberSince')}</label><div class="readonly-field" id="settings-since">${formatDate(profile.created_at)}</div></div></div>`; }

            function renderSecuritySection() { return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:lock-outline" class="text-emerald-600"></iconify-icon> ${t('settings.changePassword')}</h3><form id="security-form" onsubmit="handlePasswordChange(event)"><div class="field-group"><label for="current-password">${t('settings.currentPassword')}</label><input type="password" id="current-password" placeholder="${t('settings.currentPassword')}" required></div><div class="field-group"><label for="new-password">${t('settings.newPassword')}</label><input type="password" id="new-password" placeholder="${t('settings.newPassword')}" required minlength="6"></div><div class="field-group"><label for="confirm-password">${t('settings.confirmPassword')}</label><input type="password" id="confirm-password" placeholder="${t('settings.confirmPassword')}" required></div><button type="submit" class="save-btn">${t('settings.changePassBtn')}</button></form></div>`; }

            function renderPreferencesSection() { const profile = managerProfile || {}; const prefs = profile.preferences || {}; return `<div class="settings-card"><h3><iconify-icon icon="material-symbols:settings-outline" class="text-emerald-600"></iconify-icon> ${t('settings.preferences')}</h3><form id="preferences-form" onsubmit="handlePreferencesSave(event)"><div class="field-group"><label for="settings-language">${t('settings.language')}</label><select id="settings-language"><option value="en">English</option><option value="fr">French</option><option value="rw">Kinyarwanda</option></select></div><div class="field-group"><label for="settings-currency">${t('settings.currency')}</label><select id="settings-currency"><option value="RWF">RWF — Rwandan Franc</option><option value="USD">USD — US Dollar</option><option value="EUR">EUR — Euro</option></select></div><div class="field-group"><label for="settings-date-format">${t('settings.dateFormat')}</label><select id="settings-date-format"><option value="DD/MM/YYYY">DD/MM/YYYY</option><option value="MM/DD/YYYY">MM/DD/YYYY</option><option value="YYYY-MM-DD">YYYY-MM-DD</option></select></div><div class="field-group flex items-center gap-3"><input type="checkbox" id="settings-notifications" class="w-5 h-5 text-emerald-600"><label for="settings-notifications" class="mb-0">${t('settings.notifications')}</label></div><button type="submit" class="save-btn">${t('settings.savePrefs')}</button></form></div>`; }

            function populateSettingsForms() { const profile = managerProfile || {}; const nameInput = document.getElementById('settings-full-name'); if (nameInput) nameInput.value = profile.full_name || ''; const phoneInput = document.getElementById('settings-phone'); if (phoneInput) phoneInput.value = profile.phone || ''; const emailInput = document.getElementById('settings-email'); if (emailInput) emailInput.value = profile.email || ''; const photoImg = document.getElementById('settings-profile-photo-img'); if (photoImg) photoImg.src = profile.profile_picture || PLACEHOLDER_IMG; const roleDisplay = document.getElementById('settings-role'); if (roleDisplay) roleDisplay.textContent = profile.role || 'Manager'; const statusDisplay = document.getElementById('settings-status'); if (statusDisplay) statusDisplay.textContent = profile.status || 'Active'; const sinceDisplay = document.getElementById('settings-since'); if (sinceDisplay) sinceDisplay.textContent = formatDate(profile.created_at); const langSelect = document.getElementById('settings-language'); if (langSelect) langSelect.value = profile.preferences?.language || currentLanguage; const currencySelect = document.getElementById('settings-currency'); if (currencySelect) currencySelect.value = profile.preferences?.currency || 'RWF'; const dateFormatSelect = document.getElementById('settings-date-format'); if (dateFormatSelect) dateFormatSelect.value = profile.preferences?.dateFormat || 'DD/MM/YYYY'; const notifToggle = document.getElementById('settings-notifications'); if (notifToggle) notifToggle.checked = profile.preferences?.notifications !== false; }

            function attachSettingsChangeListeners() { const inputs = document.querySelectorAll('#settings-profile input, #settings-preferences input, #settings-preferences select, #settings-security input');
                inputs.forEach(el => { el.addEventListener('input', () => { if (!hasUnsavedChanges) hasUnsavedChanges = true; });
                    el.addEventListener('change', () => { if (!hasUnsavedChanges) hasUnsavedChanges = true; }); }); const fileInput = document.getElementById('settings-profile-photo-input'); if (fileInput) fileInput.addEventListener('change', () => { hasUnsavedChanges = true; }); const removeBtn = document.getElementById('settings-remove-photo-btn'); if (removeBtn) removeBtn.addEventListener('click', () => { hasUnsavedChanges = true; }); }
            window.switchSettingsTab = (tab) => { if (hasUnsavedChanges) { if (!confirm(t('common.areYouSure'))) return;
                    hasUnsavedChanges = false; }
                settingsTab = tab;
                document.querySelectorAll('.settings-tab-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelector(`.settings-tab-btn[onclick*="${tab}"]`)?.classList.add('active');
                document.querySelectorAll('.settings-section').forEach(el => el.classList.remove('active'));
                document.getElementById(`settings-${tab}`)?.classList.add('active');
                populateSettingsForms();
                attachSettingsChangeListeners(); };
            window.previewProfilePhoto = (event) => { const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
                reader.onload = (e) => { const img = document.getElementById('settings-profile-photo-img'); if (img) img.src = e.target.result;
                    _profilePhotoFile = file;
                    hasUnsavedChanges = true; };
                reader.readAsDataURL(file); };
            window.removeProfilePhoto = () => { if (!confirm(t('common.areYouSure'))) return; const img = document.getElementById('settings-profile-photo-img'); if (img) img.src = PLACEHOLDER_IMG;
                _profilePhotoFile = null; const input = document.getElementById('settings-profile-photo-input'); if (input) input.value = '';
                hasUnsavedChanges = true; };
            window.handleProfileSave = async (e) => { e.preventDefault(); const form = e.target; const btn = form.querySelector('.save-btn');
                setButtonLoading(btn, true); try { const name = document.getElementById('settings-full-name').value.trim(); const phone = document.getElementById('settings-phone').value.trim(); const email = document.getElementById('settings-email').value.trim(); if (!name) { alert(t('common.requiredField'));
                        setButtonLoading(btn, false); return; } if (phone && !/^\+?[0-9\s-]{7,15}$/.test(phone)) { alert(t('common.invalidValue'));
                        setButtonLoading(btn, false); return; } if (email && !/^\S+@\S+\.\S+$/.test(email)) { alert(t('common.invalidValue'));
                        setButtonLoading(btn, false); return; } const updateData = { full_name: name, phone: phone, email: email,
                        updated_at: new Date().toISOString() }; if (_profilePhotoFile) { try { const photoUrl = await uploadImageToImgbb(_profilePhotoFile);
                            updateData.profile_picture = photoUrl;
                            _profilePhotoFile = null; } catch (err) { alert(t('common.somethingWentWrong'));
                            setButtonLoading(btn, false); return; } } const profileRef = doc(db, 'profiles', currentUser.uid); await updateDoc(profileRef, updateData); if (email && email !== currentUser.email) { const password = prompt(t('settings.currentPassword')); if (!password) { alert(t('common.somethingWentWrong'));
                        setButtonLoading(btn, false); return; } const credential = EmailAuthProvider.credential(currentUser.email, password); await reauthenticateWithCredential(currentUser, credential); await updateEmail(currentUser, email); await sendEmailVerification(currentUser);
                        showToast(t('common.savedSuccessfully'), 'success'); }
                    managerProfile = { ...managerProfile, ...updateData };
                    updateProfileUI(managerProfile);
                    hasUnsavedChanges = false;
                    showToast(t('common.updatedSuccessfully'), 'success');
                    populateSettingsForms(); } catch (err) { showToast(t('common.somethingWentWrong'), 'error'); } finally { setButtonLoading(btn, false); } };
            window.handlePasswordChange = async (e) => { e.preventDefault(); const form = e.target; const btn = form.querySelector('.save-btn');
                setButtonLoading(btn, true); const current = document.getElementById('current-password').value; const newPass = document.getElementById('new-password').value; const confirm = document.getElementById('confirm-password').value; if (newPass !== confirm) { alert(t('common.invalidValue'));
                    setButtonLoading(btn, false); return; } if (newPass.length < 6) { alert(t('common.invalidValue'));
                    setButtonLoading(btn, false); return; } try { const credential = EmailAuthProvider.credential(currentUser.email, current); await reauthenticateWithCredential(currentUser, credential); await updatePassword(currentUser, newPass);
                    showToast(t('common.updatedSuccessfully'), 'success');
                    form.reset();
                    hasUnsavedChanges = false; } catch (err) { alert(t('common.somethingWentWrong')); } finally { setButtonLoading(btn, false); } };
            window.handlePreferencesSave = async (e) => { e.preventDefault(); const form = e.target; const btn = form.querySelector('.save-btn');
                setButtonLoading(btn, true); try { const language = document.getElementById('settings-language').value; const currency = document.getElementById('settings-currency').value; const dateFormat = document.getElementById('settings-date-format').value; const notifications = document.getElementById('settings-notifications').checked; const prefs = { language, currency, dateFormat,
                        notifications }; const profileRef = doc(db, 'profiles', currentUser.uid); await updateDoc(profileRef, { preferences: prefs,
                        updated_at: new Date().toISOString() });
                    managerProfile.preferences = prefs;
                    hasUnsavedChanges = false; if (language !== currentLanguage) setLanguage(language);
                    showToast(t('common.savedSuccessfully'), 'success'); } catch (err) { showToast(t('common.somethingWentWrong'), 'error'); } finally { setButtonLoading(btn, false); } };

            // =================================================================
            // MAIN ROUTING
            // =================================================================
            window.showSection = function(section) {
                if (currentSection === 'settings' && hasUnsavedChanges) { if (!confirm(t('common.areYouSure'))) return;
                    hasUnsavedChanges = false; }
                currentSection = section;
                clearError();
                document.getElementById('page-title').textContent = t(`navigation.${section}`) || section;
                document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
                document.querySelector(`[data-section="${section}"]`)?.classList.add('active');
                document.querySelectorAll('#bottom-nav a').forEach(a => a.classList.remove('active'));
                document.querySelector(`#bottom-nav a[data-section="${section}"]`)?.classList.add('active');

                const container = document.getElementById('content-area');
                container.innerHTML = '';
                try {
                    switch (section) {
                        case 'dashboard':
                            renderDashboard(container);
                            break;
                        case 'materials':
                            renderMaterials(container);
                            break;
                        case 'stock':
                            renderStock(container);
                            break;
                        case 'workers':
                            renderWorkers(container);
                            break;
                        case 'progress':
                            renderProgress(container);
                            break;
                        case 'reports':
                            renderReports(container);
                            break;
                        case 'gallery':
                            renderGallery(container);
                            break;
                        case 'settings':
                            renderSettings(container);
                            break;
                        default:
                            renderDashboard(container);
                    }
                } catch (err) {
                    console.error('Error rendering section:', err);
                    container.innerHTML =
                        `<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-red-800 max-w-2xl mx-auto mt-10"><p class="font-semibold">⚠️ Something went wrong</p><p class="text-sm mt-1">${err.message}</p><p class="text-xs mt-2 text-red-600">Check the console for details.</p></div>`;
                }
                if (window.innerWidth < 1024) {
                    document.getElementById('sidebar').classList.add('-translate-x-full');
                    document.getElementById('sidebar-overlay').classList.add('hidden');
                }
            };

            window.closeModal = () => document.getElementById('modal-overlay').classList.remove('active');
            window.openModal = (title, bodyHTML) => {
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-body').innerHTML = bodyHTML;
                document.getElementById('modal-overlay').classList.add('active');
            };

            window.handleLogout = async () => { await signOut(auth);
                window.location.href = '../index.html'; };

            // =================================================================
            // FIREBASE AUTH & LISTENERS
            // =================================================================
            window.addEventListener('load', () => {
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    const isActive = btn.dataset.language === currentLanguage;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-pressed', isActive.toString());
                });
                document.documentElement.lang = currentLanguage;
                applyTranslations();

                onAuthStateChanged(auth, async (user) => {
                    if (!user) { window.location.href = '../manager.html'; return; }
                    currentUser = user;
                    try {
                        const profileRef = doc(db, 'profiles', user.uid);
                        const profileSnap = await getDoc(profileRef);
                        if (!profileSnap.exists() || profileSnap.data().role !== 'manager') {
                            await signOut(auth);
                            window.location.href = '../manager.html';
                            return;
                        }
                        managerProfile = profileSnap.data();
                        updateProfileUI(managerProfile);
                        onSnapshot(profileRef, (snap) => {
                            if (snap.exists()) {
                                managerProfile = snap.data();
                                updateProfileUI(managerProfile);
                                if (currentSection === 'settings') populateSettingsForms();
                            }
                        });

                        let siteIds = [];
                        if (managerProfile.assigned_sites && Array.isArray(managerProfile.assigned_sites)) siteIds = managerProfile
                            .assigned_sites;
                        else if (managerProfile.assigned_site) siteIds = [managerProfile.assigned_site];
                        if (siteIds.length) {
                            const sitePromises = siteIds.map(id => getDoc(doc(db, 'sites', id)));
                            const siteSnaps = await Promise.all(sitePromises);
                            assignedSites = siteSnaps.filter(snap => snap.exists()).map(snap => ({ id: snap.id,
                                ...snap.data() }));
                            if (assignedSites.length) {
                                currentSiteId = assignedSites[0].id;
                                const selector = document.getElementById('site-selector');
                                if (assignedSites.length > 1) {
                                    selector.classList.remove('hidden');
                                    selector.innerHTML = assignedSites.map(s =>
                                        `<option value="${s.id}" ${s.id === currentSiteId ? 'selected' : ''}>${s.name}</option>`
                                        ).join('');
                                } else { selector.classList.add('hidden'); }
                                attachListeners();
                            }
                        }
                        showSection('dashboard');
                    } catch (err) {
                        console.error('Init error:', err);
                        showError('Failed to initialize: ' + err.message);
                    }
                });
            });

            function updateProfileUI(profile) {
                if (!profile) return;
                const name = profile.full_name || 'Manager';
                const email = profile.email || '';
                const photo = profile.profile_picture || '';
                const avatarImg = document.getElementById('sidebar-user-avatar-img');
                const avatarText = document.getElementById('user-avatar-text');
                if (photo) { avatarImg.src = photo;
                    avatarImg.style.display = 'block';
                    avatarText.style.display = 'none'; } else { avatarImg.style.display = 'none';
                    avatarText.style.display = 'flex';
                    avatarText.textContent = name.charAt(0).toUpperCase(); }
                document.getElementById('user-name').textContent = name;
                document.getElementById('user-email').textContent = email;
            }

            function attachListeners() {
                unsubscribeSnapshots.forEach(fn => fn());
                unsubscribeSnapshots = [];
                if (!currentSiteId) return;
                const siteId = currentSiteId;
                // materials (we still need for reports, etc.)
                const matQ = query(collection(db, 'materials'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(matQ, snap => { materialsData = snap.docs.map(d => ({ id: d.id,
                        ...d.data() })); }));
                const workQ = query(collection(db, 'site_workers'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(workQ, snap => { siteWorkersData = snap.docs.map(d => ({ id: d.id,
                        ...d.data() }));
                    refreshCurrentSection(); }));
                const progQ = query(collection(db, 'progress_tasks'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(progQ, snap => { const tasks = snap.docs.map(d => ({ id: d.id,
                        ...d.data() }));
                    progressTasks = tasks;
                    window.progressTasks = tasks;
                    refreshCurrentSection(); }));
                const posQ = query(collection(db, 'worker_positions'), where('site_id', 'in', [siteId, 'all']));
                unsubscribeSnapshots.push(onSnapshot(posQ, snap => { workerPositions = snap.docs.map(d => ({ id: d.id,
                        ...d.data() }));
                    refreshCurrentSection(); }));
                const galleryQ = query(collection(db, 'gallery'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(galleryQ, snap => { galleryData = snap.docs.map(d => ({ id: d.id,
                        ...d.data() }));
                    refreshCurrentSection(); }));
                const attQ = query(collection(db, 'worker_attendance'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(attQ, snap => { attendanceData = snap.docs.map(d => ({ id: d.id,
                        ...d.data() }));
                    refreshCurrentSection(); }));
                const stockQ = query(collection(db, 'stock'), where('site_id', '==', siteId));
                unsubscribeSnapshots.push(onSnapshot(stockQ, snap => { stockData = snap.docs.map(d => ({ id: d.id,
                        ...d.data() }));
                    refreshCurrentSection(); }));
                const transQ = query(collection(db, 'stock_transactions'), where('site_id', '==', siteId), orderBy(
                    'created_at', 'desc'));
                unsubscribeSnapshots.push(onSnapshot(transQ, snap => { stockTransactions = snap.docs.map(d => ({ id: d.id,
                        ...d.data() }));
                    refreshCurrentSection(); }));

                // Batch listeners
                const batchQ = query(collection(db, 'batches'), where('siteId', '==', siteId));
                const unsubBatch = onSnapshot(batchQ, snap => {
                    batchesData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    const batchIds = batchesData.map(b => b.id);
                    if (batchIds.length) {
                        const itemsQ = query(collection(db, 'batch_items'), where('batchId', 'in', batchIds));
                        onSnapshot(itemsQ, snap2 => {
                            batchItemsData = snap2.docs.map(d => ({ id: d.id, ...d.data() }));
                            refreshCurrentSection();
                        });
                    } else {
                        batchItemsData = [];
                        refreshCurrentSection();
                    }
                    refreshCurrentSection();
                });
                if (!window._batchUnsubs) window._batchUnsubs = [];
                window._batchUnsubs.push(unsubBatch);
                const itemsQ = query(collection(db, 'batch_items'));
                const unsubItems = onSnapshot(itemsQ, snap => {
                    const siteBatchIds = batchesData.map(b => b.id);
                    batchItemsData = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(i => siteBatchIds.includes(i
                        .batchId));
                    refreshCurrentSection();
                });
                window._batchUnsubs.push(unsubItems);
            }

            function refreshCurrentSection() {
                if (window._refreshing) return;
                window._refreshing = true;
                requestAnimationFrame(() => { showSection(currentSection);
                    window._refreshing = false; });
            }

            window.switchSite = (siteId) => {
                currentSiteId = siteId;
                attachListeners();
                showSection(currentSection);
            };

            async function uploadImageToImgbb(file) {
                const formData = new FormData();
                formData.append('image', file);
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const json = await res.json();
                if (!json.success) throw new Error(t('common.somethingWentWrong'));
                return json.data.url;
            }

            // Cleanup on page unload
            window.addEventListener('beforeunload', () => {
                if (window._batchUnsubs) {
                    window._batchUnsubs.forEach(fn => fn());
                    window._batchUnsubs = [];
                }
                unsubscribeSnapshots.forEach(fn => fn());
            });

            console.log('✅ SHDR Manager Dashboard loaded with Batch Material Receiving');
        </script>
    </main>
</body>
</html>
