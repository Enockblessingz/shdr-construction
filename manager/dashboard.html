    if (pendingAttachment) {
      const f = pendingAttachment;
      el.innerHTML = `<div class="composer-attachment"><iconify-icon icon="material-symbols:attach-file" width="16" class="text-emerald-600"></iconify-icon><span class="truncate">${escapeHTML(f.name)}</span><span class="text-slate-400">${formatBytes(f.size)}</span><button type="button" class="ml-auto text-slate-500" onclick="clearPendingAttachment()"><iconify-icon icon="material-symbols:close" width="16"></iconify-icon></button></div>`;
    } else {
      const s = window._pendingSharedRecord;
      el.innerHTML = `<div class="composer-attachment"><iconify-icon icon="material-symbols:add-link" width="16" class="text-emerald-600"></iconify-icon><span class="truncate">${escapeHTML(s.title)} — ${escapeHTML(s.subtitle)}</span><button type="button" class="ml-auto text-slate-500" onclick="window._pendingSharedRecord=null;renderComposerAttachment();"><iconify-icon icon="material-symbols:close" width="16"></iconify-icon></button></div>`;
    }
  }
  updateSendButtonState();
}
function renderEmojiPicker() {
  const el = document.getElementById('emoji-picker');
  if (!el) return;
  el.classList.toggle('open', emojiPickerOpen);
  if (!emojiPickerOpen) return;
  const grid = el.querySelector('.emoji-grid');
  if (!grid) el.innerHTML = `<div class="emoji-grid">${EMOJI_SET.map(e => `<button type="button" onclick="insertEmoji('${e}')">${e}</button>`).join('')}</div>`;
}

function renderMessageBubble(m) {
  const mine = m.sender_id === currentUser.uid;
  const isDeleted = m.deleted_for_all;
  let tickHTML = '';
  if (mine && !isDeleted) {
    if (m.read_at) tickHTML = `<span class="msg-tick read">✓✓</span>`;
    else if (m.delivered_at) tickHTML = `<span class="msg-tick delivered">✓✓</span>`;
    else tickHTML = `<span class="msg-tick sent">✓</span>`;
  }
  const reply = m.reply_preview ? `<div class="msg-reply-quote" onclick="scrollToMessage('${m.reply_to}')"><div class="rq-name">${escapeHTML(m.reply_preview.sender_name)}</div><span class="rq-text">${escapeHTML(m.reply_preview.text)}</span></div>` : '';
  const fwd = m.forwarded_from ? `<div class="msg-forwarded-label"><iconify-icon icon="material-symbols:forward" width="12"></iconify-icon>${t('messages.forwardedFrom', { name: escapeHTML(m.forwarded_from.sender_name || '') })}</div>` : '';
  let bodyHTML = '';
  if (isDeleted) { bodyHTML = `<p class="msg-deleted">${t('messages.deleted')}</p>`; }
  else {
    if (m.type === 'attachment' && m.attachment && isSafeAttachmentUrl(m.attachment.url)) {
      const a = m.attachment;
      if (a.mime?.startsWith('image/')) { bodyHTML += `<div class="attach-preview"><img src="${escapeHTML(a.url)}" onclick="openAttachmentLightbox('${escapeHTML(a.url)}')" alt=""></div>`; }
      else { bodyHTML += `<a href="${escapeHTML(a.url)}" target="_blank" rel="noopener" class="attach-file"><iconify-icon icon="material-symbols:description" width="18"></iconify-icon><span class="truncate">${escapeHTML(a.name)}</span><iconify-icon icon="material-symbols:download" width="16" class="ml-auto"></iconify-icon></a>`; }
    }
    if (m.type === 'shared_record' && m.shared_record) {
      const s = m.shared_record;
      const lineRows = (s.lines || []).map(line => {
        const label = Array.isArray(line) ? line[0] : (line.label ?? '');
        const value = Array.isArray(line) ? line[1] : (line.value ?? '');
        return `<div class="sc-row"><span class="text-slate-500">${escapeHTML(label)}</span><span class="font-medium">${escapeHTML(value)}</span></div>`;
      }).join('');
      bodyHTML += `<div class="shared-card"><div class="sc-title">${escapeHTML(s.title)}</div><div class="font-semibold text-slate-800 mb-1">${escapeHTML(s.subtitle)}</div>${lineRows}</div>`;
    }
    if (m.text) bodyHTML += `<p class="whitespace-pre-wrap">${escapeHTML(m.text)}</p>`;
  }
  const reactions = m.reactions || {};
  const reactionKeys = Object.keys(reactions).filter(k => Array.isArray(reactions[k]) && reactions[k].length);
  const reactionsHTML = reactionKeys.length ? `<div class="msg-reactions">${reactionKeys.map(k => { const mineR = reactions[k].includes(currentUser.uid); return `<span class="react-pill ${mineR ? 'mine' : ''}" onclick="toggleReaction('${m.id}','${k}')">${k}<span class="count">${reactions[k].length}</span></span>`; }).join('')}</div>` : '';
  const editedHTML = m.edited_at && !isDeleted ? ` <span class="text-[10px] opacity-70">(${t('messages.edited')})</span>` : '';
  const menuBtn = isDeleted ? '' : `<button type="button" class="msg-menu-btn" onclick="openMsgMenu(event,'${m.id}')" aria-label="Message actions"><iconify-icon icon="material-symbols:more-vert" width="20"></iconify-icon></button>`;
  const isStarred = Array.isArray(m.starred_by) && m.starred_by.includes(currentUser.uid);
  const isPinned = Array.isArray(m.pinned_by) && m.pinned_by.includes(currentUser.uid);
  const starBadge = isStarred ? `<span class="msg-star-badge"><iconify-icon icon="material-symbols:star" class="filled" width="14"></iconify-icon></span>` : '';
  const pinBadge = isPinned ? `<span class="msg-pin-badge"><iconify-icon icon="material-symbols:push-pin" width="14"></iconify-icon></span>` : '';
  return `<div class="flex ${mine ? 'justify-end' : 'justify-start'} mb-3" id="msg-${m.id}"><div class="msg-bubble-row ${mine ? 'mine' : ''}">${mine ? menuBtn : ''}<div class="msg-bubble-col" style="position:relative">${starBadge}${pinBadge}<div class="px-3.5 py-2 rounded-2xl text-sm break-words shadow-sm ${mine ? 'bg-emerald-600 text-white rounded-br-md' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-md'}">${fwd}${reply}${bodyHTML}<div class="text-[10px] mt-1 ${mine ? 'text-emerald-100' : 'text-slate-400'} text-right flex items-center gap-1 justify-end">${editedHTML}<span>${escapeHTML(formatChatTime(m.created_at))}</span>${tickHTML}</div></div>${reactionsHTML}</div>${mine ? '' : menuBtn}</div></div>`;
}

window.openAttachmentLightbox = function (url) {
  if (!isSafeAttachmentUrl(url)) { showToast(t('common.invalidValue'), 'error'); return; }
  const v = document.createElement('div');
  v.className = 'fixed inset-0 z-[9999] bg-black/85 flex items-center justify-center p-4';
  v.onclick = () => v.remove();
  v.innerHTML = `<img src="${escapeHTML(url)}" class="max-w-full max-h-[85vh] object-contain rounded-xl" onclick="event.stopPropagation()">`;
  document.body.appendChild(v);
};

window.openChatMenu = () => {
  if (!activeConversationId) return;
  const c = conversationsData.find(x => x.id === activeConversationId);
  const s = c?.user_settings?.[currentUser.uid] || {};
  openModal('⚙️ ' + t('messages.more'), `<div class="space-y-2">
    <button onclick="closeModal();toggleSearchPanel();" class="w-full text-left px-4 py-3 rounded-xl border hover:bg-slate-50 flex items-center gap-3"><iconify-icon icon="material-symbols:search" width="20" class="text-slate-600"></iconify-icon><span class="font-medium">${t('messages.searchInConversation')}</span></button>
    <button onclick="closeModal();openConversationInfo();" class="w-full text-left px-4 py-3 rounded-xl border hover:bg-slate-50 flex items-center gap-3"><iconify-icon icon="material-symbols:info" width="20" class="text-emerald-600"></iconify-icon><span class="font-medium">${t('messages.conversationInfo')}</span></button>
    <button onclick="toggleMute('${activeConversationId}');closeModal();" class="w-full text-left px-4 py-3 rounded-xl border hover:bg-slate-50 flex items-center gap-3"><iconify-icon icon="material-symbols:notifications-off-outline" width="20" class="text-blue-600"></iconify-icon><span class="font-medium">${s.muted ? t('messages.unmuteConversation') : t('messages.muteConversation')}</span></button>
    <button onclick="togglePin('${activeConversationId}');closeModal();" class="w-full text-left px-4 py-3 rounded-xl border hover:bg-slate-50 flex items-center gap-3"><iconify-icon icon="material-symbols:push-pin" width="20" class="text-emerald-600"></iconify-icon><span class="font-medium">${s.pinned ? t('messages.unpinConversation') : t('messages.pinConversation')}</span></button>
    <button onclick="toggleArchive('${activeConversationId}');closeModal();" class="w-full text-left px-4 py-3 rounded-xl border hover:bg-slate-50 flex items-center gap-3"><iconify-icon icon="material-symbols:archive-outline" width="20" class="text-amber-600"></iconify-icon><span class="font-medium">${s.archived ? t('messages.unarchiveConversation') : t('messages.archiveConversation')}</span></button>
    <button onclick="closeModal();markConversationUnread('${activeConversationId}');" class="w-full text-left px-4 py-3 rounded-xl border hover:bg-slate-50 flex items-center gap-3"><iconify-icon icon="material-symbols:mark-email-unread" width="20" class="text-indigo-600"></iconify-icon><span class="font-medium">${t('messages.markUnread')}</span></button>
  </div>`);
};

window.markConversationUnread = async (cid) => {
  if (!cid) return;
  try {
    await updateDoc(doc(db, CONVERSATIONS, cid), { [`unread.${currentUser.uid}`]: 1 });
    showToast(t('messages.markUnread'), 'success');
  } catch (err) { showToast(t('common.somethingWentWrong'), 'error'); }
};

/* ============ CONVERSATION INFO PANEL ============ */
window.openConversationInfo = () => {
  if (!activeConversationId || !activeOwnerId) return;
  convInfoOpen = true;
  convInfoTab = 'media';
  document.querySelector('.messages-shell')?.classList.add('info-open');
  const panel = document.getElementById('messages-info-panel');
  if (panel) panel.classList.remove('hidden');
  _convInfoBoundCid = activeConversationId;
  renderConversationInfo();
};

window.closeConversationInfo = () => {
  convInfoOpen = false;
  _convInfoBoundCid = null;
  document.querySelector('.messages-shell')?.classList.remove('info-open');
  const panel = document.getElementById('messages-info-panel');
  if (panel) panel.classList.add('hidden');
};

window.setConvInfoTab = (tab) => { convInfoTab = tab; renderConversationInfo(); };

window.viewAllSharedMedia = () => { convInfoTab = 'media'; renderConversationInfo(); };
window.viewAllSharedFiles = () => { convInfoTab = 'docs'; renderConversationInfo(); };

function buildConversationInfoData() {
  if (!activeOwnerId) return null;
  const op = activeOwnerProfile || {};
  const conv = conversationsData.find(c => c.id === activeConversationId);
  const visible = messagesCache.filter(m => !(m.deleted_for && m.deleted_for.includes(currentUser.uid)));
  const media = visible.filter(m => m.type === 'attachment' && m.attachment?.mime?.startsWith('image/') && isSafeAttachmentUrl(m.attachment.url));
  const files = visible.filter(m => m.type === 'attachment' && m.attachment && !m.attachment.mime?.startsWith('image/') && isSafeAttachmentUrl(m.attachment.url));
  const starred = visible.filter(m => Array.isArray(m.starred_by) && m.starred_by.includes(currentUser.uid));
  const online = !!presenceMap[activeOwnerId]?.online;
  const lastSeenTs = presenceMap[activeOwnerId]?.last_changed;
  const userSettings = conv?.user_settings?.[currentUser.uid] || {};
  const orgName = getCompanyDetails().name;
  return { op, conv, visible, media, files, starred, online, lastSeenTs, userSettings, orgName };
}

function renderConversationInfo() {
  const el = document.getElementById('messages-info-panel');
  if (!el) return;
  const data = buildConversationInfoData();
  if (!data) { el.innerHTML = ''; return; }
  const { op, conv, media, files, starred, online, lastSeenTs, userSettings, orgName } = data;
  const name = op.full_name || 'Owner';
  const photo = op.profile_picture || '';
  const presenceLabel = online ? t('messages.online') : (lastSeenTs ? `${t('messages.lastSeen')} ${formatChatTime(lastSeenTs)}` : t('messages.offline'));
  const previewMedia = media.slice(-6).reverse();
  const previewFiles = files.slice(-3).reverse();

  let contentHtml = '';
  if (convInfoTab === 'media') {
    if (!media.length) contentHtml = `<div class="info-empty">${t('common.noDataAvailable')}</div>`;
    else contentHtml = `<div class="media-grid">${previewMedia.map(m => `<div class="media-cell" onclick="openAttachmentLightbox('${escapeHTML(m.attachment.url)}')"><img src="${escapeHTML(m.attachment.url)}" alt=""></div>`).join('')}</div>`;
  } else if (convInfoTab === 'docs') {
    if (!files.length) contentHtml = `<div class="info-empty">${t('common.noDataAvailable')}</div>`;
    else contentHtml = previewFiles.map(m => {
      const a = m.attachment;
      const fileIcon = (a.mime && a.mime.includes('pdf')) ? 'picture_as_pdf' : (a.mime && (a.mime.includes('sheet') || a.mime.includes('excel'))) ? 'table_chart' : 'description';
      return `<div class="file-row"><div class="file-icon"><iconify-icon icon="material-symbols:${fileIcon}" width="20"></iconify-icon></div><div class="file-info"><div class="file-name">${escapeHTML(a.name || 'file')}</div><div class="file-size">${formatBytes(a.size || 0)}</div></div><a href="${escapeHTML(a.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><iconify-icon icon="material-symbols:download" width="18"></iconify-icon></a></div>`;
    }).join('');
  } else if (convInfoTab === 'starred') {
    if (!starred.length) contentHtml = `<div class="info-empty">${t('common.noDataAvailable')}</div>`;
    else contentHtml = starred.slice(-6).reverse().map(m => `<div class="file-row" onclick="scrollToMessage('${m.id}');closeConversationInfo();" style="cursor:pointer"><div class="file-icon"><iconify-icon icon="material-symbols:star" class="filled" width="20"></iconify-icon></div><div class="file-info"><div class="file-name">${escapeHTML((m.text || (m.attachment && m.attachment.name) || m.shared_record?.title || '').slice(0, 60) || '—')}</div><div class="file-size">${escapeHTML(formatChatTime(m.created_at))}</div></div></div>`).join('');
  }

  const convStartedAt = conv?.created_at ? formatDate(conv.created_at) : '—';
  const msgCount = messagesCache.filter(m => !(m.deleted_for && m.deleted_for.includes(currentUser.uid))).length;

  el.innerHTML = `
    <div class="info-header">
      <button type="button" onclick="closeConversationInfo()" class="lg:hidden" aria-label="${t('messages.back')}"><iconify-icon icon="material-symbols:arrow-back" width="20"></iconify-icon></button>
      <h3>${t('messages.conversationInfo')}</h3>
      <button type="button" onclick="closeConversationInfo()" aria-label="${t('common.close')}"><iconify-icon icon="material-symbols:close" width="20"></iconify-icon></button>
    </div>
    <div class="info-scroll">
      <div class="info-hero">
        <div class="avatar">${photo ? `<img src="${escapeHTML(photo)}" alt="${escapeHTML(name)}">` : escapeHTML(initialsOf(name))}</div>
        <div class="name">${escapeHTML(name)}</div>
        ${op.email ? `<div class="email">${escapeHTML(op.email)}</div>` : ''}
        <div class="org">${escapeHTML(orgName)}</div>
        <div class="presence ${online ? 'text-green-600' : 'text-slate-500'}">${escapeHTML(presenceLabel)}</div>
      </div>

      <div class="info-section">
        <h4>${t('messages.contact')}</h4>
        <div class="info-row"><span class="label">${t('messages.email')}</span><span class="value">${escapeHTML(op.email || '—')}</span></div>
        <div class="info-row"><span class="label">${t('messages.phone')}</span><span class="value">${escapeHTML(op.phone || '—')}</span></div>
        <div class="info-row"><span class="label">${t('messages.role')}</span><span class="value">${escapeHTML(op.role || 'owner')}</span></div>
        <div class="info-row"><span class="label">${t('messages.assignedSite')}</span><span class="value">${escapeHTML(assignedSites.map(s=>s.name).join(', ') || '—')}</span></div>
      </div>

      <div class="info-section">
        <h4>${t('messages.conversationDetails')}</h4>
        <div class="info-row"><span class="label">${t('messages.started')}</span><span class="value">${escapeHTML(convStartedAt)}</span></div>
        <div class="info-row"><span class="label">${t('messages.messagesCount')}</span><span class="value">${msgCount}</span></div>
        <div class="info-row"><span class="label">${t('messages.mediaCount')}</span><span class="value">${media.length}</span></div>
        <div class="info-row"><span class="label">${t('messages.filesCount')}</span><span class="value">${files.length}</span></div>
      </div>

      <div class="info-section">
        <h4>${t('messages.settings')}</h4>
        <button class="info-action" onclick="toggleMute('${activeConversationId}')">
          <iconify-icon icon="material-symbols:notifications-off-outline" width="20"></iconify-icon>
          <span class="flex-1">${userSettings.muted ? t('messages.unmuteConversation') : t('messages.muteConversation')}</span>
          <iconify-icon icon="${userSettings.muted ? 'material-symbols:notifications-off' : 'material-symbols:notifications-active'}" width="18" class="${userSettings.muted ? 'text-slate-400' : 'text-emerald-600'}"></iconify-icon>
        </button>
        <button class="info-action" onclick="togglePin('${activeConversationId}')">
          <iconify-icon icon="material-symbols:push-pin" width="20"></iconify-icon>
          <span class="flex-1">${userSettings.pinned ? t('messages.unpinConversation') : t('messages.pinConversation')}</span>
          <iconify-icon icon="${userSettings.pinned ? 'material-symbols:push-pin' : 'material-symbols:push-pin-outline'}" width="18" class="${userSettings.pinned ? 'text-emerald-600' : 'text-slate-400'}"></iconify-icon>
        </button>
        <button class="info-action" onclick="markConversationUnread('${activeConversationId}')">
          <iconify-icon icon="material-symbols:mark-email-unread" width="20"></iconify-icon>
          <span class="flex-1">${t('messages.markUnread')}</span>
        </button>
      </div>

      <div class="info-section" style="background:transparent;padding:0">
        <div class="info-tabs">
          <button class="${convInfoTab === 'media' ? 'active' : ''}" onclick="setConvInfoTab('media')">${t('messages.media')} (${media.length})</button>
          <button class="${convInfoTab === 'docs' ? 'active' : ''}" onclick="setConvInfoTab('docs')">${t('messages.docs')} (${files.length})</button>
          <button class="${convInfoTab === 'starred' ? 'active' : ''}" onclick="setConvInfoTab('starred')">${t('messages.starred')} (${starred.length})</button>
        </div>
        <div>${contentHtml}</div>
        ${convInfoTab === 'media' && media.length > 6 ? `<button class="info-action mt-2" onclick="viewAllSharedMedia()"><iconify-icon icon="material-symbols:photo-library" width="20"></iconify-icon><span class="flex-1">${t('common.viewAll')} (${media.length})</span></button>` : ''}
        ${convInfoTab === 'docs' && files.length > 3 ? `<button class="info-action mt-2" onclick="viewAllSharedFiles()"><iconify-icon icon="material-symbols:folder" width="20"></iconify-icon><span class="flex-1">${t('common.viewAll')} (${files.length})</span></button>` : ''}
      </div>
    </div>`;
}
window.renderConversationInfo = renderConversationInfo;

function updateMessagesBadge() {
  if (!currentUser) return;
  const total = conversationsData.reduce((sum, c) => sum + ((c.unread && c.unread[currentUser.uid]) || 0), 0);
  const badge = document.getElementById('messages-nav-badge');
  if (!badge) return;
  if (total > 0) { badge.textContent = total > 99 ? '99+' : String(total); badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
  maybeShowDesktopNotification(total);
}
let _lastNotified = 0;
function maybeShowDesktopNotification(total) {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  if (total <= _lastNotified) { _lastNotified = total; return; }
  _lastNotified = total;
  const c = conversationsData.find(x => x.unread && x.unread[currentUser.uid] > 0);
  if (!c) return;
  const s = c.user_settings?.[currentUser.uid] || {};
  if (s.muted) return;
  try { new Notification(t('messages.newMessageFrom', { name: activeOwnerProfile?.full_name || 'Owner' }), { body: c.last_message?.text || '', icon: 'shdr_logo Background Removed.png' }); } catch (_) {}
}

document.addEventListener('click', (ev) => {
  if (emojiPickerOpen) {
    const picker = document.getElementById('emoji-picker');
    const btn = ev.target.closest?.('button[onclick*="toggleEmojiPicker"]');
    if (picker && !picker.contains(ev.target) && !btn) { emojiPickerOpen = false; picker.classList.remove('open'); }
  }
  const menu = document.getElementById('msg-action-menu');
  if (menu && !menu.contains(ev.target)) closeMsgMenu();
  const rp = document.getElementById('reaction-picker-floating');
  if (rp && !rp.contains(ev.target)) closeReactionPicker();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { closeMsgMenu(); closeReactionPicker(); if (convInfoOpen) closeConversationInfo(); }
});

// INIT

function initLanguage(){
  document.querySelectorAll('.lang-btn').forEach(b=>{const a=b.dataset.language===currentLanguage;b.classList.toggle('active',a)});
  document.documentElement.lang=currentLanguage;applyTranslations();
}
async function initApp(){
  initLanguage();
  onAuthStateChanged(auth,async(user)=>{
    if(!user){window.location.href='../manager.html';return}
    currentUser=user;
    try{
      const pref=doc(db,'profiles',user.uid);
      const snap=await getDoc(pref);
      if(!snap.exists()||snap.data().role!=='manager'){await signOut(auth);window.location.href='../manager.html';return}
      managerProfile=snap.data();updateProfileUI(managerProfile);
      onSnapshot(pref,s=>{if(s.exists()){managerProfile=s.data();updateProfileUI(managerProfile);if(currentSection==='settings')populateSettingsForms()}});
      let ids=[];
      if(managerProfile.assigned_sites&&Array.isArray(managerProfile.assigned_sites))ids=managerProfile.assigned_sites;
      else if(managerProfile.assigned_site)ids=[managerProfile.assigned_site];
      if(ids.length){
        const snaps=await Promise.all(ids.map(id=>getDoc(doc(db,'sites',id))));
        assignedSites=snaps.filter(s=>s.exists()).map(s=>({id:s.id,...s.data()}));
        if(assignedSites.length){
          currentSiteId=assignedSites[0].id;
          const sel=document.getElementById('site-selector');
          if(assignedSites.length>1){sel.classList.remove('hidden');sel.innerHTML=assignedSites.map(s=>`<option value="${s.id}" ${s.id===currentSiteId?'selected':''}>${s.name}</option>`).join('')}
          else{sel.classList.add('hidden')}
          attachListeners();
        }
      }
      attachMessagingListeners();
      showSection('dashboard');
    }catch(err){console.error('Init error:',err);showError('Failed to initialize: '+err.message)}
  });
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initApp)}else{initApp()}
console.log('✅ SHDR Manager Dashboard — messaging v4 enabled');
