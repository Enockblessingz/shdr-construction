<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#059669">
<link rel="icon" type="image/jpeg" href="shdr_logo Background Removed.png">
<link rel="apple-touch-icon" href="shdr_logo Background Removed.png">
<title>Accept Invitation — SHDR Ltd</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
*{font-family:'Plus Jakarta Sans',sans-serif}
body{background:linear-gradient(135deg,#ecfdf5 0%,#f0fdf4 50%,#f8fafc 100%);min-height:100vh}
.material-symbols-outlined{font-family:'Material Symbols Outlined',sans-serif !important;font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.spinner{border:3px solid #e2e8f0;border-top:3px solid #059669;border-radius:50%;width:28px;height:28px;animation:spin .8s linear infinite;display:inline-block}
.btn-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top:2px solid #fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#fff;border-radius:20px;box-shadow:0 20px 50px -12px rgba(5,150,105,.25),0 4px 12px rgba(0,0,0,.04);border:1px solid #e5e7eb}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.20);transform:translateY(80px);opacity:0;transition:all .4s ease;z-index:999;max-width:400px;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left:4px solid #059669}
.toast.error{border-left:4px solid #ef4444}
.toast.info{border-left:4px solid #3b82f6}
input,button{font-family:inherit}
.field{width:100%;padding:.75rem 1rem;border:1px solid #d1d5db;border-radius:10px;font-size:.95rem;transition:all .2s;background:#fff}
.field:focus{outline:none;border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.15)}
.btn-primary{background:#059669;color:#fff;padding:.85rem 1.5rem;border-radius:10px;font-weight:600;border:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-primary:hover:not(:disabled){background:#047857;transform:translateY(-1px);box-shadow:0 6px 16px rgba(5,150,105,.3)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-secondary{background:#fff;color:#334155;padding:.85rem 1.5rem;border-radius:10px;font-weight:600;border:1px solid #d1d5db;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-secondary:hover{background:#f8fafc;border-color:#94a3b8}
.tab-btn{flex:1;padding:.65rem 1rem;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;background:transparent;color:#64748b}
.tab-btn.active{background:#fff;color:#059669;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.tab-wrapper{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:12px;margin-bottom:1.5rem}
</style>
</head>
<body>

<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-lg">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 mb-4">
        <img src="shdr_logo Background Removed.png" alt="SHDR" class="w-full h-full object-contain"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="hidden w-16 h-16 rounded-2xl bg-emerald-600 text-white items-center justify-center font-bold text-2xl">SH</div>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Sustainable Homes Design Rwanda</h1>
      <p class="text-sm text-slate-500 mt-1">Construction Sites Management System</p>
    </div>

    <div id="card-host" class="card p-6 sm:p-8"></div>

    <p class="text-center text-xs text-slate-400 mt-6">
      Need help? Contact <a href="mailto:sustainablehomedesign@gmail.com" class="text-emerald-600 hover:underline">sustainablehomedesign@gmail.com</a>
    </p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBVTLxC6nWpWL6a4BLI3xghdgUoR_cgGzw",
  authDomain: "shdr-construction.firebaseapp.com",
  databaseURL: "https://shdr-construction-default-rtdb.firebaseio.com",
  projectId: "shdr-construction",
  storageBucket: "shdr-construction.firebasestorage.app",
  messagingSenderId: "418309267761",
  appId: "1:418309267761:web:328922587ea18021e21010"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const params   = new URLSearchParams(location.search);
const rawToken = params.get('token');
const invId    = params.get('inv');

let invitation = null;
let orgDetails = null;
let siteDetails = null;
let authMode = 'signup';
let busy = false;

function showToast(msg, type = 'info') {
  const el = document.getElementById('toast');
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  el.innerHTML = '';
  const s = document.createElement('span'); s.textContent = icons[type] || 'ℹ️';
  el.appendChild(s);
  el.appendChild(document.createTextNode(' ' + msg));
  el.className = 'toast ' + type;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 5000);
}

async function sha256Hex(str) {
  const buf = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(html) { document.getElementById('card-host').innerHTML = html; }

function renderInvalid(reason) {
  render(`
    <div class="text-center">
      <div class="w-16 h-16 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined" style="font-size:32px">link_off</span>
      </div>
      <h2 class="text-xl font-bold text-slate-900 mb-2">Invitation Not Available</h2>
      <p class="text-sm text-slate-500 mb-6">${escapeHTML(reason)}</p>
      <a href="https://shdr-construction.vercel.app/index.html" class="btn-secondary" style="text-decoration:none">Return to Home</a>
    </div>
  `);
}

async function loadInvitation() {
  if (!rawToken || !invId) {
    renderInvalid('The invitation link is missing required parameters.');
    return false;
  }

  render(`
    <div class="text-center py-8">
      <div class="spinner"></div>
      <p class="text-sm text-slate-500 mt-4">Verifying your invitation…</p>
    </div>
  `);

  try {
    const providedHash = await sha256Hex(rawToken);
    const invRef = doc(db, 'manager_invitations', invId);
    const snap = await getDoc(invRef);

    if (!snap.exists()) {
      renderInvalid('We could not find this invitation. It may have been deleted.');
      return false;
    }
    invitation = { id: snap.id, ...snap.data() };

    if (invitation.token_hash !== providedHash) {
      renderInvalid('This invitation link is invalid or has been replaced by a newer one.');
      return false;
    }
    if (invitation.status === 'revoked') {
      renderInvalid('This invitation has been revoked by the organization administrator.');
      return false;
    }
    if (invitation.status === 'accepted') {
      renderInvalid('This invitation has already been accepted. Please sign in with your manager account instead.');
      return false;
    }
    if (invitation.status === 'expired' || (invitation.expires_at && new Date(invitation.expires_at) < new Date())) {
      renderInvalid('This invitation has expired. Please contact the organization administrator for a new invitation.');
      return false;
    }
    if (invitation.status !== 'pending') {
      renderInvalid('This invitation is no longer valid.');
      return false;
    }

    try {
      const orgSnap = await getDoc(doc(db, 'organizations', invitation.organization_id));
      if (orgSnap.exists()) orgDetails = { id: orgSnap.id, ...orgSnap.data() };
    } catch (_) {}
    try {
      const siteSnap = await getDoc(doc(db, 'sites', invitation.assigned_site_id));
      if (siteSnap.exists()) siteDetails = { id: siteSnap.id, ...siteSnap.data() };
    } catch (_) {}

    return true;
  } catch (err) {
    console.error('loadInvitation failed:', err);
    renderInvalid('We could not verify your invitation. Please try again later.');
    return false;
  }
}

function invitationHeaderHTML() {
  return `
    <div class="mb-6">
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold mb-4">
        <span class="material-symbols-outlined" style="font-size:14px">mail</span>
        You're invited
      </div>
      <h2 class="text-xl font-bold text-slate-900 mb-1">
        Join <span class="text-emerald-600">${escapeHTML(orgDetails?.name || 'the organization')}</span>
      </h2>
      <p class="text-sm text-slate-500">
        ${escapeHTML(invitation.invited_by_name || 'The administrator')} has invited you to the SHDR Management System.
      </p>
    </div>

    <div class="bg-slate-50 rounded-xl p-4 space-y-3 mb-6 text-sm">
      <div class="flex items-start justify-between gap-3">
        <span class="text-slate-500 flex items-center gap-1.5"><span class="material-symbols-outlined" style="font-size:16px">badge</span>Role</span>
        <span class="font-semibold text-slate-800 text-right">Site Manager</span>
      </div>
      <div class="flex items-start justify-between gap-3">
        <span class="text-slate-500 flex items-center gap-1.5"><span class="material-symbols-outlined" style="font-size:16px">construction</span>Assigned Site</span>
        <span class="font-semibold text-slate-800 text-right">${escapeHTML(siteDetails?.name || 'To be assigned')}</span>
      </div>
      <div class="flex items-start justify-between gap-3">
        <span class="text-slate-500 flex items-center gap-1.5"><span class="material-symbols-outlined" style="font-size:16px">mail</span>Email</span>
        <span class="font-semibold text-slate-800 text-right break-all">${escapeHTML(invitation.email)}</span>
      </div>
      <div class="flex items-start justify-between gap-3">
        <span class="text-slate-500 flex items-center gap-1.5"><span class="material-symbols-outlined" style="font-size:16px">schedule</span>Expires</span>
        <span class="font-semibold text-slate-800 text-right">${invitation.expires_at ? new Date(invitation.expires_at).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}) : '—'}</span>
      </div>
    </div>
  `;
}

function renderAuthForm() {
  const email = invitation.email || '';
  const prefilledName = invitation.full_name || '';

  render(`
    ${invitationHeaderHTML()}

    <div class="tab-wrapper" role="tablist">
      <button class="tab-btn ${authMode === 'signup' ? 'active' : ''}" onclick="setAuthMode('signup')">Create Account</button>
      <button class="tab-btn ${authMode === 'signin' ? 'active' : ''}" onclick="setAuthMode('signin')">Sign In</button>
    </div>

    <form id="auth-form" onsubmit="handleAuthSubmit(event)">
      ${authMode === 'signup' ? `
        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Full Name</label>
          <input type="text" id="auth-name" class="field" required value="${escapeHTML(prefilledName)}" placeholder="Your full name">
        </div>
      ` : ''}

      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
        <input type="email" id="auth-email" class="field" required value="${escapeHTML(email)}" readonly
               style="background:#f8fafc;color:#64748b;cursor:not-allowed">
        <p class="text-xs text-slate-400 mt-1">This is the email the invitation was sent to.</p>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
        <input type="password" id="auth-password" class="field" required minlength="6" placeholder="At least 6 characters">
        ${authMode === 'signup' ? `<p class="text-xs text-slate-400 mt-1">You will use this password to sign in next time.</p>` : ''}
      </div>

      <button type="submit" class="btn-primary" id="auth-submit">
        <span class="material-symbols-outlined" style="font-size:18px">${authMode === 'signup' ? 'person_add' : 'login'}</span>
        ${authMode === 'signup' ? 'Create Account & Accept' : 'Sign In & Accept'}
      </button>
    </form>

    <p class="text-xs text-slate-400 text-center mt-4">
      By continuing you agree to join <strong>${escapeHTML(orgDetails?.name || 'this organization')}</strong> as a Site Manager.
    </p>
  `);
}

window.setAuthMode = (mode) => {
  if (busy) return;
  authMode = mode;
  renderAuthForm();
};

function renderAcceptConfirmation(user) {
  const emailMatches = (user.email || '').toLowerCase() === (invitation.email || '').toLowerCase();

  render(`
    ${invitationHeaderHTML()}

    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-6">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined" style="font-size:20px">check</span>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold text-emerald-900">You're signed in</p>
          <p class="text-xs text-emerald-700 truncate">${escapeHTML(user.email || '')}</p>
        </div>
        <button onclick="handleSignOut()" class="text-xs text-emerald-700 hover:text-emerald-900 font-medium underline">Sign out</button>
      </div>
    </div>

    ${!emailMatches ? `
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6">
        <p class="text-sm text-amber-800">
          <strong>Heads up:</strong> You're signed in as <strong>${escapeHTML(user.email || '')}</strong>, but this invitation was sent to <strong>${escapeHTML(invitation.email)}</strong>. Please sign out and sign in with the correct account.
        </p>
      </div>
    ` : ''}

    <button type="button" class="btn-primary" id="accept-btn"
            onclick="handleAccept()" ${!emailMatches ? 'disabled' : ''}>
      <span class="material-symbols-outlined" style="font-size:18px">check_circle</span>
      Accept Invitation
    </button>
  `);
}

window.handleAuthSubmit = async (e) => {
  e.preventDefault();
  if (busy) return;
  busy = true;
  const btn = document.getElementById('auth-submit');

  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const name = document.getElementById('auth-name')?.value?.trim() || invitation.full_name || '';

  if (email.toLowerCase() !== (invitation.email || '').toLowerCase()) {
    showToast('Please use the email address the invitation was sent to.', 'error');
    busy = false;
    return;
  }

  btn.disabled = true;
  const origHTML = btn.innerHTML;
  btn.innerHTML = `<span class="btn-spinner"></span> ${authMode === 'signup' ? 'Creating account…' : 'Signing in…'}`;

  try {
    if (authMode === 'signup') {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      if (name) { try { await updateProfile(cred.user, { displayName: name }); } catch(_) {} }
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (err) {
    console.error('auth error:', err);
    const code = err.code || '';
    let msg = 'Authentication failed. Please try again.';
    if (code === 'auth/email-already-in-use')         msg = 'This email already has an account. Switch to the Sign In tab.';
    else if (code === 'auth/invalid-credential' || code === 'auth/wrong-password')
      msg = 'Incorrect password. Please try again.';
    else if (code === 'auth/user-not-found')          msg = 'No account found. Switch to the Create Account tab.';
    else if (code === 'auth/weak-password')           msg = 'Password must be at least 6 characters.';
    else if (code === 'auth/invalid-email')           msg = 'Invalid email address.';
    else if (code === 'auth/too-many-requests')       msg = 'Too many attempts. Please wait a few minutes.';
    else if (code === 'auth/network-request-failed')  msg = 'Network error. Check your connection.';
    showToast(msg, 'error');
    btn.disabled = false;
    btn.innerHTML = origHTML;
  } finally {
    busy = false;
  }
};

window.handleSignOut = async () => {
  try { await signOut(auth); } catch (_) {}
};

window.handleAccept = async () => {
  if (busy) return;
  const user = auth.currentUser;
  if (!user) { showToast('Please sign in first.', 'error'); return; }

  if ((user.email || '').toLowerCase() !== (invitation.email || '').toLowerCase()) {
    showToast('Signed-in email does not match the invitation.', 'error');
    return;
  }

  busy = true;
  const btn = document.getElementById('accept-btn');
  btn.disabled = true;
  const origHTML = btn.innerHTML;
  btn.innerHTML = `<span class="btn-spinner"></span> Accepting…`;

  try {
    const uid = user.uid;
    const now = new Date().toISOString();

    const freshSnap = await getDoc(doc(db, 'manager_invitations', invId));
    if (!freshSnap.exists() || freshSnap.data().status !== 'pending') {
      showToast('This invitation is no longer valid.', 'error');
      btn.disabled = false;
      btn.innerHTML = origHTML;
      busy = false;
      return;
    }

    const profileRef = doc(db, 'profiles', uid);
    const existingProfile = await getDoc(profileRef);

    const profileData = {
      email: user.email,
      full_name: invitation.full_name || user.displayName || (user.email || '').split('@')[0],
      phone: invitation.phone || '',
      role: 'manager',
      organization_id: invitation.organization_id,
      organization_status: 'active',
      assigned_site: invitation.assigned_site_id || null,
      status: 'active',
      updated_at: now
    };

    if (existingProfile.exists()) {
      await updateDoc(profileRef, profileData);
    } else {
      await setDoc(profileRef, { ...profileData, created_at: now });
    }

    try {
      await addDoc(collection(db, 'manager_site_assignments'), {
        organization_id: invitation.organization_id,
        manager_id: uid,
        site_id: invitation.assigned_site_id,
        assigned_by: invitation.invited_by,
        assigned_at: now,
        unassigned_at: null,
        status: 'active'
      });
    } catch (e) { console.warn('assignment creation failed:', e); }

    await updateDoc(doc(db, 'manager_invitations', invId), {
      status: 'accepted',
      accepted_at: now,
      accepted_by_uid: uid,
      updated_at: now
    });

    try {
      await addDoc(collection(db, 'audit_logs'), {
        organization_id: invitation.organization_id,
        actor_id: uid,
        actor_name: profileData.full_name,
        action: 'invitation_accepted',
        target_type: 'manager_invitation',
        target_id: invId,
        meta: { email: user.email },
        created_at: now
      });
    } catch (_) {}

    renderSuccess();
  } catch (err) {
    console.error('accept failed:', err);
    const msg = (err && err.code === 'permission-denied')
      ? 'Permission denied. Please contact the administrator.'
      : 'Could not complete your invitation. Please try again.';
    showToast(msg, 'error');
    btn.disabled = false;
    btn.innerHTML = origHTML;
  } finally {
    busy = false;
  }
};

function renderSuccess() {
  render(`
    <div class="text-center">
      <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined" style="font-size:36px">check_circle</span>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 mb-2">Welcome, ${escapeHTML(invitation.full_name || 'Manager')}!</h2>
      <p class="text-sm text-slate-500 mb-6">
        You have joined <strong>${escapeHTML(orgDetails?.name || 'the organization')}</strong> as a Site Manager.
      </p>

      <div class="bg-slate-50 rounded-xl p-4 space-y-2 text-sm text-left mb-6">
        <div class="flex justify-between"><span class="text-slate-500">Organization</span><span class="font-semibold text-slate-800">${escapeHTML(orgDetails?.name || '—')}</span></div>
        <div class="flex justify-between"><span class="text-slate-500">Role</span><span class="font-semibold text-slate-800">Site Manager</span></div>
        <div class="flex justify-between"><span class="text-slate-500">Assigned Site</span><span class="font-semibold text-slate-800">${escapeHTML(siteDetails?.name || 'To be assigned')}</span></div>
      </div>

      <a href="https://shdr-construction.vercel.app/manager.html" class="btn-primary" style="text-decoration:none">
        <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span>
        Continue to Manager Dashboard
      </a>
      <p class="text-xs text-slate-400 mt-3">If the dashboard does not open automatically, click the button above.</p>
    </div>
  `);

  setTimeout(() => {
    window.location.href = 'https://shdr-construction.vercel.app/manager.html';
  }, 3500);
}

(async function init() {
  const ok = await loadInvitation();
  if (!ok) return;
  onAuthStateChanged(auth, (user) => {
    if (!invitation) return;
    if (user) renderAcceptConfirmation(user);
    else renderAuthForm();
  });
})();
</script>
</body>
</html>
