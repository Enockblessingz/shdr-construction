.lang-btn:hover{background:rgba(30,86,160,.1)}
.lang-btn:focus-visible{outline:2px solid #1e56a0;outline-offset:2px}

.office-header{background:linear-gradient(135deg,#059669 0%,#047857 50%,#065f46 100%);border-radius:16px;padding:24px 28px;margin-bottom:28px;color:#fff;box-shadow:0 8px 30px rgba(5,150,105,.25)}
*{font-family:'Plus Jakarta Sans',sans-serif}
body{background:#f8fafc}
.sidebar-link.active{background:#ecfdf5;color:#059669;border-left:3px solid #059669}
.modal{display:none}
.modal.active{display:flex}
.spinner{border:3px solid #e2e8f0;border-top:3px solid #059669;border-radius:50%;width:24px;height:24px;animation:spin .8s linear infinite}
.btn-spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top:2px solid #fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}

tbody tr:nth-child(even){background:#f9fafb}
tbody tr:hover{background:#f1f5f9}
.payroll-card{transition:all .2s}

.settings-card .save-btn:hover{background:#047857}
.settings-card .save-btn:disabled{opacity:.6;cursor:not-allowed}
.settings-card .remove-photo-btn{color:#ef4444;font-size:.85rem;cursor:pointer;background:none;border:none;padding:.2rem .5rem}
.settings-card .remove-photo-btn:hover{color:#dc2626;text-decoration:underline}

.tab-inactive{background:transparent;color:#64748b}

.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left:4px solid #059669}

  let currentLanguage = localStorage.getItem('shdr_language') || 'en';
  function getNestedTranslation(obj, key){return key.split('.').reduce((o,i)=>(o?o[i]:undefined),obj);}
  function t(key, params = {}) {
    let value = getNestedTranslation(translations[currentLanguage], key);
    if (value === undefined) value = getNestedTranslation(translations.en, key);
    if (value === undefined) return key;
    if (params) Object.keys(params).forEach(p => { value = value.replace(new RegExp(`{${p}}`, 'g'), params[p]); });
    return value;
  }
  function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-aria-label]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAriaLabel)); });
  }
  function setLanguage(lang) {
    if (!['en','rw','fr'].includes(lang)) return;
    currentLanguage = lang;
    localStorage.setItem('shdr_language', lang);
    document.querySelectorAll('.lang-btn').forEach(btn => {
      const isActive = btn.dataset.language === lang;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', isActive.toString());
    });
    document.documentElement.lang = lang;
    applyTranslations();
    if (typeof showSection === 'function') showSection(currentSection);
  }
  document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => setLanguage(btn.dataset.language)));

  function formatDate(v){
    if(!v) return '—';
    let d, dateOnly=false;
    if(typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)){
      const [y,m,dd]=v.split('-').map(Number);
      d=new Date(y,m-1,dd);
      dateOnly=true;
    } else {
      d=typeof v==='string'?new Date(v):v;
    }
    if(isNaN(d.getTime())) return '—';
    const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
    const datePart=`${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    if(dateOnly) return datePart;
    const hh=String(d.getHours()).padStart(2,'0');
    const mm=String(d.getMinutes()).padStart(2,'0');
    const ampm = d.getHours() >= 12 ? 'PM' : 'AM';
    return `${datePart}, ${hh}:${mm} ${ampm}`;
  }
  function formatDateShort(v){ if(!v) return '—'; const d=typeof v==='string'?new Date(v):v; if(isNaN(d.getTime())) return '—'; return d.toISOString().split('T')[0]; }

  function attachListeners() {
    unsubscribeSnapshots.forEach(fn => { try { fn(); } catch(_){} });

    if (!currentUser) return;
    const sitesQ = query(collection(db, 'sites'), where('owner_id', '==', currentUser.uid));
    attachSnapshot(sitesQ, (snap) => {
      sitesData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      reloadRelated();
      refreshCurrentSection();
    }, 'sites');

      if (window._refreshing) return;
      window._refreshing = true;
      requestAnimationFrame(() => {
        try {
          let savedFilters = null;
          if (currentSection === 'reports') {
            savedFilters = {
              site: document.getElementById('report-site')?.value || document.getElementById('payroll-site')?.value || document.getElementById('stock-report-site')?.value || 'all',
              dept: document.getElementById('report-dept')?.value || 'all',

              pos: document.getElementById('payroll-position')?.value || 'all',
              status: document.getElementById('payroll-status')?.value || 'all'
            };

          showSection(currentSection);
          if (currentSection === 'reports' && savedFilters) {

            setIf('report-end', savedFilters.end);

    if (!confirm(t('alerts.areYouSure'))) return;
    if (!confirm(t('common.cannotUndo'))) return;
    try {
      const collectionsToClear = ['materials','site_workers','progress_tasks','expenses','gallery','stock','stock_transactions','requisitions','requisition_items','requisition_history','worker_attendance'];
      for (const col of collectionsToClear) {
        const snap = await getDocs(query(collection(db, col), where('site_id', '==', id)));
        if (!snap.empty) {
          const batch = writeBatch(db);
          snap.docs.forEach(d => batch.delete(d.ref));
          await batch.commit();
        }
      }
      const mgrSnap = await getDocs(query(collection(db, 'profiles'), where('assigned_site', '==', id)));
      if (!mgrSnap.empty) {
        const batch = writeBatch(db);
        mgrSnap.docs.forEach(d => batch.update(d.ref, { assigned_site: '' }));
        await batch.commit();
      }
      await deleteDoc(doc(db, 'sites', id));

  window.handleEditMaterial = async (e, id) => {
    e.preventDefault();
    const btn = getFormSubmitBtn(e.target);
    setButtonLoading(btn, true);
    try {
      const name = document.getElementById('edit-mat-name').value.trim();
      const newUsed = parseFloat(document.getElementById('edit-mat-used').value) || 0;
      const newUnitCost = parseFloat(document.getElementById('edit-mat-unit-cost').value) || 0;
      const imageFile = document.getElementById('edit-mat-image').files[0];
      const oldMat = materialsData.find(m => m.id === id);
      if (!oldMat) throw new Error(t('alerts.somethingWentWrong'));
      const oldUsed = oldMat.quantity_used || 0;
      const siteId = oldMat.site_id;
      let stockItem = stockData.find(s => s.site_id === siteId && s.material_name === oldMat.name);
      if (!stockItem) {
        const ref = await addDoc(collection(db, 'stock'), { site_id: siteId, material_name: oldMat.name, quantity: 0, unit: 'units', created_at: new Date().toISOString(), updated_at: new Date().toISOString() });
        stockItem = { id: ref.id, quantity: 0, material_name: oldMat.name };
      }
      const restoredQuantity = stockItem.quantity + oldUsed;
      if (newUsed > restoredQuantity) {
        showToast(`${t('alerts.invalidValue')}: ${restoredQuantity} ${t('materials.availableStock')}`, 'error');
        return;
      }
      const newStockQty = restoredQuantity - newUsed;
      const batch = writeBatch(db);
      const updateData = { name, quantity_used: newUsed, unit_cost: newUnitCost, updated_at: new Date().toISOString() };
      if (imageFile) updateData.image = await uploadImageToImgbb(imageFile);
      batch.update(doc(db, 'materials', id), updateData);
      batch.update(doc(db, 'stock', stockItem.id), { quantity: newStockQty, updated_at: new Date().toISOString() });
      batch.set(doc(collection(db, 'stock_transactions')), {
        site_id: siteId, stock_id: stockItem.id, material_name: oldMat.name,
        transaction_type: 'MATERIAL_USAGE_EDITED', quantity: newUsed - oldUsed,
        previous_quantity: stockItem.quantity, new_quantity: newStockQty,
        unit: stockItem.unit || 'units', notes: `Material usage edited: ${oldUsed} → ${newUsed}`,
        recorded_by: currentUser.uid, created_at: new Date().toISOString()
      });
      await batch.commit();
      closeModal();
      showToast(t('alerts.updatedSuccessfully'), 'success');
    } catch (err) { console.error(err); showToast(t('alerts.somethingWentWrong'), 'error'); }
    finally { setButtonLoading(btn, false); }
  };

  window.openSupplyModal = (reqId) => {

    if (!req) return;
    const items = ownerRequisitionItemsData.filter(i => i.requisition_id === reqId);
    let itemsHtml = '';
    items.forEach(item => {
      const stock = stockData.find(s => s.site_id === req.site_id && s.material_name === item.material_name);
      const available = stock ? stock.quantity : 0;
      const alreadySupplied = toNumber(item.quantity_supplied);
      const remaining = toNumber(item.quantity_requested) - alreadySupplied;
      itemsHtml += `
        <div class="flex gap-2 items-center mb-2">
          <span class="w-1/4 text-sm">${item.material_name}</span>
          <span class="w-1/6 text-sm">${t('materials.requested')}: ${item.quantity_requested}</span>

    openModal(t('materials.supply'), `<form onsubmit="handleSupply(event, '${reqId}')"><div class="space-y-2 mb-4">${itemsHtml}</div><button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-xl">${t('common.save')}</button></form>`);
  };

  window.handleSupply = async (e, reqId) => {
    e.preventDefault();
    const btn = getFormSubmitBtn(e.target);
    setButtonLoading(btn, true);
    try {
      const req = ownerRequisitionsData.find(r => r.id === reqId);
      if (!req) throw new Error('Requisition not found');
      const items = ownerRequisitionItemsData.filter(i => i.requisition_id === reqId);
      const batch = writeBatch(db);
      let anySupplied = false; let allSupplied = true;
      for (const item of items) {
        const supplyQty = parseFloat(document.getElementById(`supply-${item.id}`).value) || 0;
        if (supplyQty <= 0) { allSupplied = false; continue; }
        anySupplied = true;
        const stock = stockData.find(s => s.site_id === req.site_id && s.material_name === item.material_name);
        if (!stock) throw new Error('No stock found for ' + item.material_name);
        if (supplyQty > stock.quantity) throw new Error('Insufficient stock for ' + item.material_name);
        const newStockQty = stock.quantity - supplyQty;
        const newSupplied = toNumber(item.quantity_supplied) + supplyQty;
        batch.update(doc(db, 'stock', stock.id), { quantity: newStockQty, updated_at: new Date().toISOString() });
        batch.update(doc(db, 'requisition_items', item.id), { quantity_supplied: newSupplied, updated_at: new Date().toISOString() });
        batch.set(doc(collection(db, 'stock_transactions')), {
          site_id: req.site_id, stock_id: stock.id, material_name: item.material_name,
          transaction_type: 'REQUISITION_SUPPLY', quantity: supplyQty,
          previous_quantity: stock.quantity, new_quantity: newStockQty,
          unit: stock.unit || item.unit, notes: `Requisition ${req.requisition_number}`,
          recorded_by: currentUser.uid, created_at: new Date().toISOString()
        });
      }
      if (!anySupplied) throw new Error('No supply quantities entered');
      const newStatus = allSupplied ? 'Supplied' : 'Partially Supplied';
      batch.update(doc(db, 'requisitions', reqId), { status: newStatus, supplied_by: currentUser.uid, supplied_at: new Date().toISOString(), updated_at: new Date().toISOString() });
      batch.set(doc(collection(db, 'requisition_history')), {
        requisition_id: reqId, action: 'Supply', actor: currentUser.uid,
        actor_name: ownerProfile.full_name || 'Owner',
        timestamp: new Date().toISOString(), details: `Materials supplied. Status: ${newStatus}`
      });
      await batch.commit();
      closeModal();
      showToast(t('alerts.savedSuccessfully'), 'success');
    } catch (err) { console.error(err); showToast(err.message || t('alerts.somethingWentWrong'), 'error'); }
    finally { setButtonLoading(btn, false); }
  };

    const printHTML = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${req.requisition_number}</title>
      <style>${REPORT_PRINT_CSS}</style>
      </head><body>
      ${buildCompanyHeaderHTML(company).replace('__REPORT_TITLE__', 'Material Requisition')}
      <div class="report-meta"><strong>Requisition No.:</strong> ${req.requisition_number} &nbsp;|&nbsp; <strong>Site:</strong> ${siteName}<br><strong>Requested By:</strong> ${req.requested_by_name} &nbsp;|&nbsp; <strong>Request Date:</strong> ${formatDate(req.request_date)}<br><strong>Required Date:</strong> ${formatDate(req.required_date)} &nbsp;|&nbsp; <strong>Priority:</strong> ${req.priority === 'Urgent' ? t('materials.urgent') : t('materials.normal')} &nbsp;|&nbsp; <strong>Status:</strong> ${statusLabel}${req.notes ? `<br><strong>Notes:</strong> ${req.notes}` : ''}${req.rejection_reason ? `<br><strong style="color:#dc2626">Rejection Reason:</strong> ${req.rejection_reason}` : ''}</div>
      <table><thead><tr><th>Material</th><th style="text-align:right">Requested</th><th style="text-align:right">Supplied</th><th style="text-align:right">Remaining</th><th>Unit</th></tr></thead><tbody>${tableRows}</tbody></table>
      <h3 style="margin-top:30px; border-bottom:1px solid #ccc; padding-bottom:5px; font-size:13px; color:#065f46; text-transform:uppercase; letter-spacing:.5px;">Requisition History</h3>
      <div>${historyHtml || '<p style="font-size:12px; color:#888;">No history records.</p>'}</div>
      ${buildReportFooterHTML(company)}
      </body></html>`;
    const win = window.open('', '_blank', 'width=1000,height=700');
    if (!win) { showToast(t('common.accessDenied'), 'error'); return; }
    win.document.write(printHTML);
    win.document.close();

  function renderStock(container) {

      return;
    }
    const siteGroups = {};
    stockData.forEach(item => {
      const site = sitesData.find(s => s.id === item.site_id);
      const siteName = site ? site.name : 'Unknown Site';
      if (!siteGroups[siteName]) siteGroups[siteName] = [];
      siteGroups[siteName].push(item);
    });
    let html = `<h2 class="text-xl sm:text-2xl font-bold mb-4 flex items-center gap-2"><iconify-icon icon="material-symbols:inventory-2" class="text-emerald-600"></iconify-icon>${t('stock.title')}</h2><div class="space-y-6">`;
    for (const [siteName, items] of Object.entries(siteGroups)) {
      html += `<div class="bg-white rounded-2xl border p-4 shadow-sm"><h3 class="font-semibold text-sm text-slate-700 mb-3 flex items-center gap-2"><iconify-icon icon="material-symbols:location-on" class="text-emerald-600" width="16"></iconify-icon>${siteName}</h3><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">`;
      items.forEach(item => {
        const status = item.quantity <= 0 ? t('stock.out') : (item.minimum_quantity && item.quantity <= item.minimum_quantity ? t('stock.low') : t('stock.normal'));
        const statusClass = status === t('stock.normal') ? 'stock-status-normal' : status === t('stock.low') ? 'stock-status-low' : 'stock-status-out';
        const unitCost = materialsData.filter(m => m.site_id === item.site_id && m.name === item.material_name).pop()?.unit_cost || 0;
        const stockValue = item.quantity * unitCost;
        html += `
          <div class="bg-slate-50 rounded-xl p-3 border border-slate-200">
            <div class="flex justify-between items-start"><p class="font-medium text-slate-800">${item.material_name}</p><span class="text-xs font-medium px-2 py-0.5 rounded-full ${statusClass}">${status}</span></div>
            <p class="text-sm text-slate-600">${item.quantity} ${item.unit || 'units'}</p>
            <p class="text-xs text-slate-400">${t('stock.unitCost')}: ${unitCost.toFixed(2)} RWF</p>
            <p class="text-xs text-slate-600 font-medium">${t('stock.value')}: ${stockValue.toFixed(2)} RWF</p>
            ${item.minimum_quantity ? `<p class="text-xs text-slate-400">${t('stock.min')}: ${item.minimum_quantity}</p>` : ''}
            <p class="text-xs text-slate-400">${t('stock.updated')}: ${formatDate(item.updated_at)}</p>
          </div>`;
      });
      html += `</div></div>`;
    }
    const recent = stockTransactions.slice(0, 20);
    if (recent.length) {
      html += `<div class="bg-white rounded-2xl border p-4 shadow-sm"><h3 class="font-semibold text-sm mb-3 flex items-center gap-2"><iconify-icon icon="material-symbols:history" class="text-blue-600" width="18"></iconify-icon>${t('stock.recentTransactions')}</h3><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs"><tr><th class="px-3 py-2 text-left">${t('stock.date')}</th><th class="px-3 py-2 text-left">${t('stock.site')}</th><th class="px-3 py-2 text-left">${t('stock.material')}</th><th class="px-3 py-2 text-left">${t('stock.type')}</th><th class="px-3 py-2 text-left">${t('stock.qty')}</th><th class="px-3 py-2 text-left">${t('stock.notes')}</th></tr></thead><tbody>`;
      recent.forEach(tr => {
        const site = sitesData.find(s => s.id === tr.site_id);
        const siteName = site ? site.name : 'Unknown';
        const sign = (tr.transaction_type === 'STOCK_ADDED' || tr.transaction_type === 'STOCK_ADJUSTMENT' && tr.quantity > 0) ? '+' : '-';
        html += `<tr><td class="px-3 py-2">${formatDate(tr.created_at)}</td><td class="px-3 py-2">${siteName}</td><td class="px-3 py-2">${tr.material_name}</td><td class="px-3 py-2">${tr.transaction_type.replace('_', ' ')}</td><td class="px-3 py-2">${sign} ${tr.quantity} ${tr.unit || ''}</td><td class="px-3 py-2 text-xs text-slate-500">${tr.notes || ''}</td></tr>`;
      });
      html += `</tbody></table></div></div>`;
    }
    html += `</div>`;
    container.innerHTML = html;
  }

  // ── Payroll: read filters ──
  function readPayrollFilters() {
    const siteId = document.getElementById('payroll-site')?.value || 'all';
    const startDate = document.getElementById('payroll-start')?.value || '';
    const endDate = document.getElementById('payroll-end')?.value || '';
    const workerSearch = document.getElementById('payroll-worker-search')?.value?.toLowerCase() || '';
    const position = document.getElementById('payroll-position')?.value || 'all';
    const paymentStatus = document.getElementById('payroll-status')?.value || 'all';
    return { siteId, startDate, endDate, workerSearch, position, paymentStatus };
  }

  function isRecordPaid(rec) {
    if (!rec) return false;
    if (rec.payment_status === 'paid' || rec.paid === true || rec.is_paid === true) return true;
    return false;
  }

  function buildPayrollRows(filters) {
    const { siteId, startDate, endDate, workerSearch, position, paymentStatus } = filters;
    let filtered = attendanceData;
    if (siteId !== 'all') filtered = filtered.filter(a => a.site_id === siteId);
    if (startDate) filtered = filtered.filter(a => String(a.date || '').slice(0,10) >= startDate);
    if (endDate) filtered = filtered.filter(a => String(a.date || '').slice(0,10) <= endDate);
    if (workerSearch) filtered = filtered.filter(a => (a.name || '').toLowerCase().includes(workerSearch));
    if (position !== 'all') filtered = filtered.filter(a => a.role === position);
    if (paymentStatus === 'paid') filtered = filtered.filter(isRecordPaid);
    else if (paymentStatus === 'unpaid') filtered = filtered.filter(a => !isRecordPaid(a));

    const workerMap = {};
    filtered.forEach(rec => {
      const key = rec.worker_id || rec.id;
      if (!workerMap[key]) {
        workerMap[key] = { id: key, name: rec.name, role: rec.role, dailyRate: rec.daily_rate || 0, days: [], totalPayable: 0 };
      }
      workerMap[key].days.push(rec.date);
      workerMap[key].totalPayable += (rec.daily_rate || 0);
    });
    const workers = Object.values(workerMap);

  // ── Export General Report ──
  window.exportGeneralReport = (format) => {
    const company = getCompanyDetails();
    const siteId = document.getElementById('report-site')?.value || 'all';
    const dept = document.getElementById('report-dept')?.value || 'all';
    const startDate = document.getElementById('report-start')?.value || '';
    const endDate = document.getElementById('report-end')?.value || '';

    const filterByDate = (items, dateField) => {
      if (!startDate && !endDate) return items;
      return items.filter(item => {
        const raw = item[dateField];
        if (!raw) return false;
        const d = String(raw).slice(0,10);
        if (startDate && d < startDate) return false;
        if (endDate && d > endDate) return false;
        return true;
      });
    };
    const getSiteName = (id) => sitesData.find(s => s.id === id)?.name || 'Unknown';

    let data = [];
    if (dept === 'all' || dept === 'materials') {
      let mats = siteId !== 'all' ? materialsData.filter(m => m.site_id === siteId) : materialsData;
      mats = filterByDate(mats, 'created_at');
      data = data.concat(mats.map(m => ({
        Department: 'Materials',
        Site: getSiteName(m.site_id),
        Name: m.name,
        'Quantity Used': m.quantity_used || 0,
        'Unit Cost (RWF)': m.unit_cost || 0,
        'Total Amount (RWF)': calculateTotal(m.quantity_used || 0, m.unit_cost || 0),
        Date: m.created_at ? formatDateShort(m.created_at) : ''
      })));
    }
    if (dept === 'all' || dept === 'workers') {
      let assigned = siteId !== 'all' ? assignedWorkersData.filter(w => w.site_id === siteId) : assignedWorkersData;
      data = data.concat(assigned.map(w => ({ Department: 'Workers', Site: getSiteName(w.site_id), Name: w.name, Role: w.role, Salary: w.salary, Phone: w.phone })));
      let positions = siteId !== 'all' ? workersData.filter(p => p.site_id === siteId || p.site_id === 'all') : workersData;
      data = data.concat(positions.map(p => ({ Department: 'Worker Positions', Site: p.site_id === 'all' ? 'All Sites' : getSiteName(p.site_id), Role: p.role, 'Salary Type': p.salary_type, 'Est. Cost': p.estimated_cost })));
    }
    if (dept === 'all' || dept === 'finances') {
      let att = siteId !== 'all' ? attendanceData.filter(a => a.site_id === siteId) : attendanceData;
      att = filterByDate(att, 'date');
      const totalWorkerCost = att.reduce((sum, a) => sum + (a.daily_rate || 0), 0);
      let mats = siteId !== 'all' ? materialsData.filter(m => m.site_id === siteId) : materialsData;
      mats = filterByDate(mats, 'created_at');
      const totalMatCost = mats.reduce((sum, m) => sum + calculateTotal(m.quantity_used || 0, m.unit_cost || 0), 0);
      data.push({ Department: 'Finances', Category: 'Materials (Used)', Amount: totalMatCost, Description: 'Total material cost from used quantities' });
      data.push({ Department: 'Finances', Category: 'Workers (Attendance)', Amount: totalWorkerCost, Description: 'Total worker attendance cost' });
      data.push({ Department: 'Finances', Category: 'Total Spend', Amount: totalMatCost + totalWorkerCost, Description: 'Combined spend for the selected period' });
    }

    if (!data.length) { showToast('No data found for the selected filters.', 'error'); return; }

    const siteLabel = siteId === 'all' ? t('reports.allSites') : (sitesData.find(s => s.id === siteId)?.name || 'Site');
    const deptLabel = dept === 'all' ? t('reports.allDepartments') : dept.charAt(0).toUpperCase() + dept.slice(1);

    const period = (startDate || endDate) ? `${startDate || 'Start'} → ${endDate || 'Now'}` : 'All Time';
    const filename = `SHDR_${siteLabel.replace(/\s+/g,'_')}_${deptLabel.replace(/\s+/g,'_')}`;

    if (format === 'csv') {
      const headers = Object.keys(data[0]);
      const csvRows = [
        ...buildCsvMetadata(company, 'Management Report'),
        `"Site: ${siteLabel}"`,
        `"Department: ${deptLabel}"`,
        `"Period: ${period}"`,
        '',
        headers.map(h => `"${h}"`).join(',')
      ];
      for (const row of data) {
        const values = headers.map(h => `"${String(row[h] ?? '').replace(/"/g, '""')}"`);
        csvRows.push(values.join(','));
      }
      const csv = csvRows.join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename + '.csv';
      a.click();
      URL.revokeObjectURL(url);
      showToast('General report CSV exported.', 'success');
      return;
    }

    const headers = Object.keys(data[0]);
    const tableRows = data.map(row => `<tr>${headers.map(h => `<td>${row[h] ?? ''}</td>`).join('')}</tr>`).join('');

    const win = window.open('', '_blank', 'width=1000,height=700');
    if (!win) { showToast('Please allow pop-ups to print the report.', 'error'); return; }
    win.document.write(`

      <style>${REPORT_PRINT_CSS}</style>
      </head><body>
      ${buildCompanyHeaderHTML(company).replace('__REPORT_TITLE__', 'Management Report')}
      <div class="report-meta"><strong>Site:</strong> ${siteLabel} &nbsp;|&nbsp; <strong>Department:</strong> ${deptLabel}<br><strong>Period:</strong> ${period} &nbsp;|&nbsp; <strong>Generated:</strong> ${generatedDate}</div>

      ${buildReportFooterHTML(company)}
      </body></html>
    `);
    win.document.close();
    setTimeout(() => win.print(), 500);
  };

  function renderFinanceContent() {
    const site = sitesData.find(s => s.id === selectedFinanceSite);

    const siteMaterials = materialsData.filter(m => m.site_id === selectedFinanceSite);
    const matSpent = siteMaterials.reduce((sum, m) => sum + calculateTotal(m.quantity_used || 0, m.unit_cost || 0), 0);

    }
    const dailyAvg = totalSpent / daysActive;
    const monthlyAvg = totalSpent / (daysActive / 30);
    const completedCount = progressTasks.filter(task => task.site_id === selectedFinanceSite && task.status === 'completed').length;

          <div class="space-y-1 text-sm">
            <p><strong>${t('finances.budget')}:</strong> ${budget.toLocaleString()} RWF</p>

  window.openInviteManagerModal = () => {
    const siteOptions = sitesData.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    openModal(t('managers.inviteManager'), `
      <form onsubmit="handleInviteManager(event)" class="space-y-4">
        <div><label class="block text-sm font-medium mb-1">${t('managers.assignSite')}</label><select id="manager-site" class="w-full border rounded-lg p-3" required><option value="">${t('dashboard.selectSite')}</option>${siteOptions}</select></div>
        <input class="w-full border rounded-lg p-3" type="email" placeholder="${t('managers.email')}" id="manager-email" required>
        <input class="w-full border rounded-lg p-3" type="password" placeholder="${t('managers.password')}" id="manager-password" required minlength="6">
        <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-xl">${t('managers.invite')}</button>
      </form>`);
  };

  window.handleInviteManager = async (e) => {
    e.preventDefault();
    const btn = getFormSubmitBtn(e.target);
    setButtonLoading(btn, true);
    try {
      const email = document.getElementById('manager-email').value.trim();
      const password = document.getElementById('manager-password').value;
      const siteId = document.getElementById('manager-site').value;
      if (!email || !password || !siteId) { showAlert('alerts.requiredField'); return; }
      if (password.length < 6) { showAlert('alerts.invalidValue'); return; }
      if (managersData.some(m => m.email === email)) { showAlert('alerts.invalidValue'); return; }
      const apiKey = firebaseConfig.apiKey;
      const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, returnSecureToken: false }) });
      const data = await response.json();
      if (!response.ok) { throw new Error((data.error?.message || 'Registration failed').replace('EMAIL_EXISTS', 'Email already in use.').replace('WEAK_PASSWORD', 'Password is too weak.')); }
      await setDoc(doc(db, 'profiles', data.localId), { email, full_name: email.split('@')[0], role: 'manager', assigned_site: siteId, phone: '' });
      showToast(t('alerts.savedSuccessfully'), 'success');
      closeModal();
    } catch (err) { console.error(err); showToast(err.message || t('alerts.somethingWentWrong'), 'error'); }
    finally { setButtonLoading(btn, false); }
  };

        <div class="field-group"><label for="settings-language">${t('settings.language')}</label><select id="settings-language"><option value="en" ${prefs.language === 'en' ? 'selected' : ''}>English</option><option value="fr" ${prefs.language === 'fr' ? 'selected' : ''}>French</option><option value="rw" ${prefs.language === 'rw' ? 'selected' : ''}>Kinyarwanda</option></select></div>
        <div class="field-group"><label for="settings-currency">${t('settings.currency')}</label><select id="settings-currency"><option value="RWF" ${prefs.currency === 'RWF' ? 'selected' : ''}>RWF — Rwandan Franc</option><option value="USD" ${prefs.currency === 'USD' ? 'selected' : ''}>USD — US Dollar</option><option value="EUR" ${prefs.currency === 'EUR' ? 'selected' : ''}>EUR — Euro</option></select></div>
        <div class="field-group"><label for="settings-date-format">${t('settings.dateFormat')}</label><select id="settings-date-format"><option value="DD/MM/YYYY" ${prefs.dateFormat === 'DD/MM/YYYY' ? 'selected' : ''}>DD/MM/YYYY</option><option value="MM/DD/YYYY" ${prefs.dateFormat === 'MM/DD/YYYY' ? 'selected' : ''}>MM/DD/YYYY</option><option value="YYYY-MM-DD" ${prefs.dateFormat === 'YYYY-MM-DD' ? 'selected' : ''}>YYYY-MM-DD</option></select></div>

    const emailInput = document.getElementById('settings-email'); if (emailInput) emailInput.value = profile.email || '';
    const photoImg = document.getElementById('settings-profile-photo-img'); if (photoImg) photoImg.src = profile.profile_picture || PLACEHOLDER_IMG;
    const roleDisplay = document.getElementById('settings-role'); if (roleDisplay) roleDisplay.textContent = profile.role || 'Owner';
    const statusDisplay = document.getElementById('settings-status'); if (statusDisplay) statusDisplay.textContent = profile.status || 'Active';
    const sinceDisplay = document.getElementById('settings-since'); if (sinceDisplay) sinceDisplay.textContent = profile.created_at ? formatDate(profile.created_at) : 'N/A';

    const langSelect = document.getElementById('settings-language'); if (langSelect) langSelect.value = prefs.language || 'en';

  function attachSettingsChangeListeners() {
    const inputs = document.querySelectorAll('#settings-profile input, #settings-preferences input, #settings-preferences select, #settings-security input');
    inputs.forEach(el => {
      el.addEventListener('input', () => { if (!hasUnsavedChanges) hasUnsavedChanges = true; });
      el.addEventListener('change', () => { if (!hasUnsavedChanges) hasUnsavedChanges = true; });
    });
    const fileInput = document.getElementById('settings-profile-photo-input');
    if (fileInput) fileInput.addEventListener('change', () => { hasUnsavedChanges = true; });
    const removeBtn = document.getElementById('settings-remove-photo-btn');
    if (removeBtn) removeBtn.addEventListener('click', () => { hasUnsavedChanges = true; });
  }

  window.switchSettingsTab = (tab) => {
    if (hasUnsavedChanges) { if (!confirm(t('alerts.areYouSure'))) return; hasUnsavedChanges = false; }
    settingsTab = tab;
    document.querySelectorAll('.settings-tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.settings-tab-btn[onclick*="${tab}"]`)?.classList.add('active');
    document.querySelectorAll('.settings-section').forEach(el => el.classList.remove('active'));
    document.getElementById(`settings-${tab}`)?.classList.add('active');
    populateSettingsForms();
    attachSettingsChangeListeners();
  };

  window.previewProfilePhoto = (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = document.getElementById('settings-profile-photo-img');
      if (img) img.src = e.target.result;
      _profilePhotoFile = file;
      hasUnsavedChanges = true;
    };
    reader.readAsDataURL(file);
  };

  window.removeProfilePhoto = () => {
    if (!confirm(t('alerts.areYouSure'))) return;
    const img = document.getElementById('settings-profile-photo-img');
    if (img) img.src = PLACEHOLDER_IMG;
    _profilePhotoFile = null;
    const input = document.getElementById('settings-profile-photo-input');
    if (input) input.value = '';
    hasUnsavedChanges = true;
  };

  window.handleProfileSave = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('.save-btn');
    setButtonLoading(btn, true);
    try {
      const name = document.getElementById('settings-full-name').value.trim();
      const phone = document.getElementById('settings-phone').value.trim();
      const email = document.getElementById('settings-email').value.trim();
      if (!name) { showAlert('alerts.requiredField'); return; }
      if (phone && !/^\+?[0-9\s-]{7,15}$/.test(phone)) { showAlert('alerts.invalidValue'); return; }
      if (email && !/^\S+@\S+\.\S+$/.test(email)) { showAlert('alerts.invalidValue'); return; }
      const updateData = { full_name: name, phone, email, updated_at: new Date().toISOString() };
      if (_profilePhotoFile) {
        try { updateData.profile_picture = await uploadImageToImgbb(_profilePhotoFile); _profilePhotoFile = null; }
        catch (err) { showAlert('alerts.somethingWentWrong'); return; }
      } else {
        const currentImg = document.getElementById('settings-profile-photo-img').src;
        if (currentImg === PLACEHOLDER_IMG && ownerProfile.profile_picture) updateData.profile_picture = '';
      }
      const profileRef = doc(db, 'profiles', currentUser.uid);
      await updateDoc(profileRef, updateData);
      if (email && email !== currentUser.email) {
        const password = prompt(t('settings.currentPasscode'));
        if (!password) { showAlert('alerts.somethingWentWrong'); return; }
        const credential = EmailAuthProvider.credential(currentUser.email, password);
        await reauthenticateWithCredential(currentUser, credential);
        await updateEmail(currentUser, email);
        await sendEmailVerification(currentUser);
      }
      ownerProfile = { ...ownerProfile, ...updateData };
      updateProfileUI(ownerProfile);
      hasUnsavedChanges = false;
      showToast(t('alerts.updatedSuccessfully'), 'success');
      populateSettingsForms();
    } catch (err) { console.error(err); showToast(t('alerts.somethingWentWrong'), 'error'); }
    finally { setButtonLoading(btn, false); }
  };

  window.handlePasswordChange = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('.save-btn');
    setButtonLoading(btn, true);
    const current = document.getElementById('current-password').value;
    const newPass = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    if (newPass !== confirm) { showAlert('alerts.invalidValue'); setButtonLoading(btn, false); return; }
    if (newPass.length < 6) { showAlert('alerts.invalidValue'); setButtonLoading(btn, false); return; }
    try {
      const credential = EmailAuthProvider.credential(currentUser.email, current);
      await reauthenticateWithCredential(currentUser, credential);
      await updatePassword(currentUser, newPass);
      showToast(t('alerts.updatedSuccessfully'), 'success');
      e.target.reset();
      hasUnsavedChanges = false;
    } catch (err) { console.error(err); showToast(t('alerts.somethingWentWrong'), 'error'); }
    finally { setButtonLoading(btn, false); }
  };

  window.handlePreferencesSave = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('.save-btn');
    setButtonLoading(btn, true);
    try {
      const language = document.getElementById('settings-language').value;
      const currency = document.getElementById('settings-currency').value;
      const dateFormat = document.getElementById('settings-date-format').value;
      const notifications = document.getElementById('settings-notifications').checked;
      const prefs = { language, currency, dateFormat, notifications };
      await updateDoc(doc(db, 'profiles', currentUser.uid), { preferences: prefs, updated_at: new Date().toISOString() });
      ownerProfile.preferences = prefs;
      hasUnsavedChanges = false;
      setLanguage(language);
      showToast(t('alerts.savedSuccessfully'), 'success');
    } catch (err) { console.error(err); showToast(t('alerts.somethingWentWrong'), 'error'); }
    finally { setButtonLoading(btn, false); }
  };

  window.handleLogout = async () => {
    await signOut(auth);
    window.location.href = 'https://shdr-construction.vercel.app/index.html';
  };
  </script>
</body>
</html>
