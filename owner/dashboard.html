        function getNestedTranslation(obj, key) { return key.split('.').reduce((o, i) => (o ? o[i] : undefined), obj); }
        function t(key, params = {}) { let value = getNestedTranslation(translations[currentLanguage], key); if (value === undefined) value = getNestedTranslation(translations.en, key); if (value === undefined) return key; if (params) { Object.keys(params).forEach(param => { value = value.replace(new RegExp(`{${param}}`, 'g'), params[param]); }); } return value; }

        function renderModule(section) {
            const container = document.getElementById('content-area');
            if (!container) return;
            switch(section) {
                case 'dashboard': renderDashboard(container); break;
                case 'sites': renderSites(container); break;
                case 'materials': renderMaterials(container); break;
                case 'stock': renderStock(container); break;
                case 'workers': renderWorkers(container); break;
                case 'progress': renderProgress(container); break;
                case 'reports': renderReports(container); break;
                case 'finances': renderFinances(container); break;
                case 'managers': renderManagers(container); break;
                case 'gallery': renderGallery(container); break;
                case 'office': renderOfficeHub(container); break;
                case 'settings': renderSettings(container); break;
                default: renderDashboard(container);
            }
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = t(element.dataset.i18n); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => { element.placeholder = t(element.dataset.i18nPlaceholder); });
            document.querySelectorAll('[data-i18n-title]').forEach(element => { element.title = t(element.dataset.i18nTitle); });
            document.querySelectorAll('[data-i18n-aria-label]').forEach(element => { element.setAttribute('aria-label', t(element.dataset.i18nAriaLabel)); });
            if (currentSection) renderModule(currentSection);
        }

        function setLanguage(lang) {
            if (!['en', 'rw', 'fr'].includes(lang)) return;
            currentLanguage = lang;
            localStorage.setItem('shdr_language', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                const isActive = btn.dataset.language === lang;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-pressed', isActive.toString());
            });
            document.documentElement.lang = lang;
            applyTranslations();
        }

        document.querySelectorAll('.lang-btn').forEach(btn => { btn.addEventListener('click', () => setLanguage(btn.dataset.language)); });

        function formatDate(dateValue) { if (!dateValue) return '-'; const date = typeof dateValue === 'string' ? new Date(dateValue) : dateValue; if (isNaN(date.getTime())) return '-'; const localeMap = { en: 'en-US', rw: 'rw-RW', fr: 'fr-FR' }; return new Intl.DateTimeFormat(localeMap[currentLanguage], { year: 'numeric', month: 'long', day: 'numeric' }).format(date); }
        function formatCurrency(amount) { const localeMap = { en: 'en-US', rw: 'rw-RW', fr: 'fr-FR' }; return new Intl.NumberFormat(localeMap[currentLanguage], { style: 'currency', currency: 'RWF', minimumFractionDigits: 0 }).format(amount); }

        window.generateReport = () => { const siteId = document.getElementById('report-site')?.value || 'all'; const start = document.getElementById('report-start')?.value; const end = document.getElementById('report-end')?.value; const output = document.getElementById('report-output'); if (!output) return; let filteredSites = siteId === 'all' ? sitesData : sitesData.filter(s => s.id === siteId); if (reportType === 'general') { let html = `<h3 class="font-bold text-lg mb-4">${t('reports.reportTitles.general')}</h3>`; filteredSites.forEach(s => { const siteMats = materialsData.filter(m => m.site_id === s.id); const matCost = siteMats.reduce((sum, m) => sum + calculateTotal(m.quantity_used || 0, m.unit_cost || 0), 0); const siteWorkers = assignedWorkersData.filter(w => w.site_id === s.id); const workerCost = siteWorkers.reduce((sum, w) => sum + (w.salary || 0), 0); const totalCost = matCost + workerCost; html += `<div class="border-b pb-3 mb-3"><h4 class="font-semibold text-emerald-700">${s.name}</h4><p class="text-xs text-slate-500">${t('sites.location')}: ${s.location || '—'} | ${t('sites.budget')}: ${formatCurrency(s.budget || 0)}</p><div class="grid grid-cols-3 gap-2 mt-2 text-xs"><div>${t('finances.materialsCost')}: ${formatCurrency(matCost)}</div><div>${t('finances.workersCost')}: ${formatCurrency(workerCost)}</div><div>${t('finances.totalSpent')}: ${formatCurrency(totalCost)}</div></div></div>`; }); output.innerHTML = html || `<p class="text-slate-400">${t('common.noDataAvailable')}</p>`; } else if (reportType === 'payroll') { let html = `<h3 class="font-bold text-lg mb-4">${t('reports.reportTitles.payroll')}</h3>`; if (!attendanceData.length) { output.innerHTML = `<p class="text-slate-400">${t('reports.noAttendance')}</p>`; return; } html += `<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs"><tr><th class="px-2 py-1 text-left">${t('reports.worker')}</th><th class="px-2 py-1 text-left">${t('reports.daysWorked')}</th><th class="px-2 py-1 text-left">${t('reports.dailyRate')}</th><th class="px-2 py-1 text-left">${t('reports.totalPayable')}</th></tr></thead><tbody>`; assignedWorkersData.forEach(w => { if (siteId !== 'all' && w.site_id !== siteId) return; const records = attendanceData.filter(a => a.worker_id === w.id && a.status === 'present'); if (!records.length) return; const days = records.length; const rate = w.salary || 0; const total = days * rate; html += `<tr><td class="px-2 py-1">${w.name}</td><td class="px-2 py-1">${days}</td><td class="px-2 py-1">${formatCurrency(rate)}</td><td class="px-2 py-1">${formatCurrency(total)}</td></tr>`; }); html += `</tbody></table></div>`; output.innerHTML = html; } else if (reportType === 'stock') { let html = `<h3 class="font-bold text-lg mb-4">${t('reports.reportTitles.stock')}</h3><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs"><tr><th class="px-2 py-1 text-left">${t('stock.material')}</th><th class="px-2 py-1 text-left">${t('stock.site')}</th><th class="px-2 py-1 text-left">${t('stock.quantity')}</th><th class="px-2 py-1 text-left">${t('stock.status')}</th></tr></thead><tbody>`; stockData.forEach(st => { if (siteId !== 'all' && st.site_id !== siteId) return; const s = sitesData.find(site => site.id === st.site_id); const status = st.quantity <= 0 ? t('stock.out') : (st.minimum_quantity && st.quantity <= st.minimum_quantity ? t('stock.low') : t('stock.normal')); html += `<tr><td class="px-2 py-1">${st.material_name}</td><td class="px-2 py-1">${s ? s.name : '—'}</td><td class="px-2 py-1">${st.quantity} ${st.unit || ''}</td><td class="px-2 py-1">${status}</td></tr>`; }); html += `</tbody></table></div>`; output.innerHTML = html; } };

ems-center mb-2"><h3 class="font-bold text-base">${site.name}</h3><button onclick="editSiteBudget('${site.id}')" class="text-xs text-emerald-600">${t('finances.updateBudget')}</button></div><div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs"><div><span class="text-slate-500">${t('finances.budget')}:</span> <span class="font-semibold">${formatCurrency(sBudget)}</span></div><div><span class="text-slate-500">${t('finances.totalSpent')}:</span> <span class="font-semibold">${formatCurrency(sTotalSpent)}</span></div><div><span class="text-slate-500">${t('finances.materialsCost')}:</span> <span class="font-semibold">${formatCurrency(sMatCost)}</span></div><div><span class="text-slate-500">${t('finances.remaining')}:</span> <span class="font-semibold ${isExceeded ? 'text-red-600' : 'text-emerald-600'}">${formatCurrency(sRem)}</span></div></div>${isExceeded ? `<p class="text-xs text-red-500 mt-2 font-medium">⚠️ ${t('finances.exceeded')} ${t('finances.costControl')}</p>` : ''}</div>`; }).join('')}</div>`; }

        window.deleteGalleryImage = async (id) => { if (!confirm(t('alerts.areYouSure'))) return; try { await deleteDoc(doc(db, 'gallery', id)); showToast(t('alerts.deletedSuccessfully'), 'success'); } catch (err) { showToast(t('alerts.somethingWentWrong'), 'error'); } };

        // =============== OFFICE HUB ===============
        function renderOfficeHub(container) { container.innerHTML = `<div class="bg-white rounded-2xl border p-8 text-center max-w-md mx-auto"><iconify-icon icon="material-symbols:business-center-outline" class="text-6xl text-emerald-600 mx-auto block mb-4"></iconify-icon><h2 class="text-2xl font-bold text-slate-800 mb-2">${t('navigation.officeHub')}</h2><p class="text-slate-500 text-sm mb-6">${t('common.comingSoon')}</p></div>`; }

        // =============== SETTINGS ===============
        function renderSettings(container) { container.innerHTML = `<h2 class="text-xl sm:text-2xl font-bold mb-4">${t('settings.title')}</h2><div class="flex gap-2 border-b mb-6 overflow-x-auto"><button onclick="switchSettingsTab('profile')" class="settings-tab-btn px-4 py-2 font-medium text-sm rounded-t-lg ${settingsTab === 'profile' ? 'active' : 'text-slate-600 hover:bg-slate-100'}">${t('settings.profile')}</button><button onclick="switchSettingsTab('account')" class="settings-tab-btn px-4 py-2 font-medium text-sm rounded-t-lg ${settingsTab === 'account' ? 'active' : 'text-slate-600 hover:bg-slate-100'}">${t('settings.account')}</button><button onclick="switchSettingsTab('security')" class="settings-tab-btn px-4 py-2 font-medium text-sm rounded-t-lg ${settingsTab === 'security' ? 'active' : 'text-slate-600 hover:bg-slate-100'}">${t('settings.security')}</button><button onclick="switchSettingsTab('preferences')" class="settings-tab-btn px-4 py-2 font-medium text-sm rounded-t-lg ${settingsTab === 'preferences' ? 'active' : 'text-slate-600 hover:bg-slate-100'}">${t('settings.preferences')}</button></div><div id="settings-tab-content"></div>`; renderSettingsTabContent(); }
        window.switchSettingsTab = (tab) => { settingsTab = tab; renderSettings(document.getElementById('content-area')); };
        function renderSettingsTabContent() { const container = document.getElementById('settings-tab-content'); if (!container) return; if (settingsTab === 'profile') { container.innerHTML = `<div class="settings-card max-w-xl mx-auto"><h3 class="font-bold text-lg mb-4">${t('settings.profileInfo')}</h3><div class="text-center mb-6"><div class="profile-avatar-wrapper shadow-md rounded-full overflow-hidden mb-3"><img id="settings-profile-img" src="${ownerProfile?.profile_picture || PLACEHOLDER_IMG}" class="w-full h-full object-cover"></div><div class="flex gap-2 justify-center"><label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold"><input type="file" accept="image/*" class="hidden" onchange="handleProfilePhotoChange(event)">${t('settings.changePhoto')}</label>${ownerProfile?.profile_picture ? `<button onclick="handleRemoveProfilePhoto()" class="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg text-xs font-semibold">${t('settings.removePhoto')}</button>` : ''}</div></div><form onsubmit="handleSaveProfile(event)"><div class="field-group"><label>${t('settings.fullName')}</label><input type="text" id="set-fullname" value="${ownerProfile?.full_name || ''}" required></div><div class="field-group"><label>${t('settings.phone')}</label><input type="text" id="set-phone" value="${ownerProfile?.phone || ''}"></div><div class="field-group"><label>${t('settings.email')}</label><input type="email" id="set-email" value="${ownerProfile?.email || currentUser?.email || ''}" required></div><button type="submit" class="save-btn w-full mt-2">${t('settings.saveChanges')}</button></form></div>`; } else if (settingsTab === 'account') { container.innerHTML = `<div class="settings-card max-w-xl mx-auto"><h3 class="font-bold text-lg mb-4">${t('settings.accountInfo')}</h3><div class="space-y-4 text-sm"><div class="flex justify-between border-b pb-2"><span class="text-slate-500">${t('settings.accountName')}</span><span class="font-medium">${ownerProfile?.full_name || 'Owner'}</span></div><div class="flex justify-between border-b pb-2"><span class="text-slate-500">${t('settings.role')}</span><span class="font-medium uppercase">${ownerProfile?.role || 'owner'}</span></div><div class="flex justify-between border-b pb-2"><span class="text-slate-500">${t('settings.accountStatus')}</span><span class="font-medium text-emerald-600">${t('settings.active')}</span></div><div class="flex justify-between border-b pb-2"><span class="text-slate-500">${t('settings.memberSince')}</span><span class="font-medium">${formatDate(ownerProfile?.created_at || currentUser?.metadata?.creationTime)}</span></div></div></div>`; } else if (settingsTab === 'security') { container.innerHTML = `<div class="settings-card max-w-xl mx-auto"><h3 class="font-bold text-lg mb-4">${t('settings.changePasscode')}</h3><form onsubmit="handleChangePassword(event)"><div class="field-group"><label>${t('settings.currentPasscode')}</label><input type="password" id="set-curr-pass" required></div><div class="field-group"><label>${t('settings.newPasscode')}</label><input type="password" id="set-new-pass" required minlength="6"></div><div class="field-group"><label>${t('settings.confirmPasscode')}</label><input type="password" id="set-conf-pass" required minlength="6"></div><button type="submit" class="save-btn w-full mt-2">${t('settings.changePass')}</button></form></div>`; } else if (settingsTab === 'preferences') { container.innerHTML = `<div class="settings-card max-w-xl mx-auto"><h3 class="font-bold text-lg mb-4">${t('settings.prefs')}</h3><form onsubmit="handleSavePreferences(event)"><div class="field-group"><label>${t('settings.language')}</label><select id="set-lang" onchange="setLanguage(this.value)"><option value="en" ${currentLanguage === 'en' ? 'selected' : ''}>English</option><option value="rw" ${currentLanguage === 'rw' ? 'selected' : ''}>Kinyarwanda</option><option value="fr" ${currentLanguage === 'fr' ? 'selected' : ''}>Français</option></select></div><div class="field-group"><label>${t('settings.currency')}</label><select id="set-currency"><option value="RWF">RWF (Rwandan Franc)</option></select></div><button type="submit" class="save-btn w-full mt-2">${t('settings.savePrefs')}</button></form></div>`; } }
        window.handleProfilePhotoChange = async (e) => { const file = e.target.files[0]; if (!file) return; try { showLoading(true); const photoUrl = await uploadImageToImgbb(file); await updateDoc(doc(db, 'profiles', currentUser.uid), { profile_picture: photoUrl, updated_at: new Date().toISOString() }); showToast(t('alerts.updatedSuccessfully'), 'success'); } catch (err) { showToast(t('alerts.somethingWentWrong'), 'error'); } finally { showLoading(false); } };
        window.handleRemoveProfilePhoto = async () => { if (!confirm(t('alerts.areYouSure'))) return; try { showLoading(true); await updateDoc(doc(db, 'profiles', currentUser.uid), { profile_picture: '', updated_at: new Date().toISOString() }); showToast(t('alerts.updatedSuccessfully'), 'success'); } catch (err) { showToast(t('alerts.somethingWentWrong'), 'error'); } finally { showLoading(false); } };
        window.handleSaveProfile = async (e) => { e.preventDefault(); const form = e.target; const btn = getFormSubmitBtn(form); setButtonLoading(btn, true); try { const full_name = document.getElementById('set-fullname').value.trim(); const phone = document.getElementById('set-phone').value.trim(); const email = document.getElementById('set-email').value.trim(); await updateDoc(doc(db, 'profiles', currentUser.uid), { full_name, phone, email, updated_at: new Date().toISOString() }); if (email !== currentUser.email) { await updateEmail(currentUser, email); } showToast(t('alerts.savedSuccessfully'), 'success'); } catch (err) { showToast(t('alerts.somethingWentWrong'), 'error'); } finally { setButtonLoading(btn, false); } };
        window.handleChangePassword = async (e) => { e.preventDefault(); const form = e.target; const btn = getFormSubmitBtn(form); const currPass = document.getElementById('set-curr-pass').value; const newPass = document.getElementById('set-new-pass').value; const confPass = document.getElementById('set-conf-pass').value; if (newPass !== confPass) { showToast(t('alerts.invalidValue'), 'error'); return; } setButtonLoading(btn, true); try { const cred = EmailAuthProvider.credential(currentUser.email, currPass); await reauthenticateWithCredential(currentUser, cred); await updatePassword(currentUser, newPass); showToast(t('alerts.updatedSuccessfully'), 'success'); form.reset(); } catch (err) { showToast(t('alerts.somethingWentWrong'), 'error'); } finally { setButtonLoading(btn, false); } };
        window.handleSavePreferences = (e) => { e.preventDefault(); showToast(t('alerts.savedSuccessfully'), 'success'); };
    </script>
</body>
</html>
