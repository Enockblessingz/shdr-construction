                    { id: 'rejected-permits', label: 'Rejected Permits', icon: 'cancel' }
                ],
                submission: [
                    { id: 'new', label: 'New Submissions', icon: 'add-box' },
                    { id: 'tracking', label: 'Submission Tracking', icon: 'track-changes' },
                    { id: 'history', label: 'Submission History', icon: 'history' }
                ]
            };
            return map[tab] || map.design;
        }

        function getCategoriesForTab(tab) {
            const map = {
                design: [
                    { value: 'architectural', label: 'Architectural Document' },
                    { value: 'structural', label: 'Structural Analysis' },
                    { value: 'mep', label: 'MEP Coordination' }
                ],
                financial: [
                    { value: 'estimation', label: 'Cost Estimation' },
                    { value: 'budget', label: 'Budget Review' }
                ],
                workflow: [
                    { value: 'certification', label: 'Certification' },
                    { value: 'queue', label: 'Submission Queue' },
                    { value: 'review', label: 'Review & Verification' }
                ],
                approval: [
                    { value: 'approval', label: 'Approval Item' }
                ],
                permit: [
                    { value: 'permit', label: 'Permit' }
                ],
                submission: [
                    { value: 'submission', label: 'Submission' }
                ]
            };
            return map[tab] || map.design;
        }

        function getStatusBadge(status) {
            const map = {
                'pending': 'bg-amber-100 text-amber-700',
                'in-progress': 'bg-blue-100 text-blue-700',
                'approved': 'bg-emerald-100 text-emerald-700',
                'rejected': 'bg-red-100 text-red-700',
                'revision': 'bg-orange-100 text-orange-700',
                'history': 'bg-slate-100 text-slate-500'
            };
            return map[status] || 'bg-slate-100 text-slate-500';
        }

        function getPriorityLabel(priority) {
            const map = {
                'high': { label: 'High', icon: '🔴', class: 'priority-high' },
                'medium': { label: 'Medium', icon: '🟡', class: 'priority-medium' },
                'low': { label: 'Low', icon: '🟢', class: 'priority-low' }
            };
            return map[priority] || { label: 'None', icon: '⚪', class: '' };
        }

        // ── Main render ──
        function renderOfficeHub(container) {
            if (OFFICE_HUB_ENABLED) {
                renderFullOfficeHub(container);
            } else {
                renderComingSoon(container);
            }
        }

        // ── Coming Soon Page ──
        function renderComingSoon(container) {
            container.innerHTML = `
                <div class="max-w-3xl mx-auto py-12 px-4">
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
                        <div class="h-2 bg-gradient-to-r from-emerald-400 via-emerald-500 to-emerald-600"></div>
                        <div class="p-8 sm:p-12 text-center">
                            <div class="w-24 h-24 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-6">
                                <iconify-icon icon="material-symbols:business-center" width="48" height="48" class="text-emerald-600"></iconify-icon>
                            </div>
                            <h2 class="text-3xl sm:text-4xl font-bold text-slate-900 mb-3">${t('navigation.officeHub')}</h2>
                            <span class="inline-flex items-center gap-2 px-4 py-1.5 bg-amber-50 border border-amber-200 rounded-full text-sm font-medium text-amber-700 mb-6">
                                <span class="w-2 h-2 bg-amber-500 rounded-full animate-pulse"></span>
                                ${t('common.comingSoon')}
                            </span>
                            <p class="text-slate-600 text-base sm:text-lg max-w-lg mx-auto leading-relaxed">
                                ${t('common.comingSoon')}
                            </p>
                            <button onclick="showSection('dashboard')" class="mt-8 inline-flex items-center gap-2 px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition">
                                <iconify-icon icon="material-symbols:arrow-back" width="18"></iconify-icon>
                                ${t('navigation.dashboard')}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ── Full Office Hub (Fully Functional) ──
        function renderFullOfficeHub(container) {
            container.innerHTML = `
                <div class="max-w-7xl mx-auto">
                    <!-- Gradient Header -->
                    <div class="office-header">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h2 class="text-2xl sm:text-3xl font-bold flex items-center gap-3">
                                    <iconify-icon icon="material-symbols:business-center" width="32" class="text-white/90"></iconify-icon>
                                    Office Management Hub
                                </h2>
                                <p class="text-white/80 text-sm mt-1">Centralized control for design, finance, workflow, approvals, permits, and submissions</p>
                            </div>
                            <button onclick="openOfficeAddModal()" class="btn-new flex items-center gap-2 text-sm">
                                <iconify-icon icon="material-symbols:add" width="18"></iconify-icon>
                                New Item
                            </button>
                        </div>
                    </div>

                    <!-- Main Tabs -->
                    <div class="flex flex-wrap gap-1 p-1 bg-white/60 backdrop-blur-sm rounded-full shadow-sm border border-slate-200/60 mb-6">
                        ${[
                            { id: 'dashboard', label: 'Dashboard', icon: 'dashboard' },
                            { id: 'design', label: 'Design & Technical', icon: 'design-services' },
                            { id: 'financial', label: 'Financial & Cost', icon: 'finance' },
                            { id: 'workflow', label: 'Document Workflow', icon: 'assignment' },
                            { id: 'approval', label: 'Approval Center', icon: 'check-circle' },
                            { id: 'permit', label: 'Permit & Compliance', icon: 'gavel' },
                            { id: 'submission', label: 'Submission Control', icon: 'send' }
                        ].map(tab => `
                            <button onclick="switchOfficeTab('${tab.id}')" 
                                class="office-tab flex-1 min-w-[70px] px-3 py-2 text-sm font-semibold transition flex items-center justify-center gap-1.5
                                ${officeTab === tab.id ? 'active' : ''}">
                                <iconify-icon icon="material-symbols:${tab.icon}" width="18" height="18"></iconify-icon>
                                <span class="hidden sm:inline">${tab.label}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Content -->
                    <div id="office-content" class="animate-fade-in">
                        ${officeTab === 'dashboard' ? renderOfficeDashboard() : renderOfficeContent()}
                    </div>
                </div>
            `;
            loadOfficeItems();
        }

        // ── Dashboard ──
        function renderOfficeDashboard() {
            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="glass-stat">
                            <p class="stat-label">Total Items</p>
                            <p class="stat-number text-slate-800" id="dash-total">0</p>
                        </div>
                        <div class="glass-stat border-amber-200/50">
                            <p class="stat-label">Pending</p>
                            <p class="stat-number text-amber-600" id="dash-pending">0</p>
                        </div>
                        <div class="glass-stat border-emerald-200/50">
                            <p class="stat-label">Approved</p>
                            <p class="stat-number text-emerald-600" id="dash-approved">0</p>
                        </div>
                        <div class="glass-stat border-red-200/50">
                            <p class="stat-label">Rejected / Revision</p>
                            <p class="stat-number text-red-600" id="dash-rejected">0</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-200/60 shadow-sm p-5">
                        <h3 class="font-semibold text-slate-700 flex items-center gap-2 mb-3">
                            <iconify-icon icon="material-symbols:history" width="20" class="text-emerald-600"></iconify-icon>
                            Recent Activity
                        </h3>
                        <div id="dash-activity" class="max-h-60 overflow-y-auto">
                            <div class="text-slate-400 text-sm">Loading activity...</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        ${['design','financial','workflow','approval','permit','submission'].map(cat => {
                            const map = {
                                design: ['architectural','structural','mep'],
                                financial: ['estimation','budget'],
                                workflow: ['certification','queue','review'],
                                approval: ['approval'],
                                permit: ['permit'],
                                submission: ['submission']
                            };
                            const count = officeItems.filter(i => map[cat].includes(i.category)).length;
                            const label = cat.charAt(0).toUpperCase() + cat.slice(1);
                            const icons = {
                                design: 'design-services',
                                financial: 'finance',
                                workflow: 'assignment',
                                approval: 'check-circle',
                                permit: 'gavel',
                                submission: 'send'
                            };
                            return `
                                <div class="bg-white/70 backdrop-blur-sm rounded-xl p-4 border border-slate-200/60 text-center hover:shadow-md transition hover:-translate-y-0.5">
                                    <iconify-icon icon="material-symbols:${icons[cat]}" width="28" class="text-emerald-500 mx-auto mb-1"></iconify-icon>
                                    <p class="text-xs text-slate-500">${label}</p>
                                    <p class="text-2xl font-bold text-slate-800">${count}</p>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function updateDashboardStats() {
            const total = officeItems.length;
            const pending = officeItems.filter(i => i.status === 'pending').length;
            const approved = officeItems.filter(i => i.status === 'approved').length;
            const rejected = officeItems.filter(i => ['rejected','revision'].includes(i.status)).length;

            document.getElementById('dash-total').textContent = total;
            document.getElementById('dash-pending').textContent = pending;
            document.getElementById('dash-approved').textContent = approved;
            document.getElementById('dash-rejected').textContent = rejected;

            const container = document.getElementById('dash-activity');
            if (!container) return;
            const items = officeItems.slice().sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
            if (!items.length) {
                container.innerHTML = '<div class="text-slate-400 text-sm">No activity yet.</div>';
                return;
            }
            const recent = items.slice(0, 10);
            container.innerHTML = recent.map(item => `
                <div class="activity-item">
                    <span class="activity-dot ${item.status === 'approved' ? 'create' : item.status === 'rejected' ? 'status' : 'update'}"></span>
                    <span class="font-medium text-slate-700">${item.title}</span>
                    <span class="text-slate-400 text-xs">${formatDate(item.updated_at)}</span>
                    <span class="text-xs ${getStatusBadge(item.status)} px-2 py-0.5 rounded-full">${item.status}</span>
                    <span class="text-xs text-slate-400 ml-auto">${item.submitted_by || '—'}</span>
                </div>
            `).join('');
        }

        // ── Switch Tab ──
        window.switchOfficeTab = (tab) => {
            officeTab = tab;
            officeSubtab = getDefaultSubtab(tab);
            officeFilter = 'all';
            officeSearch = '';
            document.getElementById('office-content').innerHTML = tab === 'dashboard' ? renderOfficeDashboard() : renderOfficeContent();
            loadOfficeItems();
        };

        // ── Switch Sub-tab ──
        window.switchOfficeSubtab = (subtab) => {
            officeSubtab = subtab;
            renderOfficeItems();
        };

        // ── Render Content ──
        function renderOfficeContent() {
            const subtabs = getSubtabs(officeTab);
            return `
                <div class="bg-white rounded-2xl border border-slate-200/60 shadow-sm overflow-hidden">
                    <div class="flex flex-wrap items-center gap-1 p-3 border-b border-slate-200/60 bg-slate-50/50">
                        ${subtabs.map(st => `
                            <button onclick="switchOfficeSubtab('${st.id}')" 
                                class="subtab-btn ${officeSubtab === st.id ? 'active' : ''}">
                                <iconify-icon icon="material-symbols:${st.icon}" width="16" height="16" class="inline mr-1"></iconify-icon>
                                ${st.label}
                            </button>
                        `).join('')}
                        <div class="flex-1"></div>
                        <div class="flex items-center gap-2">
                            <select id="office-filter-select" onchange="officeFilter = this.value; renderOfficeItems()" class="office-filter">
                                <option value="all">All Status</option>
                                <option value="pending">Pending</option>
                                <option value="in-progress">In Progress</option>
                                <option value="approved">Approved</option>
                                <option value="rejected">Rejected</option>
                                <option value="revision">Revision</option>
                            </select>
                            <input type="text" id="office-search-input" placeholder="Search..." oninput="officeSearch = this.value; renderOfficeItems()" class="office-filter w-40">
                        </div>
                    </div>
                    <div id="office-items-container" class="p-4">
                        <div class="flex justify-center py-8"><div class="spinner"></div></div>
                    </div>
                </div>
            `;
        }

        // ── Load Office Items ──
        function loadOfficeItems() {
            if (officeUnsubscribe) {
                officeUnsubscribe();
                officeUnsubscribe = null;
            }
            if (!sitesData.length) {
                const container = document.getElementById('office-items-container');
                if (container) container.innerHTML = '<p class="text-slate-400 text-sm">No sites available.</p>';
                return;
            }

            const siteIds = sitesData.map(s => s.id);
            const q = query(collection(db, 'office_items'), where('site_id', 'in', siteIds));
            officeUnsubscribe = onSnapshot(q, (snap) => {
                officeItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (officeTab === 'dashboard') updateDashboardStats();
                else renderOfficeItems();
            }, err => showError(t('alerts.somethingWentWrong')));
        }

        // ── Render Items ──
        function renderOfficeItems() {
            const container = document.getElementById('office-items-container');
            if (!container) return;

            const search = officeSearch.toLowerCase();
            const filter = officeFilter;

            let items = officeItems.filter(item => {
                const categoryMap = {
                    design: ['architectural','structural','mep'],
                    financial: ['estimation','budget'],
                    workflow: ['certification','queue','review'],
                    approval: ['approval'],
                    permit: ['permit'],
                    submission: ['submission']
                };
                const categories = categoryMap[officeTab] || [];
                if (!categories.includes(item.category)) return false;

                if (officeSubtab === 'documents' && item.category !== 'architectural') return false;
                if (officeSubtab === 'structural' && item.category !== 'structural') return false;
                if (officeSubtab === 'mep' && item.category !== 'mep') return false;
                if (officeSubtab === 'estimation' && item.category !== 'estimation') return false;
                if (officeSubtab === 'budget' && item.category !== 'budget') return false;
                if (officeSubtab === 'certification' && item.category !== 'certification') return false;
                if (officeSubtab === 'queue' && item.category !== 'queue') return false;
                if (officeSubtab === 'review' && item.category !== 'review') return false;
                if (officeSubtab === 'pending' && item.status !== 'pending') return false;
                if (officeSubtab === 'in-progress' && item.status !== 'in-progress') return false;
                if (officeSubtab === 'approved' && item.status !== 'approved') return false;
                if (officeSubtab === 'rejected' && !['rejected','revision'].includes(item.status)) return false;
                if (officeSubtab === 'management' && item.category !== 'permit') return false;
                if (officeSubtab === 'approved-permits' && (item.category !== 'permit' || item.status !== 'approved')) return false;
                if (officeSubtab === 'rejected-permits' && (item.category !== 'permit' || !['rejected','revision'].includes(item.status))) return false;
                if (officeSubtab === 'new' && (item.category !== 'submission' || item.status !== 'pending')) return false;
                if (officeSubtab === 'tracking' && (item.category !== 'submission' || !['in-progress','approved','rejected','revision'].includes(item.status))) return false;
                if (officeSubtab === 'history' && (item.category !== 'submission' || item.status !== 'history')) return false;

                if (filter !== 'all' && item.status !== filter) return false;
                if (search) {
                    const match = item.title?.toLowerCase().includes(search) ||
                                  item.description?.toLowerCase().includes(search) ||
                                  item.assignee?.toLowerCase().includes(search) ||
                                  item.category?.toLowerCase().includes(search);
                    if (!match) return false;
                }
                return true;
            });

            items.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (!items.length) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400"><iconify-icon icon="material-symbols:inbox" width="56" height="56" class="mx-auto mb-3 opacity-40"></iconify-icon><p class="text-sm font-medium">No items found</p><p class="text-xs">Click "New Item" to add one.</p></div>`;
                return;
            }

            // Kanban
            if (officeTab === 'approval') {
                const columns = {
                    'pending': { label: 'Pending', items: [] },
                    'in-progress': { label: 'In Progress', items: [] },
                    'approved': { label: 'Approved', items: [] },
                    'rejected': { label: 'Rejected / Revision', items: [] }
                };
                items.forEach(item => {
                    const status = item.status || 'pending';
                    if (columns[status]) columns[status].items.push(item);
                    else columns['pending'].items.push(item);
                });

                container.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${Object.entries(columns).map(([key, col]) => `
                            <div class="kanban-column">
                                <h4>${col.label} (${col.items.length})</h4>
                                ${col.items.map(item => `
                                    <div class="office-card mb-2 ${getPriorityLabel(item.priority).class}">
                                        <div class="flex justify-between items-start">
                                            <p class="text-sm font-semibold text-slate-800">${item.title}</p>
                                            <span class="text-xs ${getStatusBadge(item.status)} px-2 py-0.5 rounded-full">${item.status}</span>
                                        </div>
                                        <p class="text-xs text-slate-500 mt-1 truncate">${item.description || '—'}</p>
                                        <div class="flex flex-wrap gap-1 mt-2 text-xs text-slate-400">
                                            ${item.priority ? `<span>${getPriorityLabel(item.priority).icon} ${getPriorityLabel(item.priority).label}</span>` : ''}
                                            ${item.assignee ? `<span>👤 ${item.assignee}</span>` : ''}
                                            ${item.due_date ? `<span>📅 ${formatDate(item.due_date)}</span>` : ''}
                                        </div>
                                        <div class="flex items-center gap-2 mt-3 pt-2 border-t border-slate-100">
                                            <button onclick="editOfficeItem('${item.id}')" class="text-xs text-emerald-600 hover:text-emerald-800 font-medium">Edit</button>
                                            <button onclick="deleteOfficeItem('${item.id}')" class="text-xs text-red-500 hover:text-red-700 font-medium">Delete</button>
                                            <select onchange="updateOfficeStatus('${item.id}', this.value)" class="text-xs border rounded-lg px-1 py-0.5 bg-white">
                                                <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>Pending</option>
                                                <option value="in-progress" ${item.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                                                <option value="approved" ${item.status === 'approved' ? 'selected' : ''}>Approved</option>
                                                <option value="rejected" ${item.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                                                <option value="revision" ${item.status === 'revision' ? 'selected' : ''}>Revision</option>
                                                <option value="history" ${item.status === 'history' ? 'selected' : ''}>Archive</option>
                                            </select>
                                        </div>
                                    </div>
                                `).join('') || `<p class="text-xs text-slate-400">Empty</p>`}
                            </div>
                        `).join('')}
                    </div>
                `;
                return;
            }

            // List View
            container.innerHTML = items.map(item => {
                const siteName = sitesData.find(s => s.id === item.site_id)?.name || 'Unknown Site';
                return `
                    <div class="office-card mb-3 ${getPriorityLabel(item.priority).class}">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="text-sm font-semibold text-slate-800">${item.title}</span>
                                    <span class="text-xs ${getStatusBadge(item.status)} px-2 py-0.5 rounded-full">${item.status}</span>
                                    ${item.priority ? `<span class="text-xs bg-slate-100 px-1.5 py-0.5 rounded">${getPriorityLabel(item.priority).icon} ${getPriorityLabel(item.priority).label}</span>` : ''}
                                    <span class="text-xs text-slate-400">${formatDate(item.created_at)}</span>
                                </div>
                                <p class="text-sm text-slate-500 truncate mt-0.5">${item.description || 'No description'}</p>
                                <div class="flex flex-wrap items-center gap-3 mt-1 text-xs text-slate-400">
                                    <span>🏷️ ${item.category}</span>
                                    <span>📍 ${siteName}</span>
                                    ${item.assignee ? `<span>👤 ${item.assignee}</span>` : ''}
                                    ${item.due_date ? `<span>📅 Due: ${formatDate(item.due_date)}</span>` : ''}
                                    ${item.file_url ? `<a href="${item.file_url}" target="_blank" class="text-emerald-600 hover:underline flex items-center gap-1"><iconify-icon icon="material-symbols:attach-file" width="14"></iconify-icon> Attachment</a>` : ''}
                                    ${item.submitted_by ? `<span>By: ${item.submitted_by}</span>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <button onclick="editOfficeItem('${item.id}')" class="text-xs text-emerald-600 hover:text-emerald-800 font-medium px-2 py-1 bg-emerald-50 rounded-lg transition">Edit</button>
                                <button onclick="deleteOfficeItem('${item.id}')" class="text-xs text-red-500 hover:text-red-700 font-medium px-2 py-1 bg-red-50 rounded-lg transition">Delete</button>
                                <select onchange="updateOfficeStatus('${item.id}', this.value)" class="text-xs border rounded-lg px-2 py-1 bg-white">
                                    <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="in-progress" ${item.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                                    <option value="approved" ${item.status === 'approved' ? 'selected' : ''}>Approved</option>
                                    <option value="rejected" ${item.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                                    <option value="revision" ${item.status === 'revision' ? 'selected' : ''}>Revision</option>
                                    <option value="history" ${item.status === 'history' ? 'selected' : ''}>Archive</option>
                                </select>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ── Status Update ──
        window.updateOfficeStatus = async (id, status) => {
            try {
                await updateDoc(doc(db, 'office_items', id), {
                    status: status,
                    updated_at: new Date().toISOString()
                });
                showToast('Status updated', 'success');
            } catch (err) {
                showToast('Error: ' + err.message, 'error');
            }
        };

        // ── Delete ──
        window.deleteOfficeItem = async (id) => {
            if (!confirm('Delete this item permanently?')) return;
            try {
                await deleteDoc(doc(db, 'office_items', id));
                showToast('Item deleted', 'success');
            } catch (err) {
                showToast('Error: ' + err.message, 'error');
            }
        };

        // ── Open Add/Edit Modal ──
        window.openOfficeAddModal = (editData = null) => {
            const isEdit = !!editData;
            const categories = getCategoriesForTab(officeTab === 'dashboard' ? 'design' : officeTab);

            const modalContent = `
                <form onsubmit="handleOfficeSave(event, '${editData?.id || ''}')" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Title *</label>
                        <input type="text" id="office-title" value="${editData?.title || ''}" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>

        // ── Save ──
        window.handleOfficeSave = async (e, id) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            setButtonLoading(btn, true);

            try {
                const title = document.getElementById('office-title').value.trim();
                const description = document.getElementById('office-description').value.trim();
                const site_id = document.getElementById('office-site').value;
                const category = document.getElementById('office-category').value;
                const status = document.getElementById('office-status').value;
                const priority = document.getElementById('office-priority').value;
                const due_date = document.getElementById('office-due-date').value;
                const assignee = document.getElementById('office-assignee').value.trim();
                const fileInput = document.getElementById('office-file');
                const isEdit = !!id;

                if (!title || !category || !site_id) {
                    alert('Title, Site, and Category are required.');
                    setButtonLoading(btn, false);
                    return;
                }

                let file_url = '';
                if (fileInput.files.length > 0) {
                    file_url = await uploadImageToImgbb(fileInput.files[0]);
                } else if (isEdit) {
                    const existing = officeItems.find(i => i.id === id);
                    file_url = existing?.file_url || '';
                }

                const data = {
                    site_id,
                    title,
                    description,
                    category,
                    status,
                    priority,
                    due_date: due_date || null,
                    assignee: assignee || null,
                    file_url,
                    updated_at: new Date().toISOString()
                };

                if (isEdit) {
                    await updateDoc(doc(db, 'office_items', id), data);
                } else {
                    data.created_at = new Date().toISOString();
                    data.submitted_by = currentUser.displayName || currentUser.email || 'Owner';
                    await addDoc(collection(db, 'office_items'), data);
                }

                closeModal();
                showToast(isEdit ? 'Item updated' : 'Item created', 'success');
            } catch (err) {
                showToast('Error: ' + err.message, 'error');
            } finally {
                setButtonLoading(btn, false);
            }
        };

        // ── Edit ──
        window.editOfficeItem = (id) => {
            const item = officeItems.find(i => i.id === id);
            if (!item) return;
            const tabMap = {
                'architectural': 'design',
                'structural': 'design',
                'mep': 'design',
                'estimation': 'financial',
                'budget': 'financial',
                'certification': 'workflow',
                'queue': 'workflow',
                'review': 'workflow',
                'approval': 'approval',
                'permit': 'permit',
                'submission': 'submission'
            };
            const targetTab = tabMap[item.category] || 'design';
            if (officeTab !== targetTab && officeTab !== 'dashboard') {
                officeTab = targetTab;
                officeSubtab = getDefaultSubtab(targetTab);
                document.getElementById('office-content').innerHTML = renderOfficeContent();
                loadOfficeItems();

            const phoneInput = document.getElementById('settings-phone');
            if (phoneInput) phoneInput.value = profile.phone || '';
            const emailInput = document.getElementById('settings-email');
            if (emailInput) emailInput.value = profile.email || '';
            const photoImg = document.getElementById('settings-profile-photo-img');
            if (photoImg) photoImg.src = profile.profile_picture || PLACEHOLDER_IMG;

            const roleDisplay = document.getElementById('settings-role');
            if (roleDisplay) roleDisplay.textContent = profile.role || 'Owner';
            const statusDisplay = document.getElementById('settings-status');
            if (statusDisplay) statusDisplay.textContent = profile.status || 'Active';
            const sinceDisplay = document.getElementById('settings-since');
            if (sinceDisplay) sinceDisplay.textContent = profile.created_at ? new Date(profile.created_at).toLocaleDateString() : 'N/A';

            if (dateFormatSelect) dateFormatSelect.value = prefs.dateFormat || 'DD/MM/YYYY';
            const notifToggle = document.getElementById('settings-notifications');
            if (notifToggle) notifToggle.checked = prefs.notifications !== false;

        function attachSettingsChangeListeners() {
            const inputs = document.querySelectorAll('#settings-profile input, #settings-preferences input, #settings-preferences select, #settings-security input');
            inputs.forEach(el => {
                el.addEventListener('input', () => { if (!hasUnsavedChanges) hasUnsavedChanges = true; });
                el.addEventListener('change', () => { if (!hasUnsavedChanges) hasUnsavedChanges = true; });
            });
            const fileInput = document.getElementById('settings-profile-photo-input');
            if (fileInput) fileInput.addEventListener('change', () => { hasUnsavedChanges = true; });
            const removeBtn = document.getElementById('settings-remove-photo-btn');
            if (removeBtn) removeBtn.addEventListener('click', () => { hasUnsavedChanges = true; });
        }

        window.switchSettingsTab = (tab) => {
            if (hasUnsavedChanges) {
                if (!confirm(t('alerts.areYouSure'))) return;
                hasUnsavedChanges = false;
            }
            settingsTab = tab;
            document.querySelectorAll('.settings-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.settings-tab-btn[onclick*="${tab}"]`)?.classList.add('active');
            document.querySelectorAll('.settings-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`settings-${tab}`)?.classList.add('active');
            populateSettingsForms();
            attachSettingsChangeListeners();
        };

        window.previewProfilePhoto = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('settings-profile-photo-img');
                if (img) img.src = e.target.result;
                _profilePhotoFile = file;
                hasUnsavedChanges = true;
            };
            reader.readAsDataURL(file);
        };

        window.removeProfilePhoto = () => {
            if (!confirm(t('alerts.areYouSure'))) return;
            const img = document.getElementById('settings-profile-photo-img');
            if (img) img.src = PLACEHOLDER_IMG;
            _profilePhotoFile = null;
            const input = document.getElementById('settings-profile-photo-input');
            if (input) input.value = '';
            hasUnsavedChanges = true;
        };

        window.handleProfileSave = async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('.save-btn');
            setButtonLoading(btn, true);

            try {
                const name = document.getElementById('settings-full-name').value.trim();
                const phone = document.getElementById('settings-phone').value.trim();
                const email = document.getElementById('settings-email').value.trim();

                if (!name) {
                    showAlert('alerts.requiredField');
                    setButtonLoading(btn, false);
                    return;
                }
                if (phone && !/^\+?[0-9\s-]{7,15}$/.test(phone)) {
                    showAlert('alerts.invalidValue');
                    setButtonLoading(btn, false);
                    return;
                }
                if (email && !/^\S+@\S+\.\S+$/.test(email)) {
                    showAlert('alerts.invalidValue');
                    setButtonLoading(btn, false);
                    return;
                }

                if (email && email !== ownerProfile.email) {
                    const usersQuery = query(collection(db, 'profiles'), where('email', '==', email));
                    const snap = await getDocs(usersQuery);
                    if (!snap.empty && snap.docs[0].id !== currentUser.uid) {
                        showAlert('alerts.invalidValue');
                        setButtonLoading(btn, false);
                        return;
                    }
                }

                const updateData = {
                    full_name: name,
                    phone: phone,
                    email: email,
                    updated_at: new Date().toISOString()
                };

                if (_profilePhotoFile) {
                    try {
                        const photoUrl = await uploadImageToImgbb(_profilePhotoFile);
                        updateData.profile_picture = photoUrl;
                        _profilePhotoFile = null;
                    } catch (err) {
                        showAlert('alerts.somethingWentWrong');
                        setButtonLoading(btn, false);
                        return;
                    }
                } else {
                    const currentImg = document.getElementById('settings-profile-photo-img').src;
                    if (currentImg === PLACEHOLDER_IMG && ownerProfile.profile_picture) {
                        updateData.profile_picture = '';
                    }
                }

                const profileRef = doc(db, 'profiles', currentUser.uid);
                await updateDoc(profileRef, updateData);

                if (email && email !== currentUser.email) {
                    const password = prompt(t('settings.currentPasscode'));
                    if (!password) {
                        showAlert('alerts.somethingWentWrong');
                        setButtonLoading(btn, false);
                        return;
                    }
                    const credential = EmailAuthProvider.credential(currentUser.email, password);
                    await reauthenticateWithCredential(currentUser, credential);
                    await updateEmail(currentUser, email);
                    await sendEmailVerification(currentUser);
                }

                ownerProfile = { ...ownerProfile, ...updateData };
                updateProfileUI(ownerProfile);
                hasUnsavedChanges = false;
                showToast(t('alerts.updatedSuccessfully'), 'success');
                populateSettingsForms();
            } catch (err) {
                showToast(t('alerts.somethingWentWrong'), 'error');
            } finally {
                setButtonLoading(btn, false);
            }
        };

        window.handlePasswordChange = async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('.save-btn');
            setButtonLoading(btn, true);

            const current = document.getElementById('current-password').value;
            const newPass = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (newPass !== confirm) {
                showAlert('alerts.invalidValue');
                setButtonLoading(btn, false);
                return;
            }
            if (newPass.length < 6) {
                showAlert('alerts.invalidValue');
                setButtonLoading(btn, false);
                return;
            }

            try {
                const credential = EmailAuthProvider.credential(currentUser.email, current);
                await reauthenticateWithCredential(currentUser, credential);
                await updatePassword(currentUser, newPass);
                showToast(t('alerts.updatedSuccessfully'), 'success');
                form.reset();
                hasUnsavedChanges = false;
            } catch (err) {
                showToast(t('alerts.somethingWentWrong'), 'error');
            } finally {
                setButtonLoading(btn, false);
            }
        };

        window.handlePreferencesSave = async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('.save-btn');
            setButtonLoading(btn, true);

            try {
                const language = document.getElementById('settings-language').value;
                const currency = document.getElementById('settings-currency').value;
                const dateFormat = document.getElementById('settings-date-format').value;
                const notifications = document.getElementById('settings-notifications').checked;

                const prefs = { language, currency, dateFormat, notifications };
                const profileRef = doc(db, 'profiles', currentUser.uid);
                await updateDoc(profileRef, { preferences: prefs, updated_at: new Date().toISOString() });

                ownerProfile.preferences = prefs;
                hasUnsavedChanges = false;
                setLanguage(language);
                showToast(t('alerts.savedSuccessfully'), 'success');
            } catch (err) {
                showToast(t('alerts.somethingWentWrong'), 'error');
            } finally {
                setButtonLoading(btn, false);
            }
        };

        // =============== LOGOUT ===============
        window.handleLogout = async () => {
            await signOut(auth);
            window.location.href = 'https://shdr-construction.vercel.app/index.html';
        };

        // The original showSection was already overridden above for office blocking.
        // Keep the existing override for reports.
        // We'll add the reports tab update separately.
        const originalShowSection2 = window.showSection;
        window.showSection = function(section) {
            // If it's office, block it (already handled above, but this ensures it stays)
            if (section === 'office') {
                showToast('🏗️ Office Hub is coming soon. Stay tuned!', 'info');
                return;
            }
            // Otherwise call the original (which might be the one we defined earlier)
            originalShowSection2(section);
            if (section === 'reports' && reportType === 'payroll') {
                setTimeout(updatePayrollReport, 100);
            }
        };

        // Add a simple helper for the showAlert function used in the code
        function showAlert(key) { alert(t(key)); }
    </script>
</body>
</html>
