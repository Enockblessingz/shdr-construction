<script>
(function(){
  class IconifyIconShim extends HTMLElement {
    static get observedAttributes(){ return ['icon','width','height','class','style']; }
    connectedCallback(){ this._render(); }
    attributeChangedCallback(){ this._render(); }
    _render(){
      if (this._rendered) return;
      this._rendered = true;
      const raw = this.getAttribute('icon') || '';
      let name = raw.replace(/^material-symbols:/, '').replace(/-outline$/, '').replace(/-/g, '_');
      const w = parseInt(this.getAttribute('width') || '20', 10);
      const h = parseInt(this.getAttribute('height') || String(w), 10);
      const size = Math.max(w, h) || 20;
      const extraClass = this.getAttribute('class') || '';
      const extraStyle = this.getAttribute('style') || '';
      this.innerHTML = `<span class="material-symbols-outlined ${extraClass}" style="font-size:${size}px;width:${w||size}px;height:${h||size}px;${extraStyle}">${name}</span>`;
    }
  }
  if (!customElements.get('iconify-icon')) customElements.define('iconify-icon', IconifyIconShim);
})();
</script>

<!-- ============================================================
     BACKEND INTEGRATION NOTE (READ BEFORE PRODUCTION DEPLOYMENT)
     ============================================================
     This HTML file implements the complete frontend subscription UI.
     For a fully secure production payment flow you MUST also deploy a
     backend (Cloud Functions / Node server) that:

     1. Creates a payment intent with your real Rwandan payment provider
        (e.g. Paypack, Flutterwave, MTN MoMo API, BK, etc.) using a
        server-held secret key.
     2. Receives provider webhooks at /webhook/payment/:provider
        with signature verification.
     3. Idempotently verifies the transaction and updates:
            profiles/{ownerId}.subscription
            companies/{ownerId}.subscription
            profiles/{ownerId}/transactions/{txnId}.status = 'paid'
        ONLY when the provider confirms success.
     4. Uses server timestamps (admin.firestore.FieldValue.serverTimestamp())
        for expiry so clients cannot fake time.

     In this file we implement:
       - PAYMENT_MODE = 'sandbox'  → for development/testing.
         Clicking "Confirm & Pay" creates a PENDING transaction,
         then (in sandbox mode only) simulates provider verification
         and activates the subscription. THIS MUST NOT BE USED IN PROD.
       - PAYMENT_MODE = 'live'     → creates a PENDING transaction.
         The subscription stays 'pending' until the backend marks the
         transaction 'paid'. The client listens for real-time updates
         and activates the UI automatically when Firestore confirms it.

     Set PAYMENT_MODE = 'live' before going live.
     ============================================================ -->

function deepFallback(lang){
  const base = translations.en;
  const cur = translations[lang] || {};
  const out = JSON.parse(JSON.stringify(base));
  function mergeInto(target, src){
    Object.keys(src||{}).forEach(k=>{
      if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k])) {
        if (!target[k] || typeof target[k] !== 'object') target[k] = {};
        mergeInto(target[k], src[k]);
      } else { target[k] = src[k]; }
    });
  }
  mergeInto(out, cur);
  translations[lang] = out;
}

function formatDate(v){
  if(!v) return '—';
  let d, dateOnly=false;
  if(typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)){const [y,m,dd]=v.split('-').map(Number);d=new Date(y,m-1,dd);dateOnly=true;}
  else d=typeof v==='string'?new Date(v):v;
  if(isNaN(d.getTime())) return '—';
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const datePart=`${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  if(dateOnly) return datePart;
  const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  return `${datePart}, ${hh}:${mm}`;
}

function deriveSubscriptionState(sub){
  if (!sub) return { status:'none', label:'—', tone:'info', canAccess:true, banner:null };
  const rawStatus = (sub.status || 'trial').toLowerCase();
  const now = new Date();
  const endDate = sub.subscription_end_date ? new Date(sub.subscription_end_date) : null;
  const trialEnd = sub.trial_end_date ? new Date(sub.trial_end_date) : null;
  const isPast = (d) => d && d.getTime() < now.getTime();

  if (rawStatus === 'trial') {
    if (trialEnd && isPast(trialEnd)) {
      return { status:'expired', label:t('subscription.expired'), tone:'danger', canAccess:false,
        banner:{ title:t('subscription.trialBanner'), message:t('subscription.trialExpired'), cta:t('subscription.choosePlanNow'), action:'plans' } };
    }
    const daysLeft = trialEnd ? Math.max(0, Math.ceil((trialEnd - now) / 86400000)) : 0;
    return { status:'trial', label:t('subscription.trial'), tone: daysLeft<=3?'warning':'info', canAccess:true,
      banner:{ title:t('subscription.trialBanner'), message:t('subscription.trialDaysLeft',{n:daysLeft}), cta:t('subscription.upgradeNow'), action:'plans' } };
  }
  if (rawStatus === 'suspended') {
    return { status:'suspended', label:t('subscription.suspended'), tone:'danger', canAccess:false,
      banner:{ title:t('subscription.suspended'), message:t('subscription.suspendedMsg'), cta:t('subscription.viewPlans'), action:'plans' } };
  }
  if (rawStatus === 'pending') {
    return { status:'pending', label:t('subscription.paymentPending'), tone:'info', canAccess:true,
      banner:{ title:t('subscription.paymentPending'), message:t('subscription.awaitVerification'), cta:t('subscription.paymentHistory'), action:'history' } };
  }
  if (rawStatus === 'past_due' || rawStatus === 'payment_failed') {
    return { status:rawStatus, label:t('subscription.pastDue'), tone:'warning', canAccess:true,
      banner:{ title:t('subscription.pastDue'), message:t('subscription.pastDueMsg'), cta:t('subscription.viewPlans'), action:'plans' } };
  }
  if (rawStatus === 'cancelled') {
    if (endDate && isPast(endDate)) {
      return { status:'expired', label:t('subscription.expired'), tone:'danger', canAccess:false,
        banner:{ title:t('subscription.expired'), message:t('subscription.expiredMsg'), cta:t('subscription.viewPlans'), action:'plans' } };
    }
    return { status:'cancelled', label:t('subscription.cancelled'), tone:'warning', canAccess:true,
      banner:{ title:t('subscription.cancelled'), message:t('subscription.cancelledMsg',{date:formatDate(endDate)}), cta:t('subscription.undoCancel'), action:'undo' } };
  }
  if (rawStatus === 'expired' || (endDate && isPast(endDate))) {
    return { status:'expired', label:t('subscription.expired'), tone:'danger', canAccess:false,
      banner:{ title:t('subscription.expired'), message:t('subscription.expiredMsg'), cta:t('subscription.viewPlans'), action:'plans' } };
  }
  return { status:'active', label:t('subscription.active'), tone:'success', canAccess:true, banner:null };
}

async function ensureSubscription(){
  if (!currentUser) return;
  const profileRef = doc(db, 'profiles', currentUser.uid);
  const snap = await getDoc(profileRef);
  const data = snap.exists() ? snap.data() : {};
  if (data.subscription && data.subscription.plan) { subscriptionData = data.subscription; return; }
  const now = new Date();
  const trialEnd = new Date(now.getTime() + TRIAL_DAYS * 86400000);
  const fresh = {
    plan: 'trial', billing_cycle: 'monthly', status: 'trial',
    trial_start_date: now.toISOString(), trial_end_date: trialEnd.toISOString(),
    subscription_start_date: null, subscription_end_date: null,
    cancel_at_period_end: false, cancelled_at: null,
    amount: 0, currency: 'RWF', payment_reference: null,
    limits: PLAN_CONFIG.trial.limits, updated_at: now.toISOString(), created_at: now.toISOString()
  };
  await updateDoc(profileRef, { subscription: fresh });
  subscriptionData = fresh;
  try {
    await setDoc(doc(db, 'companies', currentUser.uid), { owner_id: currentUser.uid, subscription: fresh, name: getCompanyDetails().name, updated_at: now.toISOString() }, { merge: true });
  } catch (_) {}
}

function attachSubscriptionListener(){
  if (!currentUser) return;
  if (subscriptionUnsub) { try { subscriptionUnsub(); } catch(_){} subscriptionUnsub = null; }
  const profileRef = doc(db, 'profiles', currentUser.uid);
  const u1 = onSnapshot(profileRef, (s) => {
    if (s.exists()) {
      const data = s.data();
      if (data.subscription) {
        subscriptionData = data.subscription;
        updateSubscriptionBadge();
        if (currentSection === 'subscription') renderSection('subscription');
      }
    }
  });
  const u2 = onSnapshot(doc(db, 'companies', currentUser.uid), (s) => {
    if (s.exists() && s.data().subscription) subscriptionData = s.data().subscription;
  }, () => {});
  subscriptionUnsub = () => { try { u1(); } catch(_){}; try { u2(); } catch(_){} };
}

/** Live-listen to owner's transactions subcollection (payment history + pending verifications). */
function attachTransactionsListener(){
  if (!currentUser) return;
  if (transactionsUnsub) { try { transactionsUnsub(); } catch(_){} transactionsUnsub = null; }
  const txQ = query(collection(db, 'profiles', currentUser.uid, 'transactions'), orderBy('created_at', 'desc'), limit(100));
  transactionsUnsub = onSnapshot(txQ, (snap) => {
    transactionsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // If any transaction just flipped to 'paid' server-side and our subscription is not yet active,
    // we leave the activation to the backend. We only reflect status here.
    if (currentSection === 'subscription') renderSection('subscription');
  }, err => console.warn('transactions listener error:', err));
}

function updateSubscriptionBadge(){
  const badge = document.getElementById('sub-nav-badge');
  if (!badge) return;
  const st = currentSubState();
  if (st.status === 'expired' || st.status === 'suspended' || st.status === 'past_due' || st.status === 'payment_failed' || st.status === 'pending') {
    badge.classList.remove('hidden');
  } else if (st.status === 'trial') {
    const trialEnd = subscriptionData?.trial_end_date ? new Date(subscriptionData.trial_end_date) : null;
    const daysLeft = trialEnd ? Math.ceil((trialEnd - new Date())/86400000) : 99;
    if (daysLeft <= 3) badge.classList.remove('hidden'); else badge.classList.add('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

  const limits = currentLimits();

/** Feature gate: returns true if allowed; otherwise shows feature-locked modal. */
function requireFeature(featureKey, featureLabel){
  if (hasFeature(featureKey)) return true;
  // Find the minimum plan that includes this feature
  const requiredPlan = PLAN_ORDER.find(p => PLAN_CONFIG[p].features[featureKey]) || 'professional';
  const requiredLabel = PLAN_CONFIG[requiredPlan]?.name || 'Professional';
  openModal(t('subscription.featureLocked'), `

      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center flex-shrink-0">

}

  attachSnapshot(query(collection(db, 'materials'), where('site_id', 'in', siteIds)), snap => { materialsData = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshCurrentSection(); }, 'materials');

  attachSnapshot(query(collection(db, 'requisitions'), where('site_id', 'in', siteIds)), snap => { ownerRequisitionsData = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshCurrentSection(); }, 'requisitions');
  attachSnapshot(query(collection(db, 'requisition_items'), where('site_id', 'in', siteIds)), snap => { ownerRequisitionItemsData = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshCurrentSection(); }, 'requisition items');

function refreshCurrentSection() {
  if (currentSection === 'messages') { renderMessagesDirectory(); return; }
  if (!currentSection) return;
  if (window._refreshing) return;
  window._refreshing = true;
  requestAnimationFrame(() => {
    try {
      let savedFilters = null;
      if (currentSection === 'reports') {
        savedFilters = { site: document.getElementById('report-site')?.value || document.getElementById('payroll-site')?.value || document.getElementById('stock-report-site')?.value || 'all', dept: document.getElementById('report-dept')?.value || 'all', start: document.getElementById('report-start')?.value || document.getElementById('payroll-start')?.value || '', end: document.getElementById('report-end')?.value || document.getElementById('payroll-end')?.value || '', search: document.getElementById('payroll-worker-search')?.value || '', pos: document.getElementById('payroll-position')?.value || 'all', status: document.getElementById('payroll-status')?.value || 'all' };
      }
      showSection(currentSection);
      if (currentSection === 'reports' && savedFilters) {
        const setIf = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.value = val; };
        setIf('report-site', savedFilters.site); setIf('payroll-site', savedFilters.site); setIf('stock-report-site', savedFilters.site);
        setIf('report-dept', savedFilters.dept); setIf('report-start', savedFilters.start); setIf('payroll-start', savedFilters.start);
        setIf('report-end', savedFilters.end); setIf('payroll-end', savedFilters.end); setIf('payroll-worker-search', savedFilters.search);
        setIf('payroll-position', savedFilters.pos); setIf('payroll-status', savedFilters.status);
        if (reportType === 'payroll' && typeof updatePayrollReport === 'function') updatePayrollReport();
      }
    } finally { window._refreshing = false; }
  });
}

window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); };

function renderSection(section) {
  const container = document.getElementById('content-area');
  container.innerHTML = '';
  switch (section) {
    case 'dashboard': renderDashboard(container); break;
    case 'sites': renderSites(container); break;
    case 'materials': renderMaterials(container); break;
    case 'stock': renderStock(container); break;
    case 'workers': renderWorkers(container); break;
    case 'progress': renderProgress(container); break;
    case 'reports': renderReports(container); break;
    case 'finances': renderFinances(container); break;
    case 'managers': renderManagers(container); break;
    case 'subscription': renderSubscription(container); break;
    case 'messages': renderMessages(container); break;
    case 'gallery': renderGallery(container); break;
    case 'settings': renderSettings(container); break;
    default: renderDashboard(container);
  }
}

window.showSection = (section) => {
  if (currentSection === 'settings' && hasUnsavedChanges) { if (!confirm(t('common.areYouSure'))) return; hasUnsavedChanges = false; }
  currentSection = section;
  clearError();
  document.getElementById('page-title').textContent = t(`navigation.${section}`);
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.querySelector(`[data-section="${section}"]`)?.classList.add('active');
  document.querySelectorAll('#bottom-nav a').forEach(a => a.classList.remove('active'));
  document.querySelector(`#bottom-nav a[data-section="${section}"]`)?.classList.add('active');
  renderSection(section);
  if (window.innerWidth < 1024) { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebar-overlay').classList.add('hidden'); }
};

window.closeModal = () => document.getElementById('modal-overlay').classList.remove('active');
window.openModal = (title, bodyHTML) => {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-overlay').classList.add('active');
};

async function uploadImageToImgbb(file) {
  const formData = new FormData();
  formData.append('image', file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
  const json = await res.json();
  if (!json.success) throw new Error(t('common.somethingWentWrong'));
  return json.data.url;
}

function renderPlanCard(planKey){
  const cfg = PLAN_CONFIG[planKey];
  if (!cfg) return '';
  const price = cfg.price;
  const limits = cfg.limits;
  const isCurrent = currentPlanKey() === planKey;
  const isRecommended = planKey === 'professional';
  const monthlyAmount = price.monthly.toLocaleString();
  const annualAmount = price.annual.toLocaleString();
  const annualEquiv = price.monthlyEquivAnnual.toLocaleString();
  const savings = price.annualSavings.toLocaleString();
  const priceMain = billingCycle === 'annual' ? annualAmount : monthlyAmount;
  const priceSuffix = billingCycle === 'annual' ? t('subscription.perYear') : t('subscription.perMonth');
  const equivLine = billingCycle === 'annual' ? t('subscription.monthEquiv', { amount: annualEquiv + ' RWF' }) : '';
  const savingsLine = billingCycle === 'annual' ? t('subscription.savePerYear', { amount: savings + ' RWF' }) : '';

  const planName = t(cfg.labelKey);
  const planDesc = t(cfg.descKey);

  const featureKeys = planKey === 'starter' ? ['featureOwnerDash','featureSites','featureWorkers','featureMaterials','featureAttendance','featureReports','featureExports','featureMessaging','featureAnalytics']
                    : planKey === 'professional' ? ['featureEverythingStarter','featureMultiSite','featureAdvancedReports','featureRequisitions','featurePerformance','featureAdvancedAnalytics','featurePriority']
                    : ['featureEverythingPro','featureCompanyReports','featureAdvancedAnalytics','featureInventoryControls','featureEnterprise'];

  const buttonHtml = isCurrent
    ? `<button class="plan-cta secondary" disabled>${t('subscription.current')}</button>`
    : `<button class="plan-cta primary" onclick="openCheckout('${planKey}','${billingCycle}')">${t('subscription.selectPlan')} — ${planName}</button>`;

  const limitSitesTxt = limits.sites >= 999 ? t('subscription.unlimited') : limits.sites;
  const limitManagersTxt = limits.managers >= 999 ? t('subscription.unlimited') : limits.managers;
  const limitWorkersTxt = limits.workers >= 999 ? t('subscription.unlimited') : limits.workers;

  return `<div class="plan-card ${isRecommended ? 'recommended' : ''} ${isCurrent ? 'current' : ''}">
    ${isRecommended && !isCurrent ? `<span class="plan-badge">${t('subscription.recommended')}</span>` : ''}
    ${isCurrent ? `<span class="plan-badge" style="background:#047857;">${t('subscription.current')}</span>` : ''}
    <div class="plan-name">${planName}</div>
    <div class="plan-desc">${planDesc}</div>
    <div class="plan-price">RWF ${priceMain}</div>
    <div class="plan-price-suffix">${priceSuffix}</div>
    ${equivLine ? `<div class="plan-equiv">${equivLine}</div>` : ''}
    ${savingsLine ? `<div class="plan-savings">${savingsLine}</div>` : ''}
    <div class="plan-limits">
      <div class="lim-row"><span>${t('subscription.limitSites')}</span><strong>${limitSitesTxt}</strong></div>
      <div class="lim-row"><span>${t('subscription.limitManagers')}</span><strong>${limitManagersTxt}</strong></div>
      <div class="lim-row"><span>${t('subscription.limitWorkers')}</span><strong>${limitWorkersTxt}</strong></div>
    </div>
    <ul class="plan-features">
      ${featureKeys.map(k => `<li><iconify-icon icon="material-symbols:check-circle" width="16"></iconify-icon><span>${escapeHTML(t('subscription.' + k))}</span></li>`).join('')}
    </ul>
    ${buttonHtml}
  </div>`;
}

window.selectPaymentMethod = (method) => {
  _checkoutState.method = method;
  document.querySelectorAll('.pay-method').forEach(btn => btn.classList.toggle('selected', btn.dataset.method === method));
  const btn = document.getElementById('confirm-pay-btn');
  if (btn) btn.disabled = false;
};

window.handleConfirmPayment = async () => {
  const btn = document.getElementById('confirm-pay-btn');
  if (!_checkoutState.planId) { showToast('Invalid plan', 'error'); return; }
  if (!_checkoutState.method) { showToast('Please choose a payment method', 'error'); return; }
  setButtonLoading(btn, true);
  try {
    const planKey = _checkoutState.planId;
    const cycle = _checkoutState.cycle;
    const cfg = PLAN_CONFIG[planKey];
    const amount = cycle === 'annual' ? cfg.price.annual : cfg.price.monthly;
    const now = new Date();
    const reference = `SHDR-${Date.now()}-${Math.random().toString(36).slice(2,8).toUpperCase()}`;

    // --- STEP 1: record PENDING transaction (server-authoritative in production) ---
    const txnRef = doc(collection(db, 'profiles', currentUser.uid, 'transactions'));
    await setDoc(txnRef, {
      id: txnRef.id,
      plan: planKey,
      billing_cycle: cycle,
      amount,
      currency: 'RWF',
      method: _checkoutState.method,
      reference,
      status: 'pending',
      created_at: now.toISOString(),
      paid_at: null,
      period_start: null,
      period_end: null,
      mode: PAYMENT_MODE
    });

    // --- STEP 2: set subscription to 'pending' so UI shows correct state ---
    const pendingSub = {
      ...(subscriptionData||{}),
      plan: planKey,
      billing_cycle: cycle,
      status: 'pending',
      amount,
      currency: 'RWF',
      payment_provider: _checkoutState.method,
      payment_reference: reference,
      limits: cfg.limits,
      updated_at: now.toISOString()
    };
    await updateDoc(doc(db, 'profiles', currentUser.uid), { subscription: pendingSub });
    try { await setDoc(doc(db, 'companies', currentUser.uid), { owner_id: currentUser.uid, subscription: pendingSub, updated_at: now.toISOString() }, { merge: true }); } catch (_) {}
    subscriptionData = pendingSub;
    updateSubscriptionBadge();

    if (PAYMENT_MODE === 'sandbox') {
      // ===== SANDBOX ONLY: simulate provider verification =====
      // In production, the backend webhook performs this step after real payment verification.
      showToast(t('subscription.paymentPending'), 'info');
      await new Promise(r => setTimeout(r, 900));
      const durationDays = cycle === 'annual' ? 365 : 30;
      const endDate = new Date(now.getTime() + durationDays * 86400000);
      const activeSub = {
        ...pendingSub,
        status: 'active',
        subscription_start_date: now.toISOString(),
        subscription_end_date: endDate.toISOString(),
        cancel_at_period_end: false,
        cancelled_at: null,
        last_payment_at: now.toISOString(),
        updated_at: now.toISOString()
      };
      await updateDoc(doc(db, 'profiles', currentUser.uid), { subscription: activeSub });
      try { await setDoc(doc(db, 'companies', currentUser.uid), { subscription: activeSub, updated_at: now.toISOString() }, { merge: true }); } catch (_) {}
      await updateDoc(txnRef, { status: 'paid', paid_at: now.toISOString(), period_start: now.toISOString(), period_end: endDate.toISOString() });
      subscriptionData = activeSub;
      closeModal();
      showToast(t('subscription.paymentSuccess'), 'success');
      if (currentSection === 'subscription') renderSection('subscription');
    } else {
      // ===== LIVE MODE: wait for server-side verification =====
      // Backend must flip txn.status to 'paid' AND write the active subscription.
      // Our real-time listeners reflect that automatically.
      closeModal();
      showToast(t('subscription.paymentPending'), 'info');
      if (currentSection === 'subscription') renderSection('subscription');
    }
  } catch (err) {
    console.error(err);
    showToast(t('subscription.paymentFailed'), 'error');
  } finally {
    setButtonLoading(btn, false);
  }
};

window.deleteSite = async (id) => {

window.handleEditMaterial = async (e, id) => {
  e.preventDefault();
  const btn = getFormSubmitBtn(e.target); setButtonLoading(btn, true);
  try {
    const name = document.getElementById('edit-mat-name').value.trim();
    const newUsed = parseFloat(document.getElementById('edit-mat-used').value) || 0;
    const newUnitCost = parseFloat(document.getElementById('edit-mat-unit-cost').value) || 0;
    const oldMat = materialsData.find(m => m.id === id); if (!oldMat) throw new Error(t('common.somethingWentWrong'));
    const oldUsed = oldMat.quantity_used || 0; const siteId = oldMat.site_id;
    let stockItem = stockData.find(s => s.site_id === siteId && s.material_name === oldMat.name);
    if (!stockItem) { const ref = await addDoc(collection(db, 'stock'), { site_id: siteId, material_name: oldMat.name, quantity: 0, unit: 'units', created_at: new Date().toISOString(), updated_at: new Date().toISOString() }); stockItem = { id: ref.id, quantity: 0, material_name: oldMat.name }; }
    const restoredQuantity = stockItem.quantity + oldUsed;
    if (newUsed > restoredQuantity) { showToast(`${t('common.invalidValue')}: ${restoredQuantity}`, 'error'); return; }
    const newStockQty = restoredQuantity - newUsed; const batch = writeBatch(db);
    batch.update(doc(db, 'materials', id), { name, quantity_used: newUsed, unit_cost: newUnitCost, updated_at: new Date().toISOString() });
    batch.update(doc(db, 'stock', stockItem.id), { quantity: newStockQty, updated_at: new Date().toISOString() });
    await batch.commit(); closeModal(); showToast(t('common.updatedSuccessfully'), 'success');
  } catch (err) { console.error(err); showToast(t('common.somethingWentWrong'), 'error'); }
  finally { setButtonLoading(btn, false); }
};

      if (!stockItem) { await deleteDoc(doc(db, 'materials', id)); showToast(t('common.deletedSuccessfully'), 'success'); return; }

      batch.update(doc(db, 'stock', stockItem.id), { quantity: newQty, updated_at: new Date().toISOString() });

};

function renderStock(container) {
  if (!stockData.length) { container.innerHTML = `<div class="bg-white rounded-2xl border p-8 text-center"><iconify-icon icon="material-symbols:inventory-2-outline" class="text-5xl text-slate-300 mx-auto block mb-4"></iconify-icon><p class="text-slate-600 font-medium">${t('stock.noStock')}</p></div>`; return; }
  const siteGroups = {};
  stockData.forEach(item => { const site = sitesData.find(s => s.id === item.site_id); const siteName = site ? site.name : 'Unknown Site'; if (!siteGroups[siteName]) siteGroups[siteName] = []; siteGroups[siteName].push(item); });
  let html = `<h2 class="text-xl sm:text-2xl font-bold mb-4 flex items-center gap-2"><iconify-icon icon="material-symbols:inventory-2" class="text-emerald-600"></iconify-icon>${t('stock.title')}</h2><div class="space-y-6">`;

    items.forEach(item => {
      const status = item.quantity <= 0 ? t('stock.out') : (item.minimum_quantity && item.quantity <= item.minimum_quantity ? t('stock.low') : t('stock.normal'));
      const statusClass = status === t('stock.normal') ? 'stock-status-normal' : status === t('stock.low') ? 'stock-status-low' : 'stock-status-out';
      const unitCost = materialsData.filter(m => m.site_id === item.site_id && m.name === item.material_name).pop()?.unit_cost || 0;

      html += `<div class="bg-slate-50 rounded-xl p-3 border border-slate-200"><div class="flex justify-between items-start"><p class="font-medium text-slate-800">${item.material_name}</p><span class="text-xs font-medium px-2 py-0.5 rounded-full ${statusClass}">${status}</span></div><p class="text-sm text-slate-600">${item.quantity} ${item.unit || 'units'}</p><p class="text-xs text-slate-600 font-medium">${t('stock.value')}: ${stockValue.toFixed(2)} RWF</p></div>`;

  }
  html += `</div>`; container.innerHTML = html;
}

  const rows = mats.map(m => ({ Site: sitesData.find(s=>s.id===m.site_id)?.name || 'Unknown', Date: formatDate(m.created_at), Material: m.name, Quantity: m.quantity_used||0, 'Unit Cost': m.unit_cost||0, Total: calculateTotal(m.quantity_used||0,m.unit_cost||0) }));

    const csv = [headers.join(','), ...rows.map(r => headers.map(h => `"${String(r[h]).replace(/"/g,'""')}"`).join(','))].join('\n');

function renderFinances(container) {
  container.innerHTML = `<h2 class="text-xl sm:text-2xl font-bold mb-3 flex items-center gap-2"><iconify-icon icon="material-symbols:finance" class="text-emerald-600"></iconify-icon>${t('finances.title')}</h2><div class="flex gap-2 overflow-x-auto pb-2 mb-4">${sitesData.map(s => `<button onclick="selectFinanceSite('${s.id}')" class="px-3 py-1 rounded-full whitespace-nowrap text-sm ${selectedFinanceSite === s.id ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}">${s.name}</button>`).join('')}</div><div id="finance-content"></div>`;
  if (selectedFinanceSite) renderFinanceContent();
}
window.selectFinanceSite = (id) => { selectedFinanceSite = id; renderFinances(document.getElementById('content-area')); };
function renderFinanceContent() {
  const site = sitesData.find(s => s.id === selectedFinanceSite); if (!site) return;
  const siteMaterials = materialsData.filter(m => m.site_id === selectedFinanceSite);
  const matSpent = siteMaterials.reduce((sum, m) => sum + calculateTotal(m.quantity_used || 0, m.unit_cost || 0), 0);
  const siteAttendance = attendanceData.filter(a => a.site_id === selectedFinanceSite);
  const workerSpent = siteAttendance.reduce((sum, a) => sum + (a.daily_rate || 0), 0);
  const totalSpent = matSpent + workerSpent; const budget = site.budget || 0; const remaining = budget - totalSpent; const loss = remaining < 0;
  document.getElementById('finance-content').innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div class="bg-white rounded-2xl border p-4"><h3 class="font-semibold text-sm mb-3">${t('finances.info')}</h3><p class="text-sm"><strong>${t('sites.siteName')}:</strong> ${site.name}</p><p class="text-sm"><strong>${t('sites.location')}:</strong> ${site.location || '—'}</p><button onclick="openAddBudgetModal('${site.id}')" class="mt-2 text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full">${t('finances.addBudget')}</button></div><div class="bg-white rounded-2xl border p-4"><h3 class="font-semibold text-sm mb-3">${t('finances.overview')}</h3><div class="space-y-1 text-sm"><p><strong>${t('finances.budget')}:</strong> ${budget.toLocaleString()} RWF</p><p><strong>${t('finances.totalSpent')}:</strong> ${totalSpent.toLocaleString()} RWF</p><p><strong>${t('finances.remaining')}:</strong> <span class="${loss ? 'text-red-600' : 'text-emerald-600'}">${remaining.toLocaleString()} RWF</span></p></div></div></div>`;
}
window.openAddBudgetModal = (siteId) => {
  const site = sitesData.find(s => s.id === siteId); if (!site) return;
  openModal(t('finances.addBudget'), `<form onsubmit="handleAddBudget(event, '${siteId}')" class="space-y-4"><p class="text-sm text-slate-600">${t('finances.budget')}: ${(site.budget || 0).toLocaleString()} RWF</p><input class="w-full border rounded-lg p-3" type="number" placeholder="${t('finances.newBudget')}" id="new-budget" min="0" required><button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-xl">${t('finances.updateBudget')}</button></form>`);

window.handleAddBudget = async (e, siteId) => {

}
window.openInviteManagerModal = () => {
  if (!checkPlanLimit('managers', managersData.length)) return;
  const siteOptions = sitesData.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  openModal(t('managers.inviteManager'), `<form onsubmit="handleInviteManager(event)" class="space-y-4"><select id="manager-site" class="w-full border rounded-lg p-3" required><option value="">${t('dashboard.selectSite')}</option>${siteOptions}</select><input class="w-full border rounded-lg p-3" type="email" placeholder="${t('managers.email')}" id="manager-email" required><input class="w-full border rounded-lg p-3" type="password" placeholder="${t('managers.password')}" id="manager-password" required minlength="6"><button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-xl">${t('managers.invite')}</button></form>`);
};
window.handleInviteManager = async (e) => {
  e.preventDefault();
  if (!checkPlanLimit('managers', managersData.length)) return;
  const btn = getFormSubmitBtn(e.target); setButtonLoading(btn, true);
  try {
    const email = document.getElementById('manager-email').value.trim();
    const password = document.getElementById('manager-password').value;
    const siteId = document.getElementById('manager-site').value;
    if (!email || !password || !siteId) { showAlert('common.requiredField'); return; }
    if (password.length < 6) { showAlert('common.invalidValue'); return; }
    if (managersData.some(m => m.email === email)) { showAlert('common.invalidValue'); return; }
    const apiKey = firebaseConfig.apiKey;
    const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, returnSecureToken: false }) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || 'Registration failed');
    await setDoc(doc(db, 'profiles', data.localId), { email, full_name: email.split('@')[0], role: 'manager', assigned_site: siteId, phone: '', status: 'active' });
    showToast(t('common.savedSuccessfully'), 'success'); closeModal();
  } catch (err) { console.error(err); showToast(err.message || t('common.somethingWentWrong'), 'error'); }
  finally { setButtonLoading(btn, false); }
};
window.removeManager = async (uid) => {
  if (!confirm(t('common.areYouSure'))) return;
  try { await deleteDoc(doc(db, 'profiles', uid)); showToast(t('common.deletedSuccessfully'), 'success'); }
  catch (err) { console.error(err); showToast(t('common.somethingWentWrong'), 'error'); }
};

let conversationsData = []; let activeManagerId = null; let activeConversationId = null; let messagesCache = []; let messageUnsub = null; let typingUnsub = null; let chatUnsubs = []; let presenceMap = {}; let typingMap = {}; let managerSearchQuery = ''; let rtdb = null; let replyingTo = null; let pendingAttachment = null; let emojiPickerOpen = false; let searchPanelOpen = false; let currentSearchQuery = ''; let _lastRenderedCid = null;

function buildConversationId(ownerId, managerId) { return `owner_${ownerId}_manager_${managerId}`; }
function getMessagingManagers() { const mySiteIds = new Set(sitesData.map(s => s.id)); const withHistory = new Set(conversationsData.map(c => c.manager_id)); return managersData.filter(m => { if (m.status && m.status !== 'active') return false; const assignedToMySite = m.assigned_site && mySiteIds.has(m.assigned_site); return assignedToMySite || withHistory.has(m.id); }); }
function getManagerSiteName(manager) { if (!manager?.assigned_site) return t('common.noDataAvailable'); return sitesData.find(s => s.id === manager.assigned_site)?.name || t('common.noDataAvailable'); }
function getConversationForManager(managerId) { return conversationsData.find(c => c.manager_id === managerId) || null; }
function formatChatTime(v) { if (!v) return ''; const d = new Date(v); if (isNaN(d.getTime())) return ''; const now = new Date(); const hh = String(d.getHours()).padStart(2, '0'); const mm = String(d.getMinutes()).padStart(2, '0'); if (d.toDateString() === now.toDateString()) return `${hh}:${mm}`; const y = new Date(now); y.setDate(y.getDate() - 1); if (d.toDateString() === y.toDateString()) return `${t('messages.yesterday')} ${hh}:${mm}`; return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()} ${hh}:${mm}`; }
function formatBytes(bytes) { if (!bytes) return '0 B'; const k = 1024, sizes = ['B','KB','MB','GB']; const i = Math.floor(Math.log(bytes) / Math.log(k)); return `${(bytes / Math.pow(k, i)).toFixed(1)} ${sizes[i]}`; }
function initialsOf(name) { return String(name || '?').trim().charAt(0).toUpperCase() || '?'; }
function getDraft(cid) { try { return localStorage.getItem(`shdr_draft_${cid}`) || ''; } catch { return ''; } }
function setDraft(cid, text) { try { if (text && text.trim()) localStorage.setItem(`shdr_draft_${cid}`, text); else localStorage.removeItem(`shdr_draft_${cid}`); } catch {} }

function initPresence() { if (!currentUser) return; try { rtdb = rtdb || getDatabase(app); } catch (e) { return; } const connectedRef = rtdbRef(rtdb, '.info/connected'); const connectedUnsub = rtdbOnValue(connectedRef, (snap) => { if (snap.val() === false) return; const myPresence = rtdbRef(rtdb, `presence/${currentUser.uid}`); onDisconnect(myPresence).set({ online: false, last_changed: Date.now() }).then(() => rtdbSet(myPresence, { online: true, last_changed: Date.now() })).catch(()=>{}); }); chatUnsubs.push(connectedUnsub); chatUnsubs.push(rtdbOnValue(rtdbRef(rtdb, 'presence'), (snap) => { presenceMap = snap.val() || {}; if (currentSection === 'messages') { renderMessagesDirectory(); renderMessagesThread(); } }, ()=>{})); }
function startTyping(cid) { if (!rtdb || !cid) return; rtdbSet(rtdbRef(rtdb, `typing/${cid}/${currentUser.uid}`), Date.now()).catch(() => {}); }
function stopTyping(cid) { if (!rtdb || !cid) return; rtdbSet(rtdbRef(rtdb, `typing/${cid}/${currentUser.uid}`), null).catch(() => {}); }
let _typingTimer = null;
function onComposerInput() { if (!activeConversationId) return; startTyping(activeConversationId); clearTimeout(_typingTimer); _typingTimer = setTimeout(() => stopTyping(activeConversationId), 3000); }
function subscribeToTyping(cid) { if (typingUnsub) { try { typingUnsub(); } catch (_) {} typingUnsub = null; } typingMap = {}; if (!rtdb || !cid) return; typingUnsub = rtdbOnValue(rtdbRef(rtdb, `typing/${cid}`), (snap) => { const val = snap.val() || {}; const now = Date.now(); typingMap = {}; Object.entries(val).forEach(([uid, ts]) => { if (uid !== currentUser.uid && now - ts < 5000) typingMap[uid] = ts; }); renderTypingIndicator(); }, ()=>{}); }
function attachMessagingListeners() { chatUnsubs.forEach(fn => { try { fn(); } catch (_) {} }); chatUnsubs = []; if (!currentUser) return; const convQ = query(collection(db, CONVERSATIONS), where('participants', 'array-contains', currentUser.uid)); chatUnsubs.push(onSnapshot(convQ, (snap) => { conversationsData = snap.docs.map(d => ({ id: d.id, ...d.data() })); updateMessagesBadge(); if (currentSection === 'messages') { if (activeConversationId && !conversationsData.some(c => c.id === activeConversationId)) closeManagerConversation(); renderMessagesDirectory(); renderMessagesThread(); } }, ()=>{})); initPresence(); }
function subscribeToMessages(cid) { if (messageUnsub) { try { messageUnsub(); } catch (_) {} messageUnsub = null; } messagesCache = []; const msgQ = query(collection(db, CONVERSATIONS, cid, 'messages'), orderBy('created_at', 'asc'), limit(500)); messageUnsub = onSnapshot(msgQ, (snap) => { messagesCache = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderMessagesThread(); markConversationRead(cid); markConversationDelivered(cid); }, ()=>{}); }
async function ensureConversation(managerId) { const allowed = getMessagingManagers().some(m => m.id === managerId); if (!allowed) throw new Error(t('messages.notAuthorized')); const cid = buildConversationId(currentUser.uid, managerId); const ref = doc(db, CONVERSATIONS, cid); let snap; try { snap = await getDoc(ref); } catch (e) { throw new Error(t('messages.notAuthorized')); } if (!snap.exists()) { const payload = { type: 'owner_manager', owner_id: currentUser.uid, manager_id: managerId, participants: [currentUser.uid, managerId], created_at: new Date().toISOString(), updated_at: new Date().toISOString(), last_message: null, unread: { [currentUser.uid]: 0, [managerId]: 0 }, user_settings: { [currentUser.uid]: { pinned: false, muted: false, archived: false }, [managerId]: { pinned: false, muted: false, archived: false } } }; try { await setDoc(ref, payload); } catch (err) { const again = await getDoc(ref); if (!again.exists()) throw err; } } return cid; }
async function markConversationRead(cid) { const conv = conversationsData.find(c => c.id === cid); const unread = (conv?.unread && conv.unread[currentUser.uid]) || 0; if (!unread) return; try { await updateDoc(doc(db, CONVERSATIONS, cid), { [`unread.${currentUser.uid}`]: 0 }); } catch (err) {} }
async function markConversationDelivered(cid) { const now = new Date().toISOString(); const batch = writeBatch(db); let touched = 0; messagesCache.forEach(m => { if (m.sender_id === currentUser.uid) return; if (m.delivered_at) return; batch.update(doc(db, CONVERSATIONS, cid, 'messages', m.id), { delivered_at: now }); touched++; }); if (touched) { try { await batch.commit(); } catch (e) {} } }
window.openManagerConversation = async (managerId) => { const manager = getMessagingManagers().find(m => m.id === managerId); if (!manager) { showToast(t('messages.notAuthorized'), 'error'); return; } try { const cid = await ensureConversation(managerId); activeManagerId = managerId; activeConversationId = cid; document.querySelector('.messages-shell')?.classList.add('thread-open'); subscribeToMessages(cid); subscribeToTyping(cid); renderMessagesThread(); renderMessagesDirectory(); await markConversationRead(cid); await markConversationDelivered(cid); } catch (err) { showToast(err.message || t('common.somethingWentWrong'), 'error'); } };
window.closeManagerConversation = () => { if (activeConversationId) stopTyping(activeConversationId); if (messageUnsub) { try { messageUnsub(); } catch (_) {} messageUnsub = null; } if (typingUnsub) { try { typingUnsub(); } catch (_) {} typingUnsub = null; } activeManagerId = null; activeConversationId = null; messagesCache = []; document.querySelector('.messages-shell')?.classList.remove('thread-open'); renderMessagesThread(); renderMessagesDirectory(); };

window.sendMessage = async () => {
  const input = document.getElementById('message-input'); if (!input || !activeConversationId || !activeManagerId) return;
  const text = (input.value || '').trim();
  if (!text) return;
  const now = new Date().toISOString(); const msgRef = doc(collection(db, CONVERSATIONS, activeConversationId, 'messages'));
  input.value = ''; stopTyping(activeConversationId);
  try {
    const msgPayload = { sender_id: currentUser.uid, sender_role: 'owner', text, type: 'text', created_at: now };
    const batch = writeBatch(db); batch.set(msgRef, msgPayload); batch.update(doc(db, CONVERSATIONS, activeConversationId), { last_message: { text: text.slice(0, 200), sender_id: currentUser.uid, created_at: now }, updated_at: now, [`unread.${activeManagerId}`]: increment(1) });
    await batch.commit();
  } catch (err) { input.value = text; showToast(t('common.somethingWentWrong'), 'error'); }
};

function renderMessagesDirectory() { const el = document.getElementById('messages-directory'); if (!el) return; const managers = getMessagingManagers(); const rows = managers.map(m => { const conv = getConversationForManager(m.id); const unread = (conv?.unread && conv.unread[currentUser.uid]) || 0; const name = m.full_name || m.email || 'Manager'; return `<button type="button" onclick="openManagerConversation('${m.id}')" class="msg-row w-full text-left px-3 py-3 border-b border-slate-100"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold">${escapeHTML(initialsOf(name))}</div><div class="flex-1 min-w-0"><p class="font-semibold text-sm text-slate-900 truncate">${escapeHTML(name)}</p><p class="text-xs text-slate-500 truncate">${getManagerSiteName(m)}</p></div>${unread > 0 ? `<span class="bg-emerald-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">${unread}</span>` : ''}</div></button>`; }).join(''); el.innerHTML = `<div class="p-3 border-b bg-white"><input id="manager-search" type="text" value="${escapeHTML(managerSearchQuery)}" oninput="filterManagerDirectory(event)" placeholder="${t('messages.searchPlaceholder')}" class="w-full border rounded-lg py-2 px-3 text-sm"></div><div class="flex-1 overflow-y-auto">${rows || `<p class="p-4 text-sm text-slate-400">${t('messages.noManagers')}</p>`}</div>`; }
