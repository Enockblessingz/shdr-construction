  <script>
// ===== STATE =====
let currentUser = null;
let currentView = 'dashboard';
let allData = [];
let sites = [];
let materials = [];
let workers = [];
let dailyReports = [];
let suppliers = [];
let purchaseOrders = [];
let photos = [];
let notifications = [];
let auditLogs = [];
let dailyWorkerDeployments = [];
let workerMaster = [];

const defaultConfig = {
    company_name: 'SHDR Ltd',
    tagline: 'Construction Site Management',
    background_color: '#f8fafc',
    surface_color: '#ffffff',
    text_color: '#0f172a',
    primary_color: '#16a34a',
    secondary_color: '#475569'
};

// ===== ELEMENT SDK =====
window.elementSdk.init({
    defaultConfig,
    onConfigChange: async (config) => {
        document.getElementById('login-title').textContent = config.company_name || defaultConfig.company_name;
        document.getElementById('login-tagline').textContent = config.tagline || defaultConfig.tagline;
        document.getElementById('header-title').textContent = config.company_name || defaultConfig.company_name;
        document.body.style.backgroundColor = config.background_color || defaultConfig.background_color;
        document.querySelectorAll('.brand-bg').forEach(el => el.style.backgroundColor = config.primary_color || defaultConfig.primary_color);
    },
    mapToCapabilities: (config) => ({
        recolorables: [
            { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); }},
            { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); }},
            { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); }},
            { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); }},
            { get: () => config.secondary_color || defaultConfig.secondary_color, set: (v) => { config.secondary_color = v; window.elementSdk.setConfig({ secondary_color: v }); }}
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }},
        fontSizeable: undefined
    }),
    mapToEditPanelValues: (config) => new Map([
        ['company_name', config.company_name || defaultConfig.company_name],
        ['tagline', config.tagline || defaultConfig.tagline]
    ])
});

// ===== DATA SDK =====
const dataHandler = {
    onDataChanged(data) {
        allData = data;
        sites = data.filter(d => d.type === 'site');
        materials = data.filter(d => d.type === 'material');
        workers = data.filter(d => d.type === 'worker');
        dailyReports = data.filter(d => d.type === 'daily_report');
        suppliers = data.filter(d => d.type === 'supplier');
        purchaseOrders = data.filter(d => d.type === 'purchase_order');
        photos = data.filter(d => d.type === 'photo');
        notifications = data.filter(d => d.type === 'notification');
        auditLogs = data.filter(d => d.type === 'audit_log');
        dailyWorkerDeployments = data.filter(d => d.type === 'daily_worker_deployment');
        workerMaster = data.filter(d => d.type === 'worker_master');
        updateNotificationBadge();
        renderCurrentView();
    }
};

(async () => {
    const result = await window.dataSdk.init(dataHandler);
    if (!result.isOk) console.error('Data SDK init failed');
    
    if (!initializeAuth()) {
        lucide.createIcons();
    }
})();

// ===== AUTHENTICATION =====
const DEMO_ACCOUNTS = {
    'admin@shdr.rw': { password: 'admin##2019', role: 'admin', name: 'Administrator' },
    'manager@shdr.rw': { password: 'manager##2019', role: 'manager', name: 'Site Manager' }
};

function togglePasswordVisibility() {
    const input = document.getElementById('login-password');
    const icon = document.getElementById('password-toggle-icon');
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    icon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
    lucide.createIcons();
}

function showForgotPassword(e) {
    e.preventDefault();
    showToast('Contact your SHDR administrator for password reset', 'success');
}

function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorDiv = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');
    const btnText = document.getElementById('login-btn-text');
    const spinner = document.getElementById('login-spinner');

    errorDiv.classList.add('hidden');

    if (!email || !password) {
        errorDiv.textContent = '❌ Please enter email and passcode';
        errorDiv.classList.remove('hidden');
        return;
    }

    btn.disabled = true;
    spinner.classList.remove('hidden');

    setTimeout(() => {
        const account = DEMO_ACCOUNTS[email];
        
        if (!account || account.password !== password) {
            errorDiv.textContent = '❌ Incorrect email or passcode. Try again!.';
            errorDiv.classList.remove('hidden');
            btn.disabled = false;
            spinner.classList.add('hidden');
            btnText.textContent = 'Sign In';
            return;
        }

        currentUser = {
            email,
            name: account.name,
            role: account.role,
            loginTime: new Date().toISOString(),
            lastActive: new Date().toISOString()
        };

        localStorage.setItem('shdr_user', JSON.stringify(currentUser));
        if (document.getElementById('login-remember').checked) {
            localStorage.setItem('shdr_remember', email);
        }

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        document.getElementById('user-display').textContent = `${currentUser.name}`;
        
        buildNavigation();
        navigateTo('dashboard');
        showToast(` Welcome, ${currentUser.name}!`);
        addNotification('login', 'Login Successful', `${currentUser.name} logged in at ${new Date().toLocaleTimeString()}`);
        lucide.createIcons();
    }, 500);
}

function initializeAuth() {
    const remembered = localStorage.getItem('shdr_remember');
    if (remembered) {
        document.getElementById('login-email').value = remembered;
        document.getElementById('login-remember').checked = true;
    }
    
    const stored = localStorage.getItem('shdr_user');
    if (stored) {
        try {
            currentUser = JSON.parse(stored);
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-display').textContent = `${currentUser.name}`;
            buildNavigation();
            navigateTo('dashboard');
            lucide.createIcons();
            return true;
        } catch (e) {
            localStorage.removeItem('shdr_user');
        }
    }
    return false;
}

document.getElementById('logout-btn').addEventListener('click', () => {
    const userName = currentUser?.name || 'User';
    currentUser = null;
    localStorage.removeItem('shdr_user');
    document.getElementById('main-app').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('login-error').classList.add('hidden');
    showToast(`${userName} logged out`);
    lucide.createIcons();
});

document.getElementById('menu-toggle').addEventListener('click', () => {
    document.getElementById('sidebar-overlay').classList.remove('hidden');
    document.getElementById('mobile-sidebar').classList.remove('hidden');
});

function closeMobileNav() {
    document.getElementById('sidebar-overlay').classList.add('hidden');
    document.getElementById('mobile-sidebar').classList.add('hidden');
}

// ===== NAVIGATION =====
const adminNavConfig = [
    { id:'dashboard', label:'Dashboard', icon:'layout-dashboard' },
    { id:'sites', label:'Sites', icon:'building' },
    { id:'materials', label:'Materials', icon:'package' },
    { id:'workers', label:'Workers', icon:'hard-hat' },
    { id:'daily-workers', label:'Daily Workers', icon:'users' },
    { id:'suppliers', label:'Suppliers', icon:'truck' },
    { id:'purchase-orders', label:'Purchase Orders', icon:'file-text' },
    { id:'photos', label:'Photos', icon:'camera' },
    { id:'reports', label:'Reports', icon:'bar-chart-3' },
    { id:'audit-logs', label:'Audit Logs', icon:'shield-alert' }
];

const managerNavConfig = [
    { id:'dashboard', label:'Dashboard', icon:'layout-dashboard' },
    { id:'daily-entry', label:'Daily Entry', icon:'clipboard-list' },
    { id:'materials', label:'Materials', icon:'package' },
    { id:'daily-workers', label:'Daily Workers', icon:'users' },
    { id:'photos', label:'Photos', icon:'camera' },
    { id:'reports', label:'Reports', icon:'bar-chart-3' }
];

function isUserAuthorized(viewId) {
    if (currentUser.role === 'admin') return true;
    const allowedForManager = ['dashboard', 'daily-entry', 'materials', 'daily-workers', 'photos', 'reports'];
    return allowedForManager.includes(viewId);
}

function buildNavigation() {
    const navItems = currentUser.role === 'admin' ? adminNavConfig : managerNavConfig;
    const makeItem = (item) => {
        if (!isUserAuthorized(item.id)) return '';
        return `<button onclick="navigateTo('${item.id}')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors ${currentView===item.id?'active':''}">
            <i data-lucide="${item.icon}" class="w-4 h-4"></i><span>${item.label}</span>
        </button>`;
    };
    const navHTML = navItems.map(makeItem).join('');
    document.getElementById('nav-items').innerHTML = navHTML;
    document.getElementById('mobile-nav-items').innerHTML = navHTML;
    
    const bottomItems = navItems.filter(i => isUserAuthorized(i.id)).slice(0,4);
    document.getElementById('bottom-nav').innerHTML = bottomItems.map(item => `
        <button onclick="navigateTo('${item.id}')" class="flex-1 flex flex-col items-center py-2 text-xs ${currentView===item.id?'text-brand-600 font-semibold':'text-slate-400'}">
            <i data-lucide="${item.icon}" class="w-5 h-5 mb-0.5"></i><span class="text-xs">${item.label}</span>
        </button>`).join('');
    lucide.createIcons();
}

function navigateTo(view) {
    currentView = view;
    closeMobileNav();
    buildNavigation();
    renderCurrentView();
}

function renderCurrentView() {
    if (!isUserAuthorized(currentView)) {
        currentView = 'dashboard';
    }
    
    const content = document.getElementById('content');
    switch(currentView) {
        case 'dashboard': content.innerHTML = renderDashboard(); break;
        case 'sites': content.innerHTML = renderSites(); break;
        case 'materials': content.innerHTML = renderMaterials(); break;
        case 'workers': content.innerHTML = renderWorkers(); break;
        case 'daily-workers': content.innerHTML = renderDailyWorkers(); break;
        case 'daily-entry': content.innerHTML = renderDailyEntry(); break;
        case 'suppliers': content.innerHTML = renderSuppliers(); break;
        case 'purchase-orders': content.innerHTML = renderPurchaseOrders(); break;
        case 'photos': content.innerHTML = renderPhotos(); break;
        case 'reports': content.innerHTML = renderReports(); break;
        case 'audit-logs': content.innerHTML = renderAuditLogs(); break;
    }
    lucide.createIcons();
}

// ===== TOAST =====
function showToast(msg, type='success') {
    const t = document.createElement('div');
    t.className = `toast px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white ${type==='success'?'bg-brand-600':type==='error'?'bg-red-500':'bg-amber-500'}`;
    t.textContent = msg;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

// ===== NOTIFICATIONS =====
function updateNotificationBadge() {
    const unread = notifications.filter(n => !n.is_read).length;
    const badge = document.getElementById('notification-badge');
    if (unread > 0) {
        badge.textContent = unread;
        badge.classList.remove('hidden');
    } else {
        badge.classList.add('hidden');
    }
}

function addNotification(type, title, message) {
    const notify = {
        type: 'notification',
        notification_type: type,
        title,
        message,
        is_read: false,
        created_at: new Date().toISOString()
    };
    window.dataSdk.create(notify);
    showToast(message, 'success');
}

// ===== DASHBOARD =====
function renderDashboard() {
    const activeSites = sites.filter(s => s.status === 'ongoing').length;
    const totalLaborCost = workers.reduce((s,w) => s + (w.total_cost||0), 0);
    const today = new Date().toISOString().split('T')[0];
    const todayMaterials = materials.filter(m => m.date === today).length;
    const todayWorkers = workers.filter(w => w.date === today).length;
    const todayLabor = workers.filter(w => w.date === today).reduce((s,w) => s + (w.total_cost||0), 0);
    const monthWrk = workers.filter(w => (w.date||'').startsWith(today.slice(0,7)));

    return `<div class="fade-in space-y-6 pb-20 lg:pb-0">
        <div><h1 class="text-2xl font-bold text-slate-900">${currentUser.role === 'admin' ? 'Admin Dashboard' : 'Site Manager Dashboard'}</h1><p class="text-slate-500 text-sm">Welcome, ${currentUser?.name}</p></div>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
            ${statCard('Active Sites', activeSites, 'building', 'bg-blue-50 text-blue-600')}
            ${statCard('Sites', sites.length, 'map-pin', 'bg-purple-50 text-purple-600')}
            ${statCard("Today's Labor", todayLabor.toLocaleString() + ' RWF', 'wallet', 'bg-brand-50 text-brand-600')}
            ${statCard('Month Labor', monthWrk.reduce((s,w)=>s+(w.total_cost||0),0).toLocaleString() + ' RWF', 'trending-up', 'bg-amber-50 text-amber-600')}
        </div>
        ${currentUser.role === 'admin' ? `
            <div class="grid md:grid-cols-2 gap-4">
                <div class="bg-white rounded-2xl p-5 border border-slate-200">
                    <h3 class="font-semibold text-slate-900 mb-3">🔨 Top Active Sites</h3>
                    ${sites.filter(s => s.status === 'ongoing').slice(0,5).map(s => `
                        <div class="flex justify-between py-2 border-b border-slate-100 text-sm">
                            <span class="text-slate-700 font-medium">${s.site_name}</span>
                            <span class="text-slate-400">${s.manager || 'Unassigned'}</span>
                        </div>
                    `).join('') || '<p class="text-slate-400 text-sm">No active sites</p>'}
                </div>
                <div class="bg-white rounded-2xl p-5 border border-slate-200">
                    <h3 class="font-semibold text-slate-900 mb-3"> Recent Notifications</h3>

function updateBatchTotal() {
    let grand = 0;
    document.querySelectorAll('.batch-qty').forEach(el => {
        const idx = el.dataset.idx;
        const qty = parseFloat(el.value) || 0;
        const cost = parseFloat(document.querySelector(`.batch-cost[data-idx="${idx}"]`).value) || 0;
        const total = qty * cost;
        document.querySelector(`.batch-total[data-idx="${idx}"]`).textContent = total.toLocaleString();
        grand += total;
    });
    const grandEl = document.getElementById('batch-grand-total');
    if (grandEl) grandEl.textContent = grand.toLocaleString() + ' RWF';
}

async function saveBatch() {
    const site = document.getElementById('bf-site')?.value;
    const date = document.getElementById('bf-date')?.value;
    const batchId = 'BATCH-' + Date.now();
    
    if (!site) { showToast('Select a site', 'error'); return; }
    if (allData.length >= 999) { showToast('Storage limit reached', 'error'); return; }

    const rows = [];
    document.querySelectorAll('.batch-qty').forEach(el => {
        const idx = el.dataset.idx;
        const selected = [...document.querySelectorAll('.material-checkbox:checked')].map(c => c.value);
        const matName = selected[parseInt(idx)];
        const qty = parseFloat(el.value);
        const cost = parseFloat(document.querySelector(`.batch-cost[data-idx="${idx}"]`).value) || 0;
        const notes = document.querySelector(`.batch-notes[data-idx="${idx}"]`).value;
        
        if (qty > 0) {
            rows.push({
                type: 'material',
                batch_id: batchId,
                site_name: site,
                date: date,
                material_name: matName,
                material_category: MATERIAL_MASTER.find(m => m.name === matName).category,
                quantity: qty,
                unit: MATERIAL_MASTER.find(m => m.name === matName).unit,
                unit_cost: cost,
                total_material_cost: qty * cost,
                notes: notes,
                created_at: new Date().toISOString(),
                created_by: currentUser.name
            });
        }
    });

    if (rows.length === 0) { showToast('Add at least one material', 'error'); return; }

    let saveCount = 0;
    for (const row of rows) {
        const result = await window.dataSdk.create(row);
        if (result.isOk) saveCount++;
    }

    if (saveCount === rows.length) {
        showToast(` Batch saved successfully! ${rows.length} materials logged.`);
        document.getElementById('batch-form-container').innerHTML = '';
    } else {
        showToast(`Saved ${saveCount}/${rows.length} entries`, 'error');
    }
}

async function deleteMaterial(id) {
    const record = allData.find(d => d.__backendId === id);
    if (!record) return;
    const result = await window.dataSdk.delete(record);
    if (result.isOk) showToast('Entry deleted');
    else showToast('Failed to delete', 'error');
}

function autoFillWage() {
    const defaultWages = { 'Mason': 15000, 'Aid-mason': 8000, 'Carpenter': 12000, 'Welder': 14000, 'Electrician': 16000, 'Plumber': 14000, 'Painter': 10000, 'Labourer': 7000, 'Supervisor': 20000 };

    if (type && defaultWages[type]) {
        document.getElementById('wf-wage').value = defaultWages[type];
    }
    calcWorkerCost();
}

function calcWorkerCost() {
    const n = parseFloat(document.getElementById('wf-num')?.value || 0);
    const w = parseFloat(document.getElementById('wf-wage')?.value || 0);
    const el = document.getElementById('wf-total');
    if (el) el.textContent = (n * w).toLocaleString() + ' RWF';
}

function calcDeploymentTotal() {
    let grand = 0;
    document.querySelectorAll('.deploy-qty').forEach(el => {
        const idx = el.dataset.idx;
        const qty = parseFloat(el.value) || 0;
        const wage = parseFloat(document.querySelector(`.deploy-wage[data-idx="${idx}"]`).value) || 0;
        const hours = parseFloat(document.querySelector(`.deploy-hours[data-idx="${idx}"]`).value) || 8;
        const total = qty * wage;
        document.querySelector(`.deploy-cost[data-idx="${idx}"]`).textContent = total.toLocaleString();
        grand += total;
    });
    const grandEl = document.getElementById('deploy-grand-total');
    if (grandEl) grandEl.textContent = grand.toLocaleString() + ' RWF';
}

async function saveDeploymentBatch() {
    const site = document.getElementById('deploy-site')?.value;
    const date = document.getElementById('deploy-date')?.value;
    const supervisor = document.getElementById('deploy-supervisor')?.value;
    
    if (!site || !date) {
        showToast('Select site and date', 'error');
        return;
    }

    if (allData.length >= 999) {
        showToast('Storage limit reached', 'error');
        return;
    }

    const selected = [...document.querySelectorAll('.deploy-worker-checkbox:checked')].map(c => c.value);
    const deploymentBatchId = 'DEPLOY-' + Date.now();
    let saveCount = 0;

    for (let idx = 0; idx < selected.length; idx++) {
        const qty = parseFloat(document.querySelector(`.deploy-qty[data-idx="${idx}"]`)?.value || 0);
        if (qty <= 0) continue;

        const wage = parseFloat(document.querySelector(`.deploy-wage[data-idx="${idx}"]`)?.value || 0);
        const hours = parseFloat(document.querySelector(`.deploy-hours[data-idx="${idx}"]`)?.value || 8);
        const notes = document.querySelector(`.deploy-notes[data-idx="${idx}"]`)?.value || '';

        const result = await window.dataSdk.create({
            type: 'daily_worker_deployment',
            deployment_batch_id: deploymentBatchId,
            site_name: site,
            deployment_date: date,
            supervisor_name: supervisor,
            worker_type: selected[idx],
            num_workers: qty,
            daily_wage: wage,
            hours_worked: hours,
            payable_cost: qty * wage,
            notes: notes,
            deployment_status: 'submitted',
            created_at: new Date().toISOString(),
            created_by: currentUser.name
        });

        if (result.isOk) saveCount++;
    }

    if (saveCount > 0) {
        showToast(` Deployment saved! ${saveCount} worker types logged.`);
        document.getElementById('worker-deployment-form').innerHTML = '';
        addNotification('deployment_created', 'Worker Deployment Created', `New deployment with ${saveCount} worker types created`);
    } else {
        showToast('Failed to save deployment', 'error');
    }
}

        addAuditLog('delete', 'daily_worker_deployment', `Deleted worker deployment`);

}

async function saveWorkerMaster() {
    const name = document.getElementById('worker-name')?.value.trim();
    if (!name) {
        showToast('Enter worker name', 'error');
        return;
    }

    if (allData.length >= 999) {
        showToast('Storage limit reached', 'error');
        return;
    }

    const result = await window.dataSdk.create({
        type: 'worker_master',
        worker_name: name,
        national_id: document.getElementById('worker-id')?.value || '',
        phone: document.getElementById('worker-phone')?.value || '',
        worker_type: document.getElementById('worker-type')?.value || '',
        skill_level: document.getElementById('worker-skill')?.value || '',
        employment_status: document.getElementById('worker-status')?.value || 'Active',
        date_joined: new Date().toISOString().split('T')[0],
        created_at: new Date().toISOString(),
        created_by: currentUser.name
    });

    if (result.isOk) {
        showToast(`✅ ${name} added to Worker Master DB`);
        document.getElementById('worker-name').value = '';
        document.getElementById('worker-id').value = '';
        document.getElementById('worker-phone').value = '';
        document.getElementById('worker-type').value = '';
        document.getElementById('worker-skill').value = '';
        document.getElementById('worker-status').value = '';
    } else {
        showToast('Failed to add worker', 'error');
    }
}

async function deleteWorkerMaster(id) {
    const record = allData.find(d => d.__backendId === id);
    if (!record) return;
    const result = await window.dataSdk.delete(record);
    if (result.isOk) {
        showToast('Worker removed from master DB');
    } else {
        showToast('Failed to delete', 'error');
    }
}

    e.preventDefault();

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    
    const result = await window.dataSdk.create({
        type: 'purchase_order',
        po_code: poCode,
        po_number: poCode,
        supplier_name: document.getElementById('po-supplier').value,
        order_date: document.getElementById('po-date').value,
        delivery_date: document.getElementById('po-delivery').value,
        po_total: parseFloat(document.getElementById('po-amount').value || 0),
        po_description: document.getElementById('po-description').value,
        po_status: 'pending',
        created_at: new Date().toISOString(),
        created_by: currentUser.name
    });
    
    if (result.isOk) {
        showToast('Purchase Order created: ' + poCode);
        document.getElementById('po-form-container').innerHTML = '';
        addNotification('po_created', 'Purchase Order Placed!', `PO ${poCode} has been placed`);
    } else {
        showToast('Failed to place Order', 'error');
        btn.disabled = false;
    }
}

function captureCamera() {

function captureGPS() {
    if (!navigator.geolocation) {
        showToast('GPS not available on this device', 'error');
        return;
    }
    
    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);
            const accuracy = Math.round(position.coords.accuracy);
            document.getElementById('photo-gps').value = lat + ',' + lng;
            document.getElementById('photo-gps-display').textContent = `${lat}, ${lng} (±${accuracy}m)`;
            showToast('📍 GPS location captured!');
        },
        (error) => {
            showToast('GPS access denied or unavailable', 'error');
        }
    );
}

async function savePhoto(e) {
    e.preventDefault();
    if (allData.length >= 999) { showToast('Storage limit reached', 'error'); return; }
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    
    const result = await window.dataSdk.create({
        type: 'photo',
        photo_site: document.getElementById('photo-site').value,
        photo_date: document.getElementById('photo-date').value,
        photo_description: document.getElementById('photo-description').value,
        gps_lat: document.getElementById('photo-gps').value.split(',')[0] || '',
        gps_lng: document.getElementById('photo-gps').value.split(',')[1] || '',
        gps_timestamp: document.getElementById('photo-date').value,
        created_at: new Date().toISOString(),
        created_by: currentUser.name
    });
    
    if (result.isOk) {
        showToast(' Photo record saved with metadata!');
        document.getElementById('photo-upload-container').innerHTML = '';
    } else {
        showToast('Failed to save photo', 'error');
        btn.disabled = false;
    }
}

function getFilteredMaterials() {
    let filtered = materials;
    const site = document.getElementById('filter-site')?.value;
    const from = document.getElementById('filter-from')?.value;
    const to = document.getElementById('filter-to')?.value;
    const matCategory = document.getElementById('filter-material')?.value;

    if (site) filtered = filtered.filter(m => m.site_name === site);
    if (from) filtered = filtered.filter(m => (m.date || '') >= from);
    if (to) filtered = filtered.filter(m => (m.date || '') <= to);
    if (matCategory) filtered = filtered.filter(m => m.material_category === matCategory);
    return filtered;
}

function updateReportFilters() {
    switchReportTab('summary');
}

function switchReportTab(tab) {
    document.querySelectorAll('[id^="tab-"]').forEach(b => b.className = b.className.replace('bg-brand-600 text-white', 'bg-slate-200 text-slate-700'));

function renderMaterialUsageReport() {
    const filteredMats = getFilteredMaterials();

    filteredMats.forEach(m => {
        if (!materialSummary[m.material_name]) {
            materialSummary[m.material_name] = { qty: 0, cost: 0, count: 0, category: m.material_category };
        }
        materialSummary[m.material_name].qty += m.quantity || 0;
        materialSummary[m.material_name].cost += m.total_material_cost || 0;
        materialSummary[m.material_name].count += 1;
    });

    const sorted = Object.entries(materialSummary).sort((a,b) => b[1].cost - a[1].cost);

    return `
        <div class="space-y-4">
            <div class="bg-white rounded-2xl p-5 border border-slate-200 overflow-x-auto">

                            <th class="px-3 py-2 text-right font-semibold">Entries</th>

function renderSiteReport() {

    filteredMats.forEach(m => {

            siteSummary[m.site_name] = { qty: 0, cost: 0, entries: 0 };
        }
        siteSummary[m.site_name].qty += m.quantity || 0;
        siteSummary[m.site_name].cost += m.total_material_cost || 0;
        siteSummary[m.site_name].entries += 1;
    });

    const sorted = Object.entries(siteSummary).sort((a,b) => b[1].cost - a[1].cost);

    return `

function renderTrendsReport() {
    const filteredMats = getFilteredMaterials();
    const dateGroups = {};
    filteredMats.forEach(m => {
        const date = m.date || 'Unknown';
        if (!dateGroups[date]) {
            dateGroups[date] = { qty: 0, cost: 0 };
        }
        dateGroups[date].qty += m.quantity || 0;
        dateGroups[date].cost += m.total_material_cost || 0;
    });

    const sorted = Object.entries(dateGroups).sort();
    const last30 = sorted.slice(-30);

    return `
        <div class="space-y-4">
            <div class="bg-white rounded-2xl p-5 border border-slate-200">
                <h3 class="font-bold text-slate-900 mb-4"> Last 30 Days Trend</h3>
                <div class="space-y-2 max-h-96 overflow-y-auto">
                    ${last30.map(item => {
                        const pct = (item[1].cost / Math.max(...last30.map(x=>x[1].cost))) * 100;
                        return `
                            <div class="flex items-center gap-3">
                                <div class="w-20 text-xs font-medium text-slate-600">${item[0]}</div>
                                <div class="flex-1 h-6 bg-slate-100 rounded relative overflow-hidden">
                                    <div class="h-full bg-gradient-to-r from-brand-400 to-brand-600" style="width: ${pct}%"></div>
                                </div>
                                <div class="text-right">
                                    <p class="text-xs font-bold text-slate-900">${item[1].cost.toLocaleString()} RWF</p>
                                    <p class="text-xs text-slate-500">${item[1].qty.toLocaleString()} units</p>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>

            <div class="bg-gradient-to-r from-slate-50 to-slate-100 rounded-2xl p-5 border border-slate-200">
                <h4 class="font-bold text-slate-900 mb-3"> Key Insights</h4>
                <div class="space-y-2 text-sm">
                    <p class="text-slate-700">• <strong>Total Days:</strong> ${Object.keys(dateGroups).length} days tracked</p>
                    <p class="text-slate-700">• <strong>Avg Daily Cost:</strong> ${(Object.values(dateGroups).reduce((s,d)=>s+d.cost,0)/Object.keys(dateGroups).length).toLocaleString()} RWF</p>
                    <p class="text-slate-700">• <strong>Highest Cost Day:</strong> ${sorted.sort((a,b)=>b[1].cost-a[1].cost)[0]?sorted.sort((a,b)=>b[1].cost-a[1].cost)[0][0]:''} (${sorted.sort((a,b)=>b[1].cost-a[1].cost)[0]?sorted.sort((a,b)=>b[1].cost-a[1].cost)[0][1].cost.toLocaleString():'0'} RWF)</p>
                </div>
            </div>
        </div>
    `;
}

function exportCSV() {
    let csv = 'SHDR Ltd Construction Report\\n' + new Date().toISOString().split('T')[0] + '\\n\\n';
    csv += 'MATERIALS USAGE\\nSite,Date,Material,Quantity,Unit,Cost\\n';
    materials.forEach(m => csv += `${m.site_name || ''},${m.date},${m.material_name},${m.quantity},${m.unit},${m.total_material_cost || ''}\\n`);
    csv += '\\nWORKER DEPLOYMENT\\nSite,Date,Type,Count,Daily Wage,Total Cost\\n';
    workers.forEach(w => csv += `${w.site_name || ''},${w.date},${w.worker_type},${w.num_workers},${w.daily_wage},${w.total_cost}\\n`);
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `SHDR_Report_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('CSV exported!');
}
