<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <title>SHDR Manager — Sign In</title>

    <link rel="icon" type="image/png" href="shdr_logo%20Background%20Removed.png">
    <link rel="apple-touch-icon" sizes="180x180" href="shdr_logo%20Background%20Removed.png">

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"></script>

    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; }
        .split-container { display: flex; min-height: 100vh; }
        .brand-panel {
            flex: 0 0 42%;
            background: linear-gradient(135deg, #064e3b 0%, #047857 100%);
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 40px; color: #fff; text-align: center;
        }
        .brand-panel::before {
            content: ''; position: absolute; inset: 0;
            background: url('https://cdn.pixabay.com/photo/2018/12/12/23/02/site-3871804_1280.jpg') center/cover no-repeat;
            opacity: 0.15; z-index: 0;
        }
        .brand-content { position: relative; z-index: 2; max-width: 360px; }
        .brand-logo { width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        .brand-logo img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.35)); }
        .form-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; background: #fff; }
        .card { width: 100%; max-width: 420px; }
        .btn-primary {
            background: #059669; color: white; font-weight: 600; border-radius: 0.75rem;
            padding: 0.75rem 1.5rem; transition: background 0.2s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-primary:hover { background: #047857; }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        .spinner { border: 3px solid #e2e8f0; border-top: 3px solid #059669; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .split-container { flex-direction: column; }
            .brand-panel { flex: 0 0 auto; padding: 40px 24px; min-height: auto; text-align: center; }
            .brand-panel h2 { font-size: 1.6rem; }
            .brand-content { max-width: 100%; }
            .brand-logo { width: 96px; height: 96px; }
            .form-panel { padding: 24px; flex: 1; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="split-container">
    <div class="brand-panel">
        <div class="brand-content">
            <div class="brand-logo">
                <img src="shdr_logo%20Background%20Removed.png" alt="SHDR Ltd."
                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 120%22%3E%3Ctext x=%2250%25%22 y=%2254%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22 font-size=%2248%22%3ESH%3C/text%3E%3C/svg%3E';">
            </div>
            <h2 class="text-2xl font-bold mb-4">Manager Access</h2>
            <p class="opacity-90">Your assigned construction site is waiting. Sign in to get started.</p>
        </div>
    </div>

    <div class="form-panel">
        <div class="card" id="dynamic-content"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    // ─── Firebase (identity only) ───────────────────────────────
    const firebaseConfig = {
        apiKey: "AIzaSyBVTLxC6nWpWL6a4BLI3xghdgUoR_cgGzw",
        authDomain: "shdr-construction.firebaseapp.com",
        databaseURL: "https://shdr-construction-default-rtdb.firebaseio.com",
        projectId: "shdr-construction",
        storageBucket: "shdr-construction.firebasestorage.app",
        messagingSenderId: "418309267761",
        appId: "1:418309267761:web:328922587ea18021e21010",
        measurementId: "G-Y4KMGWDBH3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ─── Backend base URL ───────────────────────────────────────
    const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        ? 'http://localhost:3000'
        : 'https://api.shdr.com';

    // ─── State ──────────────────────────────────────────────────
    let currentUser = null;
    let session = null;
    let currentState = 'loading';

    const container = document.getElementById('dynamic-content');

    // ─── Helpers ────────────────────────────────────────────────
    function showError(msg) {
        const el = document.getElementById('error-msg');
        if (el) { el.textContent = msg; el.classList.remove('hidden'); }
    }
    function clearError() {
        const el = document.getElementById('error-msg');
        if (el) { el.classList.add('hidden'); el.textContent = ''; }
    }
    function setButtonLoading(btn, loading) {
        if (!btn) return;
        if (loading) {
            btn.disabled = true;
            btn.dataset.origHTML = btn.dataset.origHTML || btn.innerHTML;
            btn.innerHTML = '<span class="spinner" style="width:1.2rem;height:1.2rem;border-width:2px;"></span> Loading...';
        } else {
            btn.disabled = false;
            btn.innerHTML = btn.dataset.origHTML || 'Submit';
        }
    }
    async function authedFetch(path, options = {}) {
        if (!currentUser) throw new Error('Not signed in.');
        const token = await currentUser.getIdToken();
        const headers = Object.assign({}, options.headers || {}, {
            'Authorization': `Bearer ${token}`
        });
        if (options.body && !(options.body instanceof FormData)) {
            headers['Content-Type'] = 'application/json';
        }
        const res = await fetch(`${API_BASE}${path}`, Object.assign({}, options, { headers }));
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            const err = new Error(data.message || 'Request failed.');
            err.code = data.code;
            throw err;
        }
        return data;
    }

    // ─── Render dispatcher ──────────────────────────────────────
    function render() {
        clearError();
        switch (currentState) {
            case 'loading':       renderLoading(); break;
            case 'login':         renderLogin(); break;
            case 'confirm-site':  renderSiteConfirmation(); break;
            case 'setup-profile': renderProfileSetup(); break;
            case 'redirecting':   renderRedirecting(); break;
            default:              renderLogin();
        }
    }

    function renderLoading() {
        container.innerHTML = `
            <div class="text-center py-12">
                <div class="spinner mx-auto mb-4" style="width:2rem;height:2rem;border-width:3px;"></div>
                <p class="text-slate-500 text-sm">Preparing your session...</p>
            </div>`;
    }

    // ─── Login ──────────────────────────────────────────────────
    function renderLogin() {
        container.innerHTML = `
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-slate-900">Manager Sign In</h1>
                <p class="text-slate-500 text-sm mt-2">Enter your credentials to access your site</p>
            </div>
            <div id="error-msg" class="hidden bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-4"></div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="login-email" placeholder="manager@example.com" required autocomplete="email"
                           class="w-full border border-slate-200 rounded-lg p-3 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Passcode</label>
                    <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password"
                           class="w-full border border-slate-200 rounded-lg p-3 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            <p class="text-xs text-slate-500 text-center mt-6">
                <span>
                    Designed &amp; Powered by
                    <a href="https://wa.me/250790020086" target="_blank" rel="noopener noreferrer"
                       style="color:#059669; text-decoration:none;">
                        <strong>___Enock's___blessingz___</strong>
                    </a>
                </span>
            </p>
        `;
        document.getElementById('login-form').addEventListener('submit', handleLogin);
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn = e.target.querySelector('button[type="submit"]');
        setButtonLoading(btn, true);
        clearError();
        try {
            await signInWithEmailAndPassword(auth, email, password);
            // onAuthStateChanged handles the rest
        } catch (err) {
            const msg =
                err.code === 'auth/user-not-found'    ? 'No account found with this email.' :
                err.code === 'auth/wrong-password'    ? 'Incorrect password.' :
                err.code === 'auth/invalid-email'     ? 'Invalid email format.' :
                err.code === 'auth/too-many-requests' ? 'Too many attempts. Please wait and try again.' :
                'Sign-in failed. Please try again.';
            showError(msg);
            setButtonLoading(btn, false);
        }
    }

    // ─── Auth state ─────────────────────────────────────────────
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            currentUser = null; session = null;
            currentState = 'login';
            render();
            return;
        }
        currentUser = user;
        currentState = 'loading';
        render();
        try {
            const res = await authedFetch('/api/manager/session');
            session = res.data;

            if (session.role !== 'manager') {
                await signOut(auth);
                currentState = 'login'; render();
                showError('You are not registered as a manager.');
                return;
            }
            if (!session.site) {
                await signOut(auth);
                currentState = 'login'; render();
                showError('No site assigned to your account. Contact your administrator.');
                return;
            }

            switch (session.next_step) {
                case 'confirm_site':  currentState = 'confirm-site'; break;
                case 'setup_profile': currentState = 'setup-profile'; break;
                case 'ready':         currentState = 'redirecting'; break;
                default:              currentState = 'confirm-site';
            }
            render();

            if (currentState === 'redirecting') {
                setTimeout(() => { window.location.href = 'manager/dashboard.html'; }, 600);
            }
        } catch (err) {
            console.error(err);
            await signOut(auth);
            currentState = 'login'; render();
            showError(err.message || 'Failed to load your session. Please try again.');
        }
    });

    // ─── Site confirmation ──────────────────────────────────────
    function renderSiteConfirmation() {
        const site = session.site;
        container.innerHTML = `
            <h1 class="text-xl font-bold text-slate-900 mb-4">Confirm Your Site</h1>
            <div class="mb-6">
                <img src="${(site.images && site.images[0]) || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22%3E%3Crect width=%22400%22 height=%22200%22 fill=%22%23e2e8f0%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%2394a3b8%22 font-size=%2220%22%3ENo Image%3C/text%3E%3C/svg%3E'}"
                     class="w-full h-48 object-cover rounded-xl mb-4">
                <h2 class="text-lg font-bold">${site.name}</h2>
                <p class="text-slate-500">${site.location || 'No location'}</p>
                <p class="text-sm text-slate-500 mt-1">Budget: ${(site.budget || 0).toLocaleString()} RWF</p>
            </div>
            <div id="error-msg" class="hidden bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-4"></div>
            <button id="confirm-btn" class="btn-primary mb-3">Yes, this is my site</button>
            <button id="deny-btn" class="w-full py-3 text-red-600 hover:bg-red-50 rounded-xl text-sm">This is not my site</button>
        `;

        document.getElementById('confirm-btn').addEventListener('click', async () => {
            const btn = document.getElementById('confirm-btn');
            setButtonLoading(btn, true);
            try {
                await authedFetch('/api/manager/confirm-site', { method: 'POST' });
                const res = await authedFetch('/api/manager/session');
                session = res.data;
                currentState = (session.next_step === 'setup_profile') ? 'setup-profile' : 'redirecting';
                render();
                if (currentState === 'redirecting') {
                    setTimeout(() => { window.location.href = 'manager/dashboard.html'; }, 600);
                }
            } catch (err) {
                showError(err.message || 'Failed to confirm. Please try again.');
                setButtonLoading(btn, false);
            }
        });

        document.getElementById('deny-btn').addEventListener('click', async () => {
            if (confirm('If this site is incorrect, please contact your administrator. You will be signed out.')) {
                await signOut(auth);
            }
        });
    }

    // ─── Profile setup ──────────────────────────────────────────
    function renderProfileSetup() {
        container.innerHTML = `
            <h1 class="text-xl font-bold text-slate-900 mb-4">Complete Your Profile</h1>
            <p class="text-slate-500 mb-6">Please add your phone number and a profile photo. This step is required once.</p>
            <div id="error-msg" class="hidden bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-4"></div>
            <form id="setup-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. +250 78x xxx xxx" required
                           class="w-full border border-slate-200 rounded-lg p-3 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Profile Image</label>
                    <input type="file" id="image" accept="image/*" required
                           class="w-full border border-slate-200 rounded-lg p-3 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button type="submit" class="btn-primary">Save &amp; Continue</button>
            </form>
        `;

        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const imageFile = document.getElementById('image').files[0];
            const btn = e.target.querySelector('button[type="submit"]');
            setButtonLoading(btn, true);
            clearError();

            if (!phone || !imageFile) {
                showError('Both fields are required.');
                setButtonLoading(btn, false);
                return;
            }
            if (imageFile.size > 5 * 1024 * 1024) {
                showError('Image must be under 5 MB.');
                setButtonLoading(btn, false);
                return;
            }

            try {
                const formData = new FormData();
                formData.append('phone', phone);
                formData.append('image', imageFile);
                await authedFetch('/api/manager/profile', { method: 'POST', body: formData });

                currentState = 'redirecting';
                render();
                setTimeout(() => { window.location.href = 'manager/dashboard.html'; }, 600);
            } catch (err) {
                showError(err.message || 'Could not save your profile. Please try again.');
                setButtonLoading(btn, false);
            }
        });
    }

    function renderRedirecting() {
        container.innerHTML = `
            <div class="text-center">
                <div class="spinner mx-auto mb-4" style="width:2rem;height:2rem;border-width:3px;"></div>
                <p class="text-slate-600">Redirecting to your dashboard...</p>
            </div>`;
    }

    render();
</script>
</body>
</html>
