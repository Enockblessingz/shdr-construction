<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHDR Construction Manager - Login</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js" defer></script>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-50 font-jakarta">
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 to-slate-800 p-4">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden">
            <div class="pt-10 pb-6 text-center">
                <img src="shdr_logo.jpg" alt="SHDR Ltd Logo"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                     class="w-24 h-24 mx-auto rounded-2xl shadow-lg object-contain bg-white p-2">
                <div style="display:none;" class="w-24 h-24 mx-auto rounded-2xl shadow-lg bg-green-100 flex items-center justify-center">
                    <span class="text-3xl font-bold text-green-700">SH</span>
                </div>
                <h1 class="text-3xl font-bold text-slate-900 mt-6">SHDR Ltd</h1>
                <p class="text-slate-500 text-sm mt-2">Sustainable Homes Design Rwanda</p>
                <p class="text-slate-400 text-xs mt-1">Construction Site Management System</p>
            </div>

            <div id="message" class="hidden mx-8 mb-4 p-3 rounded-xl text-sm"></div>

            <!-- LOGIN FORM -->
            <form id="login-form" class="px-8 pb-8 space-y-5" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                    <input type="email" id="login-email" placeholder="admin@shdr.rw" required
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Passcode</label>
                    <div class="relative">
                        <input type="password" id="login-password" placeholder="••••••••••" required
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-green-500 outline-none pr-12">
                        <button type="button" onclick="togglePassword('login-password', 'toggle-login-icon')"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <span id="toggle-login-icon">👁️</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="login-remember" class="w-4 h-4 accent-green-600">
                        <span class="text-slate-600">Remember me</span>
                    </label>
                    <a href="forgot-password.html" class="text-green-600 hover:text-green-700 font-medium">Forgot passcode?</a>
                </div>
                <button type="submit" id="login-btn" class="w-full py-3.5 bg-gradient-to-r from-green-500 to-green-700 hover:from-green-600 hover:to-green-800 text-white font-semibold rounded-xl transition-all">
                    Sign In
                </button>
                <p class="text-center text-sm text-slate-500">
                    Don't have an account?
                    <button type="button" onclick="toggleForm('signup')" class="text-green-600 hover:text-green-700 font-medium ml-1">Sign Up</button>
                </p>
            </form>

            <!-- SIGN UP FORM (hidden) -->
            <form id="signup-form" class="hidden px-8 pb-8 space-y-5" onsubmit="handleSignUp(event)">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                    <input type="text" id="signup-name" placeholder="Your full name" required
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                    <input type="email" id="signup-email" placeholder="you@example.rw" required
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Passcode</label>
                    <div class="relative">
                        <input type="password" id="signup-password" placeholder="••••••••••" required minlength="6"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-green-500 outline-none pr-12">
                        <button type="button" onclick="togglePassword('signup-password', 'toggle-signup-icon')"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <span id="toggle-signup-icon">👁️</span>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Confirm Passcode</label>
                    <input type="password" id="signup-confirm" placeholder="Confirm your passcode" required minlength="6"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <button type="submit" id="signup-btn" class="w-full py-3.5 bg-gradient-to-r from-green-500 to-green-700 hover:from-green-600 hover:to-green-800 text-white font-semibold rounded-xl transition-all">
                    Create Account
                </button>
                <p class="text-center text-sm text-slate-500">
                    Already have an account?
                    <button type="button" onclick="toggleForm('login')" class="text-green-600 hover:text-green-700 font-medium ml-1">Sign In</button>
                </p>
            </form>

            <div class="px-8 py-8 border-t border-slate-100 text-center text-xs text-slate-500 space-y-5">
                <p>Secure Access • SHDR Ltd © 2026</p>
                <p>Powered by <a href="https://wa.me/250790020086" target="_blank" class="font-semibold text-green-600 hover:text-green-700">Enock's blessingz</a></p>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', async () => {
            initSupabase();
            const session = await getCurrentSession();
            if (session) window.location.href = 'app.html';
            const remembered = localStorage.getItem('shdr_remember');
            if (remembered) {
                document.getElementById('login-email').value = remembered;
                document.getElementById('login-remember').checked = true;
            }
        });

        function toggleForm(form) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const msg = document.getElementById('message');
            msg.classList.add('hidden');
            if (form === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
            }
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }

        function showMessage(text, isError = true) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.classList.remove('hidden', 'bg-green-50', 'text-green-700', 'bg-red-50', 'text-red-700');
            if (isError) {
                msg.classList.add('bg-red-50', 'text-red-700');
            } else {
                msg.classList.add('bg-green-50', 'text-green-700');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            showMessage('', true);
            btn.disabled = true;
            btn.innerHTML = 'Signing in...';

            try {
                const { profile } = await signIn(email, password);
                const currentUser = {
                    id: profile.id,
                    email: email,
                    name: profile.full_name,
                    role: profile.role,
                    phone: profile.phone
                };
                localStorage.setItem('shdr_user', JSON.stringify(currentUser));
                if (document.getElementById('login-remember').checked) {
                    localStorage.setItem('shdr_remember', email);
                } else {
                    localStorage.removeItem('shdr_remember');
                }
                window.location.href = 'app.html';
            } catch (error) {
                showMessage('❌ ' + (error.message || 'Login failed'), true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const fullName = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;
            const btn = document.getElementById('signup-btn');

            if (password !== confirm) {
                showMessage('❌ Passcodes do not match', true);
                return;
            }
            if (password.length < 6) {
                showMessage('❌ Passcode must be at least 6 characters', true);
                return;
            }

            showMessage('', true);
            btn.disabled = true;
            btn.innerHTML = 'Creating account...';

            try {
                const result = await signUp(email, password, fullName, 'manager');
                if (result.needsConfirmation) {
                    showMessage('✅ Account created! Please check your email to confirm before logging in.', false);
                    setTimeout(() => toggleForm('login'), 3000);
                } else {
                    const { profile } = await signIn(email, password);
                    const currentUser = {
                        id: profile.id,
                        email: email,
                        name: profile.full_name,
                        role: profile.role,
                        phone: profile.phone
                    };
                    localStorage.setItem('shdr_user', JSON.stringify(currentUser));
                    showMessage('✅ Account created! Redirecting...', false);
                    setTimeout(() => { window.location.href = 'app.html'; }, 1500);
                }
            } catch (error) {
                showMessage('❌ ' + (error.message || 'Sign up failed'), true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        }
    </script>
</body>
</html>
