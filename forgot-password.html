<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="shdr_logo%20Background%20Removed.png">
    <link rel="apple-touch-icon" sizes="180x180" href="shdr_logo%20Background%20Removed.png">

    <title>Reset Your Passcode · SHDR Ltd</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.3.0/dist/iconify-icon.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* ── Wrapper to center card & keep footer at bottom ── */
        .page-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 40px 20px 20px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
        }

        /* ── Brand (no background) ── */
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 26px;
        }
        .brand-icon {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .brand-text h2 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }
        .brand-text p {
            font-size: 0.78rem;
            color: #64748b;
            margin-top: 2px;
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
            color: #0f172a;
        }
        p.desc {
            color: #6b7280;
            font-size: 0.92rem;
            margin-bottom: 24px;
            line-height: 1.55;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            margin-bottom: 6px;
            color: #1a1a2e;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            background: #f9fafb;
            transition: 0.2s;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5,150,105,0.10);
            background: #fff;
        }
        input:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #059669;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }
        .btn:hover:not(:disabled) { background: #047857; }
        .btn:active:not(:disabled) { transform: scale(0.99); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn iconify-icon {
            font-size: 1.25rem;
            line-height: 1;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 22px;
            color: #059669;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .back-link:hover { color: #047857; text-decoration: underline; }

        /* ── Success / error message ── */
        .message {
            padding: 16px 18px;
            border-radius: 12px;
            font-size: 0.88rem;
            margin-bottom: 18px;
            display: none;
            line-height: 1.6;
            border: 1px solid transparent;
        }
        .message.error {
            background: #fef2f2;
            color: #991b1b;
            border-color: #fecaca;
        }
        .message.success {
            background: #f0fdf4;
            color: #166534;
            border-color: #bbf7d0;
        }
        .message.info {
            background: #eff6ff;
            color: #1e40af;
            border-color: #bfdbfe;
        }

        /* Rich success layout */
        .msg-title {
            display: block;
            font-weight: 700;
            font-size: 1rem;
            color: #166534;
            margin-bottom: 8px;
        }
        .msg-line {
            display: block;
            color: #374151;
            font-size: 0.86rem;
            margin-bottom: 4px;
        }
        .masked-email {
            display: inline-block;
            font-weight: 700;
            color: #166534;
            background: #dcfce7;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.85rem;
            margin: 6px 0 8px;
            letter-spacing: 0.3px;
            word-break: break-all;
        }
        .msg-hint {
            display: block;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #bbf7d0;
            font-size: 0.8rem;
            color: #4b5563;
            font-style: italic;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ────────────── FOOTER ────────────── */
        .page-footer {
            width: 100%;
            text-align: center;
            padding: 20px 16px 24px;
            font-size: 0.85rem;
            color: #6b7280;
            line-height: 1.5;
        }
        .page-footer .designer-link {
            color: #059669;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
            transition: color 0.2s;
        }
        .page-footer .designer-link:hover {
            color: #047857;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .page-footer { font-size: 0.8rem; padding: 16px 12px 20px; }
        }
    </style>
</head>
<body>

    <div class="page-wrap">
        <div class="card">
            <!-- Brand -->
            <div class="brand">
                <div class="brand-icon">
                    <img src="shdr_logo Background Removed.png" alt="SHDR Logo">
                </div>
                <div class="brand-text">
                    <h2>SHDR Ltd</h2>
                    <p>Construction Sites Management System</p>
                </div>
            </div>

            <h1>Reset Your Passcode</h1>
            <p class="desc">Type your email address and we'll send you a secure link to reset your passcode.</p>

            <div id="message" class="message" role="alert" aria-live="polite"></div>

            <form id="reset-form" onsubmit="handleReset(event)" novalidate>
                <div class="form-group">
                    <label for="email">Type Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="owner@example.com"
                        required
                        autocomplete="email"
                        autofocus
                    />
                </div>
                <button type="submit" id="reset-btn" class="btn">
                    <iconify-icon icon="mingcute:send-fill"></iconify-icon>
                    Send Link
                </button>
            </form>

            <a href="index.html" class="back-link">
                <iconify-icon icon="material-symbols:arrow-back" width="16"></iconify-icon>
                Back to Sign In
            </a>
        </div>
    </div>

    <!-- ────────────── FOOTER ────────────── -->
    <footer class="page-footer">
        Designed &amp; Powered by
        <a href="https://wa.me/250790020086" target="_blank" rel="noopener noreferrer" class="designer-link">
            ___Enock's___blessingz___
        </a>
    </footer>

    <script type="module">
        // ─── Firebase ───
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVTLxC6nWpWL6a4BLI3xghdgUoR_cgGzw",
            authDomain: "shdr-construction.firebaseapp.com",
            databaseURL: "https://shdr-construction-default-rtdb.firebaseio.com",
            projectId: "shdr-construction",
            storageBucket: "shdr-construction.firebasestorage.app",
            messagingSenderId: "418309267761",
            appId: "1:418309267761:web:328922587ea18021e21010",
            measurementId: "G-Y4KMGWDBH3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ─── State ───
        const COOLDOWN_SECONDS = 60;
        let cooldownInterval = null;
        let cooldownRemaining = 0;

        // ─── UI Helpers ───
        const messageEl = document.getElementById('message');

        function showMessage(html, type = 'error') {
            messageEl.innerHTML = html;
            messageEl.classList.remove('error', 'success', 'info');
            messageEl.classList.add(type);
            messageEl.style.display = 'block';
        }
        function hideMessage() {
            messageEl.style.display = 'none';
            messageEl.innerHTML = '';
        }

        function setButtonLoading(btn, loading) {
            if (!btn) return;
            if (loading) {
                btn.disabled = true;
                if (!btn.dataset.original) btn.dataset.original = btn.innerHTML;
                btn.innerHTML = `<span class="spinner"></span> Sending...`;
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.original ||
                    `<iconify-icon icon="mingcute:send-fill"></iconify-icon> Send Link`;
            }
        }

        function startCooldown() {
            cooldownRemaining = COOLDOWN_SECONDS;
            const btn = document.getElementById('reset-btn');
            const emailInput = document.getElementById('email');

            btn.disabled = true;
            emailInput.disabled = true;

            const updateCooldownUI = () => {
                btn.innerHTML = `<iconify-icon icon="material-symbols:timer-outline"></iconify-icon> Resend in ${cooldownRemaining}s`;
            };
            updateCooldownUI();

            cooldownInterval = setInterval(() => {
                cooldownRemaining--;
                if (cooldownRemaining <= 0) {
                    clearInterval(cooldownInterval);
                    cooldownInterval = null;
                    cooldownRemaining = 0;
                    btn.disabled = false;
                    emailInput.disabled = false;
                    btn.innerHTML = btn.dataset.original ||
                        `<iconify-icon icon="mingcute:send-fill"></iconify-icon> Send Link`;
                } else {
                    updateCooldownUI();
                }
            }, 1000);
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
        }

        /**
         * Mask an email like: en*********z@icloud.com
         * - Show first 2 characters of the local part
         * - Show last character of the local part
         * - Replace everything between with asterisks (9 by default)
         * - Show full domain
         */
        function maskEmail(email, starCount = 9) {
            if (!email || !email.includes('@')) return email;
            const [local, domain] = email.split('@');
            if (local.length <= 3) {
                return email;
            }
            const first = local.slice(0, 2);
            const last = local.slice(-1);
            const stars = '*'.repeat(starCount);
            return `${first}${stars}${last}@${domain}`;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ─── Handle reset ───
        window.handleReset = async function (e) {
            e.preventDefault();

            const emailInput = document.getElementById('email');
            const email = emailInput.value.trim();
            const btn = document.getElementById('reset-btn');

            hideMessage();

            if (!email) {
                showMessage('Please enter your email address.', 'error');
                emailInput.focus();
                return;
            }
            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address.', 'error');
                emailInput.focus();
                return;
            }

            setButtonLoading(btn, true);
            try {
                const actionCodeSettings = {
                    url: 'https://shdr-construction.vercel.app/index.html',
                    handleCodeInApp: false
                };

                await sendPasswordResetEmail(auth, email, actionCodeSettings);

                const masked = escapeHtml(maskEmail(email));

                showMessage(
                    `<span class="msg-title">Passcode Reset Link Sent!</span>` +
                    `<span class="msg-line">We've sent a secure passcode reset link to:</span>` +
                    `<span class="masked-email">${masked}</span>` +
                    `<span class="msg-line">Please check your inbox and spam / junk folder, then follow the instructions in the email to create a new passcode.</span>` +
                    `<span class="msg-hint">Didn't receive the email? You can request a new link after a minute.</span>`,
                    'success'
                );

                emailInput.value = '';
                startCooldown();
            } catch (error) {
                let msg = 'Something went wrong. Please try again.';
                switch (error.code) {
                    case 'auth/user-not-found':
                        msg = 'No account found with this email address.';
                        break;
                    case 'auth/invalid-email':
                        msg = 'Invalid email format.';
                        break;
                    case 'auth/too-many-requests':
                        msg = 'Too many requests. Please wait a few minutes and try again.';
                        break;
                    case 'auth/network-request-failed':
                        msg = 'Network error. Check your internet connection and try again.';
                        break;
                    default:
                        msg = error.message || msg;
                }
                showMessage(msg, 'error');
            } finally {
                setButtonLoading(btn, false);
                if (cooldownRemaining > 0) {
                    btn.disabled = true;
                }
            }
        };
    </script>
</body>
</html>
