<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Passcode · SHDR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        p.desc {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #1a1a2e;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            background: #f9fafb;
            transition: 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5,150,105,0.08);
            background: #fff;
        }
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #059669;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { background: #047857; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #059669;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            line-height: 1.5;
        }
        .message.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .message.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reset Your Passcode</h1>
        <p class="desc">Enter your email address and we'll send you a link to reset your passcode.</p>

        <div id="message" class="message"></div>

        <form id="reset-form" onsubmit="handleReset(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="owner@example.com" required autocomplete="email" />
            </div>
            <button type="submit" id="reset-btn" class="btn">Send Reset Link</button>
        </form>

        <a href="index.html" class="back-link">← Back to Login</a>
    </div>

    <script type="module">
        // ─── Firebase ───
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVTLxC6nWpWL6a4BLI3xghdgUoR_cgGzw",
            authDomain: "shdr-construction.firebaseapp.com",
            databaseURL: "https://shdr-construction-default-rtdb.firebaseio.com",
            projectId: "shdr-construction",
            storageBucket: "shdr-construction.firebasestorage.app",
            messagingSenderId: "418309267761",
            appId: "1:418309267761:web:328922587ea18021e21010",
            measurementId: "G-Y4KMGWDBH3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ─── UI Helpers ───
        const messageEl = document.getElementById('message');
        function showMessage(text, isError = true) {
            messageEl.textContent = text;
            messageEl.classList.remove('error', 'success');
            messageEl.classList.add(isError ? 'error' : 'success');
            messageEl.style.display = 'block';
        }
        function hideMessage() {
            messageEl.style.display = 'none';
            messageEl.textContent = '';
        }

        function setButtonLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.dataset.original = btn.textContent;
                btn.innerHTML = `<span class="spinner"></span> Sending...`;
            } else {
                btn.disabled = false;
                btn.textContent = btn.dataset.original || 'Send Reset Link';
            }
        }

        // ─── Handle reset ───
        window.handleReset = async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('reset-btn');
            hideMessage();

            if (!email) {
                showMessage('Please enter your email address.', true);
                return;
            }

            setButtonLoading(btn, true);
            try {
                await sendPasswordResetEmail(auth, email);
                showMessage('✅ Password reset link sent! Check your email.', false);
                document.getElementById('email').value = '';
            } catch (error) {
                let msg = error.message;
                if (error.code === 'auth/user-not-found') {
                    msg = 'No account found with this email address.';
                } else if (error.code === 'auth/invalid-email') {
                    msg = 'Invalid email format.';
                }
                showMessage(msg, true);
            } finally {
                setButtonLoading(btn, false);
            }
        };

        // Expose for inline onclick
        window.handleReset = window.handleReset;
    </script>
</body>
</html>
