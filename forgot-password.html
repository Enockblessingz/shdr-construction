<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Passcode - SHDR</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js" defer></script>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-50">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8">
            <h2 class="text-2xl font-bold text-slate-900 mb-4">Reset Your Passcode</h2>
            <p class="text-sm text-slate-600 mb-6">Enter your email address and we'll send you a link to reset your passcode.</p>
            <div id="message" class="hidden mb-4 p-3 rounded-xl text-sm"></div>
            <form id="reset-form" onsubmit="handleReset(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
                    <input type="email" id="reset-email" required
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <button type="submit" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl transition-all">
                    Send Reset Link
                </button>
            </form>
            <div class="mt-6 text-center text-sm">
                <a href="login.html" class="text-green-600 hover:text-green-700">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => initSupabase());

        async function handleReset(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            const msg = document.getElementById('message');
            const btn = e.target.querySelector('button');
            
            btn.disabled = true;
            msg.classList.add('hidden');

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/update-password.html'  // you can create this page later
                });
                if (error) throw error;
                msg.textContent = '✅ Check your email for the reset link.';
                msg.classList.remove('hidden', 'bg-red-50', 'text-red-700');
                msg.classList.add('bg-green-50', 'text-green-700');
            } catch (error) {
                msg.textContent = '❌ ' + (error.message || 'Failed to send reset email');
                msg.classList.remove('hidden', 'bg-green-50', 'text-green-700');
                msg.classList.add('bg-red-50', 'text-red-700');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
